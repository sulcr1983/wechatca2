<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SuperSu — 公众号排版 + 封面生成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg-canvas: #f5f3ef;
  --bg-surface: #faf9f6;
  --bg-raised: #ffffff;
  --bg-hover: #f0ede8;
  --border: #e4e0d9;
  --border-hi: #d1ccc3;
  --text: #1a1814;
  --text-soft: #5c564a;
  --text-muted: #9a9488;
  --accent: #c8832e;
  --accent-dim: #a0681e;
  --accent-glow: rgba(200,131,46,.12);
  --red: #d9484e;
  --green: #4a9e6e;
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --font: "DM Sans","Noto Sans SC",-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono: "JetBrains Mono","Cascadia Code",monospace;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.04);
  --shadow: 0 3px 12px rgba(0,0,0,.05);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.06);
  --shadow-xl: 0 16px 48px rgba(0,0,0,.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { font-size: 15px; }
body {
  background: var(--bg-canvas);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 1200px; margin:0 auto; display:flex; flex-direction:column; min-height:100vh; padding:0 20px 20px; }

/* ── Topbar ── */
.topbar {
  display:flex; align-items:center; gap:4px;
  padding:10px 20px; margin-top:16px;
  background:var(--bg-raised); border:1px solid var(--border);
  border-radius:var(--radius-lg);
}
.topbar .logo {
  font-weight:700; font-size:1.05rem; color:var(--text);
  margin-right:24px; letter-spacing:-.01em;
  display:flex; align-items:center; gap:8px;
}
.topbar .logo::before {
  content:""; width:8px; height:8px;
  background:var(--accent); border-radius:3px;
  box-shadow:0 0 12px var(--accent-glow);
}
.tab-btn {
  padding:8px 18px; border-radius:var(--radius-sm);
  font-size:.82rem; font-weight:500;
  border:1px solid transparent; background:transparent;
  color:var(--text-soft); cursor:pointer;
  transition:all .16s ease; font-family:var(--font);
}
.tab-btn:hover { color:var(--text); background:var(--bg-hover); }
.tab-btn.active {
  background:var(--accent-glow); color:var(--accent);
  border-color:rgba(200,131,46,.2);
  font-weight:600;
}
.topbar .spacer { flex:1; }
.topbar .top-btn {
  padding:7px 14px; border-radius:var(--radius-sm);
  font-size:.8rem; border:1px solid var(--border);
  background:var(--bg-raised); color:var(--text-soft);
  cursor:pointer; font-family:var(--font); transition:all .16s ease;
  display:flex; align-items:center; gap:5px;
}
.topbar .top-btn:hover { border-color:var(--border-hi); color:var(--text); background:var(--bg-hover); }

/* ── Page ── */
.page { display:none; flex-direction:column; flex:1; margin-top:12px; gap:12px; }
.page.active { display:flex; }

/* ═══════════ WECHAT ═══════════ */
.wechat-grid {
  display:grid;
  grid-template-columns:1fr 185px 1.1fr;
  min-height:0;
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg); overflow:visible;
  box-shadow:var(--shadow);
}
.col { display:flex; flex-direction:column; min-height:0; position:relative; overflow:visible; }
.col+.col::before {
  content:""; position:absolute; left:0; top:0; bottom:0; width:1px; background:var(--border); z-index:1;
}

/* Text editor */
.col-text .editor-header {
  flex-shrink:0; display:flex; align-items:center; gap:6px;
  padding:8px 16px; border-bottom:1px solid var(--border);
  background:var(--bg-raised);
}
.editor-dot { width:6px; height:6px; border-radius:50%; }
.editor-dot:nth-child(1) { background:var(--red); }
.editor-dot:nth-child(2) { background:var(--accent); }
.editor-dot:nth-child(3) { background:var(--green); }
.editor-label { margin-left:auto; font-size:.72rem; color:var(--text-muted); font-family:var(--font-mono); }
.col-text textarea {
  flex:1; width:100%; padding:20px;
  resize:none; border:none; outline:none;
  background:transparent;
  color:var(--text); font-size:.88rem;
  line-height:1.85; font-family:var(--font);
}
.col-text textarea::placeholder { color:var(--text-muted); }

/* Templates */
.tpl-header {
  flex-shrink:0; padding:10px 14px;
  font-size:.72rem; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-muted); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:7px;
}
.tpl-count {
  font-size:.65rem; color:var(--accent);
  background:var(--accent-glow);
  padding:2px 8px; border-radius:100px; font-weight:600;
}
.tpl-list {
  height:2100px; overflow-y:auto; padding:4px;
}
.tpl-list::-webkit-scrollbar { width:6px; }
.tpl-list::-webkit-scrollbar-thumb { background:var(--border-hi); border-radius:4px; }
.tpl-list::-webkit-scrollbar-track { background:transparent; }
.tpl-item {
  padding:7px 12px; margin:1px 4px;
  border-radius:var(--radius-sm); cursor:pointer;
  font-size:.78rem; color:var(--text-soft);
  transition:all .12s ease;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  border:1px solid transparent;
}
.tpl-item:hover { background:var(--bg-hover); color:var(--text); }
.tpl-item.active {
  background:var(--accent-glow); color:var(--accent);
  border-color:rgba(200,131,46,.18);
  font-weight:600;
}

/* Preview */
.preview-header {
  flex-shrink:0; display:flex; align-items:center; gap:4px;
  padding:8px 14px; border-bottom:1px solid var(--border);
  background:var(--bg-raised);
}
.preview-header .spacer { flex:1; }
.pv-btn {
  padding:4px 11px; border-radius:var(--radius-sm);
  font-size:.76rem; border:1px solid transparent;
  background:transparent; color:var(--text-muted);
  cursor:pointer; font-family:var(--font);
  transition:all .12s ease; font-weight:500;
}
.pv-btn:hover { color:var(--text); background:var(--bg-hover); }
.pv-btn.active { border-color:rgba(200,131,46,.25); color:var(--accent); background:var(--accent-glow); }
.preview-content {
  flex:1; overflow-y:auto;
  display:flex; align-items:center; justify-content:center;
  padding:32px;
  background:radial-gradient(ellipse at 50% 30%, rgba(200,131,46,.03) 0%, transparent 70%), var(--bg-surface);
}
.pv-empty { text-align:center; color:var(--text-muted); font-size:.8rem; }
.pv-empty-icon { width:44px;height:44px;border-radius:var(--radius);border:1px dashed var(--border-hi);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:1.1rem; }
#preview-frame { width:100%; height:100%; border:none; background:white; border-radius:var(--radius-sm); }

/* Footer */
.wechat-footer {
  display:flex; align-items:center; gap:6px;
}
.wechat-footer .spacer { flex:1; }
.btn {
  padding:8px 15px; border-radius:var(--radius-sm);
  font-size:.8rem; font-family:var(--font);
  font-weight:500; cursor:pointer;
  transition:all .14s ease;
  border:1px solid var(--border);
  background:var(--bg-raised); color:var(--text-soft);
  white-space:nowrap; display:flex; align-items:center; gap:5px;
}
.btn:hover { border-color:var(--border-hi); color:var(--text); background:var(--bg-hover); }
.btn-primary {
  background:var(--accent); border-color:var(--accent);
  color:#fff; font-weight:600;
  box-shadow:0 2px 10px var(--accent-glow);
}
.btn-primary:hover { filter:brightness(1.08); }

/* AI toggle */
.ai-toggle {
  display:flex; align-items:center; gap:5px;
  padding:8px 15px; border-radius:var(--radius-sm);
  font-size:.8rem; font-family:var(--font);
  font-weight:500; cursor:pointer; transition:all .14s ease;
  border:1px solid var(--border);
  background:var(--bg-raised); color:var(--text-soft);
  white-space:nowrap; user-select:none;
}
.ai-toggle:hover { border-color:var(--border-hi); color:var(--text); }
.ai-toggle.open { border-color:rgba(200,131,46,.3); color:var(--accent); background:var(--accent-glow); }
.ai-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent-glow); }

.ai-panel { overflow:hidden; max-height:0; transition:max-height .3s ease,margin .3s ease; margin:0; }
.ai-panel.open { max-height:140px; margin-top:4px; }
.ai-panel-inner { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px 0; }
.ai-card {
  display:flex; align-items:center; gap:12px;
  padding:14px 18px; border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--bg-raised); cursor:pointer;
  transition:all .16s ease;
}
.ai-card:hover { border-color:rgba(200,131,46,.25); background:var(--bg-hover); transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.ai-card-icon { width:36px; height:36px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; font-size:1rem; flex-shrink:0; background:var(--accent-glow); }
.ai-card-label { font-size:.82rem; font-weight:600; color:var(--text); }
.ai-card-hint { font-size:.72rem; color:var(--text-muted); margin-top:1px; }

/* ═══════════ SOCIAL ═══════════ */
.social-grid {
  flex:1; display:grid;
  grid-template-columns:270px 1fr 250px;
  min-height:0;
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg); overflow:hidden;
  box-shadow:var(--shadow);
}
.social-ctrl { overflow-y:auto; background:var(--bg-raised); }
.social-ctrl .col+.col::before { display:none; }

.s-section { padding:16px 18px; border-bottom:1px solid var(--border); }
.s-section:last-child { border-bottom:none; }
.s-label {
  font-size:.72rem; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--text-muted);
  margin-bottom:10px; display:flex; align-items:center; gap:8px;
}
.s-step {
  width:20px; height:20px; border-radius:var(--radius-sm);
  background:var(--accent-glow); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
  font-size:.65rem; font-weight:700;
  border:1px solid rgba(200,131,46,.2);
}

.plt-toggles { display:flex; gap:5px; }
.plt-btn {
  flex:1; padding:7px 0; text-align:center;
  border-radius:var(--radius-sm); font-size:.76rem; font-weight:500;
  border:1px solid var(--border); background:transparent;
  color:var(--text-muted); cursor:pointer; font-family:var(--font);
  transition:all .12s ease;
}
.plt-btn:hover { color:var(--text); border-color:var(--border-hi); }
.plt-btn.active { border-color:rgba(200,131,46,.3); color:var(--accent); background:var(--accent-glow); }

.s-textarea {
  width:100%; min-height:80px; padding:10px 12px;
  border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--bg-surface); color:var(--text);
  font-size:.8rem; resize:vertical; outline:none;
  font-family:var(--font); line-height:1.7;
  transition:border-color .16s ease;
}
.s-textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
.s-counter { font-size:.68rem; color:var(--text-muted); text-align:right; margin-top:4px; font-family:var(--font-mono); }

.style-tabs { display:flex; gap:3px; margin-bottom:8px; }
.style-tab {
  padding:5px 12px; border-radius:100px;
  font-size:.74rem; font-weight:500;
  border:1px solid var(--border); background:transparent;
  color:var(--text-muted); cursor:pointer; font-family:var(--font);
  transition:all .12s ease;
}
.style-tab:hover { color:var(--text); border-color:var(--border-hi); }
.style-tab.active { border-color:rgba(200,131,46,.3); color:var(--accent); background:var(--accent-glow); }

.tpl-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:5px;
  max-height:120px; overflow-y:auto; padding-right:2px;
}
.tpl-grid::-webkit-scrollbar { width:4px; }
.tpl-grid::-webkit-scrollbar-thumb { background:var(--border-hi); border-radius:4px; }
.tpl-mini {
  padding:8px 10px; border-radius:var(--radius-sm);
  border:1px solid var(--border); cursor:pointer;
  font-size:.76rem; text-align:center;
  color:var(--text-soft); transition:all .12s ease;
}
.tpl-mini:hover { border-color:var(--border-hi); background:var(--bg-hover); }
.tpl-mini.selected { border-color:var(--accent); background:var(--accent-glow); color:var(--accent); font-weight:600; box-shadow:0 0 10px var(--accent-glow); }

.img-slots { display:flex; flex-direction:column; gap:5px; }
.img-slot {
  padding:10px 12px; border-radius:var(--radius-sm);
  border:1px dashed var(--border-hi); cursor:pointer;
  font-size:.76rem; color:var(--text-muted);
  transition:all .12s ease; display:flex; align-items:center; gap:8px;
}
.img-slot:hover { border-color:var(--accent); color:var(--text); background:var(--bg-hover); }
.img-slot .tag {
  font-size:.65rem; padding:2px 7px; border-radius:100px;
  background:var(--accent-glow); color:var(--accent); flex-shrink:0;
  font-weight:600; font-family:var(--font-mono);
}

.gen-btn {
  width:100%; padding:13px 0; border-radius:var(--radius-sm);
  font-size:.92rem; font-weight:600;
  border:none; cursor:pointer; font-family:var(--font);
  background:var(--accent); color:#fff;
  transition:all .16s ease;
  box-shadow:0 3px 16px var(--accent-glow);
  letter-spacing:.02em;
}
.gen-btn:hover { filter:brightness(1.08); transform:translateY(-1px); }
.gen-btn:active { transform:translateY(0); }
.gen-hint { font-size:.68rem; color:var(--text-muted); text-align:center; margin-top:8px; font-family:var(--font-mono); }

/* Social preview */
.social-preview {
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  background:radial-gradient(ellipse at 50% 40%, rgba(200,131,46,.04) 0%, transparent 70%), var(--bg-surface);
}
.spv-empty { text-align:center; color:var(--text-muted); font-size:.8rem; }
.spv-card {
  width:220px; border-radius:var(--radius-lg);
  background:var(--bg-raised); overflow:hidden;
  border:1px solid var(--border);
  box-shadow:var(--shadow-lg);
}
.spv-card-body { padding:28px 20px; display:flex; flex-direction:column; gap:8px; text-align:center; }
.spv-tag { font-size:.62rem; color:var(--accent); letter-spacing:.12em; text-transform:uppercase; font-weight:600; }
.spv-title { font-size:1.25rem; font-weight:700; color:var(--text); letter-spacing:-.01em; }
.spv-divider { width:36px; height:2px; background:var(--accent); margin:0 auto; border-radius:2px; opacity:.5; }
.spv-desc { font-size:.73rem; color:var(--text-muted); line-height:1.6; }

/* Social results */
.social-results { padding:16px; overflow-y:auto; background:var(--bg-raised); }
.result-label {
  font-size:.72rem; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--text-muted);
  margin-bottom:12px; display:flex; align-items:center; gap:6px;
}
.result-label::after { content:""; flex:1; height:1px; background:var(--border); }
.result-card {
  margin-bottom:10px; border-radius:var(--radius);
  overflow:hidden; cursor:pointer;
  border:1px solid var(--border); transition:all .18s ease;
}
.result-card:hover { border-color:var(--border-hi); transform:translateY(-2px); box-shadow:var(--shadow); }
.result-card-body { aspect-ratio:3/4; }
.result-card-label {
  padding:8px 12px; font-size:.7rem; color:var(--text-muted);
  text-align:center; border-top:1px solid var(--border);
  background:var(--bg-surface); font-family:var(--font-mono);
}

/* ── MODALS ── */
.modal {
  position:fixed; inset:0;
  background:rgba(30,32,25,.35);
  backdrop-filter:blur(4px);
  display:flex; justify-content:center; align-items:center;
  z-index:100; animation:modalFade .18s ease;
}
@keyframes modalFade { from { opacity:0; } to { opacity:1; } }
.modal.hidden { display:none !important; }
.modal-content {
  background:var(--bg-raised);
  border-radius:var(--radius-xl);
  padding:24px 28px;
  width:540px; max-width:92vw;
  box-shadow:var(--shadow-xl);
  border:1px solid var(--border);
  max-height:85vh; overflow-y:auto;
  animation:modalSlide .25s cubic-bezier(.4,0,.2,1);
}
@keyframes modalSlide { from { opacity:0; transform:translateY(12px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
.modal-content h3 { font-size:17px; font-weight:600; margin-bottom:4px; }
.modal-content .modal-desc { font-size:.8rem; color:var(--text-muted); margin-bottom:18px; }
.modal-content label { display:block; font-size:.78rem; font-weight:500; color:var(--text-soft); margin-bottom:5px; margin-top:12px; }
.modal-content select,.modal-content textarea,.modal-content input:not([type="checkbox"]):not([type="radio"]) {
  width:100%; padding:9px 12px;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  font-size:.82rem; font-family:inherit;
  background:var(--bg-surface); transition:border-color .14s ease;
  color:var(--text);
}
.modal-content select:focus,.modal-content textarea:focus,.modal-content input:focus {
  outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-glow);
}
.modal-actions {
  display:flex; gap:10px; justify-content:flex-end;
  margin-top:22px;
}
.modal-actions button {
  padding:9px 22px; border-radius:var(--radius-sm);
  font-size:.82rem; font-weight:500; cursor:pointer;
  transition:all .14s ease; font-family:var(--font);
}
.modal-actions button.primary {
  background:var(--accent); color:#fff; border:none;
  box-shadow:0 2px 10px var(--accent-glow);
}
.modal-actions button.primary:hover { filter:brightness(1.08); }
.modal-actions button.secondary {
  border:1px solid var(--border); background:var(--bg-raised);
  color:var(--text-soft);
}
.modal-actions button.secondary:hover { border-color:var(--border-hi); color:var(--text); }

/* ── Toast ── */
.toast {
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
  padding:10px 22px; border-radius:100px;
  background:var(--text); color:var(--bg-raised);
  font-size:.8rem; font-weight:500;
  opacity:0; transition:opacity .25s ease,transform .25s ease;
  pointer-events:none; z-index:200;
  font-family:var(--font);
  box-shadow:0 4px 20px rgba(0,0,0,.12);
  white-space:nowrap;
}

/* ── Responsive ── */
@media (max-width:800px) {
  .wechat-grid { grid-template-columns:1fr; }
  /* W-1 修复：移动端不再隐藏主题列表，改为堆叠 + 限高滚动，53 套主题仍可选取 */
  .col-templates { max-height:42vh; overflow:auto; border:1px solid var(--border); }
  .social-grid { grid-template-columns:1fr; }
  /* D-3 修复：移动端不再隐藏预览与结果，改为堆叠可见（移除 display:none） */
  .app { padding:0 10px 10px; }
}
</style>
</head>

<!-- ── Toast ── -->
<div class="toast" id="toast-el"></div>

<script>
// ── State ──
let themes = [];
let activeTpl = null;
let lastHtml = '';
let lastText = '';
let renderTimer = null;
let aiOpen = false;

// ── DOM refs ──
const inputArea = document.getElementById('input-area');
const tplList = document.getElementById('tpl-list');
const tplCount = document.getElementById('tpl-count');
const pvContent = document.getElementById('pv-content');
const pvEmpty = document.getElementById('pv-empty-state');
const previewFrame = document.getElementById('preview-frame');
const aiIndicator = document.getElementById('ai-indicator');

// =================================
// PAGE SWITCH
// =================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
  });
});

// =================================
// THEMES
// =================================
async function loadThemes() {
  try {
    const res = await fetch('/api/themes');
    const data = await res.json();
    themes = Array.isArray(data) ? data : (data.themes || []);
    renderTplList();
  } catch(e) {
    console.error('load themes error', e);
    themes = [];
    renderTplList();
  }
}

function renderTplList() {
  tplCount.textContent = themes.length;
  tplList.innerHTML = themes.map(t => 
    `<div class="tpl-item${activeTpl===t.id?' active':''}" data-tpl="${t.id}">${t.name}</div>`
  ).join('');
}

tplList.addEventListener('click', e => {
  const item = e.target.closest('.tpl-item');
  if (!item) return;
  const name = item.dataset.tpl;
  activeTpl = name;
  renderTplList();
  doRender();
});

// =================================
// RENDER
// =================================
async function doRender() {
  const text = inputArea.value.trim();
  if (!text || !activeTpl) return;
  lastText = text;
  
  try {
    const res = await fetch('/api/render', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({raw_text: text, theme_id: activeTpl})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'render failed');
    lastHtml = data.html || '';
    showPreview(lastHtml);
  } catch(e) {
    console.error('render error', e);
    toast('渲染失败: ' + e.message);
  }
}

function showPreview(html) {
  pvEmpty.style.display = 'none';
  previewFrame.style.display = 'block';
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  previewFrame.src = URL.createObjectURL(blob);
}

// Auto render on input change
inputArea.addEventListener('input', () => {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(doRender, 400);
});

// =================================
// PREVIEW MODE
// =================================
document.querySelectorAll('[data-preview]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-preview]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// =================================
// AI TOGGLE
// =================================
document.getElementById('ai-toggle').addEventListener('click', () => {
  aiOpen = !aiOpen;
  document.getElementById('ai-panel').classList.toggle('open', aiOpen);
  document.getElementById('ai-toggle').classList.toggle('open', aiOpen);
});

// =================================
// AI FORMAT
// =================================
document.getElementById('btn-ai-format').addEventListener('click', async () => {
  const text = inputArea.value.trim();
  if (!text) { toast('请先输入文本'); return; }
  toast('AI 排版中...');
  try {
    const res = await fetch('/api/ai-format', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'failed');
    if (data.formatted) inputArea.value = data.formatted;
    toast('AI 排版完成');
    doRender();
  } catch(e) {
    toast('AI 排版失败: ' + e.message);
  }
});

// =================================
// POLISH
// =================================
document.getElementById('btn-polish').addEventListener('click', () => {
  const text = inputArea.value.trim();
  if (!text) { toast('请先输入文本'); return; }
  openPolishModal(text);
});

function openPolishModal(text) {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content" style="width:520px;">
      <h3>AI 润色文字</h3>
      <p class="modal-desc">选择润色风格，AI 将自动优化你的文案</p>
      <label>润色风格</label>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <label style="display:flex;align-items:center;gap:5px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;font-size:.8rem;">
          <input type="radio" name="polish-style" value="natural" checked> 去AI味
        </label>
        <label style="display:flex;align-items:center;gap:5px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;font-size:.8rem;">
          <input type="radio" name="polish-style" value="formal"> 正式
        </label>
        <label style="display:flex;align-items:center;gap:5px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;font-size:.8rem;">
          <input type="radio" name="polish-style" value="casual"> 轻松
        </label>
      </div>
      <label>原文</label>
      <textarea readonly style="width:100%;min-height:80px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.8rem;background:var(--bg-surface);resize:none;">${text}</textarea>
      <label>润色结果</label>
      <textarea id="polish-result" readonly style="width:100%;min-height:80px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.8rem;background:var(--bg-surface);resize:none;" placeholder="点击「开始润色」生成..."></textarea>
      <div class="modal-actions">
        <button class="secondary" onclick="this.closest('.modal').remove()">取消</button>
        <button class="secondary" id="polish-apply" style="display:none;" onclick="applyPolish(this)">应用到编辑区</button>
        <button class="primary" id="polish-start" onclick="startPolish(this)">开始润色</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function startPolish(btn) {
  const modal = btn.closest('.modal');
  const style = modal.querySelector('input[name="polish-style"]:checked').value;
  const text = modal.querySelector('textarea').value;
  const resultArea = modal.querySelector('#polish-result');
  btn.textContent = '润色中...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/polish', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text, style})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'failed');
    resultArea.value = data.polished || '';
    btn.style.display = 'none';
    modal.querySelector('#polish-apply').style.display = '';
  } catch(e) {
    toast('润色失败: ' + e.message);
    btn.textContent = '开始润色';
    btn.disabled = false;
  }
}

function applyPolish(btn) {
  const result = btn.closest('.modal').querySelector('#polish-result').value;
  if (result) inputArea.value = result;
  btn.closest('.modal').remove();
  doRender();
  toast('已应用润色结果');
}

// =================================
// COPY
// =================================
document.getElementById('btn-copy').addEventListener('click', async () => {
  if (!lastHtml) { toast('请先排版生成内容'); return; }
  try {
    await navigator.clipboard.writeText(lastHtml);
    toast('HTML 已复制到剪贴板');
  } catch(e) {
    toast('复制失败');
  }
});

// =================================
// PUSH
// =================================
document.getElementById('btn-push').addEventListener('click', () => {
  if (!lastHtml) { toast('请先排版生成内容'); return; }
  openPushModal();
});

function openPushModal() {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content" style="width:600px;">
      <h3>一键推送</h3>
      <p class="modal-desc">推送到微信公众号草稿箱</p>
      <label>选择公众号</label>
      <div style="display:flex;gap:8px;">
        <select id="push-account" style="flex:1;">
          <option value="">请选择公众号</option>
        </select>
        <button class="secondary" onclick="openAccountModal()" style="font-size:.75rem;white-space:nowrap;">管理</button>
      </div>
      <label>文章标题</label>
      <input id="push-title" value="${extractTitle(lastText)}" placeholder="输入文章标题">
      <label>摘要（80-100字）</label>
      <textarea id="push-summary" placeholder="输入摘要或使用 AI 生成" style="min-height:80px;"></textarea>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <button class="secondary" onclick="genSummary(this)" style="font-size:.75rem;">AI 生成摘要</button>
      </div>
      <label>封面图</label>
      <div style="display:flex;gap:10px;align-items:center;">
        <div style="width:120px;height:80px;border-radius:var(--radius-sm);border:1px dashed var(--border-hi);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--text-muted);">预览</div>
        <div>
          <button class="secondary" onclick="genCover(this)" style="font-size:.75rem;">AI 生成封面</button>
          <p id="cover-status" style="font-size:.68rem;color:var(--text-muted);margin-top:4px;"></p>
        </div>
      </div>
      <div class="modal-actions">
        <button class="secondary" onclick="this.closest('.modal').remove()">取消</button>
        <button class="primary" onclick="confirmPush(this)">确认推送</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  loadAccounts();
}

function extractTitle(text) {
  const lines = text.split('\n').filter(l => l.trim());
  for (const line of lines) {
    if (line.startsWith('# ') || line.startsWith('## ')) return line.replace(/^#+\s*/, '');
  }
  return lines[0]?.slice(0,30) || '无标题';
}

async function loadAccounts() {
  const sel = document.getElementById('push-account');
  if (!sel) return;
  try {
    const res = await fetch('/api/accounts');
    const data = await res.json();
    const accounts = data.accounts || [];
    sel.innerHTML = '<option value="">请选择公众号</option>' + 
      accounts.map(a => `<option value="${a.id}">${a.nickname}</option>`).join('');
  } catch(e) { console.error(e); }
}

async function genSummary(btn) {
  if (!lastText) { toast('请先输入文本'); return; }
  btn.textContent = '生成中...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/summary', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({article_text: lastText})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'failed');
    document.getElementById('push-summary').value = data.summary || '';
    toast('摘要已生成');
  } catch(e) {
    toast('生成失败: ' + e.message);
  }
  btn.textContent = 'AI 生成摘要';
  btn.disabled = false;
}

async function genCover(btn) {
  const title = document.getElementById('push-title').value;
  if (!title) { toast('请先填写标题'); return; }
  btn.textContent = '生成中...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/cover-image', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title, full_text: lastText})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'failed');
    document.getElementById('cover-status').textContent = '封面已生成';
    toast('封面已生成');
  } catch(e) {
    toast('生成失败: ' + e.message);
  }
  btn.textContent = 'AI 生成封面';
  btn.disabled = false;
}

async function confirmPush(btn) {
  const accountId = document.getElementById('push-account').value;
  const title = document.getElementById('push-title').value;
  const summary = document.getElementById('push-summary').value;
  if (!accountId || !title) { toast('请选择公众号并填写标题'); return; }
  btn.textContent = '推送中...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/push', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({account_id: accountId, title, html: lastHtml, summary})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'push failed');
    toast('推送成功！');
    btn.closest('.modal').remove();
  } catch(e) {
    toast('推送失败: ' + e.message);
  }
  btn.textContent = '确认推送';
  btn.disabled = false;
}

// =================================
// ACCOUNT MANAGEMENT
// =================================
function openAccountModal() {
  const existing = document.querySelector('.modal');
  if (existing) existing.style.display = 'none';
  
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content" style="width:480px;">
      <h3>公众号管理</h3>
      <p class="modal-desc">管理微信公众号配置</p>
      <div id="acct-list"></div>
      <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:16px;">
        <label>添加公众号</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <input id="acct-nickname" placeholder="公众号名称">
          <input id="acct-appid" placeholder="AppID">
        </div>
        <input id="acct-appsecret" type="password" placeholder="AppSecret" style="margin-top:8px;">
        <button class="primary" onclick="addAccount(this)" style="margin-top:10px;width:100%;padding:9px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;cursor:pointer;font-family:var(--font);font-weight:500;">添加</button>
      </div>
      <div class="modal-actions">
        <button class="secondary" onclick="this.closest('.modal').remove();openPushModal();">关闭</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  loadAccountList();
}

async function loadAccountList() {
  const el = document.getElementById('acct-list');
  try {
    const res = await fetch('/api/accounts');
    const data = await res.json();
    const accounts = data.accounts || [];
    if (!accounts.length) {
      el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:.8rem;">暂无公众号配置</div>';
      return;
    }
    el.innerHTML = accounts.map(a => `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;">
        <div><span style="font-weight:600;font-size:.82rem;">${a.nickname}</span><span style="font-size:.7rem;color:var(--text-muted);margin-left:8px;">${a.appid}</span></div>
        <button onclick="deleteAccount('${a.id}', this)" style="padding:3px 10px;font-size:.7rem;border:1px solid rgba(217,72,78,.3);border-radius:4px;background:rgba(217,72,78,.08);color:var(--red);cursor:pointer;">删除</button>
      </div>
    `).join('');
  } catch(e) { console.error(e); }
}

async function addAccount(btn) {
  const nickname = document.getElementById('acct-nickname').value.trim();
  const appid = document.getElementById('acct-appid').value.trim();
  const appsecret = document.getElementById('acct-appsecret').value.trim();
  if (!nickname || !appid || !appsecret) { toast('请填写完整信息'); return; }
  btn.textContent = '添加中...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/accounts', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({nickname, appid, appsecret})
    });
    if (!res.ok) { const d = await res.json(); throw new Error(d.error || 'failed'); }
    document.getElementById('acct-nickname').value = '';
    document.getElementById('acct-appid').value = '';
    document.getElementById('acct-appsecret').value = '';
    toast('添加成功');
    loadAccountList();
  } catch(e) {
    toast('添加失败: ' + e.message);
  }
  btn.textContent = '添加';
  btn.disabled = false;
}

async function deleteAccount(id, btn) {
  btn.disabled = true;
  try {
    await fetch('/api/accounts/' + id, {method:'DELETE'});
    toast('已删除');
    loadAccountList();
  } catch(e) { toast('删除失败'); }
}

// =================================
// SETTINGS
// =================================
document.getElementById('btn-settings').addEventListener('click', () => {
  openSettingsModal();
});

function openSettingsModal() {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content" style="width:520px;">
      <h3>系统设置</h3>
      <p class="modal-desc">AI API 配置</p>
      <label>AI 平台</label>
      <select id="ai-platform"><option value="">加载中...</option></select>
      <label>API Key</label>
      <input id="ai-api-key" type="password" placeholder="sk-...">
      <label>模型名称</label>
      <input id="ai-model" placeholder="模型名称">
      <div style="display:flex;gap:6px;margin-top:10px;">
        <button class="secondary" onclick="testAiConfig(this)" style="font-size:.75rem;">测试连接</button>
      </div>
      <div id="ai-test-result" style="font-size:.75rem;margin-top:6px;color:var(--green);"></div>
      <div class="modal-actions">
        <button class="secondary" onclick="this.closest('.modal').remove()">关闭</button>
        <button class="primary" onclick="saveAiConfig(this)">保存配置</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  loadAiConfig();
  loadPlatforms();
}

async function loadPlatforms() {
  const sel = document.getElementById('ai-platform');
  try {
    const res = await fetch('/api/ai-platforms');
    const data = await res.json();
    const platforms = data.platforms || [];
    sel.innerHTML = platforms.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  } catch(e) { console.error(e); }
}

async function loadAiConfig() {
  try {
    const res = await fetch('/api/ai-config');
    const data = await res.json();
    if (data.config) {
      document.getElementById('ai-api-key').value = data.config.api_key || '';
      document.getElementById('ai-model').value = data.config.model || '';
      if (data.config.platform) document.getElementById('ai-platform').value = data.config.platform;
    }
  } catch(e) { console.error(e); }
}

async function saveAiConfig(btn) {
  const platform = document.getElementById('ai-platform').value;
  const api_key = document.getElementById('ai-api-key').value;
  const model = document.getElementById('ai-model').value;
  btn.textContent = '保存中...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/ai-config', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({platform, api_key, model})
    });
    if (!res.ok) throw new Error('save failed');
    toast('配置已保存');
    btn.closest('.modal').remove();
  } catch(e) { toast('保存失败'); }
  btn.textContent = '保存配置';
  btn.disabled = false;
}

async function testAiConfig(btn) {
  const resultEl = document.getElementById('ai-test-result');
  btn.textContent = '测试中...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/ai-config/test', {method:'POST'});
    const data = await res.json();
    resultEl.textContent = data.success ? '连接成功 ✓' : '连接失败: ' + (data.error || 'unknown');
    resultEl.style.color = data.success ? 'var(--green)' : 'var(--red)';
  } catch(e) {
    resultEl.textContent = '测试失败: ' + e.message;
    resultEl.style.color = 'var(--red)';
  }
  btn.textContent = '测试连接';
  btn.disabled = false;
}

// =================================
// SOCIAL
// =================================
// 风格列表由后端 /api/social/styles 提供（归藏 editorial/swiss + BLCaptain sp-*/sl-*）
// 废除硬编码中文 styleMap：前端只发规范 id，后端无需改动（D-4 修复）
let socialStyles = { guizang: [], blcaptain: [] };
let activeSocialStyle = null;
let activeSocialGroup = 'guizang';

async function loadSocialStyles() {
  try {
    const res = await fetch('/api/social/styles');
    const data = await res.json();
    socialStyles.guizang = data.guizang || [];
    socialStyles.blcaptain = data.blcaptain || [];
  } catch (e) {
    // 兜底：保证归藏两风格可用
    socialStyles.guizang = [
      {id:'editorial', name:'Editorial 杂志风'},
      {id:'swiss', name:'Swiss 瑞士风'}
    ];
    socialStyles.blcaptain = [];
  }
}

function renderSocialTpls(group) {
  const grid = document.getElementById('social-tpl-grid');
  activeSocialGroup = group;
  const items = socialStyles[group] || [];
  grid.innerHTML = items.map(s => 
    `<div class="tpl-mini" data-style="${s.id}">${s.name}</div>`
  ).join('');
}

document.querySelectorAll('.style-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.style-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderSocialTpls(tab.dataset.group);
    activeSocialStyle = null;
    document.getElementById('spv-card').style.display = 'none';
    document.getElementById('spv-empty').style.display = '';
  });
});

document.getElementById('social-tpl-grid').addEventListener('click', e => {
  const item = e.target.closest('.tpl-mini');
  if (!item) return;
  document.querySelectorAll('.tpl-mini').forEach(t => t.classList.remove('selected'));
  item.classList.add('selected');
  activeSocialStyle = item.dataset.style;
  document.getElementById('spv-empty').style.display = 'none';
  document.getElementById('spv-card').style.display = 'block';
  document.getElementById('spv-tag').textContent = item.textContent || activeSocialGroup;
  const text = document.getElementById('social-text').value.trim();
  document.getElementById('spv-title').textContent = extractSocialTitle(text) || '阳光星盘';
  document.getElementById('spv-desc').textContent = extractSocialDesc(text) || '封面描述';
});

document.querySelectorAll('.plt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.plt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

document.getElementById('social-text').addEventListener('input', function() {
  document.getElementById('social-char-count').textContent = this.value.length + ' / 500';
  if (activeSocialStyle) {
    document.getElementById('spv-title').textContent = extractSocialTitle(this.value) || '封面标题';
    document.getElementById('spv-desc').textContent = extractSocialDesc(this.value) || '封面描述';
  }
});

function extractSocialTitle(text) {
  if (!text) return '';
  const lines = text.split('\n').filter(l => l.trim());
  for (const line of lines) {
    if (line.startsWith('# ') || line.startsWith('## ')) return line.replace(/^#+\s*/, '');
  }
  const hashtag = text.match(/#(\S+)/);
  return hashtag ? hashtag[1] : lines[0]?.slice(0,20) || '';
}

function extractSocialDesc(text) {
  if (!text) return '';
  const lines = text.split('\n').filter(l => l.trim() && !l.startsWith('#'));
  return lines.slice(0,2).map(l => l.slice(0,20)).join('<br>');
}

document.getElementById('btn-generate-cover').addEventListener('click', async () => {
  const text = document.getElementById('social-text').value.trim();
  if (!text) { toast('请先输入文案'); return; }
  if (!activeSocialStyle) { toast('请先选择风格模板'); return; }
  toast('正在生成封面...');
  try {
    const res = await fetch('/api/social/generate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text, style: activeSocialStyle, platform: 'xhs'})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'generate failed');
    document.getElementById('results-empty').style.display = 'none';
    const list = document.getElementById('results-list');
    list.style.display = 'block';
    // D-1 修复：结果卡绑定后端返回的真实图片 url（data.images），废除写死渐变占位块
    const images = data.images || (Array.isArray(data) ? data : []);
    list.innerHTML = images.map(r => `
      <div class="result-card">
        <img class="result-card-img" src="${r.url}" alt="${r.file || 'cover'}" loading="lazy" />
        <div class="result-card-label">${r.file || 'cover'} · ${r.type || ''}</div>
      </div>
    `).join('');
    toast('封面已生成');
  } catch(e) {
    toast('生成失败: ' + e.message);
  }
});

document.getElementById('social-text').addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') {
    document.getElementById('btn-generate-cover').click();
  }
});

// INIT
// =================================
// 启动：从后端拉取规范风格 id 并默认渲染归藏组（D-4）
loadSocialStyles().then(() => {
  renderSocialTpls('guizang');
  document.querySelector('.style-tab[data-group="guizang"]')?.classList.add('active');
});
if (document.querySelector('.plt-btn')) document.querySelector('.plt-btn').classList.add('active');
loadThemes();

// =================================
// TOAST
// =================================
function toast(msg) {
  const el = document.getElementById('toast-el');
  el.textContent = msg;
  el.style.opacity = '1';
  el.style.transform = 'translateX(-50%) translateY(-6px)';
  clearTimeout(el._t);
  el._t = setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(-50%) translateY(0)';
  }, 1800);
}
</script>
