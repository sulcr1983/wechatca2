<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封面模板库 · Gallery 原型</title>
<style>
/* ============================================================
   模板库原型 —— 一版式一卡片，颜色用小色点切换
   为什么不做 12×10=120 个格子：同一版式换色只是换 CSS 变量，
   并排展示 120 张「长得一样、颜色不同」的图，是纯噪音。
   ============================================================ */

:root{
  --bg:#f4f3f0; --panel:#fff; --ink:#191919; --ink2:#4b4b52; --ink3:#93939b;
  --line:#e4e1da; --line2:#f1efea;
  --accent:#8f7650; --accent-soft:#f3ede2;
  --ok:#2e6b4f; --ok-soft:#e9f4ee;
  --warn:#9b5a2e; --warn-soft:#fdf1e7;
}
*{box-sizing:border-box; -webkit-font-smoothing:antialiased}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px; line-height:1.6;
}

/* ---------- 顶部工具栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1360px; margin:0 auto; padding:14px 28px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{font-family:Georgia,"Songti SC",serif; font-size:16px; font-weight:700; letter-spacing:-.01em; margin-right:4px}
.brand small{display:block; font-family:-apple-system,sans-serif; font-size:10px; font-weight:400; color:var(--ink3); letter-spacing:.02em; margin-top:1px}

.seg{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; background:#fcfbf9}
.seg button{
  border:0; background:none; padding:6px 12px; font-size:11.5px; color:var(--ink2);
  cursor:pointer; font-family:inherit; transition:all .13s; white-space:nowrap;
}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:#fff}
.seg button.on{background:var(--ink); color:#fff}

.spacer{flex:1}
.search{
  border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:12px;
  background:#fcfbf9; outline:none; width:170px; font-family:inherit;
}
.search:focus{border-color:var(--accent); background:#fff}

.count{font-size:11px; color:var(--ink3); font-variant-numeric:tabular-nums}

/* ---------- 网格 ---------- */
.wrap{max-width:1360px; margin:0 auto; padding:26px 28px 80px}
.sec{margin-bottom:34px}
.sec-hd{display:flex; align-items:baseline; gap:10px; margin-bottom:14px}
.sec-hd h2{font-family:Georgia,"Songti SC",serif; font-size:17px; margin:0; font-weight:700}
.sec-hd .n{font-size:11px; color:var(--ink3)}

.grid{display:grid; gap:16px; grid-template-columns:repeat(4, 1fr)}
.grid.d3{grid-template-columns:repeat(3, 1fr)}
.grid.d5{grid-template-columns:repeat(5, 1fr)}
@media(max-width:1180px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.grid,.grid.d3,.grid.d5{grid-template-columns:repeat(2,1fr)}}

/* ---------- 卡片 ---------- */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  overflow:hidden; transition:box-shadow .16s, border-color .16s, transform .16s;
  display:flex; flex-direction:column;
}
.card:hover{box-shadow:0 6px 22px rgba(60,45,25,.10); border-color:#d6cfc1; transform:translateY(-1px)}

.thumb{
  position:relative; width:100%; aspect-ratio:3/4; overflow:hidden;
  background:#ece9e2; cursor:zoom-in;
}
.thumb .poster{
  position:absolute; top:0; left:0; transform-origin:top left;
  width:1080px; height:1440px;
}
.thumb .zoom-hint{
  position:absolute; right:8px; bottom:8px; z-index:5;
  background:rgba(18,16,14,.62); color:#fff; font-size:10px;
  padding:3px 8px; border-radius:999px; opacity:0; transition:opacity .16s;
}
.thumb:hover .zoom-hint{opacity:1}

.card-ft{padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px}
.card-hd{display:flex; align-items:center; gap:6px}
.card-name{font-size:12.5px; font-weight:700; color:var(--ink)}
.card-tag{
  font-size:9px; padding:1px 6px; border-radius:999px; letter-spacing:.02em;
  background:var(--accent-soft); color:var(--accent); font-weight:600;
}
.card-tag.sys{background:#eef1f5; color:#4a5f78}

/* 色点切换器 —— 这是「合并显示」的核心 */
.dots{display:flex; align-items:center; gap:6px; min-height:18px}
.dot{
  width:14px; height:14px; border-radius:50%; border:1px solid rgba(0,0,0,.14);
  cursor:pointer; padding:0; position:relative; transition:transform .12s, box-shadow .12s;
  flex:0 0 auto;
}
.dot:hover{transform:scale(1.18)}
.dot.on{box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--ink)}
.dot .nm{position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; font-size:9.5px; padding:2px 6px; border-radius:4px;
  white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s;
}
.dot:hover .nm{opacity:1}
.dot-lbl{font-size:10px; color:var(--ink3); margin-left:auto; white-space:nowrap}

/* ---------- 放大预览 ---------- */
.lb{position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; padding:32px}
.lb.on{display:flex}
.lb-mask{position:absolute; inset:0; background:rgba(20,18,15,.62); backdrop-filter:blur(3px)}
.lb-in{position:relative; display:flex; gap:26px; align-items:center; max-height:100%}
.lb-stage{position:relative; box-shadow:0 20px 60px rgba(0,0,0,.35); flex:0 0 auto}
.lb-stage .poster{position:absolute; top:0; left:0; transform-origin:top left}
.lb-side{width:210px; color:#fff; flex:0 0 auto}
.lb-side h3{font-family:Georgia,"Songti SC",serif; font-size:19px; margin:0 0 4px}
.lb-side .sub{font-size:11.5px; opacity:.62; margin-bottom:18px; line-height:1.6}
.lb-side .row{display:flex; justify-content:space-between; font-size:11.5px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.14)}
.lb-side .row span:first-child{opacity:.55}
.lb-side .row span:last-child{font-family:"SF Mono",Consolas,monospace}
.lb-swatches{display:flex; gap:7px; margin-top:16px}
.lb-swatches .dot{width:20px; height:20px}
.lb-close{
  position:absolute; top:-42px; right:0; background:none; border:0; color:#fff;
  font-size:22px; cursor:pointer; opacity:.7; padding:4px 8px;
}
.lb-close:hover{opacity:1}

/* ============================================================
   海报渲染（与 cover-lab-v2 同一套规则，此处为精简版）
   ============================================================ */
.poster{
  overflow:hidden; display:flex; flex-direction:column;
  background:var(--paper); color:var(--ink); font-family:var(--f-body);
  padding:var(--py,88px) var(--px,96px) var(--pb,120px);
}
.poster .inner{position:relative; z-index:2; display:flex; flex-direction:column; flex:1; min-height:0}
.poster .eyebrow{
  font-family:var(--f-meta); font-size:20px; letter-spacing:var(--tr-meta);
  text-transform:uppercase; color:var(--accent); font-weight:500; margin-bottom:auto;
}
.poster .title{
  font-family:var(--f-title); font-weight:var(--w-title);
  letter-spacing:var(--tr-title); line-height:var(--lh-title);
  color:var(--ink); margin:0; text-wrap:normal;
}
.poster .lead{font-family:var(--f-body); font-size:var(--fs-lead); line-height:var(--lh-body); color:var(--muted); margin:0}
.poster .byline{font-family:var(--f-meta); font-size:var(--fs-meta); letter-spacing:var(--tr-meta); color:var(--muted); margin-top:24px}
.poster .accent-rule{height:4px; width:88px; background:var(--accent); margin:28px 0}
.poster .body{font-size:var(--fs-body); line-height:var(--lh-body); color:var(--muted); display:flex; flex-direction:column; gap:24px}
.poster .body p{margin:0}
.poster .list{display:flex; flex-direction:column; gap:28px}
.poster .li{display:flex; gap:22px; align-items:flex-start}
/* 清单的编号用衬线大号 —— 和「步骤」的圆点时间轴区分开 */
.poster .li .n{
  font-family:var(--f-title); font-size:40px; font-weight:var(--w-title);
  color:var(--accent); line-height:1; flex:0 0 auto; min-width:58px;
}
.poster .li .tx{font-size:var(--fs-body); line-height:1.55; color:var(--ink); padding-top:4px}
.poster .li .tx small{display:block; font-size:calc(var(--fs-body) * .86); color:var(--muted); margin-top:6px; line-height:1.5}
.poster .cmp{display:grid; grid-template-columns:1fr 1fr; flex:1; align-content:center}
.poster .cmp .col{padding:0 34px}
.poster .cmp .col:first-child{padding-left:0; border-right:1px solid var(--line)}
.poster .cmp .col:last-child{padding-right:0}
.poster .cmp .h{font-family:var(--f-meta); font-size:20px; letter-spacing:var(--tr-meta); color:var(--accent); margin-bottom:20px}
.poster .cmp .b{font-size:26px; line-height:1.6; color:var(--muted)}
.poster .foot{
  position:absolute; left:var(--px,96px); right:var(--px,96px); bottom:50px; z-index:2;
  display:flex; justify-content:space-between; align-items:baseline;
  font-family:var(--f-meta); font-size:18px; color:var(--muted); letter-spacing:var(--tr-meta);
}
.poster .num-mega{
  font-family:var(--f-title); font-weight:var(--w-title); color:var(--accent);
  line-height:.84; letter-spacing:-.035em; margin-bottom:-6px;
}
/* 步骤 = 时间轴（竖线 + 圆点），和「清单」的纯编号明确区分 */
.poster .steps{display:flex; flex-direction:column; gap:20px; margin-top:32px; position:relative; padding-left:36px}
.poster .steps::before{
  content:''; position:absolute; left:11px; top:12px; bottom:12px;
  width:1px; background:var(--line);
}
.poster .st{display:flex; gap:14px; align-items:flex-start; position:relative}
.poster .st::before{
  content:''; position:absolute; left:-30px; top:11px;
  width:8px; height:8px; border-radius:50%; background:var(--accent);
}
.poster .st .k{font-family:var(--f-meta); font-size:19px; color:var(--accent); letter-spacing:var(--tr-meta); flex:0 0 auto; padding-top:4px}
.poster .st .d b{display:block; font-size:28px; color:var(--ink); font-weight:600; line-height:1.4}
.poster .st .d small{display:block; font-size:23px; color:var(--muted); margin-top:3px; line-height:1.5}
.poster .kpis{display:flex; margin-top:38px; align-items:flex-start}
.poster .kpi{flex:1; min-width:0; padding:0 16px; border-right:1px solid var(--line)}
.poster .kpi:first-child{padding-left:0}
.poster .kpi:last-child{border-right:0; padding-right:0}
.poster .kpi b{display:block; font-family:var(--f-title); font-weight:var(--w-title); color:var(--accent); line-height:1; font-size:72px}
.poster .kpi span{display:block; font-size:22px; color:var(--muted); margin-top:10px; line-height:1.45}
.poster .mx{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); margin-top:30px}
.poster .mx .c{background:var(--paper); padding:22px 20px}
.poster .mx .c b{display:block; font-size:26px; color:var(--ink); font-weight:600; margin-bottom:6px; line-height:1.35}
.poster .mx .c small{display:block; font-size:21px; color:var(--muted); line-height:1.5}
.poster .lg{margin-top:26px; display:flex; flex-direction:column}
.poster .lg .r{display:flex; gap:18px; padding:14px 0; border-bottom:1px solid var(--line); align-items:baseline}
.poster .lg .r:first-child{border-top:1px solid var(--line)}
.poster .lg .a{font-family:var(--f-meta); font-size:19px; color:var(--accent); letter-spacing:var(--tr-meta); flex:0 0 32%; line-height:1.4}
.poster .lg .b{font-size:24px; color:var(--ink); line-height:1.5}
.poster .qmark{font-family:var(--f-title); font-size:150px; line-height:.8; color:var(--accent); opacity:.2; margin-bottom:-30px; font-weight:600}
.poster .ascend{width:100%; height:1px; background:var(--line); margin-bottom:24px}

/* 底图（图文封面专用） */
.poster .bg-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0}
.poster.has-img .title,
.poster.has-img .lead,
.poster.has-img .byline,
.poster.has-img .eyebrow{color:rgba(255,255,255,.96)}
.poster.has-img .lead,
.poster.has-img .byline{color:rgba(255,255,255,.82)}
.poster.has-img .eyebrow{color:rgba(255,255,255,.9)}
.poster.has-img .ascend{background:rgba(255,255,255,.34)}

/* 版式定位 */
.poster[data-layout="poster"]{--px:60px}
.poster[data-layout="poster"] .lead{margin-top:auto; padding-top:34px; max-width:86%}
.poster[data-layout="stack"] .eyebrow{margin-bottom:54px}
.poster[data-layout="stack"] .lead{margin-top:auto; padding-top:32px; max-width:90%; border-top:1px solid var(--line)}
.poster[data-layout="image-led"] .inner{justify-content:flex-end}
.poster[data-layout="image-led"] .eyebrow{position:absolute; top:0; left:0; margin:0}
.poster[data-layout="image-led"] .lead{margin-top:20px; max-width:88%}
.poster[data-layout="quote"] .inner{justify-content:center}
.poster[data-layout="quote"] .lead{margin-top:42px}
.poster[data-layout="number"] .inner{justify-content:center}
.poster[data-layout="number"] .lead{margin-top:24px; max-width:86%}
.poster[data-layout="list"] .title{margin-bottom:42px}
.poster[data-layout="compare"] .title{margin-bottom:42px}
.poster[data-layout="dense"] .title{margin-bottom:24px}
.poster[data-layout="steps"] .title{margin-bottom:8px}
.poster[data-layout="kpi"] .title{margin-bottom:8px}
.poster[data-layout="matrix"] .title{margin-bottom:8px}
.poster[data-layout="ledger"] .title{margin-bottom:8px}

/* 视觉体系 */
.poster[data-system="editorial"]{
  --f-title:"Georgia","Songti SC","STSong","SimSun",serif;
  --f-body:"Songti SC","STSong","SimSun","Georgia",serif;
  --f-meta:"IBM Plex Mono","Consolas",monospace;
  --w-title:500; --tr-title:.040em; --tr-meta:.220em;
  --fs-lead:32px; --fs-body:28px; --fs-meta:20px;
  --lh-title:1.14; --lh-body:1.62;
}
.poster[data-system="swiss"]{
  --f-title:"Inter","Helvetica Neue","Segoe UI","PingFang SC",sans-serif;
  --f-body:"Inter","Helvetica Neue","Segoe UI","PingFang SC",sans-serif;
  --f-meta:"IBM Plex Mono","Consolas",monospace;
  --w-title:300; --tr-title:-.010em; --tr-meta:.150em;
  --fs-lead:34px; --fs-body:30px; --fs-meta:22px;
  --lh-title:1.06; --lh-body:1.52;
}

/* 10 套色板（theme-presets.md 真值） */
.poster[data-theme="ink-classic"]{--paper:#f3f0e8;--ink:#0a0a0b;--muted:#68625a;--line:rgba(10,10,11,.22);--accent:#111111}
.poster[data-theme="indigo-porcelain"]{--paper:#f2f4f5;--ink:#0a1f3d;--muted:#5f6d78;--line:rgba(10,31,61,.20);--accent:#315d93}
.poster[data-theme="forest-ink"]{--paper:#f5f1e8;--ink:#16251b;--muted:#5d665d;--line:rgba(22,37,27,.22);--accent:#2e6b4f}
.poster[data-theme="kraft-paper"]{--paper:#eedfc7;--ink:#2a1e13;--muted:#755f49;--line:rgba(42,30,19,.24);--accent:#9b5a2e}
.poster[data-theme="dune"]{--paper:#f0e6d2;--ink:#1f1a14;--muted:#6f6557;--line:rgba(31,26,20,.22);--accent:#8f7650}
.poster[data-theme="midnight-ink"]{--paper:#0e0d0c;--ink:#ece2cf;--muted:#9a8c75;--line:rgba(236,226,207,.22);--accent:#d4a04a}
.poster[data-theme="swiss-ikb"]{--paper:#fafaf8;--ink:#0a0a0a;--muted:#737373;--line:rgba(10,10,10,.16);--accent:#002FA7}
.poster[data-theme="swiss-lemon"]{--paper:#fafaf8;--ink:#0a0a0a;--muted:#737373;--line:rgba(10,10,10,.16);--accent:#c9a800}
.poster[data-theme="swiss-lemon-green"]{--paper:#fafaf8;--ink:#0a0a0a;--muted:#737373;--line:rgba(10,10,10,.16);--accent:#7d9400}
.poster[data-theme="swiss-orange"]{--paper:#fafaf8;--ink:#0a0a0a;--muted:#737373;--line:rgba(10,10,10,.16);--accent:#FF6B35}

/* 大气层（Editorial 必备） */
.poster[data-system="editorial"]::before{
  content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
  background-image:radial-gradient(rgba(120,100,70,.055) 1px, transparent 1px);
  background-size:3px 3px;
}
.poster[data-system="editorial"][data-theme="midnight-ink"]::before{
  background-image:radial-gradient(rgba(255,244,214,.075) 1px, transparent 1px);
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">封面模板库<small>GALLERY · 一版式一卡，颜色点着换</small></div>

    <div class="seg" id="sys-seg">
      <button data-sys="editorial" class="on">Editorial 杂志</button>
      <button data-sys="swiss">Swiss 瑞士</button>
    </div>

    <div class="seg" id="grp-seg">
      <button data-grp="all" class="on">全部</button>
      <button data-grp="cover">封面</button>
      <button data-grp="inner">内页</button>
    </div>

    <div class="spacer"></div>
    <input class="search" id="q" placeholder="搜版式名…">
    <div class="seg" id="den-seg">
      <button data-den="4" class="on">4 列</button>
      <button data-den="3">3 列</button>
      <button data-den="5">5 列</button>
    </div>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="wrap" id="wrap"></div>

<!-- 放大预览 -->
<div class="lb" id="lb">
  <div class="lb-mask" data-close></div>
  <div class="lb-in">
    <button class="lb-close" data-close>×</button>
    <div class="lb-stage" id="lb-stage"></div>
    <div class="lb-side" id="lb-side"></div>
  </div>
</div>

<script>
/* ============================================================
   数据
   ============================================================ */
const SYSTEMS = {
  editorial: {name:'Editorial 杂志', palettes:['ink-classic','indigo-porcelain','forest-ink','kraft-paper','dune','midnight-ink']},
  swiss:     {name:'Swiss 瑞士',     palettes:['swiss-ikb','swiss-lemon','swiss-lemon-green','swiss-orange']},
};

const PALETTES = {
  'ink-classic':       {name:'墨色经典', paper:'#f3f0e8', accent:'#111111'},
  'indigo-porcelain':  {name:'靛蓝瓷白', paper:'#f2f4f5', accent:'#315d93'},
  'forest-ink':        {name:'森林墨绿', paper:'#f5f1e8', accent:'#2e6b4f'},
  'kraft-paper':       {name:'牛皮纸',   paper:'#eedfc7', accent:'#9b5a2e'},
  'dune':              {name:'沙丘暖纸', paper:'#f0e6d2', accent:'#8f7650'},
  'midnight-ink':      {name:'午夜墨金', paper:'#0e0d0c', accent:'#d4a04a'},
  'swiss-ikb':         {name:'克莱因蓝', paper:'#fafaf8', accent:'#002FA7'},
  'swiss-lemon':       {name:'柠檬黄',   paper:'#fafaf8', accent:'#c9a800'},
  'swiss-lemon-green': {name:'柠檬绿',   paper:'#fafaf8', accent:'#7d9400'},
  'swiss-orange':      {name:'安全橙',   paper:'#fafaf8', accent:'#FF6B35'},
};

/* 12 版式 + 首推色板（精选初稿）*/
const LAYOUTS = [
  {id:'poster',    name:'大字报',   grp:'cover', note:'标题吃掉画面，冲击最强',
   pick:{editorial:['ink-classic','midnight-ink','kraft-paper'], swiss:['swiss-ikb','swiss-orange']}},
  {id:'stack',     name:'堆叠',     grp:'cover', note:'标签+大标题+底部副标，最通用',
   pick:{editorial:['dune','ink-classic','forest-ink'], swiss:['swiss-ikb','swiss-lemon']}},
  {id:'image-led', name:'图文封面', grp:'cover', note:'标题压下部，最像杂志封面',
   pick:{editorial:['dune','midnight-ink','forest-ink'], swiss:['swiss-ikb','swiss-orange']}},
  {id:'quote',     name:'金句',     grp:'cover', note:'居中大字 + 署名',
   pick:{editorial:['midnight-ink','kraft-paper','ink-classic'], swiss:['swiss-ikb','swiss-lemon']}},
  {id:'number',    name:'编号大字', grp:'cover', note:'超大数字当主视觉',
   pick:{editorial:['indigo-porcelain','ink-classic','dune'], swiss:['swiss-ikb','swiss-lemon-green']}},

  {id:'list',      name:'清单',     grp:'inner', note:'编号条目，干货/推荐',
   pick:{editorial:['forest-ink','ink-classic','indigo-porcelain'], swiss:['swiss-ikb','swiss-lemon']}},
  {id:'compare',   name:'对比',     grp:'inner', note:'左右分栏，before/after',
   pick:{editorial:['indigo-porcelain','ink-classic','dune'], swiss:['swiss-ikb','swiss-orange']}},
  {id:'steps',     name:'步骤',     grp:'inner', note:'编号流程，教程/操作',
   pick:{editorial:['ink-classic','forest-ink','kraft-paper'], swiss:['swiss-ikb','swiss-lemon']}},
  {id:'kpi',       name:'数据塔',   grp:'inner', note:'并列大数字，结果/对比',
   pick:{editorial:['indigo-porcelain','ink-classic','dune'], swiss:['swiss-ikb','swiss-lemon-green']}},
  {id:'matrix',    name:'四宫格',   grp:'inner', note:'2×2 高密度，工具合集',
   pick:{editorial:['kraft-paper','ink-classic','forest-ink'], swiss:['swiss-ikb','swiss-lemon']}},
  {id:'ledger',    name:'条账',     grp:'inner', note:'行式列账，参数/清单',
   pick:{editorial:['ink-classic','dune','indigo-porcelain'], swiss:['swiss-ikb','swiss-orange']}},
  {id:'dense',     name:'高密度',   grp:'inner', note:'多段正文，适合拆页',
   pick:{editorial:['ink-classic','indigo-porcelain','dune'], swiss:['swiss-ikb','swiss-lemon']}},
];

const BASE_TITLE = {poster:128, stack:108, 'image-led':112, quote:104, number:82,
                    list:84, compare:84, steps:80, kpi:86, matrix:76, ledger:76, dense:78};

/* 演示内容（所有卡片共用同一份，方便横向比版式差异） */
const DEMO = {
  title: '因为太懒所以写了个工具',
  lead:  '把每周重复的排版工作，变成一次配置',
  byline:'苏哥 · 工具备忘',
  body: [
    '排版这件事，做一次很爽，做一百次很烦。',
    '真正的问题不是不会排，而是每次都要重新决定字号、留白和信息优先级。',
    '所以我把它拆成了三层：令牌负责数值，版式负责结构，风格只负责气质。',
    '改风格不该动版式，改版式不该重写样式。',
  ],
};

/* ============================================================
   状态
   ============================================================ */
const state = {
  system:'editorial',
  group:'all',
  density:4,
  q:'',
  // 每个版式在该体系下选中的色板
  picked:{ editorial:{}, swiss:{} },
};

// 初始化：每个版式落一个首推色板
LAYOUTS.forEach(l => {
  SYSTEMS.editorial.palettes.forEach(()=>{});
  state.picked.editorial[l.id] = (l.pick.editorial || [])[0] || 'ink-classic';
  state.picked.swiss[l.id]     = (l.pick.swiss || [])[0] || 'swiss-ikb';
});

/* ============================================================
   断行（与 cover-lab-v2 同规则，精简版）
   ============================================================ */
const BREAK_PUNCT = ['，','。','！','？','；','：','、','—','·'];
const BREAK_CUES  = ['所以','因为','但是','而且','然后','就是','而是','不是','如果','只要',
                     '为了','不过','其实','这时','那些','这些'];

function tokenize(text){
  const out = []; let buf = '';
  for (const ch of text){
    if (/[A-Za-z0-9'’.\-]/.test(ch)) buf += ch;
    else { if (buf){ out.push(buf); buf=''; } out.push(ch); }
  }
  if (buf) out.push(buf);
  return out;
}

function smartBreak(text, cap, maxLines = 2){
  const len = text.length;
  if (len <= cap) return { lines:[text], semantic:false };
  const need = Math.ceil(len / cap);
  if (need > maxLines) return { lines:[text], semantic:false };

  // 需要 3 行时走均分（大字报专用）—— 语义优化只对 2 行有意义
  if (need > 2){
    const per = Math.ceil(len / need);
    const out = [];
    let p = 0;
    for (let i = 0; i < need; i++){
      const take = Math.min(per, len - p - (need - i - 1));
      out.push(text.slice(p, p + take));
      p += take;
    }
    return { lines: out, semantic: false };
  }

  const cuts = []; let pos = 0;
  for (const t of tokenize(text)){ cuts.push(pos); pos += t.length; }
  cuts.push(pos);

  const target = Math.ceil(len / 2);
  let best = -1, bestScore = -Infinity;
  const lo = Math.max(1, len - cap);
  const hi = Math.min(cap, len - 1);

  for (const i of cuts){
    if (i < lo || i > hi) continue;
    const prev = text[i-1], next = text[i];
    if (/[A-Za-z0-9]/.test(prev) && /[A-Za-z0-9]/.test(next)) continue;
    if (next === ' ') continue;

    let score = 0;
    if (BREAK_PUNCT.includes(prev)) score = 100;
    else if (BREAK_CUES.some(q => text.startsWith(q, i))) score = 80;
    else score = 40;
    score -= Math.abs(i - target) * 9;
    if (score > bestScore){ bestScore = score; best = i; }
  }

  if (best > 0){
    return { lines:[text.slice(0,best).trim(), text.slice(best).trim()], semantic: bestScore >= 60 };
  }
  const mid = Math.ceil(len/2);
  let fb = -1;
  for (const i of cuts){
    if (i >= 1 && i <= cap && len - i <= cap){
      if (fb < 0 || Math.abs(i-mid) < Math.abs(fb-mid)) fb = i;
    }
  }
  if (fb > 0) return { lines:[text.slice(0,fb), text.slice(fb)], semantic:false };
  return { lines:[text.slice(0,cap), text.slice(cap)], semantic:false };
}

function planTitle(text, baseSize, availW, sysId, maxLines = 2, preferBig = false){
  const track = sysId === 'editorial' ? 0.040 : 0;
  let fallback = null;
  for (let k = 1.10; k >= 0.60; k -= 0.04){
    const size = Math.round(baseSize * k);
    const charW = size * (1 + track + 0.01);
    const cap = Math.floor(availW / charW);
    if (cap < 3) continue;
    const br = smartBreak(text, cap, maxLines);
    const fits = br.lines.length <= maxLines && br.lines.every(l => l.length * charW <= availW + 1);
    if (!fits) continue;
    const plan = { size, cap, lines: br.lines };
    // 大字报要的是「大」，不是「断得漂亮」—— 直接取最大可行字号
    if (preferBig) return plan;
    if (br.semantic) return plan;
    if (!fallback) fallback = plan;
  }
  if (fallback) return fallback;
  const size = Math.round(baseSize * 0.6);
  return { size, cap: 6, lines: [text.slice(0, 6), text.slice(6)].filter(Boolean) };
}

/* 大字报：靠「放大字号 + 缩小边距」拉开差异，而不是靠多切一行
   （3 行会把「个工具」这种尾巴单独切出来 —— 中文三行断行没有好的解） */
const MAX_LINES = {poster:2, quote:2, 'image-led':2, stack:2, number:2};
const TITLE_LIFT = {poster:1.15};
const PAD_X_MAP = {poster:60};   // 大字报边距更窄，可用宽度 888 → 960

function titleHtml(layout, sysId){
  const base = (BASE_TITLE[layout] || 90) * (TITLE_LIFT[layout] || 1);
  const maxLines = MAX_LINES[layout] || 2;
  const availW = 1080 - (PAD_X_MAP[layout] || 96) * 2;
  // 大字报优先字号（要的是冲击力），其他版式优先语义断行（要的是好读）
  const plan = planTitle(DEMO.title, base, availW, sysId, maxLines, layout === 'poster');
  return `<h1 class="title" style="font-size:${plan.size}px">${plan.lines.map(esc).join('<br>')}</h1>`;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function splitItem(t){
  const m = t.match(/^(.{2,26}?)[。！？]/);
  return m ? { head:m[1], rest:t.slice(m[0].length).trim() } : { head:t, rest:'' };
}
function extractStat(t, i){
  const m = String(t).match(/(\d+(?:\.\d+)?)\s*(%|×|倍|万|千|天|个|次)?/);
  if (!m){ const {head} = splitItem(t); return { num:String(i).padStart(2,'0'), label:head.slice(0,10) }; }
  return { num: m[1]+(m[2]||''), label: String(t).replace(m[0],' ').trim().slice(0,12) };
}

/* ============================================================
   版式骨架（9 个用槽位组合，3 个特殊处理）
   ============================================================ */
function skeleton(layout, sysId){
  const t = titleHtml(layout, sysId);
  const lead = `<p class="lead">${esc(DEMO.lead)}</p>`;
  const by   = `<div class="byline">${esc(DEMO.byline)}</div>`;
  const body = DEMO.body;

  switch(layout){
    case 'poster':
      // 大字报不要 eyebrow —— 让标题独占画面，和「堆叠」拉开差异
      return `${t}${lead}${by}`;

    case 'stack':
      return `<div class="eyebrow">NOTE</div>${t}<div class="lead">${esc(DEMO.lead)}${by}</div>`;

    case 'image-led':
      return `<div class="eyebrow">FEATURE</div><div class="ascend"></div>${t}${lead}${by}`;

    case 'quote':
      return `<div class="qmark">“</div>${t}${lead}<div class="byline">— ${esc(DEMO.byline)}</div>`;

    case 'number':
      return `<div class="num-mega" style="font-size:300px">04</div>${t}${lead}`;

    case 'list':
      return `${t}<div class="accent-rule"></div><div class="list">${body.slice(0,4).map((x,i)=>{
        const {head, rest} = splitItem(x);
        return `<div class="li"><div class="n">${String(i+1).padStart(2,'0')}</div>
          <div class="tx">${esc(head)}${rest?`<small>${esc(rest)}</small>`:''}</div></div>`;
      }).join('')}</div>`;

    case 'compare':
      return `${t}<div class="cmp">
        <div class="col"><div class="h">之前</div><div class="b">${body.slice(0,2).map(p=>`<p style="margin:0 0 12px">${esc(p)}</p>`).join('')}</div></div>
        <div class="col"><div class="h">之后</div><div class="b">${body.slice(2,4).map(p=>`<p style="margin:0 0 12px">${esc(p)}</p>`).join('')}</div></div>
      </div>`;

    case 'steps':
      return `${t}<div class="steps">${body.slice(0,4).map((x,i)=>{
        const {head, rest} = splitItem(x);
        return `<div class="st"><span class="k">${String(i+1).padStart(2,'0')}</span>
          <div class="d"><b>${esc(head)}</b>${rest?`<small>${esc(rest)}</small>`:''}</div></div>`;
      }).join('')}</div>`;

    case 'kpi':
      return `${t}<div class="kpis">${body.slice(0,4).map((x,i)=>{
        const {num,label} = extractStat(x, i+1);
        return `<div class="kpi"><b>${esc(num)}</b><span>${esc(label)}</span></div>`;
      }).join('')}</div>`;

    case 'matrix':
      return `${t}<div class="mx">${body.slice(0,4).map(x=>{
        const {head, rest} = splitItem(x);
        return `<div class="c"><b>${esc(head)}</b>${rest?`<small>${esc(rest)}</small>`:''}</div>`;
      }).join('')}</div>`;

    case 'ledger':
      return `${t}<div class="lg">${body.slice(0,4).map((x,i)=>{
        const {head, rest} = splitItem(x);
        return `<div class="r"><span class="a">${String(i+1).padStart(2,'0')} · ${esc(head.slice(0,9))}</span>
          <span class="b">${esc(rest||head)}</span></div>`;
      }).join('')}</div>`;

    case 'dense':
      return `${t}<div class="accent-rule"></div><div class="body">${body.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;

    default:
      return `${t}${lead}`;
  }
}

function posterEl(layout, sysId, theme){
  const el = document.createElement('div');
  el.className = 'poster';
  el.dataset.layout = layout;
  el.dataset.system = sysId;
  el.dataset.theme = theme;

  // 图文封面自带一张 quiet-zone 样例底图 —— 否则它在卡片里跟「堆叠」长得一样，
  // 看不出「标题压图」这个核心特征
  let bg = '';
  if (layout === 'image-led'){
    el.classList.add('has-img');
    bg = `<img class="bg-img" src="assets/sample-quiet.jpg" alt="">`;
  }

  el.innerHTML = `${bg}<div class="inner">${skeleton(layout, sysId)}</div>`;
  return el;
}

/* ============================================================
   渲染
   ============================================================ */
function scaleThumb(thumb){
  const w = thumb.clientWidth;
  const s = w / 1080;
  const p = thumb.querySelector('.poster');
  if (p) p.style.transform = `scale(${s})`;
}

function build(){
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = '';

  const groups = state.group === 'all'
    ? [['cover','封面版式'], ['inner','内页版式']]
    : [[state.group, state.group === 'cover' ? '封面版式' : '内页版式']];

  let shown = 0;

  groups.forEach(([gid, gname]) => {
    const items = LAYOUTS.filter(l =>
      l.grp === gid && (!state.q || l.name.includes(state.q) || l.id.includes(state.q))
    );
    if (!items.length) return;
    shown += items.length;

    const sec = document.createElement('section');
    sec.className = 'sec';
    sec.innerHTML = `<div class="sec-hd"><h2>${gname}</h2><span class="n">${items.length} 个版式</span></div>
      <div class="grid d${state.density}"></div>`;
    const grid = sec.querySelector('.grid');

    items.forEach(l => {
      const card = document.createElement('div');
      card.className = 'card';

      const theme = state.picked[state.system][l.id];
      const pal = PALETTES[theme];

      card.innerHTML = `
        <div class="thumb">
          <span class="zoom-hint">放大</span>
        </div>
        <div class="card-ft">
          <div class="card-hd">
            <span class="card-name">${l.name}</span>
            <span class="card-tag sys">${state.system === 'editorial' ? '杂志' : '瑞士'}</span>
          </div>
          <div class="dots"></div>
        </div>`;

      const thumb = card.querySelector('.thumb');
      const p = posterEl(l.id, state.system, theme);
      thumb.appendChild(p);

      // 色点：只换 data-theme，不重建 DOM（同一版式换色只是变量变化）
      const dots = card.querySelector('.dots');
      SYSTEMS[state.system].palettes.forEach(pid => {
        const pa = PALETTES[pid];
        const b = document.createElement('button');
        b.className = 'dot' + (pid === theme ? ' on' : '');
        b.style.background = pa.accent;
        b.innerHTML = `<span class="nm">${pa.name}</span>`;
        b.onclick = e => {
          e.stopPropagation();
          state.picked[state.system][l.id] = pid;
          p.dataset.theme = pid;
          dots.querySelectorAll('.dot').forEach(d => d.classList.remove('on'));
          b.classList.add('on');
          label.textContent = pa.name;
        };
        dots.appendChild(b);
      });
      const label = document.createElement('span');
      label.className = 'dot-lbl';
      label.textContent = pal.name;
      dots.appendChild(label);

      thumb.onclick = () => openLightbox(l);
      grid.appendChild(card);
    });

    wrap.appendChild(sec);
  });

  document.getElementById('count').textContent = `${shown} 个版式 × ${SYSTEMS[state.system].palettes.length} 色 = ${shown * SYSTEMS[state.system].palettes.length} 种组合`;

  requestAnimationFrame(() => {
    document.querySelectorAll('.thumb').forEach(t => {
      scaleThumb(t);
      const ro = new ResizeObserver(() => scaleThumb(t));
      ro.observe(t);
    });
  });
}

/* ---------- 放大预览 ---------- */
function openLightbox(l){
  const lb = document.getElementById('lb');
  const stage = document.getElementById('lb-stage');
  const side = document.getElementById('lb-side');
  const theme = state.picked[state.system][l.id];
  const pal = PALETTES[theme];

  stage.innerHTML = '';
  const p = posterEl(l.id, state.system, theme);
  // 弹窗里按视口高度定尺寸
  const maxH = window.innerHeight - 140;
  const s = Math.min(maxH / 1440, 0.62);
  p.style.transform = `scale(${s})`;
  stage.style.width = (1080 * s) + 'px';
  stage.style.height = (1440 * s) + 'px';
  stage.appendChild(p);

  const picks = l.pick[state.system] || [];
  side.innerHTML = `
    <h3>${l.name}</h3>
    <div class="sub">${l.note}</div>
    <div class="row"><span>视觉体系</span><span>${SYSTEMS[state.system].name.split(' ')[0]}</span></div>
    <div class="row"><span>版式 ID</span><span>${l.id}</span></div>
    <div class="row"><span>当前色板</span><span>${pal.name}</span></div>
    <div class="row"><span>画板</span><span>1080×1440</span></div>
    <div style="margin-top:16px; font-size:10.5px; opacity:.55; letter-spacing:.06em">首推色板</div>
    <div class="lb-swatches" id="lb-sw"></div>`;

  const sw = document.getElementById('lb-sw');
  picks.forEach(pid => {
    const pa = PALETTES[pid];
    const b = document.createElement('button');
    b.className = 'dot' + (pid === theme ? ' on' : '');
    b.style.background = pa.accent;
    b.title = pa.name;
    b.onclick = () => {
      state.picked[state.system][l.id] = pid;
      openLightbox(l);
      build();
    };
    sw.appendChild(b);
  });

  lb.classList.add('on');
}

function closeLightbox(){ document.getElementById('lb').classList.remove('on'); }
document.querySelectorAll('#lb [data-close]').forEach(el => el.onclick = closeLightbox);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

/* ---------- 交互 ---------- */
document.querySelectorAll('#sys-seg button').forEach(b => {
  b.onclick = () => {
    state.system = b.dataset.sys;
    document.querySelectorAll('#sys-seg button').forEach(x => x.classList.toggle('on', x === b));
    build();
  };
});

document.querySelectorAll('#grp-seg button').forEach(b => {
  b.onclick = () => {
    state.group = b.dataset.grp;
    document.querySelectorAll('#grp-seg button').forEach(x => x.classList.toggle('on', x === b));
    build();
  };
});

document.querySelectorAll('#den-seg button').forEach(b => {
  b.onclick = () => {
    state.density = b.dataset.den;
    document.querySelectorAll('#den-seg button').forEach(x => x.classList.toggle('on', x === b));
    build();
  };
});

document.getElementById('q').oninput = e => { state.q = e.target.value.trim(); build(); };
window.addEventListener('resize', () => {
  document.querySelectorAll('.thumb').forEach(scaleThumb);
});

// URL 参数便于截图核对：?sys=swiss&grp=inner&den=3&q=清单
const Q = new URLSearchParams(location.search);
if (Q.get('sys') === 'swiss') state.system = 'swiss';
if (['cover','inner'].includes(Q.get('grp'))) state.group = Q.get('grp');
if (Q.get('den')) state.density = Q.get('den');
if (Q.get('q')){ state.q = Q.get('q'); document.getElementById('q').value = state.q; }

document.querySelectorAll('#sys-seg button').forEach(x =>
  x.classList.toggle('on', x.dataset.sys === state.system));
document.querySelectorAll('#grp-seg button').forEach(x =>
  x.classList.toggle('on', x.dataset.grp === state.group));
document.querySelectorAll('#den-seg button').forEach(x =>
  x.classList.toggle('on', x.dataset.den === String(state.density)));

build();
</script>
</body>
</html>
