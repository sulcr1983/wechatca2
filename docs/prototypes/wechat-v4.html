<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>公众号排版 · 方案 B 可点击原型</title>
<style>
:root{
  --bg-canvas:#F7F4EE; --bg-surface:#FAF9F5; --bg-raised:#FFFFFF; --bg-hover:#F1EEE6;
  --border:#EAE6DD; --border-hi:#D8D1C2;
  --text:#191713; --text-soft:#5C5548; --text-muted:#9A9285;
  --accent:#AF3E2B; --accent-soft:rgba(175,62,43,.08);
  --ok:#2E7D5B; --warn:#8A6100; --warn-bg:#FFF6DC;
  --top-h:44px; --drawer-w:500px;
  --r:7px; --r-lg:11px;
  --sh:0 1px 2px rgba(30,25,15,.05), 0 4px 14px rgba(30,25,15,.06);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{
  background:var(--bg-canvas); color:var(--text); overflow:hidden;
  font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#D8D1C2;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#BCB3A0;background-clip:padding-box}

/* ══ 顶栏 ══ */
header.top{
  height:var(--top-h); display:flex; align-items:center; gap:14px; padding:0 14px;
  background:var(--bg-raised); border-bottom:1px solid var(--border); position:relative; z-index:30;
}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px}
.brand-mark{
  width:22px;height:22px;border-radius:6px;background:var(--accent);
  display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;
}
.tab-btn{
  height:28px;padding:0 12px;border-radius:6px;font-size:12.5px;font-weight:600;
  color:var(--text-soft);
}
.tab-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tab-btn:disabled{opacity:.42;cursor:not-allowed}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.badge{
  display:flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;
  background:#EAF4EF;color:var(--ok);font-size:11px;font-weight:600;
}
.badge i{width:5px;height:5px;border-radius:50%;background:currentColor}
.tbtn{
  height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg-raised);font-size:12px;color:var(--text-soft);
}
.tbtn:hover{border-color:var(--border-hi);background:#fff}
.tbtn.pri{background:var(--text);border-color:var(--text);color:#fff;font-weight:600}

/* ══ 主区（真实：minmax(340,620) 1fr，抽屉打开时 padding-right:500px）══ */
.stage{
  height:calc(100% - var(--top-h));
  display:grid;grid-template-columns:minmax(340px,620px) 1fr;
  grid-template-rows:minmax(0,1fr) auto;
  transition:padding-right .18s;
}
/* 开抽屉 = 进入「选风格」模式：
   ① 编辑器整栏隐退（原文 pwa/src/style.css:323 `body.browsing .pane-edit{display:none}`）
   ② 主区从两栏变单栏（1fr），右侧让出 500px 给抽屉
   结果：只剩「预览 + 抽屉」两列 —— 这是原设计，不是三列 */
body.browsing .stage{
  grid-template-columns:1fr;
  padding-right:var(--drawer-w);
}
body.browsing .pane-edit{ display:none; }
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane-edit{border-right:1px solid var(--border)}
.pane-head{
  height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;flex:none;
  border-bottom:1px solid var(--border);
}
.pane-title{font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:.04em;flex:none}
.pane-actions{margin-left:auto;display:flex;align-items:center;gap:7px}
.gbtn{
  height:24px;padding:0 9px;border-radius:5px;border:1px solid var(--border);
  background:var(--bg-raised);font-size:11.5px;color:var(--text-soft);
}
.gbtn:hover{border-color:var(--border-hi)}
.pbtn{height:26px;padding:0 12px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:600}
.cnt{font-size:11.5px;color:var(--text-muted);font-variant-numeric:tabular-nums}

#input{
  flex:1;width:100%;border:0;outline:0;resize:none;background:transparent;
  padding:14px 16px;font:13.5px/1.8 inherit;color:var(--text-soft);
}

/* ══ 解析条 ══ */
.parse-bar{
  flex:none;border-top:1px solid var(--border);padding:8px 14px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg-surface);
}
.pp-select{
  height:25px;padding:0 7px;border:1px solid var(--border);border-radius:5px;
  background:var(--bg-raised);font-size:11.5px;color:var(--text-soft);
}
.parse-body{display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.pchip{
  height:21px;padding:0 8px;border-radius:5px;background:var(--bg-raised);
  border:1px solid var(--border);font-size:10.5px;color:var(--text-soft);
  display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.pchip b{color:var(--accent);font-weight:700}
.pchip.hint{background:none;border:0;color:var(--text-muted)}

/* ══ 预览 ══ */
.preview-wrap{flex:1;min-height:0;overflow:auto;padding:16px;background:var(--bg-canvas)}
.pv-doc{
  background:#fff;border:1px solid var(--border);border-radius:9px;
  padding:26px 24px;max-width:420px;margin:0 auto;
  font-size:14px;line-height:1.85;color:#2b2b2b;
}
.pv-doc .doc-title{font-size:20px;font-weight:700;margin:0 0 6px;line-height:1.35}
.pv-doc .doc-sub{font-size:12.5px;color:#888;margin:0 0 18px}
.pv-doc p{margin:0 0 13px}
.pv-doc .h2s{font-size:16px;font-weight:700;margin:20px 0 9px}
.pv-doc ul{margin:0 0 13px;padding-left:19px}
.pv-doc li{margin-bottom:5px}
.pv-doc .quote{margin:14px 0;font-size:13.5px;color:#5a5a5a}
.pv-doc .num-big{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}

/* ══ 色卡条 ══ */
.style-bar{
  height:56px;border-top:1px solid var(--border);
  background:var(--bg-raised);display:flex;align-items:center;gap:6px;padding:0 10px;
}
.caps{display:flex;gap:6px;overflow-x:auto;flex:1;padding:4px 0;scrollbar-width:none}
.caps::-webkit-scrollbar{display:none}
.cap{
  flex:none;display:flex;align-items:center;gap:5px;height:27px;padding:0 10px;
  border-radius:99px;border:1px solid var(--border);background:var(--bg-surface);
  font-size:11.5px;color:var(--text-soft);white-space:nowrap;
}
.cap:hover{border-color:var(--border-hi)}
.cap[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.cap-sw{
  width:12px;height:12px;border-radius:50%;position:relative;overflow:hidden;flex:none;
  border:1px solid rgba(0,0,0,.08);
}
.cap-sw::after{content:'';position:absolute;right:0;top:0;width:6px;height:12px;background:var(--sw2)}
.smore{
  flex:none;height:29px;padding:0 12px;border-radius:7px;background:var(--text);
  color:#fff;font-size:12px;font-weight:600;
}

/* ══════ 底部两行：版式行 + 色卡行（方案三）══════ */
.bars{
  grid-column:1 / -1;
  display:flex; flex-direction:column; min-height:0;
  position:relative;
  transition:height .18s ease;
}
/* 开了抽屉 → 收成两格（预览 + 抽屉），底部整块隐退 */
body.browsing .bars{ display:none; }

.laybar{
  flex:none; height:32px; display:flex; align-items:center; gap:8px;
  padding:0 10px; background:var(--bg-surface); border-top:1px solid var(--border);
  font-size:11px;
}
.laybar .ll{ font-weight:700; color:var(--text-muted); letter-spacing:.05em; flex:none; }
.laybar .lv{ color:var(--text); font-weight:600; flex:none; }
.laybar .chev{
  width:18px;height:18px;border-radius:4px;display:grid;place-items:center;
  color:var(--text-muted); font-size:10px; flex:none;
}
.laybar .chev:hover{ background:var(--bg-hover); color:var(--text); }
.lay-quick{
  display:flex; gap:4px; align-items:center; overflow:hidden; flex:1; min-width:0;
  mask-image:linear-gradient(to right,#000 88%,transparent);
  -webkit-mask-image:linear-gradient(to right,#000 88%,transparent);
}
.lay-quick button{
  flex:none;height:20px;padding:0 7px;border-radius:4px;border:1px solid var(--border);
  background:var(--bg-raised);font-size:10px;color:var(--text-soft);
}
.lay-quick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.laybar .rr2{ margin-left:auto; color:var(--text-muted); flex:none; font-size:10.5px; }

/* 展开面板：绝对定位向上弹，不推挤预览 */
.laypop{
  /* 相对 .bars 定位：贴在版式行上方，色卡行 56px + 版式行 32px = 88px */
  position:absolute; left:0; right:0; bottom:88px; z-index:35;
  background:var(--bg-raised); border-top:1px solid var(--border);
  box-shadow:0 -8px 26px rgba(30,25,15,.10);
  padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px;
}
.laypop .row{ display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
.laypop .row{ display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
.laypop .gl{
  font-size:9.5px;font-weight:700;color:var(--text-muted);letter-spacing:.05em;
  flex:none; white-space:nowrap; min-width:34px;
}
.laypop .gl em{
  font-style:normal;font-weight:400;opacity:.75;font-size:9px;letter-spacing:0;
  margin-left:3px; white-space:nowrap;
}
.laypop .lc{
  height:24px;padding:0 10px;border-radius:5px;border:1px solid var(--border);
  background:var(--bg-raised);font-size:11px;color:var(--text-soft);
}
.laypop .lc:hover{border-color:var(--border-hi);background:#fff}
.laypop .lc.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.laypop .lc:disabled{opacity:.4;cursor:not-allowed}

/* 色卡行（原 .style-bar 保留，去掉 grid-column） */
style-bar{ }

/* ══════ 抽屉（方案 B 四段式）══════ */
.drawer-mask{position:fixed;inset:0;z-index:40;background:rgba(20,18,14,.28);backdrop-filter:blur(1px)}
.drawer{
  position:fixed;right:0;top:0;height:100%;width:min(560px,94vw);z-index:41;
  background:var(--bg-canvas);border-left:1px solid var(--border);
  display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(30,25,15,.1);
}
body.browsing .drawer{width:500px}
body.browsing .drawer-mask{display:none}

.d-head{
  flex:none;height:var(--top-h);padding:0 12px 0 18px;display:flex;align-items:center;gap:9px;
  border-bottom:1px solid var(--border);background:var(--bg-raised);
}
.d-head b{font-size:13.5px;flex:none}
.d-search{
  flex:1;min-width:0;height:28px;padding:0 9px;border:1px solid var(--border);
  border-radius:var(--r);background:var(--bg-surface);font:12.5px inherit;color:var(--text);outline:0;
}
.d-search:focus{border-color:var(--border-hi)}
.d-x{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--text-muted);font-size:15px}
.d-x:hover{background:var(--bg-hover);color:var(--text)}

/* ── 顶层两个并列 tab（2026-11-02 结构纠正）──
   配色主题 164 套 ≠ 整篇设计 15 套：后者是独立设计，不是前者的参数。 */
.mode-tabs{
  flex:none; display:flex; gap:0; margin:10px 16px 0;
  border:1px solid var(--border); border-radius:8px; overflow:hidden;
  background:var(--bg-surface);
}
.mode-tabs button{
  flex:1; padding:9px 8px; font-size:11.5px; color:var(--text-muted);
  display:flex; flex-direction:column; align-items:center; gap:1px;
  border-right:1px solid var(--border); transition:.14s;
}
.mode-tabs button:last-child{border-right:0}
.mode-tabs button b{font-size:12.5px;font-weight:700;color:var(--text-soft)}
.mode-tabs button span{font-size:10px}
.mode-tabs button[aria-pressed="true"]{background:var(--bg-raised);box-shadow:inset 0 -2px 0 var(--accent)}
.mode-tabs button[aria-pressed="true"] b{color:var(--accent)}
.mode-tabs button:hover{background:var(--bg-hover)}

/* 整篇设计的说明条（选中 kit 后出现） */
.kit-explain{
  flex:none; margin:10px 16px 0; padding:9px 11px; border-radius:8px;
  background:#EEF4FB; border:1px solid #CFDFF0; font-size:11px; color:#1F4E7A;
  line-height:1.6;
}
.kit-explain b{color:#123A5C}

/* 整篇设计模式下的底部提示行（替代版式行） */
.laybar.kitmode .lv{color:var(--accent)}
.laybar.kitmode .chev{display:none}

/* ── 四段式 ── */
.sec{flex:none;padding:11px 16px 10px;border-bottom:1px solid var(--border)}
.sec-h{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.sec-n{
  width:17px;height:17px;border-radius:50%;background:var(--text);color:#fff;
  font-size:10px;font-weight:700;display:grid;place-items:center;flex:none;
}
.sec-t{font-size:12px;font-weight:700;color:var(--text)}
.sec-hint{font-size:10.5px;color:var(--text-muted);margin-left:auto;white-space:nowrap}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.fchip{
  height:25px;padding:0 10px;border-radius:99px;border:1px solid var(--border);
  background:var(--bg-raised);font-size:11.5px;color:var(--text-soft);transition:.12s;
}
.fchip:hover{border-color:var(--border-hi)}
.fchip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff;font-weight:600}

.group-lab{
  font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:.05em;
  margin:8px 0 5px;display:flex;align-items:center;gap:6px;
}
.group-lab:first-of-type{margin-top:0}
.group-lab .why{
  font-weight:400;color:var(--text-muted);letter-spacing:0;
  font-size:10px;opacity:.85;
}
.dl-chip{
  height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg-raised);font-size:11.5px;color:var(--text-soft);white-space:nowrap;transition:.12s;
}
.dl-chip:hover{border-color:var(--border-hi);background:#fff}
.dl-chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.dl-chip:disabled{opacity:.4;cursor:not-allowed}

.switches{display:flex;gap:16px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-soft);cursor:pointer}
.sw input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}
.sw em{font-style:normal;color:var(--text-muted);font-size:10.5px}

/* kit 说明条 */
.kit-note{
  margin:0 16px 0;padding:9px 11px;border-radius:8px;
  background:var(--warn-bg);border:1px solid #EBD9A8;
  font-size:11.5px;color:#6B4E00;display:flex;gap:9px;align-items:flex-start;
  flex:none;
}
.kit-note .kn-icon{flex:none;font-size:13px;line-height:1.3}
.kit-note .kn-body{flex:1;min-width:0}
.kit-note .kn-t{font-weight:700;display:block;margin-bottom:1px}
.kit-note .kn-d{font-size:10.5px;opacity:.86;line-height:1.5}
.kit-note button{
  margin-top:6px;padding:3px 9px;border-radius:5px;background:#fff;
  border:1px solid #E3CE93;font-size:11px;font-weight:600;color:#6B4E00;
}
.kit-note button:hover{background:#FFFDF5}

/* 主题网格 */
.d-grid{
  flex:1;min-height:0;overflow-y:auto;padding:11px 16px 26px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));
  gap:10px;align-content:start;
}
.d-card{
  display:flex;flex-direction:column;min-height:140px;border-radius:var(--r-lg);
  border:1px solid var(--border);background:var(--bg-raised);overflow:hidden;
  text-align:left;transition:.14s;
}
.d-card:hover{border-color:var(--border-hi);box-shadow:var(--sh)}
.d-card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.d-prev{
  height:104px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;padding:13px 12px;gap:5px;
}
.d-prev i{display:block;border-radius:2px;background:currentColor;opacity:.15}
.d-prev i.t{height:8px;width:72%;opacity:.66}
/* kit 缩略图：按真实样式渲染 */
.kitmin{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:8px 9px;position:relative}
.kitmin .km-h1{line-height:1.25;letter-spacing:-.01em;padding-bottom:3px;margin-bottom:1px}
.kitmin .km-p{font-size:5.5px;line-height:1.5}
.kitmin .km-ac{font-size:6.5px;font-weight:700;letter-spacing:.08em;margin-top:2px;opacity:.9}
.d-prev i.s{height:4px;width:92%}
.d-prev i.m{height:4px;width:84%}
.d-kit{
  position:absolute;left:7px;top:7px;padding:1px 6px;border-radius:3px;
  background:rgba(20,18,14,.74);color:#fff;font-size:9.5px;line-height:1.7;letter-spacing:.03em;
}
.d-body{padding:6px 9px 7px;display:flex;align-items:center;gap:6px;border-top:1px solid var(--border)}
.d-name{flex:1;min-width:0;font-size:11.5px;color:var(--text-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-fav{width:19px;height:19px;display:grid;place-items:center;color:var(--text-muted);font-size:12px}
.d-fav:hover{color:var(--accent)}
.d-fav[data-on="1"]{color:var(--accent)}

/* 第 4 段：配色微调（粘底） */
.d-custom{
  flex:none;border-top:1px solid var(--border);padding:9px 16px 11px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--bg-surface);
}
.dc-label{font-size:11px;font-weight:700;color:var(--text)}
.dc-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-soft)}
.dc-item input{width:21px;height:21px;padding:0;border:1px solid var(--border);border-radius:4px;background:none;cursor:pointer}
.dc-reset{margin-left:auto;height:22px;padding:0 9px;border-radius:5px;border:1px solid var(--border);background:var(--bg-raised);font-size:11px;color:var(--text-soft)}

/* toast */
#toast{
  position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(8px);
  background:#2b2620;color:#fff;padding:8px 15px;border-radius:7px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap;max-width:80vw;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 角标注释 */
.ann{
  position:fixed;right:8px;bottom:8px;z-index:70;background:rgba(25,23,19,.9);color:#fff;
  padding:7px 11px;border-radius:8px;font-size:11px;line-height:1.6;max-width:190px;
}
.ann b{color:#FFD9A0}
</style>
</head>
<body data-tab="edit">

<header class="top">
  <div class="brand"><span class="brand-mark">S</span>SuperSu</div>
  <button class="tab-btn" aria-pressed="true">公众号排版</button>
  <button class="tab-btn" disabled title="本原型只做公众号排版">小红书标题图</button>
  <button class="tab-btn" disabled title="本原型只做公众号排版">小红书长图文</button>
  <div class="top-right">
    <span class="badge"><i></i>引擎就绪</span>
    <button class="tbtn">导出 ▾</button>
    <button class="tbtn">AI</button>
    <button class="tbtn">⋯</button>
  </div>
</header>

<main class="stage">
  <section class="pane pane-edit">
    <div class="pane-head">
      <span class="pane-title">内容</span>
      <div class="pane-actions">
        <button class="gbtn">插图</button>
        <button class="gbtn">搜图</button>
        <button class="gbtn">看示例</button>
        <button class="gbtn">清空</button>
        <span class="cnt" id="char-count">0 字</span>
      </div>
    </div>
    <textarea id="input" spellcheck="false"></textarea>

/* ══════════════════════════════════════════════════════════════════
   解析样例文本 → 结构
   ══════════════════════════════════════════════════════════════════ */
function parse(text) {
  const lines = text.split('\n').map(l => l.trim());
  const out = { title:'', sub:'', secs:[] };
  let cur = null;
  let first = true;
  for (const l of lines) {
    if (!l) continue;
    if (first) { out.title = l; first = false; continue; }
    if (/^[·•\-]\s*/.test(l)) {
      if (!cur) { cur = { h:'', body:[], list:[] }; out.secs.push(cur); }
      (cur.list = cur.list || []).push(l.replace(/^[·•\-]\s*/, ''));
      continue;
    }
    if (/^「.*」$/.test(l) || /^".*"$/.test(l)) {
      if (!cur) { cur = { h:'', body:[], list:[] }; out.secs.push(cur); }
      (cur.quotes = cur.quotes || []).push(l.replace(/^[「"]|["」]$/g, ''));
      continue;
    }
    if (l.length <= 18) {
      cur = { h:l, body:[], list:[] };
      out.secs.push(cur);
      continue;
    }
    if (!cur) { cur = { h:'', body:[], list:[] }; out.secs.push(cur); }
    cur.body.push(l);
  }
  return out;
}

    'natgeo':   { title:`font-size:22px;font-weight:800;margin:0 0 14px`, h2:`font-size:15px;font-weight:700;margin:24px 0 10px;padding-left:11px;border-left:4px solid ${A}` },
    /* vogue：整篇黑白；大标题 34px；斜体大数字 */
    'vogue':    { title:`font-size:28px;font-weight:900;margin:0 0 10px;padding-bottom:9px;border-bottom:3px solid #000`, h2:`font-size:17px;font-weight:700;margin:24px 0 9px;color:#000` },
    /* forbes：数字是主视觉 */
    'forbes':   { title:`font-size:21px;font-weight:800;margin:0 0 14px`, h2:`font-size:15px;font-weight:700;margin:20px 0 9px;color:#1A1A1A` },
    /* adidas：黑白高对比 + 三条纹 */
    'adidas':   { title:`font-size:23px;font-weight:900;margin:0 0 14px;letter-spacing:-.01em`, h2:`font-size:15px;font-weight:800;margin:20px 0 9px;padding-left:14px;position:relative` },
  }[lay] || {};

  /* 版式的特殊装饰 */
  let deco = '';
  if (lay === 'guardian') {
    deco = `<div style="font-size:11.5px;font-weight:700;color:${A};letter-spacing:.1em;margin-bottom:7px;text-transform:uppercase">FEATURE · 特稿</div>`;
  }
  if (lay === 'natgeo') {
    deco = `<div style="width:52px;height:3px;background:${A};margin-bottom:12px"></div>`;
  }
  if (lay === 'adidas') {
    deco = `<div style="display:flex;gap:4px;margin-bottom:11px">${'<i style="display:block;width:14px;height:3px;background:#000"></i>'.repeat(3)}</div>`;
  }
  if (lay === 'vogue') {
    deco = `<div style="font-family:Georgia,serif;font-style:italic;font-size:44px;line-height:.9;color:#000;margin-bottom:4px">01</div>`;
  }

  /* 段落级强调 */
  const enrich = (html) => {
    if (lay === 'time' && B.quote) {
      // 重点结论加一圈细红框
      html = html.replace(/<div class="quote">「(.+?)」<\/div>/g,
        `<div style="border:1px solid ${A};padding:3px 10px;margin:14px 0;font-size:13.5px;color:#444">$1</div>`);
    }
    if (lay === 'economist' && B.quote) {
      html = html.replace(/<div class="quote">「(.+?)」<\/div>/g,
        `<div style="font-size:17px;font-weight:700;line-height:1.6;margin:16px 0;padding-left:11px;border-left:3px solid ${A}">$1</div>`);
    }
    if (lay === 'guardian' && B.quote) {
      html = html.replace(/<div class="quote">「(.+?)」<\/div>/g,
        `<div style="font-size:16px;font-weight:700;line-height:1.65;margin:18px 0;color:#222"><span style="font-size:40px;color:${A};line-height:.6;vertical-align:-6px">“</span> $1</div>`);
    }
    if (lay === 'natgeo' && B.quote) {
      html = html.replace(/<div class="quote">「(.+?)」<\/div>/g,
        `<div style="background:#FAFAF6;padding:10px 12px;border-left:4px solid ${A};margin:16px 0;font-size:13px;color:#555">$1</div>`);
    }
    if (lay === 'vogue' && B.quote) {
      html = html.replace(/<div class="quote">「(.+?)」<\/div>/g,
        `<div style="margin:16px 0;font-size:13.5px;color:#333;border-bottom:1px solid #000;padding-bottom:9px">$1</div>`);
    }
    if (lay === 'forbes') {
      html = html.replace(/(\d+)/g, `<span style="font-size:1.55em;font-weight:800;color:#1A1A1A">$1</span>`);
    }
    if (B.data) {
      html = html.replace(/(\d+(?:\.\d+)?\s*(?:元|块|个|次|年|月|天|小时|分钟|%|万|亿))/g,
        `<span style="background:${A}18;padding:1px 4px;border-radius:3px;font-weight:700">$1</span>`);
    }
    return html;
  };

  /* 拼装 */
  let html = '';
  html += deco;
  html += `<h1 class="doc-title" style="${styleFor.title||''};color:${INK}">${esc(d.title || '未命名')}</h1>`;
  if (lay === 'vogue') html += `<div style="height:1px;background:#000;margin:-6px 0 16px"></div>`;

  d.secs.forEach((s, i) => {
    if (s.h) {
      const num = lay === 'economist' ? `<span style="color:${A};font-weight:800;margin-right:6px">${String(i+1).padStart(2,'0')}</span>` : '';
      const sq = lay === 'guardian' ? `<span style="position:absolute;left:0;top:50%;transform:translateY(-50%);width:9px;height:9px;background:${A}"></span>` : '';
      /* 三条纹必须真正**垂直居中**在标题左侧：用 top:50% + translateY(-50%)，
         初版写死 top:7px，标题一行时偏上、两行时完全错位（截图暴露过）。 */
      const tri = lay === 'adidas' ? `<span style="position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px">${'<i style="display:block;width:9px;height:2px;background:#000"></i>'.repeat(3)}</span>` : '';
      html += `<h2 class="h2s" style="${styleFor.h2||''};color:${INK}">${sq}${tri}${num}${esc(s.h)}</h2>`;
    }
    html += bodyHtml(s.body);
    html += listHtml(s.list);
    if (s.quotes) s.quotes.forEach(q => { html += quoteHtml(q); });
  });

  document.getElementById('preview').innerHTML = enrich(html);
  document.getElementById('preview').style.background = t.bg;
  document.getElementById('preview').style.borderColor = 'rgba(0,0,0,.07)';
  document.getElementById('preview').style.color = INK;

  /* 解析条 */
  const counts = [
    ['大标题', d.title ? 1 : 0],
    ['小标题', d.secs.filter(s => s.h).length],
    ['段落', d.secs.reduce((n,s) => n + s.body.length, 0)],
    ['金句', d.secs.reduce((n,s) => n + (s.quotes||[]).length, 0)],
    ['列表', d.secs.reduce((n,s) => n + (s.list||[]).length, 0)],
  ].filter(([,n]) => n > 0);
  document.getElementById('parse-body').innerHTML = counts.length
    ? counts.map(([k,n]) => `<span class="pchip">${k} <b>${n}</b></span>`).join('')
    : '<span class="pchip hint">粘贴后自动识别结构</span>';
}

/* ══════════════════════════════════════════════════════════════════
   抽屉渲染
   ══════════════════════════════════════════════════════════════════ */
const chip = (id, label) => {
  const locked = isKit();
  const on = layNow() === id;
  return `<button class="dl-chip" data-lay="${id}" aria-pressed="${on}" ${locked?'disabled':''}>${label}</button>`;
};

function renderDrawer() {
  /* ══ 顶层两个 tab：配色主题 / 整篇设计 ══ */
  const mode = S.mode || 'theme';
  document.getElementById('pane-theme').hidden = mode !== 'theme';
  document.getElementById('pane-kit').hidden = mode !== 'kit';
  document.querySelectorAll('#mode-tabs button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));

  /* ── 配色主题面板 ── */
  document.getElementById('fams').innerHTML = FAMS.map(([k,label,n]) =>
    `<button class="fchip" data-fam="${k}" aria-pressed="${S.fam===k}">${label}${n?` ${n}`:''}</button>`
  ).join('');
  const curFam = FAMS.find(f => f[0] === S.fam);
  document.getElementById('fam-hint').textContent =
    S.fam === 'all' ? '164 套 · 按族浏览' : `${curFam ? curFam[2] : ''} 套 · ${curFam ? curFam[1] : ''}`;

  document.getElementById('lays-common').innerHTML = LAYS_COMMON.map(([id,label]) => chip(id,label)).join('');
  document.getElementById('lays-news').innerHTML = LAYS_NEWS.map(([id,label]) => chip(id,label)).join('');

  /* 配色主题网格：只有普通主题，**不含 kit** */
  let list = [];
  if (S.fam === 'fav') list = THEMES.filter((_,i) => [0,3,6,9].includes(i));
  else if (S.fam === 'all') list = THEMES;
  else list = THEMES.filter(t => t.fam === S.fam);

  const card = (t) => {
    const on = t.id === S.themeId;
    return `<button class="d-card" data-th="${t.id}" aria-pressed="${on}" style="background:${t.bg}">
      <div class="d-prev" style="color:${t.acc}"><i class="t"></i><i class="s"></i><i class="m"></i></div>
      <div class="d-body" style="background:var(--bg-raised)">
        <span class="d-name">${t.n}</span><span class="d-fav">☆</span>
      </div>
    </button>`;
  };

  /* 搜索：跨两个 tab 都搜 */
  const q = (S.search || '').toLowerCase();
  const hit = (t) => !q || t.n.toLowerCase().includes(q) || t.id.includes(q);
  document.getElementById('grid').innerHTML = list.filter(hit).map(card).join('')
    || '<div style="grid-column:1/-1;padding:20px;color:var(--text-muted);font-size:12px">没匹配的配色主题</div>';

  /* ── 整篇设计面板 ── */
  /* 缩略图按**真实样式**渲染：底色 + 主墨色 + 强调色 + 真实 h1 字号/字重
     （只做等比缩放，不是抽象色块 —— 用户要看的是「这套长什么样」） */
  document.getElementById('grid-kit').innerHTML = KITS.filter(hit).map(t => {
    const on = t.id === S.themeId;
    const fs = parseFloat(t.h1) || 24;
    /* 卡宽 142px → 缩略图宽 142，按比例把 h1 从「正文 15px 基准」缩到卡内 */
    const r = 142 / 420;
    return `<button class="d-card" data-th="${t.id}" aria-pressed="${on}" style="background:${t.bg}">
      <div class="d-prev kitmin" style="background:${t.bg};color:${t.ink}">
        <span class="d-kit" style="background:${t.acc}">整篇</span>
        <div class="km-h1" style="font-size:${Math.max(11, fs*r).toFixed(1)}px;font-weight:${t.h1w};color:${t.ink};border-bottom:${t.lay==='time'?'2px solid '+t.acc:'none'}">${t.n}</div>
        <div class="km-p" style="color:${t.ink};opacity:.62">两天里我没看手机，也没带</div>
        <div class="km-p" style="color:${t.ink};opacity:.62">相机。风把头发吹得乱七八</div>
        <div class="km-ac" style="color:${t.acc}">${t.lay === 'vogue' ? '01' : '—'} ${LAY_LABEL[t.lay] || ''}</div>
      </div>
      <div class="d-body" style="background:var(--bg-raised)">
        <span class="d-name">${t.n}</span><span class="d-fav">☆</span>
      </div>
    </button>`;
  }).join('')
    || '<div style="grid-column:1/-1;padding:20px;color:var(--text-muted);font-size:12px">没匹配的整篇设计</div>';
}

/* 版式中文名映射（定稿） */
const LAY_LABEL = {
  time:'朱丝栏', guardian:'天头', economist:'鱼尾', natgeo:'乌丝栏',
  vogue:'版心', forbes:'算经', adidas:'三道',
  muji:'无印良品', mori:'森系', ukiyoe:'浮世绘', note:'笔记纸底',
  ikea:'宜家目录', starbucks:'星巴克', brutal:'新粗野', deepread:'深度阅读',
};

/* ── 版式行（方案三）：默认常驻，选了「全部风格」后整个 .bars 隐退 ── */
function renderLayBar() {
  const locked = isKit();
  const bar = document.getElementById('laybar');
  const t = themeNow();

  /* 整篇设计模式：版式是设计的一部分，不该给「选版式」
     → 整条变成一行状态提示 */
  if (locked) {
    bar.classList.add('kitmode');
    document.querySelector('.laybar .ll').textContent = '整篇设计';
    document.getElementById('lay-cur').textContent = t.n;
    document.getElementById('lay-quick').innerHTML =
      '<span style="font-size:10.5px;color:var(--text-muted)">版式与配色已随设计内置，不需要单独选</span>';
    document.getElementById('lay-meta').innerHTML =
      '<button id="kit-exit" style="font-size:10.5px;padding:2px 8px;border:1px solid var(--border-hi);border-radius:5px;background:var(--bg-raised)">改回可组合</button>';
    return;
  }

  /* 配色主题模式：正常的版式行 */
  bar.classList.remove('kitmode');
  document.querySelector('.laybar .ll').textContent = '版式';
  const curId = layNow();
  const all = [...LAYS_COMMON, ...LAYS_NEWS];
  const cur = all.find(l => l[0] === curId);
  document.getElementById('lay-cur').textContent = cur ? cur[1] : '默认';
  document.getElementById('lay-quick').innerHTML = all.slice(0, 6).map(([id, label]) =>
    `<button data-lay="${id}" aria-pressed="${id===curId}">${label}</button>`
  ).join('');
  document.getElementById('lay-meta').textContent = `${t.n} · 164 套`;
}

function renderLayPop() {
  const locked = isKit();
  const curId = layNow();
  const chip = ([id, label]) =>
    `<button class="lc${id===curId?' on':''}" data-lay="${id}" ${locked?'disabled':''}>${label}</button>`;
  document.getElementById('laypop').innerHTML =
    `<div class="row"><span class="gl">通用</span>${LAYS_COMMON.map(chip).join('')}</div>` +
    `<div class="row"><span class="gl">报刊<em>换任何配色都成立</em></span>${LAYS_NEWS.map(chip).join('')}</div>` +
    (locked ? `<div class="row" style="color:#8A6100;font-size:10.5px;background:#FFF6DC;padding:6px 9px;border-radius:6px;margin-top:2px">ⓘ 当前是整篇设计，版式与配色已锁定 —— 点抽屉里「改回可组合版式」解锁</div>` : '');
}

function renderCaps() {
  const t = themeNow();
  const list = [t, ...THEMES.filter(x => x.id !== S.themeId)].slice(0, 40);
  document.getElementById('caps').innerHTML = list.map(x => {
    const bg = x.id === S.themeId ? t.bg : x.bg;
    const acc = x.id === S.themeId ? t.acc : x.acc;
    return `<button class="cap" data-th="${x.id}" aria-pressed="${x.id===S.themeId}">
      <span class="cap-sw" style="background:${bg};--sw2:${acc}"></span>${x.n}
    </button>`;
  }).join('');
}

function paint() { render(); renderDrawer(); renderCaps(); renderLayBar(); renderLayPop(); }

/* ══════════════════════════════════════════════════════════════════
   交互
   ══════════════════════════════════════════════════════════════════ */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2000);
}

function openDrawer() {
  /* 方案三：选了「全部风格」→ 底部两行隐退，只剩预览 + 抽屉两格（用户要求） */
  document.getElementById('laypop').hidden = true;
  document.getElementById('lay-toggle').textContent = '▴';
  document.getElementById('drawer').hidden = false;
  document.getElementById('drawer-mask').hidden = false;
  document.body.classList.add('browsing');
  renderDrawer();
}
function closeDrawer() {
  document.getElementById('drawer').hidden = true;
  document.getElementById('drawer-mask').hidden = true;
  document.body.classList.remove('browsing');
}

/* 事件委托 */
document.addEventListener('click', (e) => {
  const fam = e.target.closest('[data-fam]');
  if (fam) { S.fam = fam.dataset.fam; renderDrawer(); return; }

  const lay = e.target.closest('[data-lay]');
  if (lay && !lay.disabled) {
    S.lay = lay.dataset.lay;
    paint();
    const label = [...LAYS_COMMON, ...LAYS_NEWS].find(l => l[0] === S.lay);
    toast(`版式：${label ? label[1] : '默认'}`);
    return;
  }

  const th = e.target.closest('[data-th]');
  if (th) {
    S.themeId = th.dataset.th;
    S.custom = null;
    const kit = KIT_BY_ID[S.themeId];
    if (kit) S.mode = 'kit';   // 选了整篇设计 → tab 自动切过去
    paint();
    toast(kit ? `整篇设计：${kit.n}（版式与配色已锁定）` : `配色：${ALL_THEME[S.themeId].n}`);
    return;
  }

  /* 展开/收起版式面板 */
  if (e.target.closest('#lay-toggle')) {
    const pop = document.getElementById('laypop');
    const btn = document.getElementById('lay-toggle');
    pop.hidden = !pop.hidden;
    btn.textContent = pop.hidden ? '▴' : '▾';
    btn.setAttribute('aria-expanded', String(!pop.hidden));
    return;
  }
  /* 点了版式（无论从快速条还是弹层）→ 收起弹层 */
  const layBtn = e.target.closest('[data-lay]');
  if (layBtn && !layBtn.disabled) {
    document.getElementById('laypop').hidden = true;
    document.getElementById('lay-toggle').textContent = '▴';
  }

  /* 顶层 tab 切换 */
  const mt = e.target.closest('[data-mode]');
  if (mt) {
    S.mode = mt.dataset.mode;
    S.search = '';
    document.getElementById('d-search').value = '';
    renderDrawer();
    return;
  }

  /* 「改回可组合」：从整篇设计退出到配色主题 */
  if (e.target.closest('#kit-exit')) {
    const kit = KIT_BY_ID[S.themeId];
    S.mode = 'theme';
    S.themeId = 'biz-azure';
    S.lay = kit ? kit.lay : '';
    S.custom = null;
    paint();
    toast('已改回可组合版式');
    return;
  }

  if (e.target.closest('#btn-themes')) { openDrawer(); return; }
  if (e.target.closest('#d-close') || e.target.closest('#drawer-mask')) { closeDrawer(); return; }
  if (e.target.closest('#btn-copy')) { toast('已复制（原型不写剪贴板）'); return; }

  if (e.target.closest('#kit-back')) {
    const kit = KIT_BY_ID[S.themeId];
    S.themeId = 'biz-azure';
    S.lay = kit ? kit.lay : '';
    paint();
    toast('已改回可组合版式');
    return;
  }
});

/* 段落开关 */
document.addEventListener('change', (e) => {
  const b = e.target.closest('[data-blk]');
  if (b) { S.blocks[b.dataset.blk] = b.checked; render(); return; }
  if (e.target.id === 'c-bg' || e.target.id === 'c-text' || e.target.id === 'c-acc') {
    S.custom = {
      bg: document.getElementById('c-bg').value,
      ink: document.getElementById('c-text').value,
      acc: document.getElementById('c-acc').value,
    };
    paint();
  }
});

document.getElementById('c-reset').onclick = () => {
  S.custom = null;
  const t = ALL_THEME[S.themeId];
  if (t) { document.getElementById('c-bg').value = t.bg; document.getElementById('c-text').value = t.ink; document.getElementById('c-acc').value = t.acc; }
  paint();
  toast('配色已恢复');
};

document.getElementById('d-search').addEventListener('input', (e) => {
  S.search = e.target.value.trim();
  renderDrawer();
});

document.getElementById('input').addEventListener('input', () => {
  document.getElementById('char-count').textContent =
    (document.getElementById('input').value.length) + ' 字';
  render();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDrawer();
});

/* ══════════════════════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════════════════════ */
document.getElementById('input').value = SAMPLE;
document.getElementById('char-count').textContent = SAMPLE.length + ' 字';
const t0 = ALL_THEME[S.themeId];
document.getElementById('c-bg').value = t0.bg;
document.getElementById('c-text').value = t0.ink;
document.getElementById('c-acc').value = t0.acc;
paint();
document.getElementById('laypop').hidden = true;
</script>
</body>
</html>
