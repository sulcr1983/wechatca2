<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperSu · 主题选择器原型（参考 句方便 的排版风格设计）</title>
<style>
  :root{
    --ink:#0d0d0d; --ink-2:#3d3d3d; --ink-3:#8a8a8a; --ink-4:#b8b8b8;
    --line:#e7e5e2; --line-2:#d8d5d1;
    --bg:#f7f6f4; --card:#fff; --hover:#f1efec;
    --accent:#0d0d0d;
    --r-lg:16px; --r-md:12px; --r-sm:8px;
    --shadow:0 18px 50px -12px rgba(28,24,18,.28), 0 2px 8px rgba(28,24,18,.06);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

  /* ── 底层：文章预览页（弹窗关掉后能看到） ───────────────────── */
  .page{min-height:100%;display:flex;flex-direction:column}
  .topbar{
    flex:none;height:52px;display:flex;align-items:center;gap:14px;
    padding:0 20px;background:#fff;border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.01em}
  .brand i{
    width:22px;height:22px;border-radius:7px;background:var(--ink);color:#fff;
    display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;
  }
  .brand span{font-weight:400;color:var(--ink-4);font-size:12px;margin-left:2px}
  .tabs{display:flex;gap:2px;background:#f2f0ed;padding:3px;border-radius:9px;margin-left:8px}
  .tabs button{padding:5px 12px;border-radius:6px;font-size:12.5px;color:var(--ink-3)}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
  .topbar .spacer{flex:1}
  .ghost-btn{
    height:32px;padding:0 14px;border:1px solid var(--line-2);border-radius:8px;
    font-size:12.5px;background:#fff;
  }
  .ghost-btn:hover{background:var(--hover)}
  .solid-btn{
    height:32px;padding:0 16px;border-radius:8px;background:var(--ink);color:#fff;
    font-size:12.5px;font-weight:600;
  }
  .solid-btn:hover{background:#000}

  .stage{flex:1;display:grid;grid-template-columns:236px 1fr 300px;gap:0;min-height:0}
  .side{border-right:1px solid var(--line);padding:18px 16px;background:#fbfaf9;overflow:auto}
  .side.right{border-right:0;border-left:1px solid var(--line)}
  .side h4{margin:0 0 10px;font-size:11px;letter-spacing:.09em;color:var(--ink-4);font-weight:600}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:6px}
  .field .box{
    border:1px solid var(--line-2);border-radius:8px;background:#fff;padding:9px 11px;
    font-size:12.5px;line-height:1.6;color:var(--ink-2);
  }
  .mini-hint{font-size:11.5px;color:var(--ink-3);line-height:1.65}

  .canvas-wrap{display:flex;align-items:flex-start;justify-content:center;padding:26px;overflow:auto;min-width:0}
  .paper{
    width:390px;min-height:520px;border-radius:4px;overflow:hidden;
    box-shadow:0 10px 34px -14px rgba(30,26,20,.4), 0 0 0 1px rgba(0,0,0,.04);
    background:#fff;
  }
  .paper .meta{
    padding:14px 18px 0;font-size:11px;color:#9c9c9c;line-height:1.7;
  }
  .paper .meta b{color:#6d6d6d;font-weight:500}
  .article{padding:6px 18px 26px}
  .article .lead{margin:0 0 18px}

  /* ── 弹窗（主视觉：完全对齐 句方便 的「选择排版主题」） ────────── */
  .mask{
    position:fixed;inset:0;background:rgba(18,16,12,.42);backdrop-filter:blur(2px);
    display:grid;place-items:center;padding:24px;z-index:50;
  }
  .mask[hidden]{display:none}
  .modal{
    width:min(1152px,100%);height:min(848px,100%);background:#fff;border-radius:var(--r-lg);
    box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
    animation:pop .18s ease-out;
  }
  @keyframes pop{from{transform:translateY(8px) scale(.995);opacity:.6}to{transform:none;opacity:1}}

  .modal-head{flex:none;padding:22px 24px 0;position:relative}
  .modal-head h2{margin:0 0 6px;font-size:17px;font-weight:700;letter-spacing:.01em}
  .modal-head p{margin:0;font-size:12.5px;color:var(--ink-3)}
  .close{
    position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:8px;
    color:var(--ink-3);font-size:17px;display:grid;place-items:center;
  }
  .close:hover{background:var(--hover);color:var(--ink)}

  .modal-bar{
    flex:none;padding:16px 24px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .seg{display:flex;gap:2px;background:#f3f1ee;padding:3px;border-radius:9px}
  .seg button{padding:6px 15px;border-radius:6px;font-size:12.5px;color:var(--ink-3)}
  .seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .search{margin-left:auto;position:relative;width:280px}
  .search input{
    width:100%;height:34px;border:1px solid var(--line-2);border-radius:8px;
    padding:0 12px 0 32px;font-size:12.5px;font-family:inherit;outline:0;background:#fff;
  }
  .search input:focus{border-color:#9c9c9c;box-shadow:0 0 0 3px rgba(13,13,13,.05)}
  .search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;stroke:#a5a19b;fill:none;stroke-width:1.8}

  .chips{flex:none;padding:14px 24px 4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .chips .lbl{font-size:12px;color:var(--ink-3);margin-right:2px}
  .chip{
    padding:5px 14px;border-radius:99px;border:1px solid var(--line-2);background:#fff;
    font-size:12px;color:var(--ink-2);transition:.12s;
  }
  .chip:hover{border-color:#b3aea7;background:#fbfaf8}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .grid{
    flex:1;min-height:0;overflow:auto;padding:16px 24px 26px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-content:start;
  }
  @media (max-width:1080px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:760px){
    .grid{grid-template-columns:1fr}
    .stage{grid-template-columns:1fr}
    .side{display:none}
    .search{width:100%;margin-left:0}
  }

  .card{
    position:relative;border:1px solid var(--line-2);border-radius:var(--r-md);
    background:#fff;overflow:hidden;text-align:left;display:flex;flex-direction:column;
    height:330px;transition:box-shadow .16s,border-color .16s,transform .16s;
  }
  .card:hover{border-color:#b9b4ad;box-shadow:0 8px 22px -12px rgba(30,26,20,.35);transform:translateY(-1px)}
  .card.on{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink), 0 8px 22px -12px rgba(30,26,20,.35)}
  .card-head{flex:none;padding:12px 13px 10px;border-bottom:1px solid #f1efec}
  .card-head .row{display:flex;align-items:center;gap:7px}
  .card-head b{font-size:13px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{
    flex:none;font-size:10.5px;color:var(--ink-3);background:#f4f2ef;border-radius:5px;
    padding:2px 6px;letter-spacing:.02em;
  }
  .card-head .desc{
    margin:5px 0 0;font-size:11px;color:var(--ink-4);line-height:1.5;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .preview{
    flex:1;min-height:0;overflow:hidden;padding:14px 15px 0;position:relative;
  }
  .preview .fade{
    position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;
  }
  .card-foot{
    flex:none;height:38px;display:flex;align-items:center;justify-content:flex-end;
    gap:4px;padding:0 11px;border-top:1px solid #f1efec;background:#fdfdfc;
    font-size:11.5px;color:var(--ink-3);
  }
  .card-foot .fav{display:flex;align-items:center;gap:4px;padding:4px 7px;border-radius:6px}
  .card-foot .fav:hover{background:var(--hover);color:var(--ink)}
  .card-foot .fav svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6}
  .card-foot .fav.on{color:#b8860b}
  .card-foot .fav.on svg{fill:#f0c040;stroke:#c99a1e}

  .empty{grid-column:1/-1;padding:60px 0;text-align:center;color:var(--ink-3);font-size:13px}
  .foot-note{flex:none;padding:0 24px 16px;font-size:11.5px;color:var(--ink-4)}

  /* 小提示条 */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);
    background:rgba(20,18,14,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:99px;
    opacity:0;pointer-events:none;transition:.2s;z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<div class="page">
  <header class="topbar">
    <div class="brand"><i>素</i>SuperSu<span>· 公众号排版</span></div>
    <div class="tabs"><button class="on">公众号排版</button><button>标题图</button><button>长图文</button></div>
    <div class="spacer"></div>
    <button class="ghost-btn" id="btn-open">换个风格</button>
    <button class="solid-btn">复制到公众号</button>
  </header>

  <div class="stage">
    <aside class="side">
      <div class="field">
        <h4>当前风格</h4>
        <div class="box" id="now-style">—</div>
      </div>
      <div class="field">
        <h4>文章</h4>
        <div class="mini-hint">《一个人也可以把公众号做得很好》<br>约 620 字 · 3 个小节</div>
      </div>
      <div class="field">
        <h4>段落样式</h4>
        <div class="mini-hint">金句 · 数据 · 提示<br>（按内容自动识别）</div>
      </div>
    </aside>

    <div class="canvas-wrap">
      <div class="paper" id="paper">
        <div class="meta"><b>原创</b> · SuperSu · 2026年11月1日 · 广东</div>
        <div class="article" id="article"></div>
      </div>
    </div>

    <aside class="side right">
      <div class="field">
        <h4>风格速览</h4>
        <div class="mini-hint" id="side-style">点击左侧「换个风格」打开主题库。</div>
      </div>
      <div class="field">
        <h4>为什么这样排</h4>
        <div class="mini-hint">
          标题 22px 只给 h1，正文统一 15px；<br>
          移动端 375px 下不折锯齿、长链接不断版。
        </div>
      </div>
    </aside>
  </div>
</div>

<!-- ── 主题选择弹窗 ───────────────────────────────────────────── -->
<div class="mask" id="mask">
  <div class="modal" role="dialog" aria-label="选择排版主题">
    <div class="modal-head">
      <h2>选择排版主题</h2>
      <p>点击主题卡片后立即应用到左侧文章预览。</p>
      <button class="close" id="btn-close" aria-label="关闭">✕</button>
    </div>

    <div class="modal-bar">
      <div class="seg" id="seg">
        <button class="on" data-tab="all">全部主题</button>
        <button data-tab="featured">编辑推荐</button>
        <button data-tab="fav">我的收藏</button>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="q" type="search" placeholder="搜索主题名 / 颜色 / 用途">
      </div>
    </div>

    <div class="chips" id="chips"><span class="lbl">标签</span></div>

    <div class="grid" id="grid"></div>
    <div class="foot-note" id="foot-note">共 164 套原创主题</div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* 示例文章文案：结构对齐公众号真实阅读场景（标题 / 引导 / 小标题 / 引用 / 列表 / 强调） */
const ARTICLE = {
  title: '一个人也可以把公众号做得很好',
  lead: '写作这件事，难的从来不是没有想法，而是想法被排版、配图、格式这些琐事一点点磨掉。',
  h2: ['一、先想清楚写给谁', '二、好内容也需要好皮相', '三、把重复劳动交给工具'],
  body: [
    '动笔之前先回答一个问题：这篇是写给自己看的，还是写给某个具体的人看的？前者的读者只有你，后者才需要排版。',
    '我见过太多账号，内容扎实却倒在阅读体验上——标题挤成一坨、段落没有呼吸、重点全靠感叹号。读者的耐心只有三秒。'
  ],
  quote: '好的设计，是尽可能少的设计。',
  list: ['用清晰的标题组织观点', '用舒展的行距留出呼吸感', '用适量的强调突出重点'],
  strong: '把时间还给写作',
  tail: '写完草稿，选好主题，再复制到公众号。剩下的交给机器。'
};

const FAM_ORDER = ['全部','公文','信笺','暮色','夜航','节庆','钢印','素页','经典'];

let state = { tab:'all', fam:'全部', q:'', current: localStorage.getItem('proto.theme') || 'ink' };
let favs = new Set(JSON.parse(localStorage.getItem('proto.favs') || '[]'));

const $ = (id) => document.getElementById(id);
const el = (t, cls, html) => { const n = document.createElement(t); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

/* ── 文章渲染（用主题真实 style 串） ── */
function renderArticle(t){
  const s = t.s;
  const box = $('article');
  box.innerHTML = '';
  box.style.background = t.bg;

  const title = el('h1', '', ARTICLE.title);
  title.setAttribute('style', s.h1 + ';margin:0 0 16px');
  box.appendChild(title);

  const lead = el('p', 'lead', ARTICLE.lead);
  lead.setAttribute('style', s.p + ';margin:0 0 18px');
  box.appendChild(lead);

  const secs = [
    [ARTICLE.h2[0], [ARTICLE.body[0]]],
    [ARTICLE.h2[1], [ARTICLE.body[1]]],
  ];
  secs.forEach(([h, ps], i) => {
    const h2 = el('h2', '', h);
    h2.setAttribute('style', s.h2 + ';' + (i === 0 ? 'margin-top:6px' : ''));
    box.appendChild(h2);
    ps.forEach((txt) => {
      const p = el('p', '', txt);
      p.setAttribute('style', s.p);
      box.appendChild(p);
    });
    if (i === 0) {
      const q = el('blockquote', '', ARTICLE.quote);
      q.setAttribute('style', s.bq);
      box.appendChild(q);
    }
  });

  // 第三小节：列表
  const h3 = el('h2', '', ARTICLE.h2[2]);
  h3.setAttribute('style', s.h2);
  box.appendChild(h3);
  ARTICLE.list.forEach((txt) => {
    const row = el('div', '', '<span style="flex:none;margin-right:8px">•</span><span>' + txt + '</span>');
    row.setAttribute('style', 'display:flex;align-items:flex-start;' + (s.li || s.p));
    box.appendChild(row);
  });

  const tail = el('p', '', '写完草稿，选好主题，再复制到公众号。把时间留给 <strong>' + ARTICLE.strong + '</strong>。');
  tail.setAttribute('style', s.p + ';margin-top:18px');
  box.appendChild(tail);
}

/* ── 卡片内的迷你预览 ── */
function miniPreview(t){
  const s = t.s;
  const wrap = el('div', 'preview');
  wrap.style.background = t.bg;
  const h1 = el('div', '', '标题示例');
  h1.setAttribute('style', s.h1.replace(/font-size:\s*\d+px/, 'font-size:19px') + ';margin:0 0 10px;text-align:left');
  const h2 = el('div', '', '小标题');
  h2.setAttribute('style', s.h2.replace(/font-size:\s*\d+px/, 'font-size:14.5px') + ';margin:0 0 8px;text-align:left');
  const p = el('div', '', '这是一段正文示例，用来观察主题的字体、颜色、间距与强调。');
  p.setAttribute('style', s.p.replace(/font-size:\s*\d+px/, 'font-size:12px') + ';margin:0 0 8px;text-align:left');
  const q = el('div', '', '“引用内容展示观点摘录。”');
  q.setAttribute('style', (s.bq || s.p).replace(/font-size:\s*\d+px/, 'font-size:11.5px') + ';margin:0;padding:7px 10px;text-align:left');
  wrap.append(h1, h2, p, q);
  const fade = el('div', 'fade');
  fade.style.background = 'linear-gradient(to bottom, transparent, ' + t.bg + ')';
  wrap.appendChild(fade);
  return wrap;
}

function card(t){
  const c = el('button', 'card' + (t.id === state.current ? ' on' : ''));
  c.dataset.id = t.id;
  const head = el('div', 'card-head');
  head.innerHTML = '<div class="row"><b>' + esc(t.name) + '</b><span class="tag">' + esc(t.fam) + '</span></div>'
                 + '<p class="desc">' + esc(t.desc || '原创排版主题') + '</p>';
  c.appendChild(head);
  c.appendChild(miniPreview(t));
  const foot = el('div', 'card-foot');
  const fav = el('span', 'fav' + (favs.has(t.id) ? ' on' : ''),
    '<svg viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></svg>'
    + (favs.has(t.id) ? '已收藏' : '收藏'));
  foot.appendChild(fav);
  c.appendChild(foot);

  c.addEventListener('click', () => select(t.id));
  fav.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (favs.has(t.id)) favs.delete(t.id); else favs.add(t.id);
    localStorage.setItem('proto.favs', JSON.stringify([...favs]));
    renderGrid();
    toast(favs.has(t.id) ? '已收藏「' + t.name + '」' : '已取消收藏');
  });
  return c;
}

function esc(s){ return String(s).replace(/[&<>"]/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function matches(t){
  if (state.tab === 'featured' && !t.featured) return false;
  if (state.tab === 'fav' && !favs.has(t.id)) return false;
  if (state.fam !== '全部' && t.fam !== state.fam) return false;
  if (state.q) {
    const q = state.q.toLowerCase();
    const hay = (t.name + ' ' + t.id + ' ' + t.fam + ' ' + t.desc).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function renderGrid(){
  const grid = $('grid');
  const list = THEMES.filter(matches);
  grid.innerHTML = '';
  if (!list.length) {
    grid.appendChild(el('div', 'empty', state.tab === 'fav'
      ? '还没有收藏的主题<br><span style="font-size:12px;color:#b8b4ae">点卡片右下角的「收藏」，常用的几套会排在最前</span>'
      : '没匹配到主题，换个词试试'));
  } else {
    list.forEach((t) => grid.appendChild(card(t)));
  }
  $('foot-note').textContent = '共 164 套原创主题 · 当前显示 ' + list.length + ' 套';
}

function select(id){
  const t = THEMES.find((x) => x.id === id);
  if (!t) return;
  state.current = id;
  localStorage.setItem('proto.theme', id);
  renderArticle(t);
  $('now-style').textContent = t.name + ' · ' + t.fam;
  $('side-style').textContent = t.name + '：' + (t.desc || '原创排版主题');
  document.querySelectorAll('.card').forEach((c) => c.classList.toggle('on', c.dataset.id === id));
}

function toast(msg){
  const n = $('toast');
  n.textContent = msg; n.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => n.classList.remove('show'), 1800);
}

/* ── 初始化 ── */
(function init(){
  const chips = $('chips');
  FAM_ORDER.forEach((f) => {
    const b = el('button', 'chip' + (f === '全部' ? ' on' : ''), f);
    b.dataset.fam = f;
    b.addEventListener('click', () => {
      state.fam = f;
      chips.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x.dataset.fam === f));
      renderGrid();
    });
    chips.appendChild(b);
  });

  $('seg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    state.tab = b.dataset.tab;
    $('seg').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    renderGrid();
  });

  $('q').addEventListener('input', (e) => { state.q = e.target.value.trim(); renderGrid(); });

  const open = () => { $('mask').hidden = false; };
  const close = () => { $('mask').hidden = true; };
  $('btn-open').addEventListener('click', open);
  $('btn-close').addEventListener('click', close);
  $('mask').addEventListener('click', (e) => { if (e.target === $('mask')) close(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

  renderGrid();
  select(state.current);
})();
</script>
