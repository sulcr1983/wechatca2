<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>公众号排版 · v6（真数据 · 179 套 · 真缩略图）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════
   SuperSu v5 —— 按 design-system/supersu/MASTER.md 重做
   ─────────────────────────────────────────────────────────────────────
   风格：Minimalism & Swiss Style（Skill: ui-ux-pro-max）
   Dials：Variance 4 / Motion 3 / Density 6
   规则来源（全部来自 Skill 的 119 条 UX 规则）：
     · Accessibility  : 对比度 ≥ 4.5:1，可见 focus ring
     · Touch          : 最小点击区 44×44（桌面可 32，但间距 ≥ 8）
     · Typography     : 正文 ≥ 12px（不是 5.5px！），line-height ≥ 1.5
     · Layout         : 文本内容限宽 65–75ch，不许横向滚动
     · Style          : 不混用 flat 与拟物；图标用 SVG 不用 emoji
   ══════════════════════════════════════════════════════════════════════ */

:root{
  /* ── 配色 C：暖纸朱砂（2026-11-02 用户定稿）──
     用户理由：「书卷气最足」。
     注：保留 MASTER.md 的间距 / 阴影 / 字号阶梯，只换色板。 */
  --color-primary:       #AF3E2B;   /* 朱砂 */
  --color-on-primary:    #FFFFFF;
  --color-secondary:     #96331F;
  --color-accent:        #AF3E2B;   /* 沿用主色（项目既有约定） */
  --color-on-accent:     #FFFFFF;
  --color-background:    #F7F4EE;   /* 暖米 */
  --color-foreground:    #191713;   /* 墨黑 */
  --color-card:          #FFFFFF;
  --color-card-fg:       #191713;
  --color-muted:         #F1EEE6;
  --color-muted-fg:      #9A9285;
  --color-border:        #EAE6DD;
  --color-destructive:   #DC2626;
  --color-ring:          #AF3E2B;

  /* ── 间距阶梯（Density 6）── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;

  /* ── 阴影层级 ── */
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 6px rgba(0,0,0,.10);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.10);

  /* ── 半径 ── */
  --radius-sm: 6px;
  --radius:    8px;
  --radius-lg: 12px;

  --top-h: 56px;
  --drawer-w: 520px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  overflow:hidden;
  font:14px/1.6 var(--font);   /* 正文 14px（不是 5.5px） */
  -webkit-font-smoothing:antialiased;
  font-feature-settings:'cv02','cv03','cv04','cv11';
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--color-ring);outline-offset:2px;border-radius:4px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D8CFC0;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#BCB3A0;background-clip:padding-box}

/* ══ 顶栏 ══ */
header.top{
  height:var(--top-h); display:flex; align-items:center; gap:var(--space-md);
  padding:0 var(--space-lg); background:var(--color-card);
  border-bottom:1px solid var(--color-border); position:relative; z-index:30;
}
.brand{display:flex;align-items:center;gap:var(--space-sm);font-weight:600;font-size:14px;letter-spacing:-.01em}
.brand-mark{
  width:26px;height:26px;border-radius:7px;
  background:var(--color-primary); color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:700;
}
.tabs{display:flex;gap:var(--space-xs);margin-left:var(--space-md)}
.tab{
  height:32px;padding:0 14px;border-radius:var(--radius);
  font-size:13px;font-weight:500;color:var(--color-muted-fg);
  transition:background 200ms ease,color 200ms ease;
}
.tab:hover{background:var(--color-muted);color:var(--color-foreground)}
.tab[aria-pressed="true"]{background:var(--color-primary);color:#fff;font-weight:600}
.tab:disabled{opacity:.4;cursor:not-allowed}
.top-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-sm)}
.badge{
  display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:99px;background:#EAF4EF;color:#2E7D5B;
  font-size:11.5px;font-weight:600;
}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--color-primary);flex:none}
.tbtn{
  height:32px;padding:0 12px;border-radius:var(--radius);
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:12.5px;font-weight:500;color:var(--color-foreground);
  transition:background 200ms ease,border-color 200ms ease;
}
.tbtn:hover{background:var(--color-muted);border-color:var(--color-primary)}
.tbtn.pri{background:var(--color-accent);border-color:var(--color-accent);color:#fff;font-weight:600}
.tbtn.pri:hover{opacity:.9}

/* ══ 主区 ══ */
.stage{
  height:calc(100% - var(--top-h));
  display:grid;grid-template-columns:minmax(360px,600px) 1fr;
  grid-template-rows:minmax(0,1fr) auto;
  transition:padding-right 200ms ease;
}
body.browsing .stage{grid-template-columns:1fr;padding-right:var(--drawer-w)}
body.browsing .pane-edit{display:none}

.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane-edit{border-right:1px solid var(--color-border);background:var(--color-card)}
.pane-head{
  height:48px;padding:0 var(--space-lg);display:flex;align-items:center;gap:var(--space-sm);
  flex:none;border-bottom:1px solid var(--color-border);
}
.pane-title{
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--color-muted-fg);
}
.pane-actions{margin-left:auto;display:flex;align-items:center;gap:var(--space-sm)}
.gbtn{
  height:28px;padding:0 11px;border-radius:var(--radius-sm);
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:12px;font-weight:500;color:var(--color-foreground);
  transition:background 200ms ease;
}
.gbtn:hover{background:var(--color-muted)}
.pbtn{
  height:32px;padding:0 16px;border-radius:var(--radius);
  background:var(--color-accent);color:#fff;font-size:13px;font-weight:600;
  transition:opacity 200ms ease,transform 200ms ease;
}
.pbtn:hover{opacity:.92;transform:translateY(-1px)}
.cnt{font-size:11.5px;color:var(--color-muted-fg);font-variant-numeric:tabular-nums}

/* 编辑区：限宽 65–75ch（Skill: Layout/Container Width） */
#input{
  flex:1;width:100%;max-width:none;border:0;outline:0;resize:none;
  background:transparent;padding:var(--space-lg);
  font:14px/1.75 var(--font);color:var(--color-foreground);
}
#input::placeholder{color:#B0A896}

/* ══ 解析条 ══ */
.parse-bar{
  flex:none;border-top:1px solid var(--color-border);
  padding:var(--space-sm) var(--space-lg);
  display:flex;align-items:center;gap:var(--space-sm);flex-wrap:wrap;
  background:#FBF8F2;
}
.pp-select{
  height:28px;padding:0 9px;border:1px solid var(--color-border);
  border-radius:var(--radius-sm);background:var(--color-card);
  font-size:12px;color:var(--color-foreground);
}
.parse-body{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.pchip{
  height:24px;padding:0 9px;border-radius:var(--radius-sm);
  background:var(--color-card);border:1px solid var(--color-border);
  font-size:11.5px;color:var(--color-foreground);
  display:flex;align-items:center;gap:5px;white-space:nowrap;
}
.pchip b{color:var(--color-primary);font-weight:700}
.pchip.hint{background:none;border:0;color:var(--color-muted-fg)}

/* ══ 预览 ══ */
/* ── 预览区：手机外壳（照线上 pwa/src/style.css:245）── */
.preview-wrap{
  flex:1;min-height:0;overflow:auto;padding:var(--space-lg);
  background:var(--color-background);
  display:flex;align-items:center;justify-content:center;
}
.phone-shell{
  width:100%;max-width:420px;height:100%;
  display:flex;flex-direction:column;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:16px;              /* 线上 --radius-xl */
  box-shadow:var(--shadow-lg);
  overflow:hidden;
}
.wx-nav{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;height:40px;font-size:12px;color:var(--color-muted-fg);
  background:var(--color-background);border-bottom:1px solid var(--color-border);
}
.wx-nav-title{
  font-weight:600;color:var(--color-foreground);
  max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* 网页模式：外壳撑满（线上 .preview-wrap.web .phone-shell） */
.preview-wrap.web .phone-shell{max-width:100%;border-radius:var(--radius)}

/* 手机里的正文：13px / 1.8，与真实公众号观感接近 */
.pv-doc{
  flex:1;min-height:0;overflow-y:auto;
  padding:18px 16px;
  font-size:13.5px;line-height:1.85;color:#1F2937;
  background:var(--color-card);
}
.pv-doc h1{font-size:19px;line-height:1.35;margin:0 0 8px;font-weight:700}
.pv-doc .h2s{font-size:15px;font-weight:700;margin:18px 0 8px}
.pv-doc p{margin:0 0 12px}
.pv-doc ul{margin:0 0 12px;padding-left:18px}
.pv-doc li{margin-bottom:5px}
.pv-doc blockquote{
  margin:14px 0;padding:12px 14px;border-left:3px solid var(--color-primary);
  background:var(--color-background);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:13px;color:#374151;
}

/* ══ 底部两行 ══ */
.bars{
  grid-column:1 / -1;display:flex;flex-direction:column;
  min-height:0;position:relative;
}
body.browsing .bars{display:none}

.laybar{
  flex:none;height:36px;display:flex;align-items:center;gap:var(--space-sm);
  padding:0 var(--space-lg);background:var(--color-card);
  border-top:1px solid var(--color-border);font-size:12px;
}
.laybar .ll{
  font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--color-muted-fg);flex:none;
}
.laybar .lv{color:var(--color-foreground);font-weight:600;flex:none}
.chev{
  width:22px;height:22px;border-radius:var(--radius-sm);display:grid;place-items:center;
  color:var(--color-muted-fg);font-size:11px;flex:none;transition:background 200ms ease;
}
.chev:hover{background:var(--color-muted);color:var(--color-foreground)}
.lay-quick{
  display:flex;gap:var(--space-xs);align-items:center;overflow:hidden;flex:1;min-width:0;
  mask-image:linear-gradient(to right,#000 90%,transparent);
  -webkit-mask-image:linear-gradient(to right,#000 90%,transparent);
}
.lay-quick button{
  flex:none;height:24px;padding:0 9px;border-radius:var(--radius-sm);
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:11.5px;color:var(--color-muted-fg);
}
.lay-quick button[aria-pressed="true"]{
  border-color:var(--color-primary);background:#EAF4EF;color:#2E7D5B;font-weight:600;
}
.laybar .rr2{margin-left:auto;color:var(--color-muted-fg);flex:none;font-size:11.5px}

/* 版式弹层 */
.laypop{
  position:absolute;left:0;right:0;bottom:92px;z-index:35;
  background:var(--color-card);border-top:1px solid var(--color-border);
  box-shadow:0 -10px 15px rgba(0,0,0,.10);
  padding:var(--space-md) var(--space-lg);display:flex;flex-direction:column;gap:var(--space-sm);
}
.laypop .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.laypop .gl{
  font-size:11px;font-weight:600;color:var(--color-muted-fg);
  flex:none;white-space:nowrap;min-width:44px;
}
.laypop .gl em{font-style:normal;font-weight:400;opacity:.8;margin-left:4px}
.laypop .lc{
  height:28px;padding:0 11px;border-radius:var(--radius-sm);
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:12px;color:var(--color-foreground);
  transition:background 200ms ease,border-color 200ms ease;
}
.laypop .lc:hover{background:var(--color-muted);border-color:var(--color-primary)}
.laypop .lc.on{
  border-color:var(--color-primary);background:#EAF4EF;color:#2E7D5B;font-weight:600;
}

.style-bar{
  height:64px;border-top:1px solid var(--color-border);
  background:var(--color-card);display:flex;align-items:center;gap:var(--space-sm);
  padding:0 var(--space-lg);
}
.caps{
  display:flex;gap:var(--space-sm);overflow-x:auto;flex:1;padding:6px 0;
  scrollbar-width:none;
  mask-image:linear-gradient(to right,#000 88%,transparent);
  -webkit-mask-image:linear-gradient(to right,#000 88%,transparent);
}
.caps::-webkit-scrollbar{display:none}
.cap{
  flex:none;display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;
  border-radius:99px;border:1px solid var(--color-border);background:var(--color-card);
  font-size:12.5px;color:var(--color-foreground);white-space:nowrap;
  transition:border-color 200ms ease,background 200ms ease;
}
.cap:hover{border-color:var(--color-primary);background:var(--color-muted)}
.cap[aria-pressed="true"]{
  border-color:var(--color-primary);background:#EAF4EF;color:#2E7D5B;font-weight:600;
}
.cap-sw{
  width:14px;height:14px;border-radius:50%;position:relative;overflow:hidden;flex:none;
  border:1px solid rgba(0,0,0,.10);
}
.cap-sw::after{content:'';position:absolute;right:0;top:0;width:7px;height:14px;background:var(--sw2)}
.smore{
  flex:none;height:34px;padding:0 14px;border-radius:99px;
  background:var(--color-foreground);color:#fff;font-size:12.5px;font-weight:600;
  transition:opacity 200ms ease;
}
.smore:hover{opacity:.9}

/* ══════════════════════════════════════════════════════════════════════
   抽屉 —— 整体重做
   ══════════════════════════════════════════════════════════════════════ */
.drawer-mask{
  position:fixed;inset:0;z-index:40;background:rgba(19,78,74,.20);
  backdrop-filter:blur(2px);
}
.drawer{
  position:fixed;right:0;top:0;height:100%;width:min(600px,94vw);z-index:41;
  background:var(--color-background);border-left:1px solid var(--color-border);
  display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(19,78,74,.12);
}
body.browsing .drawer{width:var(--drawer-w)}
body.browsing .drawer-mask{display:none}

.d-head{
  flex:none;height:var(--top-h);padding:0 var(--space-md) 0 var(--space-lg);
  display:flex;align-items:center;gap:var(--space-sm);
  border-bottom:1px solid var(--color-border);background:var(--color-card);
}
.d-head b{font-size:14px;font-weight:600;flex:none;letter-spacing:-.01em}
.d-search{
  flex:1;min-width:0;height:34px;padding:0 12px;
  border:1px solid var(--color-border);border-radius:var(--radius);
  background:var(--color-background);font:13px var(--font);color:var(--color-foreground);
  outline:0;transition:border-color 200ms ease,box-shadow 200ms ease;
}
.d-search:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(175,62,43,.10)}
.d-search::placeholder{color:#B0A896}
.d-x{
  width:30px;height:30px;border-radius:var(--radius-sm);display:grid;place-items:center;
  color:var(--color-muted-fg);font-size:16px;transition:background 200ms ease;
}
.d-x:hover{background:var(--color-muted);color:var(--color-foreground)}

/* 顶层两个并列 tab */
.mode-tabs{
  flex:none;display:flex;gap:0;margin:var(--space-md) var(--space-lg) 0;
  border:1px solid var(--color-border);border-radius:var(--radius-lg);
  overflow:hidden;background:var(--color-card);
}
.mode-tabs button{
  flex:1;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;
  border-right:1px solid var(--color-border);transition:background 200ms ease;
}
.mode-tabs button:last-child{border-right:0}
.mode-tabs button:hover{background:var(--color-muted)}
.mode-tabs button b{font-size:13px;font-weight:600;color:var(--color-foreground)}
.mode-tabs button span{font-size:11px;color:var(--color-muted-fg)}
.mode-tabs button[aria-pressed="true"]{background:rgba(175,62,43,.08);box-shadow:inset 0 -3px 0 var(--color-primary)}
.mode-tabs button[aria-pressed="true"] b{color:var(--color-primary)}

/* 分段 */
.sec{flex:none;padding:var(--space-md) var(--space-lg);border-bottom:1px solid var(--color-border)}
.sec-h{display:flex;align-items:center;gap:var(--space-sm);margin-bottom:10px}
.sec-n{
  width:20px;height:20px;border-radius:50%;background:var(--color-foreground);color:#fff;
  font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;
}
.sec-t{font-size:13px;font-weight:600;color:var(--color-foreground)}
.sec-hint{font-size:11.5px;color:var(--color-muted-fg);margin-left:auto;white-space:nowrap}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{
  height:28px;padding:0 12px;border-radius:99px;
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:12px;color:var(--color-foreground);
  transition:background 200ms ease,border-color 200ms ease;
}
.fchip:hover{background:var(--color-muted);border-color:var(--color-primary)}
.fchip[aria-pressed="true"]{
  background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600;
}

.group-lab{
  font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--color-muted-fg);margin:10px 0 6px;display:flex;align-items:center;gap:6px;
}
.group-lab:first-of-type{margin-top:0}
.group-lab .why{
  font-weight:400;letter-spacing:0;text-transform:none;font-size:11px;opacity:.85;
}
.dl-chip{
  height:30px;padding:0 12px;border-radius:var(--radius-sm);
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:12px;color:var(--color-foreground);
  transition:background 200ms ease,border-color 200ms ease;
}
.dl-chip:hover{background:var(--color-muted);border-color:var(--color-primary)}
.dl-chip[aria-pressed="true"]{
  border-color:var(--color-primary);background:#EAF4EF;color:#2E7D5B;font-weight:600;
}
.dl-chip:disabled{opacity:.4;cursor:not-allowed}

.switches{display:flex;gap:var(--space-lg);flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-foreground);cursor:pointer}
.sw input{accent-color:var(--color-primary);width:15px;height:15px;cursor:pointer}
.sw em{font-style:normal;color:var(--color-muted-fg);font-size:11px}

/* kit 说明条 */
.kit-explain{
  flex:none;margin:var(--space-md) var(--space-lg) 0;
  padding:12px 14px;border-radius:var(--radius-lg);
  background:#FBF6EC;border:1px solid #E8DFC9;
  font-size:12px;color:#6B5B3E;line-height:1.65;
}
.kit-explain b{color:#5A4A2E;font-weight:600}

/* 主题网格 */
.d-grid{
  flex:1;min-height:0;overflow-y:auto;
  padding:var(--space-md) var(--space-lg) var(--space-xl);
  display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));
  gap:var(--space-md);align-content:start;
}
.d-card{
  display:flex;flex-direction:column;border-radius:var(--radius-lg);
  border:1px solid var(--color-border);background:var(--color-card);
  overflow:hidden;text-align:left;
  transition:border-color 200ms ease,box-shadow 200ms ease,transform 200ms ease;
}
.d-card:hover{
  border-color:var(--color-primary);box-shadow:var(--shadow-md);transform:translateY(-2px);
}
.d-card[aria-pressed="true"]{
  border-color:var(--color-primary);box-shadow:0 0 0 1px var(--color-primary) inset;
}
.d-prev{
  height:132px;position:relative;overflow:hidden;background:var(--color-card);
}
/* 整篇设计卡片：缩略图 4:3，卡片高一点，才装得下标题+正文+列表 */
#grid-kit .d-prev{ height:148px; }
/* 缩略图：与线上 .d-thumb 同规则（object-fit:cover + object-position:top center） */
.d-thumb{
  width:100%;height:100%;object-fit:cover;object-position:top center;
  display:block;
}
/* 角标放右下角 —— 左上角会压住标题首字（实测「时代周刊」被压成「整篇去了趟海边」） */
.d-kit{
  position:absolute;right:6px;bottom:6px;z-index:2;
  padding:2px 7px;border-radius:4px;

}

}

/* 第 4 段配色微调 */

<script type="module">
/* ══════════════════════════════════════════════════════════════════════
   数据
   ══════════════════════════════════════════════════════════════════════ */
const LAYS_COMMON = [
  ['', '默认'], ['rhythm','图文节奏'], ['cardflow','卡片流'], ['outline','目录导航'],
  ['magazine','杂志分栏'], ['hero','首屏'], ['card','卡片组'], ['timeline','时间线'],
];
/* ⚠️ 报刊风 7 项（朱丝栏/天头/…）**已删除**（2026-11-02 用户纠正）。
   原因：引擎 19 个版式里，有 15 个（time/guardian/economist/natgeo/vogue/
   forbes/adidas/muji/mori/ukiyoe/note/ikea/starbucks/brutal/deepread）
   **已被 15 套整篇设计的 locked_layout 独占**，一一对应。
   在版式区再暴露一遍 = 同一个东西两个入口、两种名字。
   用户原话：「引擎和我们15套是不同的，我们15套这个是单独的……之前哪些不要改变」
   → 版式区保持原有 8 项不动；15 套走「整篇设计」tab，互不干扰。 */
const LAYS_NEWS = [];
const LAY_LABEL = Object.fromEntries([...LAYS_COMMON, ...LAYS_NEWS]);

/* 族：从真实数据统计（不写死数量） */
let FAMS = [['all','全部',0], ['fav','收藏',0]];
const FAM_LABEL = {
  biz:'公文', feast:'节庆', letter:'信笺', minimal:'素页',
  night:'夜航', stamp:'钢印', dusk:'暮色',
};

/* 配色主题（示例数据，真实项目从 themes/index.json 读） */
/* 164 套配色主题 + 15 套整篇设计 —— **从真实数据加载**，不手抄
   数据源：pwa/dist/themes/index.json（构建产物，179 条 = 164 palette + 15 kit）
   缩略图：data/{id}.jpg（真引擎渲染的 480×240，脚本 scripts/gen_theme_thumbs.py）
   ⚠️ v5 手填了 17 个假主题 —— 那是「看起来没啥」的根因。v6 全部读真数据。 */
let THEMES = [];   // 164 套配色主题（由 loadData 填充）

/* 15 套整篇设计 —— 从 kit-previews/index.json 加载（真跑引擎的产物） */
let KITS = [];

const SAMPLE = `周末去了趟海边

第一天：什么也没做

两天里我没看手机，也没带相机。风把头发吹得乱七八糟，我坐在礁石上看了很久的海。

下午四点到的，光刚好落在水面上，碎成一片一片。我什么也没做，就坐着。

「后来我才发现，那天唯一拍下的照片，是手机彻底没电之前随手按的一张。」

第二天：五点起床看日出

· 五点起床，裹着被子坐在阳台上
· 六点零七分，太阳从海平面出来
· 六点半回去睡回笼觉，睡到九点

中午退房，在车站买了一个面包。回来的路上我想，好像什么也没发生，但好像又发生了什么。`;

/* ══════════════════════════════════════════════════════════════════════
   状态
   ══════════════════════════════════════════════════════════════════════ */
const S = {
  mode: 'theme',
  themeId: 'su-biz-azure',
  lay: '',
  fam: 'all',
  blocks: { quote:true, data:false, tip:true },
  search: '',
};
const KIT_BY_ID = () => Object.fromEntries(KITS.map(k => [k.id, k]));
const isKit = () => !!KIT_BY_ID()[S.themeId];

function themeNow() {
  if (isKit()) {
    const k = KIT_BY_ID()[S.themeId];
    return { n: k.name, bg: k.colors.background || '#fff', acc: k.colors.accent || '#000' };
  }
  return THEMES.find(t => t.id === S.themeId) || THEMES[0];
}
const layNow = () => isKit() ? (KIT_BY_ID()[S.themeId].lockedLayout || '') : S.lay;

/* ══════════════════════════════════════════════════════════════════════
   渲染预览
   ══════════════════════════════════════════════════════════════════════ */
function parse(text) {
  const lines = text.split('\n').map(l => l.trim());
  const out = { title:'', secs:[] };
  let cur = null, first = true;
  for (const l of lines) {
    if (!l) continue;
    if (first) { out.title = l; first = false; continue; }
    if (/^[·•\-]\s*/.test(l)) {
      if (!cur) { cur = { h:'', body:[], list:[] }; out.secs.push(cur); }
      (cur.list = cur.list || []).push(l.replace(/^[·•\-]\s*/, ''));
      continue;
    }
    if (/^[「"].*[」"]$/.test(l)) {
      if (!cur) { cur = { h:'', body:[], list:[] }; out.secs.push(cur); }
      (cur.quotes = cur.quotes || []).push(l.replace(/^[「"]|[」"]$/g, ''));
      continue;
    }
    if (l.length <= 18) { cur = { h:l, body:[], list:[] }; out.secs.push(cur); continue; }
    if (!cur) { cur = { h:'', body:[], list:[] }; out.secs.push(cur); }
    cur.body.push(l);
  }
  return out;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderPreview() {
  const d = parse(document.getElementById('input').value || '');
  const t = themeNow();
  const B = S.blocks;

  let html = `<h1 style="color:${t.acc}">${esc(d.title || '未命名')}</h1>`;
  d.secs.forEach(s => {
    if (s.h) html += `<div class="h2s">${esc(s.h)}</div>`;
    s.body.forEach(p => { html += `<p>${esc(p)}</p>`; });
    if (s.list && s.list.length) html += `<ul>${s.list.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    if (s.quotes && B.quote) s.quotes.forEach(q => { html += `<blockquote>「${esc(q)}」</blockquote>`; });
  });
  document.getElementById('preview').innerHTML = html;
  /* 手机外壳的导航标题跟着文章标题走（照线上 #wx-title 的行为）
     ⚠️ 变量名不能叫 t —— 上面 const t = themeNow() 已占用（踩过 SyntaxError） */
  const wxTitle = document.getElementById('wx-title');
  if (wxTitle) wxTitle.textContent = d.title || '未命名';

  /* 解析条 */
  const counts = [
    ['大标题', d.title ? 1 : 0],
    ['小标题', d.secs.filter(s => s.h).length],
    ['段落', d.secs.reduce((n,s) => n + s.body.length, 0)],
    ['金句', d.secs.reduce((n,s) => n + (s.quotes||[]).length, 0)],
    ['列表', d.secs.reduce((n,s) => n + (s.list||[]).length, 0)],
  ].filter(([,n]) => n > 0);
  document.getElementById('parse-body').innerHTML = counts.length
    ? counts.map(([k,n]) => `<span class="pchip">${k} <b>${n}</b></span>`).join('')
    : '<span class="pchip hint">粘贴后自动识别结构</span>';
}

/* ══════════════════════════════════════════════════════════════════════
   抽屉
   ══════════════════════════════════════════════════════════════════════ */
function renderDrawer() {
  const mode = S.mode;
  document.getElementById('pane-theme').hidden = mode !== 'theme';
  document.getElementById('pane-kit').hidden = mode !== 'kit';
  document.querySelectorAll('#mode-tabs button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));

  /* 族：按真实数据统计数量 */
  const famCount = {};
  THEMES.forEach(t => { if (t.fam) famCount[t.fam] = (famCount[t.fam] || 0) + 1; });
  FAMS = [['all','全部',THEMES.length], ['收藏' === '收藏' ? 'fav' : 'fav', '收藏', 0]]
    .concat(Object.entries(famCount)
      .sort((a,b) => b[1] - a[1])
      .map(([k,n]) => [k, FAM_LABEL[k] || k, n]));
  document.getElementById('fams').innerHTML = FAMS.map(([k,label,n]) =>
    `<button class="fchip" data-fam="${k}" aria-pressed="${S.fam===k}">${label}${n?` ${n}`:''}</button>`
  ).join('');
  const cf = FAMS.find(f => f[0] === S.fam);
  document.getElementById('fam-hint').textContent =
    S.fam === 'all' ? `${THEMES.length} 套 · 按族浏览` : `${cf ? cf[2] : 0} 套 · ${cf ? cf[1] : ''}`;

  /* 版式 */
  const chip = ([id,label]) => {
    const locked = isKit();
    return `<button class="dl-chip" data-lay="${id}" aria-pressed="${layNow()===id}" ${locked?'disabled':''}>${label}</button>`;
  };
  document.getElementById('lays-common').innerHTML = LAYS_COMMON.map(chip).join('');
  const q = (S.search || '').toLowerCase();
  const hit = t => !q || (t.n || t.name || '').toLowerCase().includes(q) || t.id.includes(q);

  /* 配色主题网格 */
  let list = S.fam === 'fav' ? THEMES.filter((_,i) => [0,3,6,9].includes(i))
           : S.fam === 'all' ? THEMES
           : THEMES.filter(t => t.fam === S.fam);
  document.getElementById('grid').innerHTML = list.filter(hit).map(t =>
    `<button class="d-card" data-th="${t.id}" aria-pressed="${t.id===S.themeId}">
      <div class="d-prev" style="background:${t.bg}">
        <img class="d-thumb" loading="lazy" alt="${esc(t.n)}"
             src="../../public/theme-thumbs/${t.id}.jpg"
             onerror="this.style.display='none'">
      </div>
      <div class="d-body">
        <span class="d-name">${t.n}</span><span class="d-fav">☆</span>
      </div>
    </button>`).join('')
    || `<div style="grid-column:1/-1;padding:24px;color:var(--color-muted-fg);font-size:13px">没匹配的配色主题</div>`;

  /* 整篇设计网格 —— 预渲染 JPG，照线上 theme-thumbs 的做法
     （pwa/src/app.js:775 用 <img src="./theme-thumbs/{id}.jpg">）
     不用 iframe：桌面宽度的 h1 塞进 227px 卡片会占 3–4 行、正文全被挤没。
     JPG 由 scripts/gen_kit_thumbs.py 用 Playwright 截 480×240 生成。 */
  document.getElementById('grid-kit').innerHTML = KITS.filter(hit).map(k =>
    `<button class="d-card" data-th="${k.id}" aria-pressed="${k.id===S.themeId}">
      <div class="d-prev">
        <span class="d-kit">整篇</span>
        <img class="d-thumb" loading="lazy" alt="${esc(k.name)}"
             src="./data/${k.id}.jpg"
             onerror="this.style.display='none'">
      </div>
      <div class="d-body">
        <span class="d-name">${esc(k.name)}</span><span class="d-fav">☆</span>
      </div>
    </button>`).join('')
    || `<div style="grid-column:1/-1;padding:24px;color:var(--color-muted-fg);font-size:13px">缩略图未生成，先跑 scripts/gen_kit_thumbs.py</div>`;
}

function renderLayBar() {
  const bar = document.getElementById('laybar');
  const t = themeNow();
  if (isKit()) {
    bar.querySelector('.ll').textContent = '整篇设计';
    document.getElementById('lay-cur').textContent = t.n;
    document.getElementById('lay-quick').innerHTML =
      '<span style="font-size:11.5px;color:var(--color-muted-fg)">版式与配色已随设计内置</span>';
    document.getElementById('lay-meta').innerHTML =
      '<button id="kit-exit" style="font-size:11.5px;padding:3px 10px;border:1px solid var(--color-border);border-radius:6px;background:var(--color-card);color:var(--color-foreground)">改回可组合</button>';
    return;
  }
  bar.querySelector('.ll').textContent = '版式';
  const all = [...LAYS_COMMON, ...LAYS_NEWS];
  const cur = all.find(l => l[0] === layNow());
  document.getElementById('lay-cur').textContent = cur ? cur[1] : '默认';
  document.getElementById('lay-quick').innerHTML = all.slice(0, 6).map(([id,label]) =>
    `<button data-lay="${id}" aria-pressed="${layNow()===id}">${label}</button>`).join('');
  document.getElementById('lay-meta').textContent = `${t.n} · 164 套`;
}

function renderLayPop() {
  const chip = ([id,label]) =>
    `<button class="lc${layNow()===id?' on':''}" data-lay="${id}">${label}</button>`;
  document.getElementById('laypop').innerHTML =
    `<div class="row"><span class="gl">通用</span>${LAYS_COMMON.map(chip).join('')}</div>`;
}

function renderCaps() {
  const t = themeNow();
  const list = [t, ...THEMES.filter(x => x.id !== S.themeId)].slice(0, 40);
  document.getElementById('caps').innerHTML = list.map(x => {
    const bg = x.id === S.themeId ? t.bg : x.bg;
    const acc = x.id === S.themeId ? t.acc : x.acc;
    return `<button class="cap" data-th="${x.id}" aria-pressed="${x.id===S.themeId}">
      <span class="cap-sw" style="background:${bg};--sw2:${acc}"></span>${x.n}
    </button>`;
  }).join('');
}

const paint = () => { renderPreview(); renderDrawer(); renderCaps(); renderLayBar(); renderLayPop(); };

/* ══════════════════════════════════════════════════════════════════════
   交互
   ══════════════════════════════════════════════════════════════════════ */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2200);
}
function openDrawer() {
  document.getElementById('laypop').hidden = true;
  document.getElementById('lay-toggle').textContent = '▴';
  document.getElementById('drawer').hidden = false;
  document.getElementById('drawer-mask').hidden = false;
  document.body.classList.add('browsing');
  renderDrawer();
}
function closeDrawer() {
  document.getElementById('drawer').hidden = true;
  document.getElementById('drawer-mask').hidden = true;
  document.body.classList.remove('browsing');
}

document.addEventListener('click', (e) => {
  const mt = e.target.closest('[data-mode]');
  if (mt) { S.mode = mt.dataset.mode; S.search = ''; document.getElementById('d-search').value = ''; renderDrawer(); return; }

  const fam = e.target.closest('[data-fam]');
  if (fam) { S.fam = fam.dataset.fam; renderDrawer(); return; }

  const lay = e.target.closest('[data-lay]');
  if (lay && !lay.disabled) {
    S.lay = lay.dataset.lay;
    document.getElementById('laypop').hidden = true;
    document.getElementById('lay-toggle').textContent = '▴';
    paint();
    toast(`版式：${LAY_LABEL[S.lay] || '默认'}`);
    return;
  }

  const th = e.target.closest('[data-th]');
  if (th) {
    S.themeId = th.dataset.th;
    if (isKit()) S.mode = 'kit';
    paint();
    toast(`已选：${themeNow().n}`);
    return;
  }

  if (e.target.closest('#kit-exit')) {
    S.mode = 'theme'; S.themeId = 'su-biz-azure'; S.lay = '';
    paint(); toast('已改回可组合版式'); return;
  }
  if (e.target.closest('#lay-toggle')) {
    const pop = document.getElementById('laypop');
    const btn = document.getElementById('lay-toggle');
    pop.hidden = !pop.hidden;
    btn.textContent = pop.hidden ? '▴' : '▾';
    btn.setAttribute('aria-expanded', String(!pop.hidden));
    return;
  }
  if (e.target.closest('#btn-themes')) { openDrawer(); return; }
  if (e.target.closest('#d-close') || e.target.closest('#drawer-mask')) { closeDrawer(); return; }
  if (e.target.closest('#btn-copy')) { toast('已复制（原型不写剪贴板）'); return; }

  /* 手机 / 网页视图切换（照线上 applyMode()：给 .preview-wrap 加 .web） */
  const modeBtn = e.target.closest('#btn-mode');
  if (modeBtn) {
    const wrap = document.getElementById('preview-wrap');
    const web = wrap.classList.toggle('web');
    modeBtn.textContent = web ? '网页' : '手机';
    return;
  }
});

document.addEventListener('change', (e) => {
  const b = e.target.closest('[data-blk]');
  if (b) { S.blocks[b.dataset.blk] = b.checked; renderPreview(); }
});

document.getElementById('d-search').addEventListener('input', (e) => {
  S.search = e.target.value.trim(); renderDrawer();
});
document.getElementById('input').addEventListener('input', () => {
  document.getElementById('char-count').textContent = document.getElementById('input').value.length + ' 字';
  renderPreview();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
document.getElementById('c-reset').onclick = () => { paint(); toast('配色已恢复'); };

/* ══════════════════════════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════════════════════════ */
/* ══ 加载真实数据 ══ */
const RES = await fetch('./data/themes-index.json');
if (!RES.ok) throw new Error('数据加载失败：' + RES.status);
const ALL = await RES.json();

/* 179 条 = 164 palette + 15 kit（字段：id/name/desc/primary/accent/background/family/kind/lockedLayout/tags/featured） */
THEMES = ALL.filter(t => t.kind !== 'kit').map(t => ({
  id: t.id, n: t.name, fam: t.family || '',
  bg: t.background || '#FFFFFF', acc: t.accent || t.primary || '#333',
  desc: t.desc || '', featured: !!t.featured,
}));
KITS = ALL.filter(t => t.kind === 'kit').map(t => ({
  id: t.id, name: t.name, lockedLayout: t.lockedLayout || '',
  colors: { background: t.background || '#FFFFFF', accent: t.accent || '#333' },
  desc: t.desc || '',
}));

document.getElementById('input').value = SAMPLE;
document.getElementById('char-count').textContent = SAMPLE.length + ' 字';

   名字取自 mg-*.json 的 name 字段（用户已定：保留品牌名） */
