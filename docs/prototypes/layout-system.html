<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EE">
<title>SuperSu · 版式 × 配色 原型 V3</title>
<!-- ══ 顶栏与 pwa/index.html + pwa/src/style.css 逐项一致（未作任何改动）══
     · --top-h 56px / padding 0 16px / border-bottom 1px #EAE6DD / bg #FFFFFF
     · brand-mark 24×24 圆角 6 + box-shadow 0 0 0 1px rgba(20,18,14,.10)
     · .brand 15px/700 + .brand-tail 12.5px/400 #6E6759
     · .cover-btn 32px 高 / 圆角 8 / #AF3E2B 字 / 6px 圆点 / aria-pressed 反白
     · .engine-badge 26px 胶囊 12px 字 / .menu-btn 30px / .icon-btn 30×30
     · .stage grid-template-columns minmax(340px,620px) 1fr / 第二行 60px 风格条
     · .pane-head 44px / .phone-shell max-width 420px / .wx-nav 40px
     · body.browsing 让位 500px（线上已有，不能省）
     ══ -->
<style>
:root {
  --bg-canvas: #F7F4EE; --bg-surface: #FAF9F5; --bg-raised: #FFFFFF;
  --bg-hover: #F0EDE8; --border: #EAE6DD; --border-hi: #D8D2C6;
  --text: #191713; --text-soft: #6E6759; --text-muted: #9B9484;
  --accent: #AF3E2B; --accent-dim: #96331F;
  --accent-soft: rgba(175, 62, 43, .08); --success: #5F8F73;
  --radius-sm: 6px; --radius: 8px; --radius-lg: 12px; --radius-xl: 16px;
  --font: "DM Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC",
          -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", ui-monospace, monospace;
  --shadow-lg: 0 4px 16px rgba(87, 76, 54, .10);
  --shadow-xl: 0 16px 48px rgba(20, 18, 14, .22);
  --top-h: 56px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg-canvas); color: var(--text);
  font-family: var(--font); font-size: 14px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font-family: inherit; font-size: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

/* ══ 顶栏（逐项照抄 style.css） ══════════════════════════════ */
.top {
  height: var(--top-h); padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-raised); border-bottom: 1px solid var(--border);
  position: relative; z-index: 20;
}
.top-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-mark {
  width: 24px; height: 24px; border-radius: 6px; flex: none; display: block;
  box-shadow: 0 0 0 1px rgba(20, 18, 14, .10);
  background: var(--accent); color: #fff;
  font-size: 13px; font-weight: 700; line-height: 24px; text-align: center;
}
.brand { font-size: 15px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.brand-tail { font-weight: 400; font-size: 12.5px; color: var(--text-soft); margin-left: 4px; }
.brand-sub { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; margin-left: 4px; }
.cover-btn {
  height: 32px; padding: 0 12px; border-radius: var(--radius);
  color: var(--accent); font-size: 12.5px; font-weight: 600; white-space: nowrap;
  border: 1px solid rgba(175, 62, 43, .28); background: var(--accent-soft);
  display: inline-flex; align-items: center; gap: 5px;
  transition: background .15s, color .15s, border-color .15s;
}
.cover-btn::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.cover-btn:hover { background: rgba(175, 62, 43, .14); border-color: var(--accent); }
.cover-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.cover-btn[aria-pressed="true"]::before { background: #fff; }
.top-right { display: flex; align-items: center; gap: 8px; position: relative; }
.engine-badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 10px; border-radius: 99px;
  font-size: 12px; color: var(--text-soft);
  background: var(--bg-surface); border: 1px solid var(--border); white-space: nowrap;
}
.engine-badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
.engine-badge[data-state="ready"] i { background: var(--success); }
.menu-btn {
  height: 30px; padding: 0 10px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg-raised);
  color: var(--text-soft); font-size: 13px; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 4px;
}
.menu-btn:hover { background: var(--bg-hover); color: var(--text); }
.icon-btn {
  width: 30px; height: 30px; border-radius: var(--radius);
  color: var(--text-soft); font-size: 16px; line-height: 1;
  display: grid; place-items: center;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }

/* ══ 主体两栏 ═══════════════════════════════════════════════ */
.stage {
  height: calc(100% - var(--top-h));
  display: grid;
  grid-template-columns: minmax(340px, 620px) 1fr;
  grid-template-rows: minmax(0, 1fr) auto;
}
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane-edit { border-right: 1px solid var(--border); }
.pane-head { height: 44px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; flex: none; gap: 8px; }
.pane-title { font-size: 12px; font-weight: 600; color: var(--text-soft); letter-spacing: .04em; flex: none; }
.pane-meta { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; flex: none; }
.pane-actions { display: flex; align-items: center; gap: 8px; }
.ghost-btn {
  height: 30px; padding: 0 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); color: var(--text-soft); font-size: 12px;
}
.ghost-btn:hover { border-color: var(--border-hi); color: var(--text); }
.primary-btn {
  height: 32px; padding: 0 16px; border-radius: var(--radius);
  background: var(--accent); color: #fff; font-size: 13px; font-weight: 500;
}
.input {
  flex: 1; width: 100%; min-height: 0; padding: 4px 16px 16px;
  border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
  font-family: var(--font); font-size: 14.5px; line-height: 1.85;
}
.parse-bar {
  flex: none; min-height: 38px; padding: 8px 16px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  font-size: 12px; color: var(--text-muted); background: var(--bg-surface);
}
.pp-select {
  flex: none; height: 24px; padding: 0 4px;
  border: 1px solid var(--border); border-radius: 6px;
  background: transparent; color: inherit; font-size: 12px; font-family: inherit;
}
.preview-wrap { flex: 1; min-height: 0; padding: 0 16px 6px; display: flex; justify-content: center; overflow: hidden; }
.phone-shell {
  width: 100%; max-width: 420px; height: 100%;
  display: flex; flex-direction: column;
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); overflow: hidden;
}
.wx-nav {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; height: 40px; font-size: 12px; color: var(--text-soft);
  background: var(--bg-surface); border-bottom: 1px solid var(--border);
}
.wx-nav-title { font-weight: 600; color: var(--text); max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preview { flex: 1; width: 100%; border: 0; background: #fff; overflow-y: auto; }

/* ══ 风格条（照抄 .style-bar） ══════════════════════════════ */
.style-bar {
  grid-column: 1 / -1; min-width: 0;
  flex: none; height: 60px; padding: 0 128px 0 10px;
  border-top: 1px solid var(--border); background: var(--bg-surface);
  display: flex; align-items: center; gap: 6px;
}
.style-caps { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px; }
.style-caps::-webkit-scrollbar { display: none; }
.cap {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 12px 0 8px; border-radius: 99px;
  background: var(--bg-raised); border: 1px solid var(--border);
  color: var(--text-soft); font-size: 12.5px; white-space: nowrap;
}
.cap:hover { border-color: var(--border-hi); color: var(--text); }
.cap[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.cap i { width: 16px; height: 16px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.style-scroll { width: 28px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-raised); color: var(--text-soft); font-size: 16px; display: grid; place-items: center; flex: none; }
.style-more { flex: none; height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--border-hi); color: var(--text-soft); font-size: 12.5px; }
.style-more:hover { background: var(--bg-hover); color: var(--text); }

/* ══ 风格库抽屉（照抄 .drawer + body.browsing 让位） ═══════ */
body.browsing .stage { grid-template-columns: 1fr; padding-right: 500px; }
body.browsing .pane-edit { display: none; }
.drawer {
  position: fixed; top: 0; right: 0; z-index: 50;
  width: 500px; height: 100%;
  background: var(--bg-canvas); border-left: 1px solid var(--border);
  box-shadow: var(--shadow-xl);
  display: flex; flex-direction: column;
}
.drawer-head {
  flex: none; height: var(--top-h); padding: 0 12px 0 20px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border); background: var(--bg-raised);
}
.drawer-head b { font-size: 14px; flex: none; }
.drawer-search {
  flex: 1; min-width: 0; height: 30px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-surface); color: var(--text); font-family: inherit; font-size: 13px; outline: 0;
}
#btn-drawer-close {
  width: 40px; height: 40px; border-radius: 50%; font-size: 20px; font-weight: 500;
  color: var(--text); background: var(--bg-hover); border: 1px solid var(--border); flex: none;
}
#btn-drawer-close:hover { background: rgba(175, 62, 43, .12); border-color: var(--accent); color: var(--accent); }

/* ── 版式区：紧凑型（图标块 26×26 + 名称 11px，两行） ── */
.lay-sec { flex: none; padding: 10px 14px 10px; border-bottom: 1px solid var(--border); }
.sec-ttl {
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  letter-spacing: .06em; display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 8px;
}
.sec-ttl em { font-style: normal; font-weight: 400; letter-spacing: 0; font-size: 10.5px; }
.lay-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px 2px; }
.lay-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 5px 2px 4px; border-radius: var(--radius-sm);
  border: 1px solid transparent;
}
.lay-item:hover { background: var(--bg-hover); }
.lay-item[aria-pressed="true"] { background: var(--accent-soft); border-color: rgba(175,62,43,.30); }
.lay-ic {
  width: 26px; height: 26px; border-radius: 5px; flex: none;
  background: var(--bg-raised); border: 1px solid var(--border);
  padding: 4px; display: flex; flex-direction: column; gap: 2px; overflow: hidden;
}
.lay-item[aria-pressed="true"] .lay-ic { border-color: var(--accent); }
.lay-ic i { display: block; height: 2px; border-radius: .5px; background: var(--border-hi); }
.lay-ic i.k { background: var(--text-soft); height: 3px; }
.lay-ic i.a { background: var(--accent); }
.lay-ic i.w { width: 60%; }
.lay-ic i.h { height: 7px; background: var(--bg-hover); }
.lay-nm { font-size: 10px; line-height: 1.2; color: var(--text-soft); white-space: nowrap; }
.lay-item[aria-pressed="true"] .lay-nm { color: var(--accent); font-weight: 600; }

/* ── kit 锁定态 ──────────────────────────────────────────────── */
/* 说明行：解释「为什么不给点」，而不是让用户以为坏了 */
.kit-note {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin: 0 0 8px; padding: 7px 9px;
  background: var(--accent-soft); border: 1px solid rgba(175, 62, 43, .22);
  border-radius: var(--radius-sm); font-size: 11px; line-height: 1.5;
}
.kit-note-txt { color: var(--text-soft); flex: 1 1 auto; min-width: 0; }
.kit-note-txt strong { color: var(--accent); font-weight: 700; }
.kit-exit {
  flex: none; height: 24px; padding: 0 10px; border-radius: 99px;
  background: var(--accent); color: #fff; font-size: 11px; font-weight: 600;
  white-space: nowrap;
}
.kit-exit:hover { background: var(--accent-dim); }

/* 置灰：真 disabled，不是只加颜色 —— 但也要看得出是「不可用」而非「坏了」 */
.lay-sec.is-locked .lay-item,
.pal-sec.is-locked .pdot,
.pal-sec.is-locked .pal-fam,
.lay-sec.is-locked .lay-item[aria-pressed="true"] {
  opacity: .38; cursor: not-allowed; pointer-events: none;
}
.lay-sec.is-locked .lay-ic,
.pal-sec.is-locked .pdot { filter: grayscale(1); }
/* 自定义配色：kit 下直接收起（不是变灰——它本来就不该出现） */
.drawer-blocks.is-locked .swatch-row { display: none; }

/* ── 三段标签：让抽屉「一次只显示一件事」 ──────────────────────
   背景：抽屉里堆 6 段时，500px 宽一屏高的空间被版式 26 格 + 配色 + 装饰抢光，
   主题卡只剩 2 行可见（用户反馈「下面几十个可选的没了」）。
   改成按需切页后，风格页能把整块高度都给主题卡。 */
.seg-tabs {
  flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
  padding: 6px 10px 0; border-bottom: 1px solid var(--border); background: var(--bg-raised);
}
.seg-tab {
  position: relative; height: 30px; border-radius: 7px 7px 0 0;
  font-size: 12.5px; color: var(--text-soft); font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
}
.seg-tab:hover { background: var(--bg-hover); color: var(--text); }
.seg-tab[aria-pressed="true"] {
  background: var(--bg-canvas); color: var(--text); font-weight: 700;
  box-shadow: inset 0 -2px 0 var(--accent);
}
/* 版式标签上挂当前版式名，切到别的页也知道现在是哪套 */
.seg-tab em {
  font-style: normal; font-weight: 400; font-size: 10.5px;
  color: var(--text-muted); max-width: 72px; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}
.seg-tab[aria-pressed="true"] em { color: var(--accent); }

/* ── 二级切换：配色主题 / 整篇设计 ────────────────────────────
   与一级 tab 在视觉上必须能区分：一级是「下划线 tab」，二级是「填充胶囊」。
   两级长得一样会让人以为是同一层，点错。 */
.sub-tabs {
  flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  padding: 7px 14px 9px; background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
}
.sub-tab {
  height: 30px; border-radius: 99px; border: 1px solid var(--border);
  background: var(--bg-surface); color: var(--text-soft);
  font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
}
.sub-tab:hover { border-color: var(--border-hi); color: var(--text); }
.sub-tab[aria-pressed="true"] {
  background: var(--text); border-color: var(--text); color: #fff;
}
/* 数量徽标：一眼知道各有几套，不用点进去数 */
.sub-tab em {
  font-style: normal; font-weight: 500; font-size: 10.5px;
  background: rgba(0,0,0,.07); border-radius: 99px; padding: 1px 6px;
}
.sub-tab[aria-pressed="true"] em { background: rgba(255,255,255,.22); }
/* 搜索时二级切换失效（跨两段搜），给个视觉提示 */
.sub-tabs.is-search .sub-tab { opacity: .45; pointer-events: none; }

/* 整篇设计段顶部的说明条：解释这一段和上一段有什么不同 */
.kit-strip {
  padding: 9px 14px 3px; font-size: 11px; line-height: 1.5;
  color: var(--text-muted);
}

/* pane：一个 pane 占满标签栏以下的全部高度 */
.pane-sec { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
.pane-sec[hidden] { display: none; }


/* ── 配色区：单行横滑 ── */
.pal-sec { flex: none; padding: 9px 14px; border-bottom: 1px solid var(--border); }
.pal-row { display: flex; align-items: center; gap: 6px; }
.pal-fam {
  flex: none; height: 20px; padding: 0 7px; border-radius: 99px;
  border: 1px solid var(--border); background: var(--bg-raised);
  font-size: 10.5px; color: var(--text-soft); white-space: nowrap;
}
.pal-fam[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }
.pal-dots { flex: 1; min-width: 0; display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.pal-dots::-webkit-scrollbar { display: none; }
.pdot {
  width: 18px; height: 18px; border-radius: 50%; flex: none; position: relative;
  border: 1px solid rgba(0,0,0,.10); box-shadow: inset 0 0 0 2.5px var(--bg-raised);
}
.pdot:hover { transform: scale(1.15); }
.pdot[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.pal-name { flex: none; font-size: 10.5px; color: var(--text-muted); max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── 段落样式 + 自定义配色（现有，不动） ── */
.drawer-blocks {
  flex: none; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap;
  padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 11.5px;
}
.drawer-blocks .db-label { color: var(--text-muted); flex: none; }
.drawer-blocks .db-item { display: flex; align-items: center; gap: 4px; color: var(--text-soft); flex: none; white-space: nowrap; }
.drawer-blocks .db-hint { font-style: normal; font-size: 10px; color: var(--text-muted); opacity: .7; margin-left: 2px; }
.swatch-row { margin-left: auto; display: flex; align-items: center; gap: 5px; }
.swatch-row span { font-size: 10.5px; color: var(--text-muted); }
.swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border-hi); padding: 0; }

/* ── 设计签名代表卡 ── */
.sig-head {
  flex: none; padding: 9px 14px 3px; font-size: 11px; font-weight: 600; color: var(--text-muted);
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.sig-head span { font-weight: 400; font-size: 10.5px; }
.sig-head > span:first-child { font-weight: 600; }
.sig-hint { color: var(--text-muted); opacity: .8; white-space: nowrap; }
/* 两段之间一条分隔线，避免 49 张卡和 15 张卡糊成一片 */
.sig-head--kit { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--border); }
/* 风格页：配色条固定，下面两块卡共用一个滚动区 ——
   分两段各自滚动会在 500px 宽里出现两条滚动条、互相挤（实测踩过）。 */
#pane-style { gap: 0; }
#pane-style .drawer-grid {
  flex: 0 0 auto; min-height: 0; overflow: visible;
  padding: 8px 14px 6px; grid-auto-rows: 88px;
}
#pane-style .drawer-grid--kit {
  max-height: none; padding-bottom: 22px; grid-auto-rows: 96px;
}
/* 外层统一滚动，两块卡在同一条视线里 */
.style-scroll-body {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
}
.drawer-grid {
  flex: 1 1 auto; min-height: 100px; overflow-y: auto; padding: 8px 14px 22px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
  grid-auto-rows: 88px; gap: 8px; align-content: start;
}
/* kit 卡片的「锁定」小标：告诉用户这张卡不能自由组合 */
.kit-lock {
  color: #fff !important; background: var(--text-soft);
  border-radius: 3px; padding: 0 4px; font-size: 9px !important;
  line-height: 14px; flex: none;
}
.d-card--kit[aria-pressed="true"] .kit-lock { background: var(--accent); }
/* 某段搜索无命中：留在原地给一行说明，不整段消失 */
.grid-empty {
  grid-column: 1 / -1; text-align: center; color: var(--text-muted);
  padding: 18px 0; font-size: 11.5px;
}
.d-card {
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-raised);
  overflow: hidden; padding: 0; text-align: left; min-height: 88px;
  display: flex; flex-direction: column;
}

.d-card .nm { padding: 5px 8px; font-size: 11px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 4px; }
.d-card .nm span { color: var(--text-muted); font-size: 10px; }

/* ══ 预览区内容 ═════════════════════════════════════════════ */
.doc { padding: 22px 18px 40px; }

/* ══ 长图文（横滑卡片） ═════════════════════════════════════ */
.lf-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
/* 6 页 2 行 3 列，全部可见（横滑会把首页截掉，实测过） */
.lf-deck {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 14px;
  width: 100%; max-width: 620px; padding: 4px 2px 10px;
}
.lf { width: 100%; }
.lf-page {
  width: 100%; aspect-ratio: 3 / 4; border-radius: 5px; overflow: hidden; position: relative;
  box-shadow: 0 8px 22px -10px rgba(30,26,20,.45), 0 0 0 1px rgba(0,0,0,.05);
}
.lf-cap { font-size: 9.5px; color: var(--text-muted); padding: 5px 1px 0; display: flex; justify-content: space-between; font-family: var(--font); }
.lf-bar { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--text-soft); }

/* 长图文页面角色 */
.pg { position: absolute; inset: 0; display: flex; flex-direction: column; }
.pg-kick { font-family: var(--font-mono); font-size: 6.5px; letter-spacing: .18em; }
.pg-foot { position: absolute; left: 12px; right: 12px; bottom: 8px; display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 6.5px; opacity: .55; }

.toast {

.toast.show { opacity: 1; transform: translateX(-50%); }

/* 由配色 + 字型参数生成一套完整的 style 串。
   ⚠️ 不能留空对象：P() 会拼出 style="undefined"，预览直接坏掉（实测踩过）。 */
function kitStyles(k, tp) {
  const serif = tp.serif
    ? "Georgia,'Songti SC','Noto Serif SC',serif"
    : "-apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  const light = (() => {
    const h = k.bg.replace('#','');
    const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    return (0.2126*r + 0.7152*g + 0.0722*b) / 255 >= 0.55;
  })();
  return {
    h1: `font-size:${tp.h1}px;font-weight:800;line-height:1.32;color:${k.ink};font-family:${serif};margin:0 0 18px;padding:0`,
    h2: `font-size:${tp.h2}px;font-weight:700;line-height:1.45;color:${k.ink};font-family:${serif};margin:34px 0 12px;padding:0`,
    p:  `font-size:${tp.fs}px;line-height:${tp.lh};color:${k.ink};font-family:${serif};margin:0 0 16px;letter-spacing:${tp.fs >= 17 ? '0.3px' : '0.2px'};text-align:justify`,
    blockquote: `font-size:${tp.fs}px;line-height:${tp.lh};color:${k.ink};font-family:${serif};margin:24px 0`,
    list_item_text: `font-size:${tp.fs}px;line-height:${tp.lh};color:${k.ink};font-family:${serif}`,
    _serif: serif,
    _light: light,
  };

/* ⚠️ 必须用**成员自己的**样式串（t.s），不能用组代表的（g.rep.s）。
   同组只代表「结构相同」，颜色各不相同：公文·湖蓝 h2 底色 #256F9D、公文·朱砂 #9D3525。
   写成 `s: g.rep.s` 会让换色后预览完全不动 —— 这就是「渲染读全局而非入参」的变种（本项目已犯 6 次的同一类）。 */
function themeById(id){
  // kit：样式用固定配色，layout 用 locked_layout（不读用户本机覆盖）
  const k = KIT_BY_ID[id];
  if (k) {
    const tp = KIT_TYPO[k.id];
    return { id: k.id, name: k.name, fam: '整篇设计', desc: k.note,
             bg: k.bg, ink: k.ink, accent: k.accent,
             s: kitStyles(k, tp), lockedLayout: k.layout };
  }
  const t = ALL.find(x => x.id === id); if (!t) return null;
  const g = GROUPS.find(g => g.sig === t.sig) || { rep: t };
  return { ...g.rep, ...t };
}

/* ══ 装饰钩子：返回要插进 h1 / h2 的 HTML ═══════════════ */
function decoHTML(t, where){
  const d = state.deco;
  if (d === 'none') return { pre:'', post:'', h2pre:'' };
  const ac = t.accent, ink = t.ink;
  if (d === 'kicker' && where === 'h1') {
    return { pre:`<span style="display:block;margin:0 0 12px;font-size:11px;line-height:1.4;font-weight:700;letter-spacing:3px;color:${ac};font-family:-apple-system,sans-serif">${ART.kicker}</span>`, post:'', h2pre:'' };
  }
  if (d === 'mark' && where === 'h1') {
    return { pre:'', post:`<span style="display:block;width:60px;height:4px;margin-top:14px;background:${ac}"></span>`, h2pre:'' };
  }
  if (d === 'badge') {
    return { pre:'', post:'', h2pre:`<span style="display:inline-block;min-width:30px;margin:0 10px 4px 0;padding:4px 7px;color:#fff;background:${ac};border-radius:6px;font-family:ui-monospace,monospace;font-size:.72em;line-height:1;text-align:center">$N</span>` };
  }
  return { pre:'', post:'', h2pre:'' };
}

/* ══ 渲染公众号文章 ═════════════════════════════════════ */
function renderDoc(t){
  const s = t.s, a = ART;
  const font = (/serif|Georgia|Songti|宋/i.test(s.p||'') ? "Georgia,'Songti SC','Noto Serif SC',serif" : "-apple-system,'PingFang SC',sans-serif");
  const dg = decoHTML(t, 'h1');
  const db = decoHTML(t, 'h2');

  const P = x => `<p style="${s.p}">${x}</p>`;
  const H1 = () => `<h1 style="${s.h1}">${dg.pre}${a.title}${dg.post}</h1>`;
  // 编号必须逐节递增：没有自动编号的文章（如默认版式）也要从 01 数起
  let _h2i = 0;
  const H2 = (txt, n) => {
    _h2i += 1;
    const num = n || String(_h2i).padStart(2, '0');
    const badge = state.deco === 'badge'
      ? (db.h2pre || '').replace('$N', num)
      : (n ? `<span style="font-family:ui-monospace,monospace;font-size:.62em;opacity:.5;margin-right:8px">${n}</span>` : '');
    return `<h2 style="${s.h2}">${badge}${txt}</h2>`;
  };
  const BQ = x => `<div style="${s.blockquote || s.p}">${x}</div>`;
  const LI = arr => arr.map(x => `<div style="display:flex;gap:8px;align-items:flex-start;${s.list_item_text||s.p};margin:0 0 9px"><span style="flex:none;opacity:.55">•</span><span>${x}</span></div>`).join('');
  const wrap = inner => `<div class="doc" style="background:${t.bg};color:${t.ink};font-family:${font};padding:22px 18px 40px">${inner}</div>`;

  // kit 主题带 lockedLayout：必须用它，不能用全局 state.layout。
  // ⚠️ 写成 `state.layout` 会导致点「时代周刊」渲染出上一次选的版式（实测：
  //    点 mg-time 却渲染出「深度阅读」的赤陶配色），因为全局 layout 还停在 'deepread'。
  // 这正是方案文档里「kit 的 layout 不读用户本机覆盖」的同一原则。
  const L = t.lockedLayout || state.layout;

  if (L === 'hero') {
    return wrap(`<div style="margin:0 -18px 22px;padding:28px 18px;background:${t.accent};color:#fff">
        <h1 style="margin:0 0 10px;font-size:26px;font-weight:700;line-height:1.3;color:#fff">${a.title}</h1>
        <p style="margin:0;font-size:13px;line-height:1.8;opacity:.9">${a.deck}</p></div>` +
      a.secs.map((x,i)=>`${H2(x.h,x.n)}${x.p.map(P).join('')}${i===0?BQ(a.quote):''}${i===2?LI(a.list):''}`).join(''));
  }
  if (L === 'card') {
    return wrap(H1() + a.secs.map((x,i)=>
      `<div style="margin:0 0 14px;padding:16px 18px;border-radius:12px;background:${t.bg==='#ffffff'?'rgba(0,0,0,.035)':'rgba(255,255,255,.09)'}">
        ${H2(x.h,x.n)}${x.p.map(y=>`<p style="${s.p};margin-bottom:8px">${y}</p>`).join('')}${i===0?BQ(a.quote):''}${i===2?LI(a.list):''}</div>`).join(''));
  }
  if (L === 'rhythm') {
    return wrap(H1() + a.secs.map((x,i)=>
      `<div style="margin:30px 0 12px"><span style="display:inline-block;width:4px;height:15px;background:${t.accent};margin-right:9px;vertical-align:2px"></span></div>${H2(x.h)}${x.p.map(y=>`<p style="${s.p};margin-bottom:26px">${y}</p>`).join('')}${i===0?BQ(a.quote):''}${i===2?LI(a.list):''}`).join(''));
  }
  if (L === 'outline') {
    return wrap(H1() +
      `<div style="margin:0 0 22px;padding:14px 16px;border-radius:10px;background:${t.bg==='#ffffff'?'rgba(0,0,0,.03)':'rgba(255,255,255,.07)'}">
        <div style="font-size:11px;letter-spacing:.16em;color:${t.accent};margin-bottom:8px">目录</div>
        ${a.secs.map((x,k)=>`<div style="font-size:12.5px;line-height:2">${k+1}. ${x.h}</div>`).join('')}</div>` +
      a.secs.map((x,i)=>`${H2(x.h)}${x.p.map(P).join('')}${i===0?BQ(a.quote):''}${i===2?LI(a.list):''}`).join(''));
  }
  if (L === 'magazine') {
    return wrap(H1() +
      `<div style="height:2px;background:${t.accent};opacity:.5;margin:2px 0 18px"></div>${P(a.deck)}
      ${H2(a.secs[0].h)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin:0 0 12px">
        <div>${P(a.secs[0].p[0])}</div>
        <div style="border-left:1px solid rgba(0,0,0,.12);padding-left:16px">${P(a.secs[0].p[1])}</div></div>` +
      a.secs.slice(1).map((x,i)=>`${H2(x.h)}${x.p.map(P).join('')}${i===0?BQ(a.quote):''}${i===1?LI(a.list):''}`).join(''));
  }
  if (L === 'timeline') {
    return wrap(H1() + a.secs.map((x,i)=>
      `<div style="display:flex;gap:14px;margin:0 0 6px">
        <div style="flex:none;width:12px;display:flex;flex-direction:column;align-items:center">
          <span style="width:10px;height:10px;border-radius:50%;background:${t.accent};margin-top:12px"></span>
          ${i<a.secs.length-1?'<span style="flex:1;width:1px;background:rgba(0,0,0,.14);min-height:40px"></span>':''}</div>
        <div style="flex:1;min-width:0">${H2(x.h)}${x.p.map(P).join('')}${i===0?BQ(a.quote):''}${i===2?LI(a.list):''}</div></div>`).join(''));
  }
  if (L === 'masthead') {
    return wrap(`<div style="margin:0 -18px;padding:16px 18px 12px;border-bottom:2px solid ${t.ink};display:flex;justify-content:space-between;align-items:flex-end">
        <span style="font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.16em;color:${t.accent}">NO. 12 — 2026</span>
        <span style="font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.2em;color:${t.ink};opacity:.45">WORKFLOW</span></div>
      <h1 style="${s.h1};font-size:27px;margin:20px 0 12px">${a.title}</h1>
      <p style="margin:0 0 16px;font-size:13px;line-height:1.85;font-style:italic;color:${t.ink};opacity:.62">${a.deck}</p>
      <div style="font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;color:${t.accent};padding-bottom:14px;border-bottom:1px solid rgba(0,0,0,.12);margin-bottom:22px;display:flex;gap:14px">
        <span>SUPERSU</span><span>6 MIN READ</span></div>` +
      a.secs.map((x,i)=>`<h2 style="${s.h2};display:flex;align-items:baseline;gap:9px"><span style="font-family:ui-monospace,monospace;font-size:.62em;color:${t.accent};flex:none">${x.n}</span>${x.h}</h2>${x.p.map(P).join('')}
        ${i===0?`<div style="margin:22px 0;padding:18px 0;border-top:1px solid rgba(0,0,0,.15);border-bottom:1px solid rgba(0,0,0,.15);font-size:17px;line-height:1.65;text-align:center;font-style:italic">${a.quote}</div>`:''}
        ${i===2?LI(a.list):''}`).join(''));
  }
  if (L === 'marginal') {
    return wrap(`<div style="padding:22px 0 16px;border-bottom:3px solid ${t.ink}">
        <div style="font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.18em;color:${t.accent};margin-bottom:10px">FIELD NOTES</div>
        <h1 style="${s.h1};font-size:26px;margin:0">${a.title}</h1></div>
      <p style="margin:16px 0 0;padding-left:76px;font-size:13.5px;line-height:1.9;color:${t.ink};opacity:.6">${a.deck}</p>` +
      a.secs.map((x,i)=>`<div style="display:flex;gap:12px;margin-top:20px;align-items:flex-start">
        <div style="flex:none;width:64px;padding-top:3px">
          <div style="font-family:ui-monospace,monospace;font-size:20px;line-height:1;color:${t.accent}">${x.n}</div>
          <div style="font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.14em;color:${t.ink};opacity:.45;margin-top:5px">${x.lab}</div></div>
        <div style="flex:1;min-width:0;border-left:1px solid rgba(0,0,0,.14);padding-left:12px">
          <h2 style="${s.h2};font-size:14px;margin:0 0 8px">${x.h}</h2>
          ${x.p.map(y=>`<p style="${s.p};font-size:13px;margin-bottom:12px">${y}</p>`).join('')}
          ${i===0?`<div style="font-size:12.5px;line-height:1.8;color:${t.ink};opacity:.62;border-left:2px solid ${t.accent};padding-left:10px">${a.quote}</div>`:''}
          ${i===2?LI(a.list):''}</div></div>`).join(''));
  }
  if (L === 'split') {
    return wrap(`<div style="padding:22px 0 14px">
        <div style="font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.18em;color:${t.accent};margin-bottom:8px">FIELD NOTES</div>
        <h1 style="${s.h1};font-size:25px;margin:0 0 10px">${a.title}</h1>
        <p style="margin:0;font-size:13px;line-height:1.88;color:${t.ink};opacity:.6">${a.deck}</p></div>
      ${H2(a.secs[0].h)}
      <div style="display:grid;grid-template-columns:1fr 1fr;margin-top:12px;border-top:2px solid ${t.ink}">
        <div style="padding:14px 10px 14px 0"><div style="font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;color:${t.accent};margin-bottom:8px">写给自己</div>
          <p style="${s.p};font-size:11.5px;margin:0">${a.secs[0].p[0]}</p></div>

       <p style="${s.p};font-size:17px;line-height:1.6">${a.deck}</p>` +
      a.secs.map((x, i) =>
        `<h2 style="display:inline-block;text-align:left;background:${lightBg ? '#F5E9A8' : 'rgba(255,255,255,.16)'};color:${frame};border:3px solid ${frame};box-shadow:5px 5px 0 ${frame};padding:8px 16px;font-size:22px;font-weight:900;margin:34px 5px 18px 0">${x.h}</h2>`
        + x.p.map(P).join('')
        + (i === 0 ? `<div style="background:${lightBg ? '#FFFFFF' : t.bg};border:3px solid ${frame};box-shadow:6px 6px 0 ${lightBg ? '#F5C6D0' : 'rgba(255,200,210,.55)'};padding:16px 18px;margin:26px 0;font-size:16px;line-height:1.7">${a.quote}</div>` : '')
        + (i === 2 ? LI(a.list) : '')
      ).join('') +
      `<div style="height:5px;background:${frame};margin:30px 0 0"></div>`
    );
  }

  if (L === 'deepread') {
    const brown = lightBg ? '#4A3B32' : t.ink;
    const terra = lightBg ? '#C8795A' : accent;
    return wrap(
      `<p style="margin:0 0 10px;font-size:11px;letter-spacing:.28em;font-weight:700;color:${terra}">深度阅读</p>
       <h1 style="text-align:left;font-size:26px;line-height:1.32;font-weight:800;color:${brown};margin:0 0 22px;padding:0">${a.title}</h1>
       <p style="${s.p};font-size:17px;line-height:1.85">${a.deck}</p>` +
      a.secs.map((x, i) =>
        `<h2 style="text-align:left;font-size:22px;line-height:1.4;font-weight:800;color:${brown};margin:34px 0 6px;padding:0 0 10px;border-bottom:2px solid ${lightBg ? 'rgba(74,59,50,.25)' : 'rgba(255,255,255,.25)'}">${x.h}</h2>`
        + x.p.map(P).join('')
        + (i === 0 ? `<div style="border-left:4px solid ${terra};background:${lightBg ? 'rgba(200,121,90,.09)' : 'rgba(255,255,255,.07)'};padding:16px 18px;margin:26px 0;border-radius:4px;font-size:16px;line-height:1.8">${a.quote}</div>` : '')
        + (i === 2 ? LI(a.list) : '')
      ).join('') +
      `<div style="width:56px;height:2px;background:${terra};margin:34px auto 0"></div>`
    );
  }

  return wrap(H1() + P(a.deck) + a.secs.map((x,i)=>`${H2(x.h)}${x.p.map(P).join('')}${i===0?BQ(a.quote):''}${i===2?LI(a.list):''}`).join(''));
}

/* ══ 长图文页面 ═════════════════════════════════════════ */
function lfPage(role, t){
  const b = t.bg, ink = t.ink, ac = t.accent;
  const font = (/serif|Georgia|Songti|宋/i.test(t.s.p||'') ? "Georgia,'Songti SC',serif" : "-apple-system,'PingFang SC',sans-serif");
  const base = `background:${b};color:${ink};font-family:${font}`;
  const foot = (n) => `<div class="pg-foot" style="color:${ink};font-size:6px;left:12px;right:12px;bottom:7px"><span>SuperSu</span><span>${n} / 06</span></div>`;
  const kick = (txt) => `<div class="pg-kick" style="color:${ac};margin-bottom:10px">${txt}</div>`;

  let inner = '', cap = '';
  if (role === 'toc') {
    cap = '目录页（原有能力，未声明触发条件）';
    inner = `<div class="pg" style="${base};padding:18px 14px 26px;box-sizing:border-box">
      ${kick('CONTENTS')}
      ${ART.secs.map((x,i)=>`<div style="display:flex;gap:7px;align-items:baseline;padding:7px 0;border-bottom:1px dotted rgba(0,0,0,.18)">
        <span style="font-family:ui-monospace,monospace;font-size:7px;color:${ac};flex:none">0${i+1}</span>
        <span style="flex:1;min-width:0;font-size:9.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.h}</span>
        <span style="font-family:ui-monospace,monospace;font-size:7px;opacity:.5;flex:none">P0${i+2}</span></div>`).join('')}
      ${foot('P01')}</div>`;
  } else if (role === 'dense') {
    cap = '正文页（现有，12 套共用同一排版）';
    inner = `<div class="pg" style="${base};padding:14px 12px 24px;box-sizing:border-box;overflow:hidden">
      ${kick('CHAPTER 02')}
      <div style="font-size:11px;font-weight:600;margin:0 0 4px;line-height:1.3">先想清楚写给谁</div>
      <div style="width:20px;height:2px;background:${ac};margin-bottom:7px;flex:none"></div>
      <p style="font-size:7.5px;line-height:1.62;margin:0 0 6px">动笔之前先回答一个问题：这篇是写给自己看的，还是写给某个具体的人看的？</p>
      <p style="font-size:7.5px;line-height:1.62;margin:0">我见过太多账号，内容扎实却倒在阅读体验上——标题挤成一坨、段落没有呼吸。</p>
      ${foot('P02')}</div>`;
  } else if (role === 'split') {
    cap = '双栏论证页（新增）';
    inner = `<div class="pg" style="${base};padding:16px 12px 26px;box-sizing:border-box;overflow:hidden">
      ${kick('FORM / CONCEPT')}
      <div style="font-size:11px;font-weight:600;margin:0 0 9px;line-height:1.3">好内容也需要好皮相</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div style="min-width:0"><div style="font-family:ui-monospace,monospace;font-size:10px;color:${ac};margin-bottom:3px">01</div>
          <p style="font-size:7.5px;line-height:1.62;margin:0">排版不是装饰，是把结构说清楚。读者扫一眼就该知道哪里是重点。</p></div>
        <div style="min-width:0;border-left:1px solid rgba(0,0,0,.15);padding-left:8px"><div style="font-family:ui-monospace,monospace;font-size:10px;color:${ac};margin-bottom:3px">02</div>
          <p style="font-size:7.5px;line-height:1.62;margin:0">清晰的标题、舒展的行距、适量的强调——这三件事比配色重要十倍。</p></div></div>
      ${foot('P04')}</div>`;
  } else if (role === 'ledger') {
    cap = '编号塔（新增）';
    inner = `<div class="pg" style="${base};padding:16px 12px 26px;box-sizing:border-box;overflow:hidden">
      ${kick('WHAT CHANGED')}
      ${['标题不再是一条下划线','引用升级成整宽大字','清单有自己的编号塔','结尾有署名与 CTA'].map((x,i)=>
        `<div style="display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.12)">
          <span style="font-family:ui-monospace,monospace;font-size:12px;color:${ac};flex:none">0${i+1}</span>
          <span style="font-size:8.5px;line-height:1.45;min-width:0">${x}</span></div>`).join('')}
      ${foot('P05')}</div>`;
  } else if (role === 'stat') {
    cap = '数据页（新增）';
    inner = `<div class="pg" style="${base};justify-content:center;padding:0 14px;box-sizing:border-box;overflow:hidden">
      <div style="font-family:ui-monospace,monospace;font-size:46px;line-height:.85;letter-spacing:-.06em;color:${ac};font-weight:700">164</div>
      <div style="font-family:ui-monospace,monospace;font-size:9px;opacity:.6;margin-top:3px">套主题 / 49 种设计</div>
      <div style="margin:10px 0;height:3px;background:rgba(0,0,0,.10);position:relative;flex:none"><b style="position:absolute;left:0;top:0;bottom:0;width:68%;background:${ac}"></b></div>
      <div style="font-size:8px;line-height:1.65;opacity:.8">按设计手法归一后，164 套主题只落成 49 种不同的样子。</div>
      ${foot('P06')}</div>`;
  } else {
    cap = '引语页（新增）';
    inner = `<div class="pg" style="${base};justify-content:center;text-align:center;padding:0 16px;box-sizing:border-box;overflow:hidden">
      <div style="font-family:Georgia,serif;font-size:26px;line-height:.7;color:${ac};opacity:.5">“</div>
      <div style="font-size:11px;line-height:1.6;font-style:italic;margin:5px 0 10px">${ART.quote}</div>
      <div style="width:30px;height:2px;background:${ac};margin:0 auto;flex:none"></div>
      ${foot('P03')}</div>`;
  }
  return `<div class="lf"><div class="lf-page">${inner}</div><div class="lf-cap"><span>${cap}</span></div></div>`;
}

/* ══ 渲染各区域 ═════════════════════════════════════════ */
function renderPreview(){
  const t = themeById(state.theme) || themeById('ink');
  if (state.view === 'wechat') {
    $('#pv-title').textContent = '预览';
    $('#wx-title').textContent = ART.title;
    $('#preview').innerHTML = renderDoc(t);
    $('#char-count').textContent = SRC.length + ' 字';
  } else {
    $('#pv-title').textContent = '小红书长图文';
    $('#wx-title').textContent = '成套预览 · 6 页';
    $('#preview').innerHTML = `<div class="lf-wrap">
      <div class="lf-bar">页面角色 <b style="color:var(--text)">6</b> 种 · <span style="color:var(--accent)">4 种为本轮新增</span></div>
      <div class="lf-deck">${LF_ROLES.map(r => lfPage(r.id, t)).join('')}</div>
      <div style="font-size:11.5px;color:var(--text-muted)">翻页时结构真的在变（对照：现在 12 套模板共用同一套正文排版）</div>
    </div>`;
    $('#char-count').textContent = SRC.length + ' 字';
  }
  const caps = ['ink','su-biz-azure','su-letter-azure','su-night-azure','su-feast-gold','broadsheet','magazine','terracotta']
    .map(id => ALL.find(x => x.id === id)).filter(Boolean);
  $('#style-caps').innerHTML = caps.map(c =>
    `<button class="cap" data-skin="${c.id}" aria-pressed="${c.id===state.theme}"><i style="background:${c.accent}"></i>${c.name}</button>`).join('');
}

function renderLayouts(){
  const locked = isKit(state.theme);
  const cur = locked ? (KIT_BY_ID[state.theme].layout) : state.layout;
  $('#lay-count').textContent = LAYOUTS.length + ' 种' + (locked ? ' · 已锁定' : ' · 新增 4');
  $('#lay-grid').innerHTML = LAYOUTS.map(l =>
    `<button class="lay-item" data-lay="${l.id}" aria-pressed="${l.id===cur}" title="${l.tip}"
       ${locked ? 'disabled aria-disabled="true"' : ''}>
      <span class="lay-ic">${l.dgm.map(c=>`<i class="${c}"></i>`).join('')}</span>
      <span class="lay-nm">${l.nm}</span></button>`).join('');
  // 锁定态：说明行出现 + 整块置灰
  $('#kit-note').hidden = !locked;
  $('#lay-sec').classList.toggle('is-locked', locked);
}

function renderDecos(){
  $('#deco-grid').innerHTML = DECOS.map(d =>
    `<button class="lay-item" data-deco="${d.id}" aria-pressed="${d.id===state.deco}" title="${d.tip}">
      <span class="lay-ic" style="align-items:center;justify-content:center;font-size:11px;font-family:ui-monospace,monospace;color:var(--text-soft)">${d.id==='none'?'—':d.id==='kicker'?'≡':d.id==='mark'?'▁':'01'}</span>
      <span class="lay-nm">${d.nm}</span></button>`).join('');
}

function renderPals(){
  const fams = ['全部','公文','信笺','暮色','夜航','节庆','钢印','素页','经典'];
  const list = state.palFam === '全部' ? ALL : ALL.filter(m => m.fam === state.palFam);
  // kit 下色卡区同步真 disabled：只加 CSS 灰不够——点击仍会触发（实测过：
  // 164 个色点 dotsDisabledCount 为 0），用户换色发现样式没变会判定「坏了」。
  const locked = isKit(state.theme);
  const dis = locked ? 'disabled aria-disabled="true"' : '';
  // 分段后「配色 N 设计 / M 套」并到了色点名后面，不再单独占一行标题
  const cur0 = ALL.find(m => m.id === state.theme);
  $('#pal-name').textContent = locked
    ? ((cur0 ? cur0.name : '') + ' · 已锁定')
    : (cur0 ? cur0.name : '');
  $('#pal-dots').innerHTML = list.map(m =>
    `<button class="pdot" data-skin="${m.id}" aria-pressed="${m.id===state.theme}" ${dis}
       style="background:${m.accent}" title="${m.name}"></button>`).join('');
  const cur = cur0;
  $('#pal-name').textContent = cur ? cur.name : '';
  $('#pal-fams').innerHTML = fams.map(f =>
    `<button class="pal-fam" data-fam="${f}" aria-pressed="${f===state.palFam}" ${dis}>${f}</button>`).join('');
  document.querySelector('.pal-sec').classList.toggle('is-locked', locked);
  document.querySelector('.drawer-blocks').classList.toggle('is-locked', locked);
}

function renderGrid(){
  const q = ($('#drawer-search').value || '').trim().toLowerCase();
  const searching = !!q;
  const hit = (m) => !q || (m.name + ' ' + m.id + ' ' + (m.fam || '') + ' ' + (m.desc || ''))
    .toLowerCase().includes(q);

  /* ── 段 1：配色主题（49 张设计签名代表卡）── */
  const reps = GROUPS.map(g => ({ ...ALL.find(x => x.id === g.rep.id), count: g.members.length }));
  const paletteList = reps.filter(hit);
  $('#sub-palette-n').textContent = paletteList.length;
  $('#drawer-grid').innerHTML = paletteList.map(m => {
    const t = themeById(m.id);
    return `<button class="d-card" data-skin="${m.id}" aria-pressed="${m.id===state.theme}">
      <div class="thumb" style="background:${t.bg}">
        <div style="font-size:10.5px;font-weight:700;color:${t.ink};border-bottom:2px solid ${t.accent};padding-bottom:3px;margin-bottom:5px">标题示例</div>
        <div style="font-size:8.5px;line-height:1.7;color:${t.ink};opacity:.7">正文示例，观察字体与间距。</div></div>
      <div class="nm">${m.name}<span>${m.count>1?m.count+' 套同款':m.fam}</span></div></button>`;
  }).join('') || '<div class="grid-empty">没匹配的配色主题</div>';

  /* ── 段 2：整篇设计（15 套 kit，固定配色）── */
  const kitList = KITS.filter(hit);
  $('#sub-kit-n').textContent = kitList.length;
  $('#kit-grid').innerHTML = kitList.map(k => {
    const on = k.id === state.theme;
    return `<button class="d-card d-card--kit" data-skin="${k.id}" aria-pressed="${on}" title="${k.note}">
      <div class="thumb" style="background:${k.bg}">
        <div style="font-size:10.5px;font-weight:700;color:${k.ink};border-bottom:2px solid ${k.accent};padding-bottom:3px;margin-bottom:4px">标题示例</div>
        <div style="font-size:8.5px;line-height:1.6;color:${k.ink};opacity:.72">${k.note.split(' · ')[0]}</div>
      </div>
      <div class="nm">${k.name}<span class="kit-lock">锁定</span></div></button>`;
  }).join('') || '<div class="grid-empty">没匹配的整篇设计</div>';

  renderSubTabs(searching);
}

/* 二级切换：配色主题 / 整篇设计。
   ⚠️ 搜索时两段都显示（跨段搜）—— 否则在「配色主题」段搜「时代」得 0 命中，
      用户会以为整篇设计不存在。 */
function renderSubTabs(searching){
  const cur = state.styleTab;
  document.querySelectorAll('.sub-tab').forEach(t =>
    t.setAttribute('aria-pressed', String(!searching && t.dataset.styleTab === cur)));
  $('#sub-tabs').classList.toggle('is-search', !!searching);

  const showPalette = searching || cur === 'palette';
  const showKit = searching || cur === 'kit';
  // 搜索时：某段 0 命中就整段收起（连标题一起）。
  // 否则会出现「配色主题 0 / 整篇设计 1」，上面那一大块空网格把唯一结果挤到屏幕外。
  const palHit = $('#drawer-grid').querySelector('.d-card') !== null;
  const kitHit = $('#kit-grid').querySelector('.d-card') !== null;
  $('#sec-palette').hidden = searching ? !palHit : !showPalette;
  $('#sec-kit').hidden = searching ? !kitHit : !showKit;
  // 两段都没命中时给一条统一空态，别让抽屉全空
  const empty = $('#search-empty');
  if (empty) empty.hidden = !(searching && !palHit && !kitHit);
}

/* 分区切换：一次只显示一类，避免把主题卡挤没 */
function renderPanes(){
  const cur = state.pane;
  document.querySelectorAll('.seg-tab').forEach(t =>
    t.setAttribute('aria-pressed', String(t.dataset.pane === cur)));
  for (const p of ['style', 'layout', 'more']) {
    const el = document.getElementById('pane-' + p);
    if (el) el.hidden = (p !== cur);
  }
  // 版式标签上挂当前版式名，切到别的页也知道现在是哪套
  const k = KIT_BY_ID[state.theme];
  const curLay = k ? k.layout : state.layout;
  const nm = (LAYOUTS.find(l => l.id === curLay) || {}).nm || '默认';
  const tag = $('#tab-layout-cur');
  if (tag) tag.textContent = k ? '· 锁定' : '· ' + nm;
}

function render(){
  document.querySelectorAll('.cover-btn').forEach(b => b.setAttribute('aria-pressed', String(b.id === (state.view==='wechat'?'btn-editor':'btn-longform'))));
  renderPanes(); renderLayouts(); renderDecos(); renderPals(); renderGrid(); renderPreview();
}

/* ══ 事件 ═══════════════════════════════════════════════ */
document.addEventListener('click', (e) => {
  // 风格页二级：配色主题 / 整篇设计
  const sub = e.target.closest('[data-style-tab]');
  if (sub) {
    state.styleTab = sub.dataset.styleTab;
    localStorage.setItem('proto.styleTab', state.styleTab);
    renderSubTabs(false);
    return;
  }
  // 分区标签
  const tab = e.target.closest('[data-pane]');
  if (tab) {
    state.pane = tab.dataset.pane;
    localStorage.setItem('proto.pane', state.pane);
    renderPanes();
    return;
  }
  // 退出 kit：回到进 kit 前记住的那套 palette 主题
  if (e.target.closest('#kit-exit')) {
    const back = state.kitReturn && !isKit(state.kitReturn) ? state.kitReturn : 'ink';
    state.theme = back;
    localStorage.setItem('proto.skin', back);
    render();
    toast('已改回可组合版式：' + (ALL.find(x => x.id === back)?.name || back));
    return;
  }
  const lay = e.target.closest('[data-lay]');
  if (lay) {
    // kit 锁定：即使 disabled 被绕过（事件仍可能冒泡到 document），这里再拦一道
    if (isKit(state.theme)) { toast('这是整篇设计，版式已固定；点上方「改回可组合版式」可解锁'); return; }
    state.layout = lay.dataset.lay;
    localStorage.setItem('proto.layout', state.layout);
    render();
    toast('版式：' + LAYOUTS.find(l=>l.id===state.layout).nm);
    return;
  }
  const dec = e.target.closest('[data-deco]');
  if (dec) { state.deco = dec.dataset.deco; localStorage.setItem('proto.deco', state.deco); render(); toast('装饰：' + DECOS.find(d=>d.id===state.deco).nm); return; }
  const fam = e.target.closest('[data-fam]');
  if (fam) { state.palFam = fam.dataset.fam; renderPals(); return; }
  const sk = e.target.closest('[data-skin]');
  if (sk) {
    const next = sk.dataset.skin;
    // 进 kit 前记住当前 palette 主题（只在「当前不是 kit」时写，避免连续点两个 kit 覆盖记忆）
    if (!isKit(state.theme) && isKit(next)) {
      state.kitReturn = state.theme;
      localStorage.setItem('proto.kitReturn', state.theme);
    }
    // kit 下点色点：直接拦掉（色卡区已置灰，这里是双保险）
    if (isKit(state.theme) && !isKit(next)) {
      toast('这是整篇设计，配色已固定；先点「改回可组合版式」再换色');
      return;
    }
    state.theme = next;
    localStorage.setItem('proto.skin', next);
    // 选中什么就落在对应的二级标签上：选 kit 却不切过去，用户会以为界面没反应
    state.styleTab = isKit(next) ? 'kit' : 'palette';
    localStorage.setItem('proto.styleTab', state.styleTab);
    render();
    const m = KIT_BY_ID[next] || ALL.find(x => x.id === next);
    if (m) toast((isKit(next) ? '整篇设计：' : '配色：') + m.name);
    return;
  }
});

$('#btn-editor').addEventListener('click', () => { state.view='wechat'; localStorage.setItem('proto.view','wechat'); render(); });
$('#btn-longform').addEventListener('click', () => { state.view='long'; localStorage.setItem('proto.view','long'); render(); });
$('#btn-cover').addEventListener('click', () => toast('小红书标题图不在本原型范围（V2 方案已定稿）'));
$('#drawer-search').addEventListener('input', renderGrid);
$('#btn-themes').addEventListener('click', () => { $('#drawer').hidden = false; document.body.classList.add('browsing'); });
$('#btn-drawer-close').addEventListener('click', () => { $('#drawer').hidden = true; document.body.classList.remove('browsing'); });
$('#btn-demo').addEventListener('click', () => { $('#input').value = SRC; toast('已填入示例文章'); });
$('#btn-clear').addEventListener('click', () => { $('#input').value = ''; });
$('#btn-copy').addEventListener('click', () => toast('原型：复制走线上 copyRich，此处不接'));
$('#btn-mode').addEventListener('click', () => {
  $('#preview-wrap').classList.toggle('web');
  $('#btn-mode').textContent = $('#preview-wrap').classList.contains('web') ? '网页' : '手机';
});

$('#input').value = SRC;
render();
</script>
