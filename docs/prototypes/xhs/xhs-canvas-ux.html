<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小红书标题图 / 长图文 · 单画布 UX 原型</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   0. 设计令牌 —— 直接取真系统 pwa/src/style.css 的值，不另造一套
   ══════════════════════════════════════════════════════════════════ */
:root{
  --bg-canvas:#F7F4EE; --bg-surface:#FAF9F5; --bg-raised:#FFFFFF;
  --bg-hover:#F0EDE8; --bg-sunken:#F2EEE7;
  --border:#EAE6DD; --border-hi:#D8D2C6;
  --text:#191713; --text-soft:#6E6759; --text-muted:#9B9484;
  --accent:#AF3E2B; --accent-soft:rgba(175,62,43,.08); --accent-hi:rgba(175,62,43,.16);
  --ok:#5F8F73; --warn:#C08A2E;
  --r-sm:6px; --r:8px; --r-lg:12px; --r-xl:16px;
  --sh-1:0 1px 2px rgba(30,25,15,.05);
  --sh-2:0 2px 8px rgba(30,25,15,.07);
  --sh-3:0 8px 28px rgba(30,25,15,.12);
  --sh-sheet:0 -8px 32px rgba(30,25,15,.14);
  --top-h:56px;
  --art-w:1080; --art-h:1440;   /* 画布原始像素 */
  --k:1;                         /* 画布缩放比，JS 计算 */
}
*{box-sizing:border-box}
/* ⚠️ .film{display:flex} 会压过 [hidden] 的 UA 级 display:none —— 空态下会留 8px 空隙（实测踩过） */
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{
  background:var(--bg-canvas); color:var(--text);
  font:13.5px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::selection{background:var(--accent-hi)}

/* 封面字体：真系统里这四支是自托管的，原型直接引 dist 的同名文件 */
@font-face{font-family:'Noto Serif SC';font-weight:400;font-display:swap;
  src:url("../../../pwa/dist/fonts/cover/noto-serif-sc-400.woff2") format('woff2')}
@font-face{font-family:'Noto Sans SC';font-weight:400;font-display:swap;
  src:url("../../../pwa/dist/fonts/cover/noto-sans-sc-400.woff2") format('woff2')}
@font-face{font-family:'Noto Sans SC';font-weight:700;font-display:swap;
  src:url("../../../pwa/dist/fonts/cover/noto-sans-sc-700.woff2") format('woff2')}

/* ══════════════════════════════════════════════════════════════════
   1. 顶栏 —— 1:1 复刻真系统（pwa/index.html:29-61）
   ══════════════════════════════════════════════════════════════════ */
.top{
  height:var(--top-h); padding:0 16px; flex:none;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--bg-raised); border-bottom:1px solid var(--border);
  position:relative; z-index:20;
}
.top-left{display:flex;align-items:center;gap:8px;min-width:0}
.top-right{display:flex;align-items:center;gap:6px;flex:none}
.brand-mark{width:24px;height:24px;border-radius:6px;display:block;flex:none;
  box-shadow:0 0 0 1px rgba(20,18,14,.10)}
.brand{font-size:15px;font-weight:700;white-space:nowrap}
.brand-tail{font-weight:400;font-size:12.5px;color:var(--text-soft);margin-left:4px}
.brand-sub{font-size:12px;color:var(--text-muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;margin-left:4px}

.cover-btn{
  height:32px;padding:0 12px;border-radius:var(--r);white-space:nowrap;
  color:var(--accent);font-size:12.5px;font-weight:600;
  border:1px solid rgba(175,62,43,.28);background:var(--accent-soft);
  display:inline-flex;align-items:center;gap:5px;
  transition:background .15s,color .15s,border-color .15s;
}
.cover-btn::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.cover-btn:hover{background:rgba(175,62,43,.14);border-color:var(--accent)}
.cover-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.cover-btn[aria-pressed="true"]::before{background:#fff}

.engine-badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:99px;font-size:12px;color:var(--text-soft);
  background:var(--bg-surface);border:1px solid var(--border);white-space:nowrap}
.engine-badge i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.icon-btn{width:30px;height:30px;border-radius:var(--r);color:var(--text-soft);
  font-size:15px;display:grid;place-items:center}
.icon-btn:hover{background:var(--bg-hover);color:var(--text)}
.menu-btn{height:30px;padding:0 10px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--bg-raised);color:var(--text-soft);font-size:13px;white-space:nowrap}
.menu-btn:hover{background:var(--bg-hover);color:var(--text)}

/* ══════════════════════════════════════════════════════════════════
   2. 主体三段：命令栏 / 画布 / 动作栏
   去掉左右两栏 —— 这是本方案最大的结构改动
   ══════════════════════════════════════════════════════════════════ */
.app{height:100%;display:flex;flex-direction:column}
.body{flex:1;min-height:0;display:flex;flex-direction:column}

/* ── 2.1 命令栏：输入 + 三个参数 + 主按钮，全在这一条里 ── */
.composer-wrap{padding:14px 16px 0;flex:none;display:flex;justify-content:center}
.composer{
  width:100%;max-width:920px;background:var(--bg-raised);
  border:1px solid var(--border);border-radius:var(--r-xl);
  box-shadow:var(--sh-2);overflow:hidden;
  transition:box-shadow .18s,border-color .18s;
}
.composer:focus-within{border-color:var(--border-hi);box-shadow:var(--sh-3)}
.cm-head{display:flex;align-items:center;gap:8px;padding:9px 14px 0}
.cm-tag{width:20px;height:20px;border-radius:5px;background:var(--bg-sunken);
  color:var(--text-soft);font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none}
.cm-label{font-size:11.5px;font-weight:600;color:var(--text-muted);letter-spacing:.03em}
.cm-count{margin-left:auto;font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.cm-input{
  width:100%;border:0;outline:0;background:none;resize:none;
  padding:4px 14px 2px;font-size:16px;line-height:1.5;font-weight:600;
  min-height:44px;max-height:132px;display:block;
}
.cm-input::placeholder{color:var(--text-muted);font-weight:400;font-size:13.5px}
/* ── 文章条（长文用）：一行摘要 + 编辑入口 ── */
.cm-article{
  display:flex;align-items:center;gap:10px;padding:8px 14px 6px;min-height:46px;
}
.art-line{min-width:0;flex:1}
.art-title{
  display:block;font-size:15px;font-weight:600;line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.art-title.empty{color:var(--text-muted);font-weight:400}
.art-meta{display:block;font-size:11px;color:var(--text-muted);
  margin-top:1px;font-variant-numeric:tabular-nums}
.art-edit{
  flex:none;height:30px;padding:0 12px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--bg-surface);
  font-size:12px;color:var(--text-soft);white-space:nowrap;
}
.art-edit:hover{border-color:var(--border-hi);background:var(--bg-hover);color:var(--text)}
.cm-foot{display:flex;align-items:center;gap:6px;padding:4px 10px 9px;flex-wrap:wrap}
.cm-tools{display:flex;align-items:center;gap:2px;margin-left:2px}
.cm-tool{height:26px;padding:0 8px;border-radius:var(--r-sm);font-size:11.5px;color:var(--text-muted);
  display:inline-flex;align-items:center;gap:4px}
.cm-tool:hover{background:var(--bg-hover);color:var(--text)}

/* ── 2.2 胶囊：入口 + 当前值，一颗顶两块 ── */
.cap{
  height:30px;padding:0 9px 0 10px;border-radius:99px;
  border:1px solid var(--border);background:var(--bg-surface);
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-soft);
  transition:border-color .15s,background .15s,color .15s;
}
.cap:hover{border-color:var(--border-hi);background:var(--bg-hover)}
.cap[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cap .k{color:var(--text-muted);font-size:11.5px}
.cap[aria-expanded="true"] .k{color:rgba(175,62,43,.62)}
.cap .v{color:var(--text);font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap[aria-expanded="true"] .v{color:var(--accent)}
.cap .dot{width:14px;height:14px;border-radius:4px;flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
.cap .chev{color:var(--text-muted);font-size:9px;margin-left:-1px}

/* ── 2.3 画布：主角 ── */
.stage{
  flex:1;min-height:0;position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:10px 16px 18px;gap:14px;
  /* 极淡的径向晕影：让两侧留白读作「桌面」而不是「没做完」 */
  background:radial-gradient(ellipse 62% 78% at 50% 46%,
    rgba(255,255,255,.62) 0%,rgba(255,255,255,0) 62%),
    var(--bg-canvas);
}
.stage-inner{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0;max-height:100%}
.cv-wrap{
  position:relative;flex:none;border-radius:2px;overflow:hidden;
  box-shadow:0 1px 2px rgba(30,25,15,.10),0 12px 40px rgba(30,25,15,.14);
  background:#fff;
}
#cv-art{position:absolute;left:0;top:0;width:100%;height:100%}
.cv-art{width:1080px;height:1440px;transform-origin:top left;position:absolute;left:0;top:0}
.cv-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-muted);
  font-variant-numeric:tabular-nums;height:16px}
.cv-meta button{color:var(--text-soft);text-decoration:underline;text-underline-offset:2px}
.cv-meta button:hover{color:var(--accent)}
.dot-sep{color:var(--border-hi)}
.cm-save{margin-left:auto;flex:none}
/* 托盘出现时画布让位：托盘是 fixed，不参与布局，
   所以用 padding 把画布挤上去 —— 否则正好盖住底部的标题（实测 59px 遮挡） */
.app.tray-open .stage{padding-bottom:112px}
/* 定影动画：点保存时画布闪一下，暗示「正在出片」 */
.cv-wrap.flash::after{
  content:"";position:absolute;inset:0;background:#fff;pointer-events:none;
  animation:flash .55s ease-out forwards;
}
@keyframes flash{0%{opacity:.9}60%{opacity:.35}100%{opacity:0}}

/* 长文翻页箭头 */
.pg-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);
  border:1px solid var(--border);color:var(--text-soft);font-size:16px;
  display:grid;place-items:center;box-shadow:var(--sh-2);z-index:5;
}
.pg-btn:hover{background:#fff;color:var(--accent);border-color:var(--border-hi)}
.pg-btn[disabled]{opacity:.32;pointer-events:none}
.pg-prev{left:-46px}.pg-next{right:-46px}

/* 长文胶片条 */
.film{
  flex:none;display:flex;gap:8px;overflow-x:auto;padding:2px 4px 6px;
  max-width:100%;scrollbar-width:thin;
}
.film::-webkit-scrollbar{height:6px}
.film::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:3px}
.film-item{
  position:relative;flex:none;border-radius:4px;overflow:hidden;
  border:2px solid transparent;background:#fff;box-shadow:var(--sh-1);
  transition:border-color .15s,transform .15s;
}
.film-item:hover{transform:translateY(-1px)}
.film-item[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.film-item .n{
  position:absolute;left:3px;bottom:3px;font-size:9px;font-weight:600;color:#fff;
  background:rgba(20,18,14,.72);padding:0 4px;border-radius:3px;letter-spacing:.04em;
}
.film-item .n.cover{background:var(--accent)}

/* ── 2.4 动作条：贴在命令栏右端（不占一整行 64px 的底栏）── */
.actions{
  flex:none;display:flex;align-items:center;gap:6px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:var(--bg-canvas);
}
.act-ghost{height:30px;padding:0 10px;border-radius:var(--r);font-size:11.5px;color:var(--text-muted);
  display:inline-flex;align-items:center;gap:5px}
.act-ghost:hover{background:var(--bg-hover);color:var(--text)}
.act-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.act-hint{font-size:11px;color:var(--text-muted)}
.btn-primary{
  height:38px;padding:0 18px;border-radius:var(--r-lg);
  background:var(--accent);color:#fff;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 2px 8px rgba(175,62,43,.22);
  transition:background .15s,transform .12s,box-shadow .15s;
}
.btn-primary:hover{background:#9C3524;box-shadow:0 4px 14px rgba(175,62,43,.28)}
.btn-primary:active{transform:translateY(1px)}
.btn-primary[disabled]{background:var(--border-hi);color:#fff;box-shadow:none;pointer-events:none}

/* ══════════════════════════════════════════════════════════════════
   3. 弹层（sheet）—— 所有设置的去处。刻意做成「不遮画布」
   ══════════════════════════════════════════════════════════════════ */
.mask{
  position:fixed;inset:0;background:rgba(25,23,19,.32);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s;
  -webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px);
}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);
  width:100%;max-width:880px;max-height:min(70vh,620px);z-index:41;
  background:var(--bg-raised);border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--sh-sheet);display:flex;flex-direction:column;
  transition:transform .26s cubic-bezier(.32,.72,.28,1);
}
.sheet.on{transform:translate(-50%,0)}
.sheet-grip{height:14px;display:grid;place-items:center;flex:none}
.sheet-grip i{width:36px;height:4px;border-radius:2px;background:var(--border-hi)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:0 16px 10px;flex:none}
.sheet-title{font-size:14px;font-weight:700}
.sheet-sub{font-size:11.5px;color:var(--text-muted);margin-left:2px}
.sheet-x{margin-left:auto;width:28px;height:28px;border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--text-muted);font-size:15px}
.sheet-x:hover{background:var(--bg-hover);color:var(--text)}
.sheet-body{overflow-y:auto;padding:0 16px 18px;min-height:0}
.sheet-foot{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}

/* ── 3.1 配图面板 ── */
.tabs3{display:flex;gap:6px;padding:2px 0 12px}
.tab3{flex:1;height:34px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--bg-surface);font-size:12.5px;color:var(--text-soft);
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tab3[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.tab3 .badge{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:99px;
  background:var(--accent);color:#fff}

.search-row{display:flex;gap:6px;margin-bottom:10px}
.search-field{flex:1;height:36px;border:1px solid var(--border);border-radius:var(--r);
  background:var(--bg-surface);padding:0 10px;font-size:13px;outline:0}
.search-field:focus{border-color:var(--border-hi);box-shadow:0 0 0 3px var(--accent-soft)}
.btn-sm{height:36px;padding:0 14px;border-radius:var(--r);font-size:12.5px;font-weight:600;
  background:var(--text);color:#fff;display:inline-flex;align-items:center;gap:5px}
.btn-sm:hover{opacity:.88}
.btn-sm.ghost{background:var(--bg-raised);color:var(--text-soft);border:1px solid var(--border)}
.btn-sm.ghost:hover{background:var(--bg-hover);color:var(--text);opacity:1}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;
  border:2px solid transparent;background:var(--bg-sunken)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.photo .nm{position:absolute;left:0;right:0;bottom:0;padding:14px 7px 5px;
  font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(20,18,14,.78))}
.photo .tag{position:absolute;top:6px;left:6px;font-size:9.5px;font-weight:700;
  padding:1px 5px;border-radius:99px;background:rgba(255,255,255,.92);color:#5C5446}
.photo:hover img{transform:scale(1.03);transition:transform .3s}
.sheet-note{font-size:11.5px;color:var(--text-muted);line-height:1.6;margin:10px 0 0}

/* ── 3.2 版式面板：缩略图用「你自己的文案」实时渲染 ── */
.layout-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.lay{text-align:left}
.lay-thumb{
  position:relative;border-radius:var(--r);overflow:hidden;background:#fff;
  border:2px solid transparent;box-shadow:var(--sh-1);
  transition:border-color .15s,box-shadow .15s,transform .15s;
}
/* 缩略图里的画布：宽高写死 1080×1440（与真画布同一套渲染），再按容器宽度整体 scale */
.thumb-art{position:absolute;left:0;top:0;transform-origin:top left}
/* 不满足前提内容的版式：缩略图去饱和 + 灰纱，一眼看出「现在用不了」 */
.lay[disabled]{cursor:not-allowed}
.lay-off{opacity:.45;filter:grayscale(.75)}
.lay[disabled] .lay-desc{color:var(--warn)}
.lay:hover .lay-thumb{transform:translateY(-1px);box-shadow:var(--sh-2)}
.lay[aria-pressed="true"] .lay-thumb{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lay-name{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:12px;font-weight:600}
.lay-desc{font-size:11px;color:var(--text-muted);line-height:1.45;margin-top:1px}
.lay[aria-pressed="true"] .lay-name{color:var(--accent)}
.lay-badge{font-size:9px;font-weight:700;padding:0 4px;border-radius:3px;
  background:var(--bg-sunken);color:var(--text-muted)}
.lay-sec{font-size:11.5px;font-weight:700;color:var(--text-soft);letter-spacing:.06em;
  margin:16px 0 9px;display:flex;align-items:center;gap:8px}
.lay-sec::after{content:"";flex:1;height:1px;background:var(--border)}

/* ── 3.3 文字面板 ── */
.row-label{font-size:11.5px;font-weight:600;color:var(--text-soft);margin:14px 0 7px;
  display:flex;align-items:center;gap:8px}
.row-label .hint{font-weight:400;color:var(--text-muted)}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--border);
  background:var(--bg-surface);font-size:12px;color:var(--text-soft);
  display:inline-flex;align-items:center;gap:5px;
}
.chip:hover{border-color:var(--border-hi);background:var(--bg-hover)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip .mini-dot{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.field{height:34px;width:100%;border:1px solid var(--border);border-radius:var(--r);
  background:var(--bg-surface);padding:0 10px;font-size:13px;outline:0}
.field:focus{border-color:var(--border-hi);box-shadow:0 0 0 3px var(--accent-soft)}
.switch{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-soft);
  padding:7px 0;cursor:pointer}
.switch input{width:16px;height:16px;accent-color:var(--accent)}

/* 尺寸 */
.size-row{display:flex;gap:8px}
.size{flex:1;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-surface);
  padding:9px 8px;text-align:center;font-size:12px;color:var(--text-soft)}
.size b{display:block;font-size:12.5px;color:var(--text);margin-bottom:2px}
.size[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.size[aria-pressed="true"] b{color:var(--accent)}
.size[disabled]{opacity:.42;pointer-events:none}

/* ══════════════════════════════════════════════════════════════════
   4. 出片托盘 —— 「生成」与「下载」是两个明确动作
   ══════════════════════════════════════════════════════════════════ */
.tray{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);
  width:calc(100% - 24px);max-width:840px;z-index:42;
  background:var(--bg-raised);border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--sh-sheet);padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  transition:transform .28s cubic-bezier(.32,.72,.28,1);
  display:flex;align-items:center;gap:12px;
}
.tray.on{transform:translate(-50%,0)}
.tray-thumb{width:52px;height:69px;border-radius:5px;overflow:hidden;flex:none;
  background:var(--bg-sunken);box-shadow:var(--sh-1);position:relative}
.tray-thumb .cv-art{transform-origin:top left}
.tray-info{min-width:0;flex:1}
.tray-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.tray-title .ok{width:15px;height:15px;border-radius:50%;background:var(--ok);color:#fff;
  font-size:9px;display:grid;place-items:center;flex:none}
.tray-sub{font-size:11.5px;color:var(--text-muted);margin-top:1px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray-acts{display:flex;align-items:center;gap:6px;flex:none}
.tray-x{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:var(--r-sm);
  color:var(--text-muted);font-size:13px;display:grid;place-items:center}
.tray-x:hover{background:var(--bg-hover);color:var(--text)}

/* 全屏文章编辑层 */
.art-full{
  width:100%;height:min(56vh,440px);min-height:220px;resize:none;
  border:1px solid var(--border);border-radius:var(--r);
  background:var(--bg-surface);padding:12px 14px;outline:0;
  font-size:13.5px;line-height:1.78;
}
.art-full:focus{border-color:var(--border-hi);box-shadow:0 0 0 3px var(--accent-soft)}
.art-foot{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11.5px;color:var(--text-muted)}
.art-hint{margin-left:auto}

/* ══════════════════════════════════════════════════════════════════
   5. 灯箱 / 九宫格 / toast
   ══════════════════════════════════════════════════════════════════ */
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(18,16,13,.90);
  display:none;align-items:center;justify-content:center;padding:24px}
.lightbox.on{display:flex}
.lightbox-inner{position:relative;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.lightbox-x{position:absolute;right:-8px;top:-40px;width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:15px}
.lightbox-x:hover{background:rgba(255,255,255,.26)}

.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:min(62vh,420px);margin:0 auto}
.nine-cell{position:relative;aspect-ratio:1;overflow:hidden;border-radius:2px;background:#fff}
.nine-cell .cv-art{transform-origin:top left}
.nine-note{font-size:11.5px;color:var(--text-muted);text-align:center;margin-top:12px;line-height:1.6}

.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,8px);
  background:rgba(25,23,19,.92);color:#fff;font-size:12.5px;
  padding:9px 15px;border-radius:99px;z-index:70;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;max-width:82vw;text-align:center;
  box-shadow:0 6px 22px rgba(0,0,0,.22);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#8E2A1B}

/* ══════════════════════════════════════════════════════════════════
   6. 空态 / 说明面板
   ══════════════════════════════════════════════════════════════════ */
.empty-art{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;width:100%;height:100%;background:var(--bg-surface);
  border:1px dashed var(--border-hi);color:var(--text-muted);font-size:12.5px;text-align:center;padding:40px}

.note-list{display:flex;flex-direction:column;gap:0}
.note-item{padding:11px 0;border-bottom:1px solid var(--border)}
.note-item:last-child{border-bottom:0}
.note-item b{display:block;font-size:12.5px;margin-bottom:3px}
.note-item span{font-size:12px;color:var(--text-soft);line-height:1.65}

/* ══════════════════════════════════════════════════════════════════
   7. 封面画布渲染 —— 坐标系是「真实输出像素」（1080×1440 / 1080×1080 / 2100×900）
   所有位置与字号都按 W/H 比例算，所以三种尺寸共用同一套版式函数
   ══════════════════════════════════════════════════════════════════ */
.cv-art{
  position:absolute;left:0;top:0;overflow:hidden;
  font-family:'Noto Serif SC',serif;color:var(--ink);background:var(--paper);
}
.cv-art.sans{font-family:'Noto Sans SC',sans-serif}
.cv-art .ph{position:absolute;object-fit:cover;display:block}
.cv-art .veil{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none}
.cv-art .scrim{position:absolute;left:0;right:0;pointer-events:none}
.cv-art .blk{position:absolute;left:8.15%;right:8.15%}
.cv-art .ttl{
  font-weight:500;letter-spacing:.02em;line-height:1.18;margin:0;
  word-break:break-word;text-wrap:balance;
}
/* 压在照片上的文字：scrim 管 90%，投影只补笔画边缘那 10%（design §5 铁律 3）。
   0 0 18px 而不是 2px 2px —— 硬投影会让笔画发虚，模糊半径大才是「衬底」效果。 */
.cv-art .onphoto{text-shadow:0 1px 18px rgba(8,7,6,.34),0 0 3px rgba(8,7,6,.22)}
.cv-art .sub{line-height:1.62;color:var(--muted);text-wrap:pretty}
.cv-art .kick{
  font-family:'Noto Sans SC',sans-serif;font-weight:500;
  letter-spacing:.2em;color:var(--accentText);
}
.cv-art .auth{color:var(--muted);letter-spacing:.06em}
.cv-art .bar{background:var(--accent)}
.cv-art .rule{background:var(--line)}

/* 长文内页 */
.cv-art .pg-head,.cv-art .pg-foot{
  position:absolute;left:8.15%;right:8.15%;
  display:flex;align-items:center;justify-content:space-between;
  font-family:'Noto Sans SC',sans-serif;letter-spacing:.18em;
  color:var(--accentText);
}
.cv-art .pg-body{position:absolute;left:8.15%;right:8.15%}
.cv-art .pg-body p{margin:0 0 43px;line-height:1.74;text-wrap:pretty}
.cv-art .pg-body p:last-child{margin-bottom:0}
.cv-art .pg-body h3{
  margin:0 0 30px;font-weight:600;line-height:1.36;color:var(--ink);
}
.cv-art .pg-body .item{
  display:flex;gap:26px;margin-bottom:34px;line-height:1.6;
}
.cv-art .pg-body .item .num{
  flex:none;font-weight:600;color:var(--accentText);
  font-variant-numeric:tabular-nums;
}
.cv-art .pg-deco{position:absolute;color:var(--accent);pointer-events:none}
.cv-art .bgline{position:absolute;inset:0;pointer-events:none}

/* ══════════════════════════════════════════════════════════════════
   8. 响应式：≤640 单栏，画布仍居中，弹层变全高
   ══════════════════════════════════════════════════════════════════ */

  .cm-input{font-size:15px;min-height:46px}
  .cm-input.long{font-size:13px}
  .sheet{max-height:88vh;border-radius:var(--r-xl) var(--r-xl) 0 0;max-width:100%}
  .layout-grid{grid-template-columns:repeat(2,1fr);gap:10px}

}

  .composer-wrap{padding-top:8px}
  .film{display:none}
}

<script>
/* ══════════════════════════════════════════════════════════════════════
   单画布 UX 原型 · 交互内核
   目标不是复刻渲染精度（那是 pwa/src/cover 的事），而是把「流程」跑通：
   输入 → 三颗胶囊调参 → 画布实时变 → 保存 → 出片托盘。
   ══════════════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);

/* ── 尺寸 ── */
const SIZES = {
  xhs:    { w:1080, h:1440, label:'3:4',   hint:'1080×1440' },
  square: { w:1080, h:1080, label:'1:1',   hint:'1080×1080' },
  wide:   { w:2100, h:900,  label:'21:9',  hint:'2100×900'  },
};

/* ── 8 套色板（值取自 docs/design-xhs-studio-redesign.md §11.6 全表）
      accent 只用于色块/细线；文字一律 accentText —— 柠檬黄当字只有 1.35:1 */
const PALS = [
  { key:'dune',     name:'沙丘暖纸', paper:'#f0e6d2', ink:'#1f1a14', muted:'#6f6557',
    accent:'#8f7650', accentText:'#6b5334', line:'rgba(31,26,20,.20)', dark:false },
  { key:'forest',   name:'森林墨绿', paper:'#f5f1e8', ink:'#16211b', muted:'#5c6a60',
    accent:'#2e6b4f', accentText:'#2e6b4f', line:'rgba(22,33,27,.18)', dark:false },
  { key:'indigo',   name:'靛蓝瓷白', paper:'#f2f4f5', ink:'#161c26', muted:'#5b6675',
    accent:'#315d93', accentText:'#315d93', line:'rgba(22,28,38,.16)', dark:false },
  { key:'kraft',    name:'牛皮纸',   paper:'#eedfc7', ink:'#241c12', muted:'#6b5b42',
    accent:'#9b5a2e', accentText:'#7c4520', line:'rgba(36,28,18,.22)', dark:false },
  { key:'midnight', name:'午夜墨金', paper:'#0e0d0c', ink:'#f0e9db', muted:'#9a917f',
    accent:'#d4a04a', accentText:'#d4a04a', line:'rgba(240,233,219,.16)', dark:true },
  { key:'ikb',      name:'克莱因蓝', paper:'#fafaf8', ink:'#111111', muted:'#6b6b66',
    accent:'#002FA7', accentText:'#002FA7', line:'rgba(17,17,17,.16)', dark:false },
  { key:'lemon',    name:'柠檬黄',   paper:'#fafaf8', ink:'#111111', muted:'#6b6b66',
    accent:'#C5E803', accentText:'#4F5A00', line:'rgba(17,17,17,.16)', dark:false },
  { key:'orange',   name:'安全橙',   paper:'#fafaf8', ink:'#111111', muted:'#6b6b66',
    accent:'#FF6B35', accentText:'#A6390A', line:'rgba(17,17,17,.16)', dark:false },
];
const palOf = (k) => PALS.find(p => p.key === k) || PALS[0];

/* ── 版式：needImg 决定「不要图」时是否可选 —— 这是本方案的一条硬规则 ── */
const LAYS = [
  { id:'image-led', name:'全出血',  desc:'图铺满，标题压底部',        needImg:true  },
  { id:'magazine',  name:'刊头',    desc:'图占顶部 36%，文字在下',    needImg:true  },
  { id:'split',     name:'左文右图', desc:'左 56% 纸面，右 44% 竖图',  needImg:true  },
  { id:'card',      name:'卡片浮层', desc:'图铺满 + 白卡承载文字',     needImg:true  },
  { id:'swiss',     name:'瑞士极简', desc:'白纸细体大字，左对齐',      needImg:false },
  { id:'bigtype',   name:'大字报',  desc:'垂直居中，字号最大',        needImg:false },
  { id:'quote',     name:'金句',    desc:'居中大字 + 引号 + 署名',    needImg:false },
  { id:'number',    name:'编号大字', desc:'超大数字当主视觉',          needImg:false },
  { id:'list',      name:'清单',    desc:'标题 + 编号条目',           needImg:false },
];
const layOf = (id) => LAYS.find(l => l.id === id) || LAYS[0];

/* ── 字体 / 文字玩法（与 textmode.js 的目录同口径，玩法只留 3 档）── */
const FONTS = [
  { id:'auto',  name:'跟随版式', family:"'Noto Serif SC'", note:'衬线，有书卷气' },
  { id:'sans',  name:'思源黑体', family:"'Noto Sans SC'",  note:'中性现代，最百搭' },
  { id:'serif', name:'思源宋体', family:"'Noto Serif SC'", note:'衬线，正式感' },
];
const TMODES = [
  { id:'stack',  name:'默认',     note:'沿用版式原本的排法' },
  { id:'poster', name:'大字压阵', note:'字号撑到极限，冲击强' },
  { id:'vertical', name:'竖排',   note:'自上而下，中式古典' },
];

/* ── 照片：亮度分析在运行时真算（缩到 108×144 画进 canvas，逐带取 mean/sd）── */
const PHOTOS = [
  { id:'p1', name:'海边雾晨', src:'../../../public/images/09-snow-bike.jpg'  },
  { id:'p2', name:'山野秋千', src:'../../../public/images/05-swing.jpg'      },
  { id:'p3', name:'夜街路灯', src:'../../../public/images/02-night-street.jpg' },
  { id:'p4', name:'桌灯',     src:'../../../public/images/06-desk-lamp.jpg'  },
  { id:'p5', name:'校车',     src:'../../../public/images/03-school-bus.jpg' },
  { id:'p6', name:'收音机',   src:'../../../public/images/07-radio.jpg'      },
];
const photoOf = (id) => PHOTOS.find(p => p.id === id) || PHOTOS[0];

/* ── 状态 ── */
const state = {
  mode:'title',          // title | long
  size:'xhs',
  pal:'dune',
  lay:'image-led',
  font:'auto',
  tmode:'stack',
  imgMode:'search',      // search | upload | color
  photo:'p1',
  photos:[],             // 搜索结果（原型里直接用本地 6 张）
  text:'',
  // 长文
  longText:'',
  tpl:'editorial',
  page:0,
  pages:[],
  pn:true,
  sign:'',
};
const analysisCache = new Map();

/* ══════════════════════════════════════════════════════════════════════
   1. 工具
   ══════════════════════════════════════════════════════════════════════ */
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chars = (s) => [...String(s)];
const now = () => performance.now();

function toast(msg, err) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast' + (err ? ' err' : ''); }, 2400);
}

/* 标题自适应：按字数反算字号，宁降字号也不让标题爆版 */
function fitTitle(text, boxW, base, maxLines = 3) {
  const n = Math.max(1, chars(text).length);
  for (let size = base; size > base * 0.55; size -= 2) {
    const cpl = Math.max(1, Math.floor(boxW / size));
    if (Math.ceil(n / cpl) <= maxLines) return size;
  }
  return Math.round(base * 0.55);
}
/* 小字换行估算（用于算文字带高度） */
const subLines = (text, boxW, size) => Math.max(1, Math.ceil(chars(text).length / Math.max(1, Math.floor(boxW / (size * 0.96)))));

/* ══════════════════════════════════════════════════════════════════════
   2. 底图可读性：与 analyze.js 同口径（sRGB 空间反解 α，封顶 0.30，busy 优先）
   ══════════════════════════════════════════════════════════════════════ */
const toLin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
const invLin = (L) => 255 * (L <= 0.0031308 ? L * 12.92 : 1.055 * Math.pow(L, 1 / 2.4) - 0.055);
const relLum = (r, g, b) => 0.2126 * toLin(r) + 0.7152 * toLin(g) + 0.0722 * toLin(b);
const SCRIM_SRGB = 10;
const MAX_ALPHA = 0.30;
const NEED_CR = 4.5;
const BUSY_SD = 0.15;

function alphaForL(L) {
  const sMax = invLin(L);
  const targetS = invLin(0.1833);      // 白字达 4.5:1 所需的底亮度上限
  return Math.max(0, (sMax - targetS) / Math.max(1, sMax - SCRIM_SRGB));
}
function scrimmedLum(L, a) {
  if (a <= 0) return L;
  const s = invLin(L);
  return toLin(s * (1 - a) + SCRIM_SRGB * a);
}
const contrast = (a, b) => (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
const INK_DARK = relLum(28, 26, 22);
const WHITE = 1;

/* 逐带实测：把图缩到 108×144 画进 canvas，按 10 带算 mean / sd */
async function analyze(src) {
  if (analysisCache.has(src)) return analysisCache.get(src);
  const p = new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const W = 108, H = 144;
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const cx = cv.getContext('2d', { willReadFrequently:true });
      // 按 object-fit:cover 居中裁切
      const ir = img.width / img.height, cr = W / H;
      let sw = img.width, sh = img.height, sx = 0, sy = 0;
      if (ir > cr) { sw = img.height * cr; sx = (img.width - sw) / 2; }
      else { sh = img.width / cr; sy = (img.height - sh) / 2; }
      cx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
      const d = cx.getImageData(0, 0, W, H).data;
      const bands = [], sds = [];
      for (let b = 0; b < 10; b++) {
        const y0 = Math.floor(b * H / 10), y1 = Math.floor((b + 1) * H / 10);
        let sum = 0, sum2 = 0, n = 0, max = 0, min = 1;
        for (let y = y0; y < y1; y++) {
          for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            const L = relLum(d[i], d[i + 1], d[i + 2]);
            sum += L; sum2 += L * L; n++;
            if (L > max) max = L;
            if (L < min) min = L;
          }
        }
        const mean = sum / n;
        bands.push(+mean.toFixed(4));
        sds.push(+Math.sqrt(Math.max(0, sum2 / n - mean * mean)).toFixed(4));
      }
      resolve({ bands, sds });
    };
    img.onerror = () => reject(new Error('图片加载失败'));
    img.src = src;
  });
  const r = await p;
  analysisCache.set(src, r);
  return r;
}

/* 四种判定（顺序硬性：先什么都不做 → 再试黑字 → 最后才压暗） */
function judge(an, zone) {
  const i0 = Math.max(0, Math.floor(zone[0] * 10));
  const i1 = Math.min(9, Math.ceil(zone[1] * 10) - 1);
  let maxL = 0, minL = 1, sd = 0, mean = 0, n = 0;
  for (let i = i0; i <= i1; i++) {
    maxL = Math.max(maxL, an.bands[i]);
    minL = Math.min(minL, an.bands[i]);
    sd = Math.max(sd, an.sds[i]);
    mean += an.bands[i]; n++;
  }
  mean /= Math.max(1, n);
  const busy = sd > BUSY_SD;
  const whiteCR = contrast(WHITE, maxL);
  const blackCR = contrast(minL, INK_DARK);
  if (!busy && whiteCR >= NEED_CR) return { ink:'#fff', alpha:0, verdict:'免压暗', cr:whiteCR, busy };
  if (!busy && blackCR >= NEED_CR) return { ink:'#1f1a14', alpha:0, verdict:'免压暗', cr:blackCR, busy };
  const a = alphaForL(maxL);
  if (!busy && a <= MAX_ALPHA) return { ink:'#fff', alpha:a, verdict:'轻压暗', cr:contrast(WHITE, scrimmedLum(maxL, a)), busy };
  return { ink:'#fff', alpha:0, verdict:'建议换版式', cr:whiteCR, busy, unfit:true };
}

/* ══════════════════════════════════════════════════════════════════════
   3. 标题图渲染器
   ══════════════════════════════════════════════════════════════════════ */
function artStyle(W, H, pal, extra = '') {
  return `width:${W}px;height:${H}px;`
    + `--paper:${pal.paper};--ink:${pal.ink};--muted:${pal.muted};`
    + `--accent:${pal.accent};--accentText:${pal.accentText};--line:${pal.line};` + extra;
}
/* 文字玩法 → 附加 CSS（只作用于标题，不碰正文） */
function tmodeCss(mode) {
  if (mode === 'poster') return '.ttl{line-height:.96 !important;font-weight:900 !important;letter-spacing:-.01em !important}';
  if (mode === 'vertical') return '.ttl{writing-mode:vertical-rl;text-orientation:upright;line-height:1.15;letter-spacing:.06em;max-height:78%;margin-left:auto;margin-right:auto}';
  return '';
}

function coverHtml(W, H, o) {
  const pal = palOf(state.pal);
  const S = W / 1080;
  const pad = 88 * S;
  const boxW = W - pad * 2;
  const fontFam = FONTS.find(f => f.id === state.font).family;
  const isSans = (state.font === 'sans') || o.lay === 'swiss';
  const ff = state.font === 'auto' ? (o.lay === 'swiss' ? "'Noto Sans SC'" : "'Noto Serif SC'") : fontFam;

  const title = o.title || '';
  const sub = o.sub || '';
  const auth = o.auth || '';
  const kick = o.kick || '';
  const photo = o.photo || '';
  const an = o.an || null;

  const titleEl = (size, cls = '') =>
    `<h1 class="ttl ${cls}" style="font-size:${size}px;${cls === 'onPhoto' ? `color:${o.ink || '#fff'}` : ''}">${esc(title)}</h1>`;
  const subEl = (size, extra = '') =>
    sub ? `<div class="sub" style="font-size:${size}px;margin-top:${Math.round(size * 0.72)}px;${extra}">${esc(sub)}</div>` : '';
  const authEl = (size, extra = '') =>
    auth ? `<div class="auth" style="font-size:${size}px;margin-top:${Math.round(size * 0.9)}px;${extra}">${esc(auth)}</div>` : '';

  let body = '';

  if (o.lay === 'image-led' || o.lay === 'card') {
    /* C2 全出血 / C5 卡片浮层 */
    const tSize = fitTitle(title, boxW * 0.96, 108 * S, 3);
    const sSize = 36 * S;
    const blockH = (title ? (Math.ceil(chars(title).length / Math.max(1, Math.floor(boxW * 0.96 / tSize))) * tSize * 1.22) : 0)
      + (sub ? subLines(sub, boxW * 0.96, sSize) * sSize * 1.62 + sSize * 0.72 : 0)
      + (auth ? sSize * 1.9 : 0) + 30 * S;
    const bottomOff = 150 * S;
    const y0 = 1 - (bottomOff + blockH) / H;
    const v = an ? judge(an, [Math.max(0, y0), 1]) : { ink:'#fff', alpha:0.22, verdict:'分析中', cr:0 };

    if (o.lay === 'card') {
      const cw = boxW, ch = blockH + 90 * S;
      body = (photo ? `<img class="ph" src="${photo}" style="inset:0;width:100%;height:100%">` : '')
        + `<div style="position:absolute;left:${pad}px;bottom:${bottomOff}px;width:${cw}px;height:${ch}px;`
        + `background:${pal.dark ? 'rgba(255,255,255,.94)' : '#fff'};border-radius:${16 * S}px;`
        + `box-shadow:0 ${24 * S}px ${60 * S}px rgba(93,74,58,.20);"></div>`
        + `<div class="blk" style="bottom:${bottomOff + 45 * S}px;left:${pad + 44 * S}px;right:${pad + 44 * S}px;">`
        + `<h1 class="ttl" style="font-size:${tSize}px;color:#1f1a14">${esc(title)}</h1>`
        + (sub ? `<div class="sub" style="font-size:${sSize}px;color:#6f6557;margin-top:${Math.round(sSize * 0.72)}px">${esc(sub)}</div>` : '')
        + (auth ? `<div class="auth" style="font-size:${sSize * 0.86}px;color:#6f6557;margin-top:${Math.round(sSize * 0.9)}px">${esc(auth)}</div>` : '')
        + `</div>`;
      o._verdict = { ink:'#1f1a14', alpha:0, verdict:'卡片即保护', cr:0 };
    } else {
      body = (photo ? `<img class="ph" src="${photo}" style="inset:0;width:100%;height:100%">` : `<div style="position:absolute;inset:0;background:${pal.paper}"></div>`)
        + (v.alpha > 0
          ? `<div class="scrim" style="top:${Math.max(0, y0 * 100 - 6)}%;height:${Math.min(100, (1 - y0) * 100 + 6)}%;`
            + `background:linear-gradient(to bottom,rgba(10,9,8,0) 0%,rgba(10,9,8,${(v.alpha * 0.55).toFixed(3)}) 22%,`
            + `rgba(10,9,8,${v.alpha.toFixed(3)}) 62%,rgba(10,9,8,${Math.min(0.36, v.alpha * 1.05).toFixed(3)}) 100%)"></div>`
          : '')
        + `<div class="blk${photo ? ' onphoto' : ''}" style="bottom:${bottomOff}px;">`
        + (kick ? `<div class="kick" style="font-size:${19 * S}px;color:${v.ink};opacity:${v.ink === '#fff' ? '.92' : '.78'};margin-bottom:${22 * S}px">${esc(kick)}</div>` : '')
        + `<h1 class="ttl" style="font-size:${tSize}px;color:${v.ink}">${esc(title)}</h1>`
        + (sub ? `<div class="sub" style="font-size:${sSize}px;color:${v.ink};opacity:.92;margin-top:${Math.round(sSize * 0.72)}px">${esc(sub)}</div>` : '')
        + (auth ? `<div class="auth" style="font-size:${sSize * 0.86}px;color:${v.ink};opacity:.78;margin-top:${Math.round(sSize * 0.9)}px">${esc(auth)}</div>` : '')
        + `</div>`;
      o._verdict = v;
    }
  }

  else if (o.lay === 'magazine') {
    /* 刊头照片带：图字不重叠，天然免压暗 */
    const bandH = Math.round(H * 0.36);
    const tSize = fitTitle(title, boxW, 96 * S, 3);
    const sSize = 36 * S;
    body = `<div style="position:absolute;left:0;top:0;right:0;height:${bandH}px;background:${pal.paper2 || pal.paper};overflow:hidden">`
      + (photo ? `<img class="ph" src="${photo}" style="inset:0;width:100%;height:100%">` : '')
      + `</div>`
      + `<div style="position:absolute;left:0;right:0;top:${bandH}px;height:${Math.max(2, Math.round(3 * S))}px;background:${pal.accent}"></div>`
      + `<div class="kick" style="position:absolute;left:${pad}px;top:${bandH + 60 * S}px;font-size:${19 * S}px">${esc(kick || 'EDITORIAL')}</div>`
      + `<div class="blk" style="bottom:${150 * S}px;">`
      + `<h1 class="ttl" style="font-size:${tSize}px">${esc(title)}</h1>`
      + (sub ? `<div class="sub" style="font-size:${sSize}px;margin-top:${Math.round(sSize * 0.72)}px">${esc(sub)}</div>` : '')
      + (auth ? `<div class="auth" style="font-size:${sSize * 0.86}px;margin-top:${Math.round(sSize * 0.9)}px">${esc(auth)}</div>` : '')
      + `</div>`
      + `<div style="position:absolute;left:${pad}px;right:${pad}px;bottom:${96 * S}px;height:1px;background:${pal.line}"></div>`;
    o._verdict = { ink:'#1f1a14', alpha:0, verdict:'图字不重叠', cr:0 };
  }

  else if (o.lay === 'split') {
    /* 左文右图：竖切 56/44 */
    const splitX = Math.round(W * 0.56);
    const tSize = fitTitle(title, splitX - pad * 2, 84 * S, 4);
    const sSize = 34 * S;
    // ⚠️ 三元运算符优先级陷阱：`photo ? A : '' + B` 会被解析成 `photo ? A : ('' + B)`，
    //    有图时后面所有文字块全被丢掉（实测踩过：左文右图只剩图、没字）。必须给三元加括号。
    body = (photo ? `<img class="ph" src="${photo}" style="left:${splitX}px;top:0;width:${W - splitX}px;height:${H}px">` : '')
      + `<div style="position:absolute;left:0;top:0;width:${splitX}px;height:${H}px;background:${pal.paper}"></div>`
      + `<div class="kick" style="position:absolute;left:${pad}px;top:${120 * S}px;font-size:${19 * S}px">${esc(kick || 'FIELD NOTES')}</div>`
      + `<div style="position:absolute;left:${pad}px;width:${splitX - pad * 2}px;top:50%;transform:translateY(-50%)">`
      + `<h1 class="ttl" style="font-size:${tSize}px">${esc(title)}</h1>`
      + (sub ? `<div class="sub" style="font-size:${sSize}px;margin-top:${Math.round(sSize * 0.7)}px">${esc(sub)}</div>` : '')
      + (auth ? `<div class="auth" style="font-size:${sSize * 0.86}px;margin-top:${Math.round(sSize * 0.9)}px">${esc(auth)}</div>` : '')
      + `</div>`
      + `<div style="position:absolute;left:${pad}px;bottom:${110 * S}px;width:${52 * S}px;height:${3 * S}px;background:${pal.accent}"></div>`;
    o._verdict = { ink:'#1f1a14', alpha:0, verdict:'图字不重叠', cr:0 };
  }

  else if (o.lay === 'swiss') {
    /* 瑞士极简：细体大字，左对齐，克莱因蓝细线 */
    const tSize = fitTitle(title, boxW, 132 * S, 4);
    body = `<div style="position:absolute;left:${pad}px;top:${H * 0.2}px;width:${3 * S}px;height:${H * 0.5}px;background:${pal.accent}"></div>`
      + `<div style="position:absolute;left:${pad + 46 * S}px;right:${pad}px;top:50%;transform:translateY(-50%)">`
      + `<h1 class="ttl" style="font-size:${tSize}px;font-weight:300;letter-spacing:-.01em">${esc(title)}</h1>`
      + (sub ? `<div class="sub" style="font-size:${34 * S}px;margin-top:${30 * S}px;max-width:78%">${esc(sub)}</div>` : '')
      + (auth ? `<div class="auth" style="font-size:${26 * S}px;margin-top:${34 * S}px">${esc(auth)}</div>` : '')
      + `</div>`
      + `<div class="kick" style="position:absolute;left:${pad + 46 * S}px;bottom:${110 * S}px;font-size:${19 * S}px">SWISS · 01</div>`;
  }

  else if (o.lay === 'bigtype') {
    const tSize = fitTitle(title, boxW * 0.94, 148 * S, 3);
    body = `<div style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:0 ${pad}px">`
      + `<div style="width:${78 * S}px;height:${10 * S}px;background:${pal.accent};margin:0 auto ${46 * S}px"></div>`
      + `<h1 class="ttl" style="font-size:${tSize}px;font-weight:700;line-height:1.06;text-align:center">${esc(title)}</h1>`
      + (sub ? `<div class="sub" style="font-size:${34 * S}px;margin-top:${44 * S}px;text-align:center">${esc(sub)}</div>` : '')
      + (auth ? `<div class="auth" style="font-size:${26 * S}px;margin-top:${40 * S}px;text-align:center">${esc(auth)}</div>` : '')
      + `</div>`;
  }

  else if (o.lay === 'quote') {
    const tSize = fitTitle(title, boxW * 0.86, 96 * S, 3);
    body = `<div class="pg-deco" style="left:${pad}px;top:${H * 0.22}px;font-size:${420 * S}px;line-height:1;opacity:.10;font-family:'Noto Serif SC',serif">“</div>`
      + `<div style="position:absolute;left:${pad}px;right:${pad}px;top:50%;transform:translateY(-50%);text-align:center">`
      + `<h1 class="ttl" style="font-size:${tSize}px;line-height:1.42">${esc(title)}</h1>`
      + `<div style="width:${56 * S}px;height:${3 * S}px;background:${pal.accent};margin:${56 * S}px auto 0"></div>`
      + (sub ? `<div class="sub" style="font-size:${32 * S}px;margin-top:${44 * S}px">${esc(sub)}</div>` : '')
      + (auth ? `<div class="auth" style="font-size:${26 * S}px;margin-top:${38 * S}px">${esc(auth)}</div>` : '')
      + `</div>`;
  }

  else if (o.lay === 'number') {
    const num = (String(title).match(/(\d+)/) || [])[1] || String(new Date().getMonth() + 1).padStart(2, '0');
    body = `<div style="position:absolute;left:${pad}px;right:${pad}px;top:${H * 0.16}px">`
      + `<div style="font-family:'Noto Sans SC';font-size:${520 * S}px;font-weight:700;line-height:.86;`
      + `color:${pal.accent};opacity:.16;letter-spacing:-.04em">${esc(num)}</div>`
      + `</div>`
      + `<div class="blk" style="bottom:${H * 0.22}px;">`
      + `<h1 class="ttl" style="font-size:${fitTitle(title, boxW, 100 * S, 3)}px">${esc(title)}</h1>`
      + (sub ? `<div class="sub" style="font-size:${34 * S}px;margin-top:${32 * S}px">${esc(sub)}</div>` : '')
      + (auth ? `<div class="auth" style="font-size:${26 * S}px;margin-top:${34 * S}px">${esc(auth)}</div>` : '')
      + `</div>`;
  }

  else if (o.lay === 'list') {
    /* ⚠️ 清单版式必须真有多条：只有 1 条时整页下半截全空（实测过，看着像没生成完）。
       条目不足 2 条就不该用这套 —— 由 layAvailable() 在面板层挡住，这里做兜底。 */
    const items = (sub ? sub.split(/[·、\n]/).filter(Boolean).slice(0, 5) : []);
    if (items.length < 2) {
      // 兜底：退化成「金句」的排法，绝不留半页空白
      return coverHtml(W, H, { ...o, lay: 'quote' });
    }
    // 条目少 → 行距撑开，让版面饱满；条目多 → 收窄
    const rowH = Math.min(150 * S, (H * 0.46) / items.length);
    body = `<div style="position:absolute;left:${pad}px;right:${pad}px;top:${H * 0.2}px">`
      + `<h1 class="ttl" style="font-size:${fitTitle(title, boxW, 84 * S, 2)}px">${esc(title)}</h1>`
      + `<div style="width:${64 * S}px;height:${3 * S}px;background:${pal.accent};margin:${38 * S}px 0 ${48 * S}px"></div>`
      + items.map((it, i) => `<div style="display:flex;gap:${26 * S}px;align-items:flex-start;`
        + `height:${rowH}px;padding-top:${20 * S}px;border-bottom:1px solid ${pal.line}">`
        + `<span style="font-family:'Noto Sans SC';font-size:${26 * S}px;color:${pal.accentText};`
        + `font-weight:600;min-width:${44 * S}px;line-height:1.6">${String(i + 1).padStart(2, '0')}</span>`
        + `<span style="font-size:${44 * S}px;line-height:1.5">${esc(it.trim())}</span></div>`).join('')
      + `</div>`
      + (auth ? `<div class="auth" style="position:absolute;left:${pad}px;bottom:${110 * S}px;font-size:${26 * S}px">${esc(auth)}</div>` : '');
  }

  return `<div class="cv-art${isSans ? ' sans' : ''}" style="${artStyle(W, H, pal, `font-family:${ff};`)}">`
    + `<style>${tmodeCss(state.tmode)}</style>`
    + body + `</div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   4. 长图文：分块 → 分页 → 角色
   ══════════════════════════════════════════════════════════════════════ */
function parseBlocks(text) {
  const out = [];
  const lines = String(text).split(/\r?\n/);
  let list = null;
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) { list = null; continue; }
    if (/^---$/.test(l)) { out.push({ type:'pagebreak' }); list = null; continue; }
    if (/^#{1,6}\s*/.test(l)) { out.push({ type:'h3', text: l.replace(/^#{1,6}\s*/, '') }); list = null; continue; }
    if (/^(\d+[.、)]|[-*•·])\s*/.test(l)) {
      const t = l.replace(/^(\d+[.、)]|[-*•·])\s*/, '');
      if (!list) { list = { type:'list', items:[] }; out.push(list); }
      list.items.push(t); continue;
    }
    // 短行且无句末标点 → 当小标题
    if (l.length <= 18 && !/[。！？；，、.]/.test(l)) { out.push({ type:'h3', text:l }); list = null; continue; }
    out.push({ type:'p', text:l }); list = null;
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════════
   分页：按「真实像素高度」装箱 + 平均分配
   ──────────────────────────────────────────────────────────────────────
   ⚠️ 不能用「行数包络」估算。实测过：4 段短句（每段 10 字）按行数包络只有 6.2，
      判为「够满」，但实际只占画布上方 1/3 —— 最后一张看起来像「图断了」。
      行数包络对「段数多、每段短」的情形系统性低估（每段都要付一次段间距）。
   ⚠️ 也不能纯贪心装满：贪心的结果是前几页 100%、末页 35%。
      读者翻到最后一张看到大片空白，会怀疑是不是没生成完。
      所以先算总高、定页数，再按平均高度分配 —— 每页填充率一致。
   ══════════════════════════════════════════════════════════════════════ */
const PAGE_H = 1108;          // 1440 − 176(页眉) − 156(页脚余量)
const BODY_SIZE = 52, BODY_LH = 1.74, PGAP = 43;
const CPL = 17;               // 904px / 52px ≈ 17 字一行

function blockH(b) {
  // 分页符不占高：paginate 里已先剥掉，但外部（调试/单测）可能直接调进来
  if (!b || b.type === 'pagebreak') return 0;
  if (b.type === 'h3') {
    const lines = Math.max(1, Math.ceil(b.text.length / 13));
    return lines * (BODY_SIZE * 1.4 * 1.36) + 30 + PGAP;
  }
  if (b.type === 'list') {
    return b.items.reduce((h, it) => {
      const lines = Math.max(1, Math.ceil(it.length / 15));
      return h + lines * (BODY_SIZE * 1.5) + 34;
    }, 0) + 20;
  }
  const lines = Math.max(1, Math.ceil(b.text.length / CPL));
  return lines * BODY_SIZE * BODY_LH + PGAP;
}
const pageH = (pg) => pg.blocks.reduce((h, b) => h + blockH(b), 0);

function paginate(blocks) {
  const pages = [];
  let i = 0;

  /* ① 开篇：首段 ≤ 110 字（再长就不是「大字引言」而是正文了，design §6 实测 120 字上限） */
  if (blocks[0] && blocks[0].type === 'p' && blocks[0].text.length <= 110) {
    pages.push({ role:'opening', blocks:[blocks[0]] });
    i = 1;
  }

  /* ② 切大段：手动 --- 优先于自动分页 */
  const segs = [[]];
  for (; i < blocks.length; i++) {
    const b = blocks[i];
    if (b.type === 'pagebreak') { if (segs[segs.length - 1].length) segs.push([]); continue; }
    segs[segs.length - 1].push(b);
  }

  /* ③ 每段内：定页数 → 平均分配 */
  for (const seg of segs) {
    if (!seg.length) continue;

    // 清单段（≥2 条）单独成页，不当正文塞
    if (seg.length === 1 && seg[0].type === 'list' && seg[0].items.length >= 2) {
      pages.push({ role:'points', blocks:[seg[0]] });
      continue;
    }

    const total = seg.reduce((h, b) => h + blockH(b), 0);
    const n = Math.max(1, Math.ceil(total / PAGE_H));
    const target = total / n;

    let cur = [], h = 0;
    for (let k = 0; k < seg.length; k++) {
      const b = seg[k];
      const bh = blockH(b);
      const isLast = k === seg.length - 1;
      const wouldOverflow = h + bh > PAGE_H;
      const passedTarget = h >= target && cur.length > 0;
      // 超过目标且「剩下的页数还装得下剩余内容」→ 收页
      if ((wouldOverflow || (passedTarget && h + bh > target)) && cur.length) {
        pages.push({ role:'dense', blocks:cur });
        cur = []; h = 0;
      }
      cur.push(b); h += bh;
      if (isLast) pages.push({ role:'dense', blocks:cur });
    }
  }

  /* ④ 末页欠填 → 升格「结尾」：结尾页本来就该疏（CTA + 超大页脚 + 留白），
      这样末页的空白读作设计，而不是「没生成完」。
      欠填且合并可行时优先合并，但合并后必须仍 ≤ PAGE_H*1.05。 */
  while (pages.length >= 2) {
    const last = pages[pages.length - 1];
    const prev = pages[pages.length - 2];
    if (last.role !== 'dense' || prev.role !== 'dense') break;
    if (pageH(last) / PAGE_H >= 0.62) break;
    if ((pageH(prev) + pageH(last)) > PAGE_H * 1.02) break;
    prev.blocks = prev.blocks.concat(last.blocks);
    pages.pop();
  }
  const last = pages[pages.length - 1];
  if (last && last.role === 'dense' && pageH(last) / PAGE_H < 0.62) last.role = 'closing';

  return pages.slice(0, 5);
}

/* ── 长文模板：6 种视觉族（对应真系统 12 套里的 6 族，锁色语义一致）── */
const TPLS = [
  { id:'editorial', name:'杂志编辑', desc:'EDITORIAL 刊头 + 上下细线', lock:null,      serif:true  },
  { id:'swiss',     name:'瑞士网格', desc:'左侧色条 + REF 编号',       lock:null,      serif:false },
  { id:'notion',    name:'效率笔记', desc:'面包屑 + 顶部细线',         lock:'ikb',     serif:false },
  { id:'book',      name:'书籍内页', desc:'装订阴影 + § 符号',         lock:'kraft',   serif:true  },
  { id:'memo',      name:'苹果备忘录', desc:'横线纸 + 圆角白卡',       lock:'indigo',  serif:false },
  { id:'night',     name:'暗夜深思', desc:'深色渐变 + 发光竖线',       lock:'midnight', serif:true  },
];
const tplOf = (id) => TPLS.find(t => t.id === id) || TPLS[0];
const tplPal = (t) => palOf(t.lock || state.pal);

/* tplOverride：渲染「某一套模板」的预览（模板面板要用它画 6 张不同模板的缩略图）。
   ⚠️ 原来这里硬读 state.tpl，结果模板面板里 6 张缩略图全画成了当前选中的那套 ——
      用户看到的「六个模板长得一模一样」，会以为功能坏了（实测踩过）。 */
function longPageHtml(W, H, page, idx, total, isCover, tplOverride) {
  const t = tplOf(tplOverride || state.tpl);
  const pal = isCover ? palOf(state.pal) : tplPal(t);
  const S = W / 1080;
  const pad = 88 * S;
  const boxW = W - pad * 2;
  const ff = t.serif ? "'Noto Serif SC'" : "'Noto Sans SC'";
  const headY = 76 * S, footY = 1440 - 74 * S;

  const base = `<div class="cv-art${t.serif ? '' : ' sans'}" style="${artStyle(W, H, pal, `font-family:${ff};`)}">`;

  if (isCover) {
    // 封面走标题图那套渲染，只是锁定版式为全出血 / 刊头
    const { title, sub } = extract(state.longText);
    return coverHtml(W, H, {
      lay: state.imgMode === 'color' ? 'bigtype' : 'image-led',
      title, sub, auth: state.sign,
      photo: state.imgMode === 'color' ? '' : photoOf(state.photo).src,
      an: state.imgMode === 'color' ? null : analysisCache.get(photoOf(state.photo).src),
      kick: 'XHS · LONG',
    });
  }

  /* ── 模板骨架 ── */
  let chrome = '';
  if (t.id === 'editorial') {
    chrome = `<div class="pg-head" style="top:${headY}px;font-size:${19 * S}px">`
      + `<span>EDITORIAL</span><span>${String(idx).padStart(2, '0')}</span></div>`
      + `<div style="position:absolute;left:${pad}px;right:${pad}px;top:${headY + 46 * S}px;height:1px;background:${pal.line}"></div>`;
  } else if (t.id === 'swiss') {
    chrome = `<div style="position:absolute;left:${pad * 0.55}px;top:${H * 0.10}px;width:${6 * S}px;height:${H * 0.80}px;background:${pal.accent}"></div>`
      + `<div class="pg-head" style="top:${headY}px;font-size:${19 * S}px"><span>REF ${String(idx).padStart(2, '0')}</span><span>GRID</span></div>`;
  } else if (t.id === 'notion') {
    chrome = `<div class="pg-head" style="top:${headY}px;font-size:${17 * S}px;letter-spacing:.06em;opacity:.72">`
      + `<span>笔记 / 第 ${idx} 页</span><span>·</span></div>`
      + `<div style="position:absolute;left:${pad}px;right:${pad}px;top:${headY + 40 * S}px;height:1px;background:${pal.line}"></div>`;
  } else if (t.id === 'book') {
    chrome = `<div style="position:absolute;left:0;top:0;width:${26 * S}px;height:100%;`
      + `background:linear-gradient(to right,rgba(0,0,0,.10),rgba(0,0,0,0))"></div>`
      + `<div style="position:absolute;right:0;top:0;width:${12 * S}px;height:100%;`
      + `background:linear-gradient(to left,rgba(255,255,255,.35),rgba(255,255,255,0))"></div>`
      + `<div class="pg-head" style="top:${headY}px;font-size:${19 * S}px"><span>§ ${String(idx).padStart(2, '0')}</span><span>${esc(state.sign || '')}</span></div>`;
  } else if (t.id === 'memo') {
    chrome = `<div style="position:absolute;left:0;right:0;top:0;height:${86 * S}px;background:rgba(0,0,0,.03);`
      + `border-bottom:1px solid ${pal.line};display:flex;align-items:center;justify-content:center">`
      + `<span style="font-size:${21 * S}px;font-weight:600;letter-spacing:.02em">备忘录</span></div>`
      + Array.from({ length:9 }).map((_, i) => `<div style="position:absolute;left:${pad * 0.5}px;right:${pad * 0.5}px;`
        + `top:${180 * S + i * 118 * S}px;height:1px;background:${pal.line};opacity:.6"></div>`).join('');
  } else if (t.id === 'night') {
    chrome = `<div style="position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,${pal.paper2 || '#1a1816'} 0%,${pal.paper} 62%)"></div>`
      + `<div style="position:absolute;left:${pad}px;top:${H * 0.12}px;width:${2 * S}px;height:${H * 0.72}px;`
      + `background:linear-gradient(to bottom,${pal.accent},transparent);opacity:.55"></div>`;
  }

  /* ── 页脚（页码 + 签名，两开关都在这）── */
  const footParts = [];
  if (state.sign) footParts.push(`<span>@${esc(state.sign)}</span>`);
  else footParts.push(`<span></span>`);
  if (state.pn) footParts.push(`<span>${idx} / ${total}</span>`);
  const foot = `<div class="pg-foot" style="bottom:${74 * S}px;font-size:${18 * S}px">${footParts.join('')}</div>`;

  /* ── 正文 ── */
  const bodyTop = 176 * S;
  let content = '';
  const pS = 52 * S, hS = 52 * 1.4 * S;

  if (page.role === 'opening') {
    const lead = page.blocks[0];
    const size = 74 * S;
    /* 开篇是 airy 版式：靠「上锚点 + 下锚点」成立，不是靠塞满（design §6 的分档结论）。
       上锚点 = 色条 + kicker；下锚点 = 署名 + 「往下读」提示。中间留白是刻意的。 */
    content = `<div style="position:absolute;left:${pad}px;right:${pad}px;top:${H * 0.26}px">`
      + `<div class="kick" style="font-size:${19 * S}px;margin-bottom:${30 * S}px">开篇</div>`
      + `<div style="width:${58 * S}px;height:${6 * S}px;background:${pal.accent};margin-bottom:${48 * S}px"></div>`
      + `<div style="font-size:${size}px;line-height:1.36;font-weight:500;text-wrap:balance">${esc(lead.text)}</div>`
      + `</div>`
      + `<div style="position:absolute;left:${pad}px;right:${pad}px;bottom:${190 * S}px;`
      + `display:flex;align-items:flex-end;justify-content:space-between">`
      + `<div style="font-size:${28 * S}px;line-height:1.6;color:${pal.muted};`
      + `font-family:'Noto Sans SC';letter-spacing:.06em">— ${esc(state.sign || '这一篇的全部')}</div>`
      + `<div style="font-size:${22 * S}px;color:${pal.accentText};font-family:'Noto Sans SC';`
      + `letter-spacing:.14em;opacity:.72">往下读 ↓</div>`
      + `</div>`
      + `<div style="position:absolute;left:${pad}px;right:${pad}px;bottom:${150 * S}px;height:1px;background:${pal.line}"></div>`;
  } else if (page.role === 'points') {
    const list = page.blocks[0];
    const rowH = Math.min(150 * S, (H * 0.66) / Math.max(1, list.items.length));
    content = `<div style="position:absolute;left:${pad}px;right:${pad}px;top:${bodyTop + 40 * S}px">`
      + list.items.map((it, i) => `<div style="display:flex;align-items:flex-start;gap:${32 * S}px;`
        + `height:${rowH}px;border-bottom:1px solid ${pal.line};padding-top:${22 * S}px">`
        + `<span style="font-family:'Noto Sans SC';font-size:${44 * S}px;font-weight:600;`
        + `color:${pal.accent};opacity:.30;min-width:${70 * S}px;line-height:1">${String(i + 1).padStart(2, '0')}</span>`
        + `<span style="font-size:${46 * S}px;line-height:1.5">${esc(it)}</span></div>`).join('')
      + `</div>`;
  } else if (page.role === 'closing') {
    content = `<div style="position:absolute;left:${pad}px;right:${pad}px;top:${H * 0.3}px">`
      + `<div style="font-size:${64 * S}px;line-height:1.42;font-weight:500">`
      + page.blocks.map(b => esc(b.text || '')).join('</div><div style="font-size:64px;line-height:1.42;font-weight:500;margin-top:0.6em">')
      + `</div>`
      + `<div style="width:${56 * S}px;height:${3 * S}px;background:${pal.accent};margin-top:${56 * S}px"></div>`
      + `<div style="font-size:${28 * S}px;color:${pal.muted};margin-top:${36 * S}px;`
      + `font-family:'Noto Sans SC';letter-spacing:.08em">收藏 · 下次照着做</div>`
      + `</div>`;
  } else {
    content = `<div class="pg-body" style="top:${bodyTop}px;font-size:${pS}px">`
      + page.blocks.map(b => {
        if (b.type === 'h3') return `<h3 style="font-size:${hS}px">${esc(b.text)}</h3>`;
        if (b.type === 'list') return b.items.map((it, i) =>
          `<div class="item"><span class="num" style="font-size:${pS}px">${String(i + 1).padStart(2, '0')}</span>`
          + `<span style="font-size:${pS}px">${esc(it)}</span></div>`).join('');
        return `<p>${esc(b.text)}</p>`;
      }).join('')
      + `</div>`;
  }

  return base + chrome + content + foot + `</div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   5. 画布装配 / 缩放
   ══════════════════════════════════════════════════════════════════════ */
const ART = { W:1080, H:1440 };

function paint() {
  const wrap = $('cv-wrap');
  const art = $('cv-art');
  const dim = SIZES[state.size];
  ART.W = dim.w; ART.H = dim.h;

  if (state.mode === 'title') {
    const { title, sub } = extract(state.text);
    if (!title) { showEmpty(); return; }
    const src = state.imgMode === 'color' ? '' : photoOf(state.photo).src;
    const an = src ? analysisCache.get(src) : null;
    const html = coverHtml(dim.w, dim.h, {
      lay: state.lay, title, sub, auth: state.sign, photo: src, an,
      kick: state.imgMode === 'color' ? '' : 'TRAVEL NOTES',
    });
    art.innerHTML = html;
    const v = window.__lastVerdict;
    $('cv-meta-txt').textContent = `${dim.w} × ${dim.h}`;
    $('act-hint').textContent = v && v.verdict ? `底图 ${v.verdict}${v.cr ? ` · 对比 ${v.cr.toFixed(1)}:1` : ''}` : '改完即时预览';
  } else {
    paintLong();
    return;
  }
  fit();
  $('film').hidden = true;
  $('pg-prev').hidden = true;
  $('pg-next').hidden = true;
}

function paintLong() {
  const dim = SIZES.xhs;   // 长文固定 3:4（多尺寸会让页数翻倍）
  ART.W = dim.w; ART.H = dim.h;
  const { title, sub } = extract(state.longText);
  const bodyText = String(state.longText).split(/\r?\n/).slice(1).join('\n').trim();
  const blocks = parseBlocks(bodyText);
  const pages = paginate(blocks);
  state.pages = [{ role:'cover', blocks:[] }, ...pages];

  const art = $('cv-art');
  const p = state.pages[Math.min(state.page, state.pages.length - 1)];
  art.innerHTML = longPageHtml(dim.w, dim.h, p, state.page + 1, state.pages.length, p.role === 'cover');

  $('cv-meta-txt').textContent = `第 ${state.page + 1} / ${state.pages.length} 页 · ${roleName(p.role)}`;
  $('act-hint').textContent = `整套 ${state.pages.length} 张 · ${tplOf(state.tpl).name}`;

  // 胶片条
  const film = $('film');
  film.hidden = false;
  film.innerHTML = '';
  const s = 58 / 1080;
  state.pages.forEach((pg, i) => {
    const b = document.createElement('button');
    b.className = 'film-item';
    b.style.width = `${Math.round(1080 * s)}px`;
    b.style.height = `${Math.round(1440 * s)}px`;
    b.setAttribute('aria-pressed', String(i === state.page));
    b.title = `${i === 0 ? '封面' : roleName(pg.role)} · P${String(i + 1).padStart(2, '0')}`;
    const inner = document.createElement('div');
    inner.style.cssText = `position:absolute;left:0;top:0;width:1080px;height:1440px;transform:scale(${s});transform-origin:top left`;
    inner.innerHTML = longPageHtml(1080, 1440, pg, i + 1, state.pages.length, pg.role === 'cover');
    b.appendChild(inner);
    const n = document.createElement('span');
    n.className = 'n' + (i === 0 ? ' cover' : '');
    n.textContent = i === 0 ? '封面' : `P${String(i + 1).padStart(2, '0')}`;
    b.appendChild(n);
    b.addEventListener('click', () => { state.page = i; paint(); });
    film.appendChild(b);
  });
  $('pg-prev').hidden = false;
  $('pg-next').hidden = false;
  $('pg-prev').disabled = state.page <= 0;
  $('pg-next').disabled = state.page >= state.pages.length - 1;
  fit();
}

const ROLES = { cover:'封面', opening:'开篇', dense:'正文', points:'清单', closing:'结尾' };
const roleName = (r) => ROLES[r] || r;

/* 缩放：画布按可用高度等比缩，永远完整可见（这是「画布是主角」的前提） */
function fit() {
  const stage = $('stage');
  const wrap = $('cv-wrap');
  const filmEl = $('film');
  // ⚠️ 胶片条高度必须量：缩略图 58px 宽 → 高 77px，加 padding 是 85，写死 74 会把它切掉一半
  const filmH = filmEl.hidden ? 0 : filmEl.offsetHeight + 8;
  // ⚠️ 必须扣掉实际 padding，不能写死 12*2：托盘出现时 padding-bottom 会变成 112
  const cs = getComputedStyle(stage);
  const availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 22 - filmH;
  const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - (state.mode === 'long' ? 96 : 0);
  const k = Math.min(availW / ART.W, availH / ART.H, 1);
  wrap.style.width = `${Math.round(ART.W * k)}px`;
  wrap.style.height = `${Math.round(ART.H * k)}px`;
  const art = wrap.querySelector('.cv-art');
  if (art) { art.style.transform = `scale(${k})`; art.style.transformOrigin = 'top left'; art.style.position = 'absolute'; }
  ART.k = k;
}

function showEmpty() {
  const dim = SIZES[state.size];
  ART.W = dim.w; ART.H = dim.h;
  $('cv-art').innerHTML = `<div class="cv-art" style="${artStyle(dim.w, dim.h, palOf(state.pal))}display:block">`
    + `<div class="empty-art"><b style="font-size:16px;color:#6E6759">先写一句话</b>`
    + `<span style="max-width:300px">第一行会变成大标题，第二行作小字。<br>写上去画布立刻就有内容。</span></div></div>`;
  fit();
}

/* 文案提取（与 ui.js 的 extractStory 同口径：引语只取第一个列表项之前） */
function extract(text) {
  const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const title = (lines[0] || '').replace(/^#{1,6}\s*/, '').slice(0, 64);
  const rest = lines.slice(1);
  const before = [];
  for (const l of rest) {
    if (/^(\d+[.、)]|[-*•·])\s*/.test(l)) break;
    before.push(l);
    if (before.length >= 2) break;
  }
  // ⚠️ 小字必须「像小字」：长文里第二段是完整一句话，整句塞进封面会变成第二段正文。
  //    规则：只取第一句（到第一个句末标点），再截到 44 字 —— 封面小字是钩子，不是摘要。
  const first = before[0] || '';
  const one = first.split(/[。！？!?；;]/)[0] || first;
  const sub = one.slice(0, 44);
  return { title, sub };
}

/* ══════════════════════════════════════════════════════════════════════
   6. 胶囊 → 弹层
   ══════════════════════════════════════════════════════════════════════ */
let openSheet = null;

function showSheet(kind) {
  openSheet = kind;
  const mask = $('mask'), sheet = $('sheet');
  const body = $('sheet-body'), foot = $('sheet-foot');
  const title = $('sheet-title'), sub = $('sheet-sub');
  foot.hidden = true; foot.innerHTML = '';
  body.innerHTML = '';
  document.querySelectorAll('.cap').forEach(c => c.setAttribute('aria-expanded', 'false'));

  if (kind === 'img') {
    title.textContent = '配图'; sub.textContent = state.imgMode === 'color' ? '当前：不要图' : '搜一张 · 传一张 · 不要图';
    $('cap-img').setAttribute('aria-expanded', 'true');
    body.innerHTML = renderImgSheet();
    bindImgSheet();
  } else if (kind === 'lay') {
    title.textContent = '版式'; sub.textContent = '缩略图用的是你自己的文案，所见即所得';
    $('cap-lay').setAttribute('aria-expanded', 'true');
    body.innerHTML = renderLaySheet();
    bindLaySheet();
  } else if (kind === 'type') {
    title.textContent = '文字'; sub.textContent = '字体 · 排法 · 署名';
    $('cap-type').setAttribute('aria-expanded', 'true');
    body.innerHTML = renderTypeSheet();
    bindTypeSheet();
  } else if (kind === 'size') {
    title.textContent = '尺寸'; sub.textContent = '标题图可切三种；长图文固定 3:4';
    $('cap-size').setAttribute('aria-expanded', 'true');
    body.innerHTML = renderSizeSheet();
    bindSizeSheet();
  } else if (kind === 'why') {
    title.textContent = '这套界面为什么长这样'; sub.textContent = '设计决策与取舍';
    body.innerHTML = renderWhySheet();
  } else if (kind === 'nine') {
    title.textContent = '九宫格切图'; sub.textContent = '按 3×3 切开发布';
    body.innerHTML = `<div class="nine" id="nine-grid"></div>`
      + `<p class="nine-note">非正方形图会先居中裁成方形。发小红书时按 01 → 09 顺序上传。</p>`;
    buildNine();
    foot.hidden = false;
    foot.innerHTML = `<button class="btn-sm ghost" id="nine-close">关闭</button>`
      + `<button class="btn-sm" id="nine-zip" style="margin-left:auto">下载 9 张（ZIP）</button>`;
    $('nine-close').onclick = hideSheet;
    $('nine-zip').onclick = () => toast('原型不打包，落地时复用 nine.js 的 zipTiles');
  }

  mask.classList.add('on');
  sheet.classList.add('on');
  paintThumbs();
  $('sheet-x').focus({ preventScroll:true });
}

/* 缩略图缩放：面板宽度变化 → 每张缩略图按自己容器宽度算 scale。
   ⚠️ 必须在面板 visible 之后量（display:none 时 clientWidth=0，会算出 0）。 */
function paintThumbs() {
  document.querySelectorAll('#sheet-body .thumb-art').forEach(el => {
    const box = el.parentElement;
    const w = box.clientWidth;
    if (!w) return;
    const k = w / Number(el.dataset.w || 1080);
    el.style.width = `${el.dataset.w}px`;
    el.style.height = `${el.dataset.h}px`;
    el.style.transform = `scale(${k})`;
  });
}
window.addEventListener('resize', () => { if (openSheet) paintThumbs(); });

function hideSheet() {
  $('mask').classList.remove('on');
  $('sheet').classList.remove('on');
  document.querySelectorAll('.cap').forEach(c => c.setAttribute('aria-expanded', 'false'));
  openSheet = null;
}

/* ── 6.1 配图面板 ── */
function renderImgSheet() {
  const tabs = `<div class="tabs3" id="img-tabs">`
    + `<button class="tab3" data-m="search" aria-pressed="${state.imgMode === 'search'}">搜一张<b class="badge">特色</b></button>`
    + `<button class="tab3" data-m="upload" aria-pressed="${state.imgMode === 'upload'}">传一张</button>`
    + `<button class="tab3" data-m="color"  aria-pressed="${state.imgMode === 'color'}">不要图</button>`
    + `</div>`;

  if (state.imgMode === 'color') {
    return tabs + `<p class="sheet-note">不用底图时，版式会自动切到纯文字那几套（瑞士极简 / 大字报 / 金句 / 编号 / 清单）。`
      + `搜不到合适的图也不至于没封面。</p>`;
  }
  if (state.imgMode === 'upload') {
    return tabs + `<div style="border:1px dashed var(--border-hi);border-radius:var(--r);padding:26px 16px;text-align:center;background:var(--bg-surface)">`
      + `<div style="font-size:13px;font-weight:600;margin-bottom:4px">把图片拖进来，或点这里选</div>`
      + `<div style="font-size:11.5px;color:var(--text-muted)">JPG / PNG，建议竖图；上限 12MB</div>`
      + `<button class="btn-sm" style="margin-top:14px" id="fake-upload">选一张本地图</button></div>`
      + `<p class="sheet-note">上传后仍可调文字位置与磨砂——文字压在图上的那几套会实测亮度，自动决定白字还是黑字。</p>`;
  }
  // 搜索
  const kw = extract(state.text).title || '海边';
  return tabs
    + `<div class="search-row"><input class="search-field" id="kw" value="${esc(kw)}">`
    + `<button class="btn-sm" id="do-search">搜索</button></div>`
    + `<div class="photo-grid" id="photo-grid">`
    + PHOTOS.map(p => `<button class="photo" data-p="${p.id}" aria-pressed="${state.photo === p.id}">`
      + `<img src="${p.src}" alt="${esc(p.name)}" loading="lazy">`
      + `<span class="tag">Pexels</span><span class="nm">${esc(p.name)}</span></button>`).join('')
    + `</div>`
    + `<p class="sheet-note">关键词从你写的标题自动提取，可改。图源是 Pexels 免费商用（需一次性的免费 Key），`
    + `候选图会先算一遍亮度分布，决定文字该用白色还是黑色、要不要压暗。</p>`;
}

function bindImgSheet() {
  document.querySelectorAll('#img-tabs .tab3').forEach(b => b.addEventListener('click', () => {
    const m = b.dataset.m;
    if (m === 'color' && layOf(state.lay).needImg) {
      state.lay = 'swiss';
      toast('切到纯文字版式：瑞士极简');
    }
    if (m !== 'color' && !layOf(state.lay).needImg) {
      state.lay = 'image-led';
    }
    state.imgMode = m;
    refreshCaps();
    paint();
    showSheet('img');
  }));
  const up = $('fake-upload');
  if (up) up.onclick = () => { state.photo = 'p2'; state.imgMode = 'search'; refreshCaps(); paint(); showSheet('img'); toast('原型里用本地图代替上传'); };
  const ds = $('do-search');
  if (ds) ds.onclick = () => {
    const g = $('photo-grid');
    g.style.opacity = '.4';
    toast('搜索中…（原型里直接用本地 6 张）');
    setTimeout(() => { g.style.opacity = '1'; }, 500);
  };
  document.querySelectorAll('#photo-grid .photo').forEach(b => b.addEventListener('click', () => {
    state.photo = b.dataset.p;
    // ⚠️ 函数名是 analyze（不是 analysis）。写错时 Promise 不会抛，只在控制台静默失败，
    //    表现是「点了照片没反应」——这类错误只能靠产物级断言抓（已加进自检脚本）。
    analyze(photoOf(state.photo).src)
      .then(a => { analysisCache.set(photoOf(state.photo).src, a); paint(); })
      .catch(() => paint());
    document.querySelectorAll('#photo-grid .photo').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    refreshCaps();
    paint();
  }));
}

/* ── 6.2 版式面板：缩略图用「你自己的文案」渲染 ── */
function renderLaySheet() {
  const { title, sub } = extract(state.text);
  const t = title || '你的标题会出现在这里';
  const s = sub || '第二行可以当小字';
  const src = state.imgMode === 'color' ? '' : photoOf(state.photo).src;

  const avail = LAYS.filter(l => state.imgMode === 'color' ? !l.needImg : true);
  const imgGroup = avail.filter(l => l.needImg);
  const txtGroup = avail.filter(l => !l.needImg);

  /* 版式可用性：有的版式需要前提内容（清单要 ≥2 条），不满足就置灰 + 说明，
     而不是让用户点进去看到半页空白再自己猜原因。 */
  const listCount = s ? s.split(/[·、\n]/).filter(Boolean).length : 0;
  const layAvailable = (l) => (l.id === 'list' ? listCount >= 2 : true);
  const layWhy = (l) => (l.id === 'list' && listCount < 2 ? '需要 2 条以上小字（用「、」或换行分隔）' : '');

  const card = (l) => {
    // ⚠️ 一律按 1080×1440 真实尺寸渲染，再由 paintThumbs() 整体 scale。
    //    曾经在这里传 320×427「缩略图专用尺寸」，结果又被外层 scale 0.18 → 只剩指甲盖大（实测踩过）。
    const html = coverHtml(1080, 1440, {
      lay: l.id, title: t, sub: s, auth: state.sign,
      photo: l.needImg ? src : '',
      an: l.needImg ? analysisCache.get(src) : null,
      kick: l.needImg ? 'NOTES' : '',
    });
    // ⚠️ 缩放比不能写死：列宽随面板宽度变化（3 列 / 4 列），写死 320/1080 会让
    //    内容溢出被裁成「只剩左上角一块」（实测踩过）。统一在 paintThumbs() 里量完再设。
    const ok = layAvailable(l);
    return `<button class="lay" data-l="${l.id}" aria-pressed="${state.lay === l.id}"`
      + `${ok ? '' : ' disabled'} title="${esc(layWhy(l))}">`
      + `<div class="lay-thumb${ok ? '' : ' lay-off'}" style="aspect-ratio:3/4">`
      + `<div class="thumb-art" data-w="1080" data-h="1440">${html}</div>`
      + `</div>`
      + `<div class="lay-name">${esc(l.name)}${l.needImg ? '' : '<span class="lay-badge">不用图</span>'}</div>`
      + `<div class="lay-desc">${ok ? esc(l.desc) : esc(layWhy(l))}</div></button>`;
  };

  let out = '';
  if (imgGroup.length) out += `<div class="lay-sec">有底图 · ${imgGroup.length} 套</div><div class="layout-grid">${imgGroup.map(card).join('')}</div>`;
  if (txtGroup.length) out += `<div class="lay-sec">纯文字 · 搜不到图也能用</div><div class="layout-grid">${txtGroup.map(card).join('')}</div>`;
  if (state.imgMode === 'color') out = `<p class="sheet-note" style="margin:0 0 12px">当前是「不要图」，所以只列纯文字版式。</p>` + out;
  return out;
}

function bindLaySheet() {
  document.querySelectorAll('#sheet-body .lay').forEach(b => b.addEventListener('click', () => {
    state.lay = b.dataset.l;
    refreshCaps();
    paint();
    showSheet('lay');
  }));
}

  return `<div class="row-label">字体 <span class="hint">${esc(FONTS.find(f => f.id === state.font).note)}</span></div>`
    + `<div class="chip-row" id="font-row">`
    + FONTS.map(f => `<button class="chip" data-f="${f.id}" aria-pressed="${state.font === f.id}">${esc(f.name)}</button>`).join('')
    + `</div>`

    + `<div class="row-label">标题排法 <span class="hint">${esc(TMODES.find(m => m.id === state.tmode).note)}</span></div>`
    + `<div class="chip-row" id="tmode-row">`
    + TMODES.map(m => `<button class="chip" data-t="${m.id}" aria-pressed="${state.tmode === m.id}">${esc(m.name)}</button>`).join('')
    + `</div>`

    + `<div class="row-label">署名 <span class="hint">可选，显示在封面底部</span></div>`
    + `<input class="field" id="sign-field" maxlength="16" placeholder="例如：阿苏" value="${esc(state.sign)}">`

function bindTypeSheet() {
  document.querySelectorAll('#font-row .chip').forEach(b => b.addEventListener('click', () => {
    state.font = b.dataset.f; paint(); showSheet('type'); refreshCaps();
  }));
  document.querySelectorAll('#tmode-row .chip').forEach(b => b.addEventListener('click', () => {
    state.tmode = b.dataset.t; paint(); showSheet('type');
  }));
  document.querySelectorAll('#pal-row .chip').forEach(b => b.addEventListener('click', () => {
    state.pal = b.dataset.p; paint(); showSheet('type');

  let st = 0;
  sf.addEventListener('input', () => {
    clearTimeout(st);
    st = setTimeout(() => { state.sign = sf.value.trim().slice(0, 16); paint(); }, 220);
