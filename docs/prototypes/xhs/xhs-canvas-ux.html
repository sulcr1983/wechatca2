}

/* ── 6.4 尺寸面板 ── */
function renderSizeSheet() {
  const dim = SIZES[state.size];
  const longMode = state.mode === 'long';
  const note = longMode
    ? '长图文固定 3:4 —— 多尺寸会让页数翻倍，用户分不清哪套是哪套。'
    : '3:4 是小红书信息流占屏最大的尺寸，99% 的场景用它就够；方图与横版留给特定栏目。';
  return `<div class="size-row" id="size-row">`
    + Object.entries(SIZES).map(([k, v]) => `<button class="size" data-s="${k}" aria-pressed="${state.size === k}" ${longMode && k !== 'xhs' ? 'disabled' : ''}>`
      + `<b>${v.label}</b>${v.hint}</button>`).join('')
    + `</div><p class="sheet-note">${note}</p>`
    + (longMode ? '' : `<p class="sheet-note">切换尺寸只影响画布比例，版式与字号会按比例重算——不是把图拉变形。</p>`);
}
function bindSizeSheet() {
  document.querySelectorAll('#size-row .size').forEach(b => b.addEventListener('click', () => {
    state.size = b.dataset.s; paint(); showSheet('size'); refreshCaps();
  }));
}

/* ── 6.5 设计说明（原型自带，方便对照验收）── */
function renderWhySheet() {
  const rows = [
    ['删掉左右两栏', '原来左栏 7 个设置分区、右栏 27 个色点全摊在首屏。现在画布占屏从约 40% 提到约 68%，设置全进弹层。'],
    ['三颗胶囊 = 入口 + 当前值', '「配图 · 海边」既是打开面板的按钮，也是当前状态的显示。省掉一整套「当前设置摘要」。'],
    ['版式缩略图用你的文案', '原来缩略图是预渲染的示例图，用户得靠想象。现在每张缩略图都是你那句话在那个版式下的样子。'],
    ['弹层不遮画布', '面板最高 70vh、居中悬浮，上方画布仍在视野里——调参数时眼睛不用来回跳。'],
    ['预览就是结果', '原系统「实时预览」和「标题图结果」是同一张图的两次呈现。现在只有一块画布，删掉结果区。'],
    ['保存 → 出片托盘', '原来点保存直接偷偷落盘，用户不知道存哪了。现在先出片、再在托盘里选「下载 / 复制 / 九宫格」。'],
    ['长文用翻页而不是长列表', '一次只看一页，配胶片条定位；比一屏塞 6 张缩略图更容易判断「这页读起来舒服吗」。'],
    ['两个模块同一套骨架', '切 tab 后命令栏 / 画布 / 动作栏位置不变，只有输入框从 1 行变 3 行、画布下方多一条胶片。'],
  ];
  return `<div class="note-list">` + rows.map(([t, d]) =>
    `<div class="note-item"><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join('') + `</div>`;
}

/* ── 6.6 九宫格 ── */
function buildNine() {
  const g = $('nine-grid');
  if (!g) return;
  g.innerHTML = '';
  const cell = 140;
  const s = cell / 360;   // 每格取 1/3 画面
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    const d = document.createElement('div');
    d.className = 'nine-cell';
    d.style.width = `${cell}px`; d.style.height = `${cell}px`;
    const inner = document.createElement('div');
    // 每格显示原图对应区域：把 1080×1440 画布裁成 3×3 后，按 cover 居中
    inner.style.cssText = `position:absolute;left:${-c * cell}px;top:${-r * cell}px;width:${cell * 3}px;height:${cell * 3}px;`
      + `transform:scale(${1});transform-origin:top left`;
    const art = $('cv-art').innerHTML;
    inner.innerHTML = `<div style="width:${cell * 3}px;height:${cell * 3}px;position:relative;overflow:hidden">`
      + `<div style="position:absolute;left:0;top:0;width:1080px;height:1440px;transform:scale(${(cell * 3) / 1080});transform-origin:top left">${art}</div>`
      + `</div>`;
    d.appendChild(inner);
    g.appendChild(d);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   7. 出片托盘
   ══════════════════════════════════════════════════════════════════════ */
function showTray() {
  const dim = SIZES[state.mode === 'long' ? 'xhs' : state.size];
  const tray = $('tray');
  // 缩略图：把当前画布缩小塞进去
  const s = 52 / dim.w;
  $('tray-thumb').innerHTML = `<div style="position:absolute;left:0;top:0;width:${dim.w}px;height:${dim.h}px;`
    + `transform:scale(${s});transform-origin:top left">${$('cv-art').innerHTML}</div>`;

  const pages = state.mode === 'long' ? state.pages.length : 1;
  $('tray-title').textContent = pages > 1 ? `整套 ${pages} 张已生成` : '大图已生成';
  $('tray-sub').textContent = pages > 1
    ? `1080 × 1440 · 封面 + ${pages - 1} 张内页 · PNG`
    : `${dim.w} × ${dim.h} · PNG · 纯前端生成`;

  $('tray-acts').innerHTML = pages > 1
    ? `<button class="btn-sm ghost" id="t-nine">九宫格</button>`
      + `<button class="btn-sm ghost" id="t-copy">复制首图</button>`
      + `<button class="btn-sm" id="t-dl">打包 ZIP</button>`
    : `<button class="btn-sm ghost" id="t-copy">复制</button>`
      + `<button class="btn-sm" id="t-dl">下载 PNG</button>`;
  $('t-dl').onclick = () => toast(pages > 1 ? '原型不打包 ZIP，落地复用 nine.js' : '已保存到下载文件夹', false);
  $('t-copy').onclick = () => toast('已复制到剪贴板');
  if ($('t-nine')) $('t-nine').onclick = () => { hideTray(); showSheet('nine'); };
  tray.classList.add('on');
  $('body').parentElement.classList.add('tray-open');
  fit();
  clearTimeout(showTray._t);
  showTray._t = setTimeout(hideTray, 9000);
}
function hideTray() {
  $('tray').classList.remove('on');
  document.querySelector('.app').classList.remove('tray-open');
  fit();
}

/* ══════════════════════════════════════════════════════════════════════
   8. 胶囊状态同步
   ══════════════════════════════════════════════════════════════════════ */
function refreshCaps() {
  const isLong = state.mode === 'long';
  // 配图
  if (state.imgMode === 'color') { $('cap-img-v').textContent = '不要图'; $('cap-img-dot').style.background = palOf(state.pal).paper; }
  else if (state.imgMode === 'upload') { $('cap-img-v').textContent = '自己的图'; }
  else { $('cap-img-v').textContent = photoOf(state.photo).name; $('cap-img-dot').style.background = '#C8BFB0'; }
  // 版式
  if (isLong) {
    const t = tplOf(state.tpl);
    $('cap-lay-v').textContent = t.name;
    $('cap-type-v').textContent = t.lock ? '模板锁色' : palOf(state.pal).name;
  } else {
    $('cap-lay-v').textContent = layOf(state.lay).name;
    $('cap-type-v').textContent = FONTS.find(f => f.id === state.font).name;
  }
  $('cap-size-v').textContent = SIZES[isLong ? 'xhs' : state.size].label;
}

/* ── 文章条 + 全屏编辑层（长文）──
   首屏只露「标题 · 字数 · 页数」；点「编辑全文」升一个全屏层。
   为什么不是抽屉：整篇文章是要静心读改的东西，70vh 的半吊子高度不够。
   ⚠️ 这两个函数必须定义在 boot() 之前：boot 里会写 $('art-edit').onclick = openArticleEditor。
 */
function renderArticleBar() {
  const { title } = extract(state.longText);
  const t = $('art-title');
  if (!t) return;
  t.textContent = title || '把文章粘进来';
  t.classList.toggle('empty', !title);
  const pages = state.pages.length;
  $('art-meta').textContent = state.longText.length
    ? `${state.longText.length} 字 · 自动分 ${pages} 页`
    : '第一行作封面标题；单独一行的「---」强制分页';
}

function openArticleEditor() {
  const mask = $('mask');
  const sheet = $('sheet');
  $('sheet-title').textContent = '整篇文章';
  $('sheet-sub').textContent = '第一行作封面标题 · 「---」强制分页';
  $('sheet-body').innerHTML = `<textarea class="art-full" id="art-full" spellcheck="false"
    placeholder="把文章粘到这里。&#10;第一行会作封面标题；单独一行的「---」可强制分页。"></textarea>
    <div class="art-foot"><span id="art-full-count">0 字</span>
    <span class="art-hint">改完点「完成」，画布会重新分页</span></div>`;
  $('sheet-foot').hidden = false;
  $('sheet-foot').innerHTML = `<button class="btn-sm ghost" id="art-cancel">取消</button>
    <button class="btn-sm" id="art-done" style="margin-left:auto">完成</button>`;
  const ta = $('art-full');
  ta.value = state.longText;
  const upd = () => { $('art-full-count').textContent = `${ta.value.length} 字`; };
  ta.addEventListener('input', upd);
  upd();
  mask.classList.add('on');
  sheet.classList.add('on');
  sheet.style.maxHeight = '88vh';
  setTimeout(() => ta.focus(), 260);
  $('art-cancel').onclick = () => { hideSheet(); sheet.style.maxHeight = ''; };
  $('art-done').onclick = () => {
    state.longText = ta.value;
    state.page = 0;
    $('cm-count').textContent = `${state.longText.length} 字`;
    hideSheet();
    sheet.style.maxHeight = '';
    paint();
    renderArticleBar();
  };
}

/* ══════════════════════════════════════════════════════════════════════
   9. 模式切换（标题图 / 长图文）
   ══════════════════════════════════════════════════════════════════════ */
const SAMPLE_TITLE = '周末去了趟海边\n两天里我没看手机，只听见浪';
const SAMPLE_LONG = `把日子过成一张纸

我一直觉得，日子过得快，是因为我们把它过成了流水账。

早上睁眼，先摸手机。通勤路上刷完三十条视频，到公司已经累了。
晚上回家，再刷两小时，然后睡着。第二天照旧。

真正的问题不是时间少，而是没有留下痕迹。
你记得上周三下午在干什么吗？大多数人都答不上来。

所以我开始记一张纸。
每天只写三行：今天做了什么、看到了什么、想通了一件什么事。
不用文采，不用排版，写完就贴在冰箱上。

一个月后翻回去，那些以为忘掉的日子全都在。
原来不是日子太快，是我们没有停下来看一眼。

---

这件事不需要工具，不需要方法。
一支笔，一张纸，三行字。

如果你也想试试，从今晚开始。
不用写得好，写下来就行。`;

function setMode(mode) {
  state.mode = mode;
  const isLong = mode === 'long';
  $('tab-title').setAttribute('aria-pressed', String(!isLong));
  $('tab-long').setAttribute('aria-pressed', String(isLong));
  $('tab-editor').setAttribute('aria-pressed', 'false');

  const input = $('cm-input');
  if (isLong) {
    /* 长文的关键决策：**整篇文章不常驻首屏**。
       实测过：300 字的文章在命令栏里占 284px，画布被压到只剩 473px 高 —— 
       而用户此刻要看的是「这套图文好不好看」，不是「我刚粘的原文」。
       所以文章收成一条「文章条」：标题 + 字数 + 编辑入口，点开是全屏编辑层。 */
    $('cm-tag').textContent = '文';
    $('cm-label').textContent = '整篇文章';
    // 字数已经在文章条里了（「309 字 · 5 页」），右上角再显示一遍是冗余
    $('cm-count').textContent = '';
    $('cm-count').hidden = true;
    input.hidden = true;
    $('cm-article').hidden = false;
    renderArticleBar();
    // 长文用「模板 / 选项」两颗胶囊
    $('cap-lay').querySelector('.k').textContent = '模板';
    $('cap-type').querySelector('.k').textContent = '配色';
    $('btn-save').innerHTML = '导出整套';
    $('cap-size').style.display = 'none';
    state.page = 0;
  } else {
    $('cm-tag').textContent = 'T';
    $('cm-label').textContent = '一句话，变成一张图';
    $('cm-count').textContent = `${state.text.length} / 500`;
    $('cm-count').hidden = false;
    input.hidden = false;
    $('cm-article').hidden = true;
    input.className = 'cm-input';
    input.placeholder = '写个标题，比如「周末去了趟海边」\n第二行可作小字。';
    input.value = state.text;
    input.style.height = 'auto';
    input.style.height = `${Math.min(200, Math.max(44, input.scrollHeight))}px`;
    $('cap-lay').querySelector('.k').textContent = '版式';
    $('cap-type').querySelector('.k').textContent = '文字';
    $('btn-save').innerHTML = '保存大图';
    $('cap-size').style.display = '';
  }
  $('btn-nine').hidden = isLong;
  refreshCaps();
  paint();
}

/* ══════════════════════════════════════════════════════════════════════
   10. 事件绑定
   ══════════════════════════════════════════════════════════════════════ */
function boot() {
  // 输入
  const input = $('cm-input');
  input.addEventListener('input', () => {
    if (state.mode === 'long') {
      state.longText = input.value;
      $('cm-count').textContent = `${input.value.length} 字`;
      state.page = 0;
    } else {
      state.text = input.value;
      $('cm-count').textContent = `${input.value.length} / 500`;
    }
    input.style.height = 'auto';
    input.style.height = `${Math.min(state.mode === 'long' ? 132 : 200, Math.max(state.mode === 'long' ? 64 : 44, input.scrollHeight))}px`;
    paint();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('btn-save').click(); }
  });

  $('btn-sample').onclick = () => {
    if (state.mode === 'long') {
      state.longText = SAMPLE_LONG; state.page = 0;
      $('cm-count').textContent = `${state.longText.length} 字`;
      paint(); renderArticleBar();
    } else {
      state.text = SAMPLE_TITLE; $('cm-input').value = SAMPLE_TITLE;
      $('cm-input').dispatchEvent(new Event('input'));
    }
  };
  $('art-edit').onclick = openArticleEditor;
  $('btn-use-main').onclick = () => toast('原型没有排版页内容，点「示例」看效果');

  // 胶囊
  $('cap-img').onclick = () => showSheet('img');
  $('cap-lay').onclick = () => showSheet(state.mode === 'long' ? 'tpl' : 'lay');
  $('cap-type').onclick = () => showSheet(state.mode === 'long' ? 'pal' : 'type');
  $('cap-size').onclick = () => showSheet('size');
  $('btn-why').onclick = () => showSheet('why');

  // 遮罩 / 关闭
  $('mask').onclick = hideSheet;
  $('sheet-x').onclick = hideSheet;

  // 翻页
  $('pg-prev').onclick = () => { if (state.page > 0) { state.page--; paint(); } };
  $('pg-next').onclick = () => { if (state.page < state.pages.length - 1) { state.page++; paint(); } };

  // 动作
  $('btn-save').onclick = () => {
    if (state.mode === 'title' && !extract(state.text).title) { toast('先写一句话（第一行作标题）', true); $('cm-input').focus(); return; }
    if (state.mode === 'long' && !extract(state.longText).title) { toast('先把文章粘进来（第一行作封面标题）', true); $('cm-input').focus(); return; }
    $('cv-wrap').classList.add('flash');
    setTimeout(() => $('cv-wrap').classList.remove('flash'), 600);
    setTimeout(showTray, 260);
  };
  $('btn-nine').onclick = () => showSheet('nine');
  // 历史入口暂不做：本原型只演示主流程

  // 放大查看
  $('btn-zoom').onclick = () => {
    const dim = SIZES[state.mode === 'long' ? 'xhs' : state.size];
    const k = Math.min((window.innerWidth - 120) / dim.w, (window.innerHeight - 140) / dim.h);
    const box = $('lightbox-art');
    box.style.width = `${Math.round(dim.w * k)}px`;
    box.style.height = `${Math.round(dim.h * k)}px`;
    box.innerHTML = `<div style="position:absolute;left:0;top:0;width:${dim.w}px;height:${dim.h}px;`
      + `transform:scale(${k});transform-origin:top left">${$('cv-art').innerHTML}</div>`;
    $('lightbox').classList.add('on');
  };
  $('lightbox-x').onclick = () => $('lightbox').classList.remove('on');
  $('lightbox').onclick = (e) => { if (e.target.id === 'lightbox') $('lightbox').classList.remove('on'); };

  // 托盘
  $('tray-x').onclick = hideTray;

  // tab
  $('tab-title').onclick = () => setMode('title');
  $('tab-long').onclick = () => setMode('long');
  $('tab-editor').onclick = () => toast('原型只做小红书两个模块');

  // 键盘
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if ($('lightbox').classList.contains('on')) { $('lightbox').classList.remove('on'); return; }
      if ($('tray').classList.contains('on')) { hideTray(); return; }
      if (openSheet) { hideSheet(); return; }
    }
    if (state.mode === 'long' && openSheet === null) {
      if (e.key === 'ArrowLeft') $('pg-prev').click();
      if (e.key === 'ArrowRight') $('pg-next').click();
    }
  });

  window.addEventListener('resize', () => fit());

  // 预分析所有照片（并行，进页面就开始算）
  Promise.all(PHOTOS.map(p => analyze(p.src).then(a => { analysisCache.set(p.src, a); })))
    .then(() => { paint(); refreshCaps(); })
    .catch(() => {});

  // 初始
  state.text = SAMPLE_TITLE;
  $('cm-input').value = SAMPLE_TITLE;
  $('cm-input').dispatchEvent(new Event('input'));
  refreshCaps();
  setTimeout(fit, 60);
}

/* 版式面板的 tpl/pal 分支（长文用）—— 单独写，避免和标题图的 9 套混在一起 */
const origShowSheet = showSheet;
showSheet = function (kind) {
  if (kind === 'tpl' || kind === 'pal') {
    openSheet = kind;
    document.querySelectorAll('.cap').forEach(c => c.setAttribute('aria-expanded', 'false'));
    (kind === 'tpl' ? $('cap-lay') : $('cap-type')).setAttribute('aria-expanded', 'true');
    $('sheet-title').textContent = kind === 'tpl' ? '长文模板' : '配色';
    $('sheet-sub').textContent = kind === 'tpl' ? '一套模板管整套图文' : (tplOf(state.tpl).lock ? '这套模板自带配色' : '8 套，封面与内页同族');
    $('sheet-foot').hidden = true;
    const body = $('sheet-body');
    if (kind === 'tpl') {
      body.innerHTML = `<div class="layout-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">`
        + TPLS.map(t => `<button class="lay" data-tpl="${t.id}" aria-pressed="${state.tpl === t.id}">`
          + `<div class="lay-thumb" style="aspect-ratio:3/4;background:${tplPal(t).paper}">`
          + `<div class="thumb-art" data-w="1080" data-h="1440">`
          + longPageHtml(1080, 1440, { role:'dense', blocks:[{ type:'p', text:'这是这套模板的正文样子。字号 52px，行高 1.74，每行约 17 字。' }, { type:'h3', text:'一个小标题' }, { type:'p', text:'换模板换的是整套的气质：页眉、页脚、装饰、配色。' }] }, 2, 4, false, t.id)
          + `</div></div>`
          + `<div class="lay-name">${esc(t.name)}${t.lock ? '<span class="lay-badge">锁色</span>' : ''}</div>`
          + `<div class="lay-desc">${esc(t.desc)}</div></button>`).join('') + `</div>`
        + `<p class="sheet-note">模板是整套图文的风格，封面只是它的第 1 页——所以不给封面单独换版式，否则第一页和后面几页会像两篇。</p>`;
      document.querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => {
        state.tpl = b.dataset.tpl; refreshCaps(); paint(); showSheet('tpl');
      });
    } else {
      const locked = !!tplOf(state.tpl).lock;
      body.innerHTML = (locked ? `<p class="sheet-note" style="margin:0 0 12px;color:var(--text-soft)">`
        + `<b>${esc(tplOf(state.tpl).name)}</b> 自带配色，色板不参与 —— 强风格模板放白纸上就毁了。</p>` : '')
        + `<div class="chip-row">`
        + PALS.map(p => `<button class="chip" data-p="${p.key}" aria-pressed="${!locked && state.pal === p.key}" `
          + `${locked ? 'disabled style="opacity:.42"' : ''}>`
          + `<span class="mini-dot" style="background:linear-gradient(135deg,${p.paper} 0 52%,${p.accent} 52%)"></span>${esc(p.name)}</button>`).join('')
        + `</div>`
        + `<p class="sheet-note">色板只换颜色，不换结构。8 套都验过文字对比度：柠檬黄、安全橙这类亮色当文字只有 1.35:1，`
        + `所以色块用一个色、文字用另一个更深的值。</p>`;
      document.querySelectorAll('#sheet-body [data-p]').forEach(b => b.onclick = () => {
        if (locked) return;
        state.pal = b.dataset.p; refreshCaps(); paint(); showSheet('pal');
      });
    }
    $('mask').classList.add('on');
    $('sheet').classList.add('on');
    paintThumbs();
    return;
  }
  return origShowSheet(kind);
};

boot();
</script>
