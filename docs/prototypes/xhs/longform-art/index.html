<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长图文 · 12 套 × 5 页 模板库</title>
<style>
  :root{--bg:#EAE4D8;--ink:#221E19;--muted:#7A7164;--accent:#A6432C;--line:rgba(34,30,25,.16)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.65}
  header{position:sticky;top:0;z-index:20;background:rgba(234,228,216,.97);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 28px 12px}
  .htop{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font-family:'Noto Serif SC','Songti SC',serif;font-weight:500;font-size:25px;
    letter-spacing:.04em;margin:0}
  .sub{font-size:13px;color:var(--muted);margin:0}
  .cmd{font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--muted);margin:6px 0 0}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button.chip{border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 13px;border-radius:20px;font-size:13px;cursor:pointer}
  button.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .stat{margin-left:auto;font:12px ui-monospace,monospace;color:var(--muted)}
  .list{padding:24px 28px 60px;display:flex;flex-direction:column;gap:30px}
  .set{background:rgba(255,255,255,.32);border:1px solid var(--line);padding:16px}
  .set-head{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;flex-wrap:wrap}
  .set-head b{font-family:'Noto Serif SC',serif;font-weight:500;font-size:19px}
  .set-head span{font-size:12px;color:var(--muted)}
  .pages{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
  .pg{flex:none;width:200px;cursor:pointer;transition:.15s}
  .pg:hover{transform:translateY(-2px)}
  .frame{width:100%;aspect-ratio:3/4;overflow:hidden;position:relative;background:#fff;
    box-shadow:0 2px 10px rgba(34,30,25,.12)}
  .frame iframe{position:absolute;top:0;left:0;width:1080px;height:1440px;border:0;
    transform:scale(.185);transform-origin:top left;pointer-events:none}
  .pl{font-size:11.5px;color:var(--muted);padding-top:6px;text-align:center}
  #viewer{position:fixed;inset:0;z-index:40;background:rgba(20,17,14,.90);
    display:none;align-items:center;justify-content:center;padding:24px}
  #viewer.on{display:flex}
  #viewer iframe{width:min(80vh*0.75,92vw);height:min(80vh,92vw*4/3);border:0;
    box-shadow:0 12px 50px rgba(0,0,0,.5);background:#F3EDE0}
  .vinfo{position:absolute;top:20px;left:28px;color:#F3EDE0;font-size:14px}
  .vinfo b{font-size:19px;font-family:'Noto Serif SC',serif;font-weight:500}
  .close{position:absolute;top:18px;right:26px;background:none;border:1px solid #F3EDE0;
    color:#F3EDE0;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
</style>
</head><body>

<header>
  <div class="htop">
    <h1>长图文 · 模板库</h1>
    <p class="sub">12 套排印风格 × 每套 5 页成套 · 文字为主 · 点任意一页看大图</p>
    <span class="stat" id="stat"></span>
  </div>
  <p class="cmd">.venv/Scripts/python.exe -m http.server 8128 → /docs/prototypes/xhs/longform-art/index.html</p>
  <div class="filters" id="filters"></div>
</header>

<div class="list" id="list"></div>

<div id="viewer">
  <div class="vinfo" id="vinfo"></div>
  <button class="close" id="vclose" aria-label="关闭">×</button>
  <iframe id="vframe" scrolling="no"></iframe>
</div>

<script type="module">
import { TEMPLATES, FAMILIES, PAGE_KEYS } from './templates.js';

const $=(s)=>document.querySelector(s);
let family='全部';
const ROLE_CN={cover:'封面',opening:'开篇',dense:'正文',points:'清单',closing:'金句/结尾'};

function chip(label,value,cur,pick){
  const b=document.createElement('button');b.className='chip';b.textContent=label;
  b.setAttribute('aria-pressed',String(value===cur));b.onclick=()=>pick(value);return b;
}
function filters(){
  const box=$('#filters');box.textContent='';
  ['全部',...FAMILIES].forEach(f=>box.appendChild(chip(f,f,family,v=>{family=v;render();})));
}
function open(id,i){
  $('#vframe').src=`./tpl.html?id=${id}&page=${i}`;
  const t=TEMPLATES.find(x=>x.id===id);
  $('#vinfo').innerHTML=`<b>${t.name}</b><br>第 ${i+1} / ${PAGE_KEYS.length} 页 · ${ROLE_CN[PAGE_KEYS[i]]} · ${t.family} · ${t.pal}`;
  $('#viewer').classList.add('on');
}
function close(){$('#viewer').classList.remove('on');$('#vframe').src='about:blank';}
$('#vclose').onclick=close;
$('#viewer').onclick=(e)=>{if(e.target.id==='viewer')close();};
document.addEventListener('keydown',(e)=>{if(e.key==='Escape')close();});

function render(){
  filters();
  const list=TEMPLATES.filter(t=>family==='全部'||t.family===family);
  $('#stat').textContent=`${list.length} 套 / ${list.length*5} 页 · 每套封面→开篇→正文→清单→结尾`;
  const box=$('#list');box.textContent='';
  list.forEach((t,si)=>{
    const sec=document.createElement('section');sec.className='set';
    sec.innerHTML=`<div class="set-head"><b>${String(si+1).padStart(2,'0')} · ${t.name}</b>
      <span>${t.family} · ${t.pal} · 5 页成套 · 文字排印差异：字号 / 行距 / 字体 / 栏宽 / 序号体系</span></div>`;
    const row=document.createElement('div');row.className='pages';
    PAGE_KEYS.forEach((pk,i)=>{
      const d=document.createElement('div');d.className='pg';d.tabIndex=0;
      d.innerHTML=`<div class="frame"><iframe scrolling="no" loading="lazy"
        src="./tpl.html?id=${t.id}&page=${i}"></iframe></div>
        <div class="pl">${i+1}/5 · ${ROLE_CN[pk]}</div>`;
      d.onclick=()=>open(t.id,i);
      d.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(t.id,i);}};
      row.appendChild(d);
    });
    sec.appendChild(row);box.appendChild(sec);
  });
}
render();
</script>
</body></html>
