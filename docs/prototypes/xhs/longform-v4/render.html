<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>长图文骨架对照 · 渲染页</title>
<!--
  用法：render.html?skeleton=m01-magazine
        render.html?skeleton=all   → 5 页依次排开（总览用）

  ⚠️ 公平性约束：所有骨架共用同一段 @page 与同一套设计令牌，
     差异只来自 skeletons.js 里各自的排印语法。
-->
<style>
  /* ── 字体：自包含副本（assets/fonts/，从 pwa/public/fonts/cover/ 拷贝）──
     ⚠️ 不引用仓库根的 ../../../../pwa/... —— 那样这个目录单独拷走就打不开了。
     真源仍是 pwa/public/fonts/cover/，改字体后重新 cp 一次。 */
  @font-face { font-family: 'NotoSerifSC'; src: url('./assets/fonts/noto-serif-sc-400.woff2') format('woff2'); font-weight: 400; font-display: block; }
  @font-face { font-family: 'NotoSerifSC'; src: url('./assets/fonts/noto-serif-sc-700.woff2') format('woff2'); font-weight: 700; font-display: block; }
  @font-face { font-family: 'NotoSansSC'; src: url('./assets/fonts/noto-sans-sc-400.woff2') format('woff2'); font-weight: 400; font-display: block; }
  @font-face { font-family: 'NotoSansSC'; src: url('./assets/fonts/noto-sans-sc-700.woff2') format('woff2'); font-weight: 700; font-display: block; }

  :root {
    /* 设计令牌：与长图文 dune 色板一致，保证对照页与产品同族 */
    --paper: #f0e6d2;
    --ink: #1f1a14;
    --muted: #6f6557;
    --accent: #8f7650;
    --line: rgba(31, 26, 20, .22);
    --serif: 'NotoSerifSC', 'Songti SC', serif;
    --sans: 'NotoSansSC', 'PingFang SC', sans-serif;
    --mono: ui-monospace, 'Cascadia Mono', Menlo, monospace;
  }

  /* ── 唯一的 @page：所有骨架共用，页边距不参与版式差异 ── */
  @page {
    size: 1080px 1440px;
    margin: 96px;
    @top-left {
      content: string(doctitle);
      font: 400 20px/1 ui-monospace, Menlo, monospace;
      letter-spacing: .18em; color: #8a8070;
    }
    @bottom-right {
      content: counter(page) " / " counter(pages);
      font: 400 20px/1 ui-monospace, Menlo, monospace;
      letter-spacing: .12em; color: #8a8070;
    }
  }

  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { color: var(--ink); }
  h1 { string-set: doctitle content(); }

  /* 总览模式：页与页之间留缝，方便并排看 */
  body.all .pagedjs_pages { display: flex; gap: 24px; padding: 24px; }
  body.all .pagedjs_page { flex: none; }

  /* ── 对照标注条（原型 UI 层，不进 1080×1440 成品画布）──
     ⚠️ Paged.js 的 CSS polyfill 会把 position:fixed 重写成 static（实测），
        所以不能靠 fixed 隔离。改用「挂在 body 之外」：标注条放在 <html> 下
        的独立容器里，Paged.js 只分页 #content，永远不会碰它。
     ⚠️ 成品 PNG 用 modern-screenshot 截 .pagedjs_page，不含这条。 */
  #compare-bar {
    position: relative; left: 0; right: 0; bottom: 0; z-index: 9999;
    background: #1c1917; color: #f0e6d2;
    font: 400 13px/1.5 var(--sans);
    padding: 10px 18px; display: flex; gap: 26px; align-items: center;
    flex-wrap: wrap; box-shadow: 0 -2px 12px rgba(0,0,0,.18);
  }
  #compare-bar b { color: #e8c88a; font-weight: 700; }
  #compare-bar .cb-item { white-space: nowrap; }
  #compare-bar .cb-dim { color: #a89c8a; }
  #compare-bar .cb-note { flex: 1; min-width: 220px; color: #b9ab96; font-size: 12px; }
  #compare-bar .cb-dens { padding: 2px 9px; border-radius: 10px;
    background: #3a3128; color: #e8c88a; }
  body.all .compare-bar { position: static; }
  body.has-bar { padding-bottom: 58px; }
</style>

<!-- 骨架自己的 CSS 由脚本注入到这个 <style> 里 -->
<style id="skel-css"></style>
</head>
<body>

<div id="content"></div>

<script type="module">
import { SKELETONS, skeletonById } from './skeletons.js';
import { TOTAL_CHARS } from './fixture.js';

const params = new URLSearchParams(location.search);
const which = params.get('skeleton') || SKELETONS[0].id;

const list = which === 'all' ? SKELETONS : [skeletonById(which)];
if (which === 'all') document.body.classList.add('all');

/* 每种骨架各自的 CSS 用「同一份 style 标签 + 分页容器前缀」隔开。
   ⚠️ 总览模式下多套 CSS 会互相污染，所以给每套套一个 scope 类。 */
const cssParts = [];
const htmlParts = [];

list.forEach((sk, i) => {
  const scope = which === 'all' ? `.sk-${i}` : '';
  // 给 CSS 里的选择器加作用域前缀（跳过 body / @ 规则）
  const scoped = sk.css
    .split('\n')
    .map((line) => {
      if (!scope) return line;
      const m = line.match(/^(\s*)([^{@\s][^{]*?)\s*\{/);
      if (!m) return line;
      const [, indent, sel] = m;
      const sels = sel.split(',').map((s) => {
        const t = s.trim();
        return t === 'body' ? scope : `${scope} ${t}`;
      }).join(', ');
      return `${indent}${sels} {`;
    })
    .join('\n');
  cssParts.push(scoped);

  htmlParts.push(`<div class="skeleton-page sk-${i}" data-skeleton="${sk.id}">
    <div class="skeleton-body">${sk.html}</div>
  </div>`);
});

document.getElementById('skel-css').textContent = cssParts.join('\n');
document.getElementById('content').innerHTML = htmlParts.join('');

/* 等字体就绪再交给 Paged.js —— 字体未就绪就分页会导致页数漂移 */
await document.fonts.ready;

/* 动态加载 Paged.js 与截图库（放在字体之后，避免它抢跑） */
const loadScript = (src) => new Promise((resolve, reject) => {
  const s = document.createElement('script');
  s.src = src;
  s.onload = resolve;
  s.onerror = () => reject(new Error(`${src} 加载失败`));
  document.head.appendChild(s);
});
await loadScript('./vendor/paged.polyfill.js');
await loadScript('./vendor/modern-screenshot.js');

/* 对照标注条：把「差异」写成可读的数字，而不只是让人凭感觉。
   放在画布外（position:fixed），不占 1080×1440，也不参与分页。 */
const bar = document.createElement('div');
bar.id = 'compare-bar';
/* 挂在 <html> 下、<body> 之外：Paged.js 只处理 body 里的 #content，
   不会把标注条算进内容流，也不会把它重排进某一页。 */
document.documentElement.appendChild(bar);

function renderBar(sk, measured) {
  const m = measured || {};
  bar.innerHTML = `
    <span class="cb-item"><b>${sk.name}</b> <span class="cb-dim">${sk.id}</span></span>
    <span class="cb-item">本页字数 <b>${m.chars ?? '—'}</b> <span class="cb-dim">/ 夹具 ${TOTAL_CHARS}</span></span>
    <span class="cb-item">密度档 <span class="cb-dens">${sk.density}</span></span>
    <span class="cb-item">锚点数 <b>${sk.anchors.length}</b> <span class="cb-dim">${sk.anchors.join(' · ')}</span></span>
    <span class="cb-item">填充率 <b>${m.fill ?? '—'}</b> <span class="cb-dim">≥0.75 达标</span></span>
    <span class="cb-note">${sk.dimension} · ${sk.recipe}｜${sk.note}</span>
  `;
}

/* 实测：本页字数 + 内容填充率（口径与 probe_measure.py 一致） */
function measureFirstPage() {
  const pg = document.querySelector('.pagedjs_page');
  if (!pg) return {};
  const pr = pg.getBoundingClientRect();
  const content = pg.querySelector('.pagedjs_page_content');
  const chars = (content?.textContent || '').replace(/\s+/g, '').length;
  let top = Infinity, bottom = -Infinity;
  if (content) {
    const all = [...content.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,blockquote,figure,div,span')]
      .filter((el) => (el.textContent || '').trim());
    const leaves = all.filter((el) => !all.some((o) => o !== el && el.contains(o)));
    leaves.forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.height <= 0) return;
      top = Math.min(top, r.top - pr.top);
      bottom = Math.max(bottom, r.bottom - pr.top);
    });
  }
  const fill = top === Infinity ? 0 : +(((bottom - top) / (pr.height - 192)).toFixed(3));
  return { chars, fill };
}

if (which !== 'all') document.body.classList.add('has-bar');
renderBar(list[0], {});

/* 就绪信号：页数稳定（pagedjs:rendered 事件实测从不触发，见 GATE.md 陷阱 1） */
window.__skeletonsReady = false;
let last = -1, stableSince = 0;
const tick = () => {
  const n = document.querySelectorAll('.pagedjs_page').length;
  if (n === 0) { requestAnimationFrame(tick); return; }
  if (n !== last) { last = n; stableSince = performance.now(); requestAnimationFrame(tick); return; }
  if (performance.now() - stableSince > 700) {
    window.__skeletonsReady = true;
    window.__skeletonMeta = list.map((sk, i) => ({
      id: sk.id, name: sk.name, recipe: sk.recipe,
      dimension: sk.dimension, density: sk.density,
      anchors: sk.anchors, note: sk.note,
      densityMeasured: i === 0 ? measureFirstPage() : null,
    }));
    if (which !== 'all') renderBar(list[0], measureFirstPage());
    return;
  }
  requestAnimationFrame(tick);
};
requestAnimationFrame(tick);
</script>
</body>
</html>
