<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>公众号排版 · v7（真数据 · 183 套 · 真缩略图）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════
   SuperSu v5 —— 按 design-system/supersu/MASTER.md 重做
   ─────────────────────────────────────────────────────────────────────
   风格：Minimalism & Swiss Style（Skill: ui-ux-pro-max）
   Dials：Variance 4 / Motion 3 / Density 6
   规则来源（全部来自 Skill 的 119 条 UX 规则）：
     · Accessibility  : 对比度 ≥ 4.5:1，可见 focus ring
     · Touch          : 最小点击区 44×44（桌面可 32，但间距 ≥ 8）
     · Typography     : 正文 ≥ 12px（不是 5.5px！），line-height ≥ 1.5
     · Layout         : 文本内容限宽 65–75ch，不许横向滚动
     · Style          : 不混用 flat 与拟物；图标用 SVG 不用 emoji
   ══════════════════════════════════════════════════════════════════════ */

:root{
  /* ── 配色 C：暖纸朱砂（2026-11-02 用户定稿）──
     用户理由：「书卷气最足」。
     注：保留 MASTER.md 的间距 / 阴影 / 字号阶梯，只换色板。 */
  --color-primary:       #AF3E2B;   /* 朱砂 */
  --color-on-primary:    #FFFFFF;
  --color-secondary:     #96331F;
  --color-accent:        #AF3E2B;   /* 沿用主色（项目既有约定） */
  --color-on-accent:     #FFFFFF;
  --color-background:    #F7F4EE;   /* 暖米 */
  --color-foreground:    #191713;   /* 墨黑 */
  --color-card:          #FFFFFF;
  --color-card-fg:       #191713;
  --color-muted:         #F1EEE6;
  --color-muted-fg:      #9A9285;
  --color-border:        #EAE6DD;
  --color-destructive:   #DC2626;
  --color-ring:          #AF3E2B;

  /* ── 间距阶梯（Density 6）── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;

  /* ── 阴影层级 ── */
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 6px rgba(0,0,0,.10);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.10);

  /* ── 半径 ── */
  --radius-sm: 6px;
  --radius:    8px;
  --radius-lg: 12px;

  --top-h: 56px;
  --drawer-w: 520px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  overflow:hidden;
  font:14px/1.6 var(--font);   /* 正文 14px（不是 5.5px） */
  -webkit-font-smoothing:antialiased;
  font-feature-settings:'cv02','cv03','cv04','cv11';
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--color-ring);outline-offset:2px;border-radius:4px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D8CFC0;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#BCB3A0;background-clip:padding-box}

/* ══ 顶栏 ══ */
header.top{
  height:var(--top-h); display:flex; align-items:center; gap:var(--space-md);
  padding:0 var(--space-lg); background:var(--color-card);
  border-bottom:1px solid var(--color-border); position:relative; z-index:30;
}
.brand{display:flex;align-items:center;gap:var(--space-sm);font-weight:600;font-size:14px;letter-spacing:-.01em}
.brand-mark{
  width:26px;height:26px;border-radius:7px;
  background:var(--color-primary); color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:700;
}
.tabs{display:flex;gap:var(--space-xs);margin-left:var(--space-md)}
.tab{
  height:32px;padding:0 14px;border-radius:var(--radius);
  font-size:13px;font-weight:500;color:var(--color-muted-fg);
  transition:background 200ms ease,color 200ms ease;
}
.tab:hover{background:var(--color-muted);color:var(--color-foreground)}
.tab[aria-pressed="true"]{background:var(--color-primary);color:#fff;font-weight:600}
.tab:disabled{opacity:.4;cursor:not-allowed}
.top-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-sm)}
.badge{
  display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:99px;background:#EAF4EF;color:#2E7D5B;
  font-size:11.5px;font-weight:600;
}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--color-primary);flex:none}
.tbtn{
  height:32px;padding:0 12px;border-radius:var(--radius);
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:12.5px;font-weight:500;color:var(--color-foreground);
  transition:background 200ms ease,border-color 200ms ease;
}
.tbtn:hover{background:var(--color-muted);border-color:var(--color-primary)}
.tbtn.pri{background:var(--color-accent);border-color:var(--color-accent);color:#fff;font-weight:600}
.tbtn.pri:hover{opacity:.9}

/* ══ 顶栏下拉菜单（对齐 pwa/index.html 的 #menu-export / #menu）══
   线上两个菜单：#btn-export → 4 项导出；#btn-more ⋯ → 8 项操作。 */
.tmenu-wrap{position:relative}
.tmenu{
  position:absolute;top:calc(100% + 6px);right:0;z-index:70;
  min-width:186px;padding:5px;
  background:var(--color-card);border:1px solid var(--color-border);
  border-radius:var(--radius);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;gap:1px;
}
.tmenu[hidden]{display:none}
.tmenu button{
  display:flex;align-items:baseline;gap:8px;
  width:100%;padding:8px 10px;border-radius:var(--radius-sm);
  text-align:left;font-size:12.5px;color:var(--color-foreground);
  transition:background 160ms ease;
}
.tmenu button:hover{background:var(--color-muted)}
.tmenu .sub{font-size:11px;color:var(--color-muted-fg);margin-left:auto}

/* ══ 主区 ══ */
.stage{
  height:calc(100% - var(--top-h));
  display:grid;grid-template-columns:minmax(360px,600px) 1fr;
  grid-template-rows:minmax(0,1fr) auto;
  transition:padding-right 200ms ease;
}
body.browsing .stage{grid-template-columns:1fr;padding-right:var(--drawer-w)}
body.browsing .pane-edit{display:none}

.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane-edit{border-right:1px solid var(--color-border);background:var(--color-card)}
.pane-head{
  height:48px;padding:0 var(--space-lg);display:flex;align-items:center;gap:var(--space-sm);
  flex:none;border-bottom:1px solid var(--color-border);
}
.pane-title{
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--color-muted-fg);
}
.pane-actions{margin-left:auto;display:flex;align-items:center;gap:var(--space-sm)}
.gbtn{
  height:28px;padding:0 11px;border-radius:var(--radius-sm);
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:12px;font-weight:500;color:var(--color-foreground);
  transition:background 200ms ease;
}
.gbtn:hover{background:var(--color-muted)}
.pbtn{
  height:32px;padding:0 16px;border-radius:var(--radius);
  background:var(--color-accent);color:#fff;font-size:13px;font-weight:600;
  transition:opacity 200ms ease,transform 200ms ease;
}
.pbtn:hover{opacity:.92;transform:translateY(-1px)}
.cnt{font-size:11.5px;color:var(--color-muted-fg);font-variant-numeric:tabular-nums}

/* 编辑区：限宽 65–75ch（Skill: Layout/Container Width） */
#input{
  flex:1;width:100%;max-width:none;border:0;outline:0;resize:none;
  background:transparent;padding:var(--space-lg);
  font:14px/1.75 var(--font);color:var(--color-foreground);
}
#input::placeholder{color:#B0A896}

/* ══ 解析条 ══ */
.parse-bar{
  flex:none;border-top:1px solid var(--color-border);
  padding:var(--space-sm) var(--space-lg);
  display:flex;align-items:center;gap:var(--space-sm);flex-wrap:wrap;
  background:#FBF8F2;
}
.pp-select{
  height:28px;padding:0 9px;border:1px solid var(--color-border);
  border-radius:var(--radius-sm);background:var(--color-card);
  font-size:12px;color:var(--color-foreground);
}
.parse-body{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.pchip{
  height:24px;padding:0 9px;border-radius:var(--radius-sm);
  background:var(--color-card);border:1px solid var(--color-border);
  font-size:11.5px;color:var(--color-foreground);
  display:flex;align-items:center;gap:5px;white-space:nowrap;
}
.pchip b{color:var(--color-primary);font-weight:700}
.pchip.hint{background:none;border:0;color:var(--color-muted-fg)}

/* ══ 页尾与内容（折叠块，在编辑区底部）══ */
.footer-box{
  flex:none; border-top:1px solid var(--color-border);
  background:var(--color-card);
}
.footer-box summary{
  display:flex; align-items:center; gap:8px; padding:10px var(--space-lg);
  cursor:pointer; list-style:none; font-size:12px;
}
.footer-box summary::-webkit-details-marker{display:none}
.footer-box summary::after{
  content:'›'; margin-left:auto; color:var(--color-muted-fg);
  font-size:14px; transition:transform 200ms ease;
}
.footer-box[open] summary::after{transform:rotate(90deg)}
.footer-box summary:hover{background:var(--color-muted)}
.fb-t{font-weight:600;color:var(--color-foreground)}
.fb-s{font-size:11px;color:var(--color-muted-fg)}
.fb-body{padding:0 var(--space-lg) var(--space-md)}
.fb-sw{
  display:flex; align-items:flex-start; gap:8px; padding:7px 0; cursor:pointer;
}
.fb-sw input{margin-top:3px;accent-color:var(--color-primary);width:14px;height:14px;flex:none}
.fb-sw b{display:block;font-size:12px;font-weight:600;color:var(--color-foreground)}
.fb-sw em{
  display:block;font-style:normal;font-size:11px;color:var(--color-muted-fg);
  line-height:1.5;margin-top:1px;
}
#tail-md{
  width:100%;margin:4px 0 0;padding:9px 10px;resize:vertical;
  border:1px solid var(--color-border);border-radius:var(--radius-sm);
  background:var(--color-background);font:12px/1.7 var(--font);
  color:var(--color-foreground);outline:0;
}
#tail-md:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(175,62,43,.10)}
.fb-note{margin:5px 0 0;font-size:11px;color:var(--color-muted-fg)}
.fb-sep{height:1px;background:var(--color-border);margin:10px 0 4px}

/* 预览里的页尾 */
.pv-tail{
  margin-top:22px;padding-top:16px;border-top:1px dashed var(--color-border);
  font-size:13px;color:#4B5563;
}
.pv-tail b{color:#1F2937}
/* 导语（首段浅底） */
.pv-doc .lead{
  background:var(--color-background);border-radius:var(--radius-sm);
  padding:14px 16px;margin-bottom:16px;
}
/* 链接网址后缀 */
.pv-doc .url{
  font-size:11.5px;color:#8A8279;word-break:break-all;
}

/* ══ 二级折叠区：微调（背景/配色等降级到这里）══ */
/* 微调区固定在抽屉底部（sticky）。
   ⚠️ 原实现是普通块，被 164 套主题网格推到最底部，要滚到底才看见（截图暴露）。
   固定后与主题网格互不干扰：网格自己滚，微调条一直在。 */
.tweak{
  flex:none; margin:0; padding:0;
  border-top:1px solid var(--color-border);
  border-left:0; border-right:0; border-bottom:0; border-radius:0;
  background:var(--color-card);
  position:relative; z-index:2;
}
/* 展开时限制最大高度，内部自己滚，不把抽屉撑爆 */
.tweak[open] .tw-body{
  max-height:46vh; overflow-y:auto;
}
.tweak summary{
  display:flex; align-items:center; gap:8px; padding:11px var(--space-lg);
  cursor:pointer; list-style:none; font-size:12px;
}
.tweak summary::-webkit-details-marker{display:none}
.tweak summary::after{
  content:'⌃'; margin-left:auto; color:var(--color-muted-fg);
  font-size:12px; transition:transform 200ms ease;
}
.tweak[open] summary::after{transform:rotate(180deg)}
.tweak summary:hover{background:var(--color-muted)}
.tw-t{font-weight:600;color:var(--color-foreground)}
.tw-s{font-size:10.5px;color:var(--color-muted-fg)}
.tw-body{border-top:1px solid var(--color-border);padding:12px}
.tw-sec + .tw-sec{margin-top:14px;padding-top:12px;border-top:1px dashed var(--color-border)}
.tw-h{font-size:11.5px;font-weight:600;color:var(--color-foreground);margin-bottom:6px}
.tw-note{margin:0 0 8px;font-size:10.5px;color:var(--color-muted-fg);line-height:1.5}
.tw-bgs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tw-bgs .d-card{min-height:0}
.tw-bgs .d-prev{height:64px}
.tw-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ══ 设置弹窗（低频项）══ */
.setdlg{
  width:min(620px,94vw); max-height:86vh; padding:0; border:0;
  border-radius:var(--radius-xl); box-shadow:0 24px 64px rgba(60,40,20,.22);
  background:var(--color-background); color:var(--color-foreground);
  overflow:hidden;
}
.setdlg::backdrop{ background:rgba(40,30,20,.34); backdrop-filter:blur(3px); }
.sd-head{
  display:flex; align-items:center; gap:10px;
  padding:14px var(--space-lg); border-bottom:1px solid var(--color-border);
  background:var(--color-card);
}
.sd-t{ font-size:14px; font-weight:600; }
.sd-sub{ font-size:11px; color:var(--color-muted-fg); }
.sd-x{
  margin-left:auto; border:0; background:transparent; cursor:pointer;
  font-size:18px; line-height:1; color:var(--color-muted-fg); padding:2px 6px;
  border-radius:var(--radius-sm);
}
.sd-x:hover{ background:var(--color-muted); color:var(--color-foreground); }
.sd-body{ max-height:calc(86vh - 52px); overflow-y:auto; padding:var(--space-md) var(--space-lg) var(--space-xl); }
.sd-sec + .sd-sec{ margin-top:20px; padding-top:16px; border-top:1px solid var(--color-border); }
.sd-h{ font-size:12px; font-weight:600; color:var(--color-primary); margin-bottom:10px; letter-spacing:.02em; }
.sd-item{ display:flex; gap:16px; align-items:center; padding:9px 0; }
.sd-item.sd-col{ display:block; }
.sd-item + .sd-item{ border-top:1px dashed var(--color-border); }
.sd-l{ flex:1; min-width:0; }
.sd-l b{ display:block; font-size:12.5px; font-weight:600; }
.sd-l em{ display:block; font-style:normal; font-size:11px; color:var(--color-muted-fg); line-height:1.5; margin-top:2px; }
.sd-ctl{ display:flex; align-items:center; gap:10px; flex:none; }
.sd-ctl input[type=range]{ width:130px; accent-color:var(--color-primary); cursor:pointer; }
.sd-val{ font-size:11.5px; color:var(--color-muted-fg); min-width:42px; text-align:right; }
.sd-btns{ display:flex; gap:8px; flex-wrap:wrap; }

/* ══ 预览 ══ */
/* ── 预览区：手机外壳（照线上 pwa/src/style.css:245）── */
.preview-wrap{
  flex:1;min-height:0;overflow:auto;padding:var(--space-lg);
  background:var(--color-background);
  display:flex;align-items:center;justify-content:center;
}
.phone-shell{
  width:100%;max-width:420px;height:100%;
  display:flex;flex-direction:column;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:16px;              /* 线上 --radius-xl */
  box-shadow:var(--shadow-lg);
  overflow:hidden;
}
.wx-nav{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;height:40px;font-size:12px;color:var(--color-muted-fg);
  background:var(--color-background);border-bottom:1px solid var(--color-border);
}
.wx-nav-title{
  font-weight:600;color:var(--color-foreground);
  max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* 网页模式：外壳撑满（线上 .preview-wrap.web .phone-shell） */
.preview-wrap.web .phone-shell{max-width:100%;border-radius:var(--radius)}

/* 手机里的正文：13px / 1.8，与真实公众号观感接近 */
.pv-doc{
  flex:1;min-height:0;overflow-y:auto;
  padding:18px 16px;
  font-size:13.5px;line-height:1.85;color:#1F2937;
  background:var(--color-card);
}
.pv-doc h1{font-size:19px;line-height:1.35;margin:0 0 8px;font-weight:700}
.pv-doc .h2s{font-size:15px;font-weight:700;margin:18px 0 8px}
.pv-doc p{margin:0 0 12px}
.pv-doc ul{margin:0 0 12px;padding-left:18px}
.pv-doc li{margin-bottom:5px}
.pv-doc blockquote{
  margin:14px 0;padding:12px 14px;border-left:3px solid var(--color-primary);
  background:var(--color-background);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:13px;color:#374151;
}

/* ══ 底部两行 ══ */
.bars{
  grid-column:1 / -1;display:flex;flex-direction:column;
  min-height:0;position:relative;
}
body.browsing .bars{display:none}

.laybar{
  flex:none;height:36px;display:flex;align-items:center;gap:var(--space-sm);
  padding:0 var(--space-lg);background:var(--color-card);
  border-top:1px solid var(--color-border);font-size:12px;
}
.laybar .ll{
  font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--color-muted-fg);flex:none;
}
.laybar .lv{color:var(--color-foreground);font-weight:600;flex:none}
.chev{
  width:22px;height:22px;border-radius:var(--radius-sm);display:grid;place-items:center;
  color:var(--color-muted-fg);font-size:11px;flex:none;transition:background 200ms ease;
}
.chev:hover{background:var(--color-muted);color:var(--color-foreground)}
.lay-quick{
  display:flex;gap:var(--space-xs);align-items:center;overflow:hidden;flex:1;min-width:0;
  mask-image:linear-gradient(to right,#000 90%,transparent);
  -webkit-mask-image:linear-gradient(to right,#000 90%,transparent);
}
.lay-quick button{
  flex:none;height:24px;padding:0 9px;border-radius:var(--radius-sm);
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:11.5px;color:var(--color-muted-fg);
}
.lay-quick button[aria-pressed="true"]{
  border-color:var(--color-primary);background:#EAF4EF;color:#2E7D5B;font-weight:600;
}
.laybar .rr2{margin-left:auto;color:var(--color-muted-fg);flex:none;font-size:11.5px}

/* 版式弹层 */
.laypop{
  position:absolute;left:0;right:0;bottom:92px;z-index:35;
  background:var(--color-card);border-top:1px solid var(--color-border);
  box-shadow:0 -10px 15px rgba(0,0,0,.10);
  padding:var(--space-md) var(--space-lg);display:flex;flex-direction:column;gap:var(--space-sm);
}
.laypop .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.laypop .gl{
  font-size:11px;font-weight:600;color:var(--color-muted-fg);
  flex:none;white-space:nowrap;min-width:44px;
}
.laypop .gl em{font-style:normal;font-weight:400;opacity:.8;margin-left:4px}
.laypop .lc{
  height:28px;padding:0 11px;border-radius:var(--radius-sm);
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:12px;color:var(--color-foreground);
  transition:background 200ms ease,border-color 200ms ease;
}
.laypop .lc:hover{background:var(--color-muted);border-color:var(--color-primary)}
.laypop .lc.on{
  border-color:var(--color-primary);background:#EAF4EF;color:#2E7D5B;font-weight:600;
}

.style-bar{
  height:64px;border-top:1px solid var(--color-border);
  background:var(--color-card);display:flex;align-items:center;gap:var(--space-sm);
  padding:0 var(--space-lg);
}
.caps{
  display:flex;gap:var(--space-sm);overflow-x:auto;flex:1;padding:6px 0;
  scrollbar-width:none;
  mask-image:linear-gradient(to right,#000 88%,transparent);
  -webkit-mask-image:linear-gradient(to right,#000 88%,transparent);
}
.caps::-webkit-scrollbar{display:none}
.cap{
  flex:none;display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;
  border-radius:99px;border:1px solid var(--color-border);background:var(--color-card);
  font-size:12.5px;color:var(--color-foreground);white-space:nowrap;
  transition:border-color 200ms ease,background 200ms ease;
}
.cap:hover{border-color:var(--color-primary);background:var(--color-muted)}
.cap[aria-pressed="true"]{
  border-color:var(--color-primary);background:#EAF4EF;color:#2E7D5B;font-weight:600;
}
.cap-sw{
  width:14px;height:14px;border-radius:50%;position:relative;overflow:hidden;flex:none;
  border:1px solid rgba(0,0,0,.10);
}
.cap-sw::after{content:'';position:absolute;right:0;top:0;width:7px;height:14px;background:var(--sw2)}
.smore{
  flex:none;height:34px;padding:0 14px;border-radius:99px;
  background:var(--color-foreground);color:#fff;font-size:12.5px;font-weight:600;
  transition:opacity 200ms ease;
}
.smore:hover{opacity:.9}

/* ══════════════════════════════════════════════════════════════════════
   抽屉 —— 整体重做
   ══════════════════════════════════════════════════════════════════════ */
.drawer-mask{
  position:fixed;inset:0;z-index:40;background:rgba(19,78,74,.20);
  backdrop-filter:blur(2px);
}
.drawer{
  position:fixed;right:0;top:0;height:100%;width:min(600px,94vw);z-index:41;
  background:var(--color-background);border-left:1px solid var(--color-border);
  display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(19,78,74,.12);
}
body.browsing .drawer{width:var(--drawer-w)}
body.browsing .drawer-mask{display:none}

.d-head{
  flex:none;height:var(--top-h);padding:0 var(--space-md) 0 var(--space-lg);
  display:flex;align-items:center;gap:var(--space-sm);
  border-bottom:1px solid var(--color-border);background:var(--color-card);
}
.d-head b{font-size:14px;font-weight:600;flex:none;letter-spacing:-.01em}
.d-search{
  flex:1;min-width:0;height:34px;padding:0 12px;
  border:1px solid var(--color-border);border-radius:var(--radius);
  background:var(--color-background);font:13px var(--font);color:var(--color-foreground);
  outline:0;transition:border-color 200ms ease,box-shadow 200ms ease;
}
.d-search:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(175,62,43,.10)}
.d-search::placeholder{color:#B0A896}
.d-x{
  width:30px;height:30px;border-radius:var(--radius-sm);display:grid;place-items:center;
  color:var(--color-muted-fg);font-size:16px;transition:background 200ms ease;
}
.d-x:hover{background:var(--color-muted);color:var(--color-foreground)}

/* 顶层两个并列 tab */
/* 两个 tab：改成分段控件（segmented control）。
   ⚠️ 原实现是两块大方块 + 副标题，视觉上像两个按钮堆着，很难看（用户 2026-11-02 反馈）。
   现在：细边框胶囊、单行文字、选中用主题色实底，副标题降为右侧小字。 */
.mode-tabs{
  flex:none;display:flex;gap:4px;margin:var(--space-md) var(--space-lg) 0;
  padding:4px;border-radius:99px;
  background:var(--color-muted);
}
.mode-tabs button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 12px;border-radius:99px;
  transition:background 200ms cubic-bezier(.16,1,.3,1), box-shadow 200ms ease, color 200ms ease;
}
.mode-tabs button:hover:not([aria-pressed="true"]){background:rgba(255,255,255,.5)}
.mode-tabs button b{font-size:12.5px;font-weight:600;color:var(--color-muted-fg);transition:color 200ms ease}
.mode-tabs button span{font-size:10.5px;color:var(--color-muted-fg);opacity:.75}
.mode-tabs button[aria-pressed="true"]{
  background:var(--color-card);
  box-shadow:0 1px 3px rgba(60,40,20,.13), 0 0 0 1px rgba(60,40,20,.06);
}
.mode-tabs button[aria-pressed="true"] b{color:var(--color-primary)}
.mode-tabs button[aria-pressed="true"] span{color:var(--color-primary);opacity:.72}

/* 分段 */
.sec{flex:none;padding:var(--space-md) var(--space-lg);border-bottom:1px solid var(--color-border)}
.sec-h{display:flex;align-items:center;gap:var(--space-sm);margin-bottom:10px}
.sec-n{
  width:20px;height:20px;border-radius:50%;background:var(--color-foreground);color:#fff;
  font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;
}
.sec-t{font-size:13px;font-weight:600;color:var(--color-foreground)}
.sec-hint{font-size:11.5px;color:var(--color-muted-fg);margin-left:auto;white-space:nowrap}

/* 可折叠段（②③④）：收起时只留一行，摘要值仍在 .sec-hint 里常显。
   收纳收益实测：550px 顶部 → 222px，风格网格可见 432px → 778px。 */
.sec.is-fold{padding-top:10px;padding-bottom:10px}
.sec.is-fold>.sec-h{margin-bottom:0;cursor:pointer;user-select:none}
.sec.is-fold[data-open="1"]>.sec-h{margin-bottom:10px}
.sec-x{
  margin-left:6px;flex:none;color:var(--color-muted-fg);
  font-size:10px;line-height:1;
  transition:transform 180ms ease;
}
.sec.is-fold[data-open="1"] .sec-x{transform:rotate(90deg)}
.sec.is-fold>.sec-h:hover .sec-t{color:var(--color-primary)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{
  height:28px;padding:0 12px;border-radius:99px;
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:12px;color:var(--color-foreground);
  transition:background 200ms ease,border-color 200ms ease;
}
.fchip:hover{background:var(--color-muted);border-color:var(--color-primary)}
.fchip[aria-pressed="true"]{
  background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600;
}

.group-lab{
  font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--color-muted-fg);margin:10px 0 6px;display:flex;align-items:center;gap:6px;
}
.group-lab:first-of-type{margin-top:0}
.group-lab .why{
  font-weight:400;letter-spacing:0;text-transform:none;font-size:11px;opacity:.85;
}
.dl-chip{
  height:30px;padding:0 12px;border-radius:var(--radius-sm);
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:12px;color:var(--color-foreground);
  transition:background 200ms ease,border-color 200ms ease;
}
.dl-chip:hover{background:var(--color-muted);border-color:var(--color-primary)}
.dl-chip[aria-pressed="true"]{
  border-color:var(--color-primary);background:#EAF4EF;color:#2E7D5B;font-weight:600;
}
.dl-chip:disabled{opacity:.4;cursor:not-allowed}

.switches{display:flex;gap:var(--space-lg);flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-foreground);cursor:pointer}
.sw input{accent-color:var(--color-primary);width:15px;height:15px;cursor:pointer}
.sw em{font-style:normal;color:var(--color-muted-fg);font-size:11px}

/* 字号行（B-2，抽屉内常驻） */
.fs-row{display:flex;align-items:center;gap:8px}
.fs-row input[type=range]{flex:1;min-width:0;accent-color:var(--color-primary)}
.fs-step{
  width:26px;height:26px;flex:none;border-radius:var(--radius-sm);
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:14px;line-height:1;display:grid;place-items:center;
  color:var(--color-foreground);transition:background 160ms ease,border-color 160ms ease;
}
.fs-step:hover:not(:disabled){background:var(--color-muted);border-color:var(--color-primary)}
.fs-step:disabled{opacity:.35;cursor:default}
.fs-reset{
  height:26px;padding:0 10px;flex:none;border-radius:var(--radius-sm);
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:11.5px;color:var(--color-muted-fg);transition:background 160ms ease;
}
.fs-reset:hover{background:var(--color-muted)}

/* 主题网格 */
/* 两个 tab 面板必须是 flex 容器，否则内容会把底部的微调区顶出视口 */
#pane-theme, #pane-kit{
  flex:1; min-height:0;
  display:flex; flex-direction:column;
}
#pane-theme[hidden], #pane-kit[hidden]{ display:none; }

.d-grid{
  flex:1;min-height:0;overflow-y:auto;
  padding:var(--space-md) var(--space-lg) var(--space-xl);
  display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));
  gap:var(--space-md);align-content:start;
  /* ⚠️ 两条都是硬性要求，少一条卡片就会叠成一坨（2026-11-03 有头实测）：
     ① grid-auto-rows:max-content —— .d-grid 是 flex 子项（flex:1 把高度钉成可用空间），
        自动行会被压成 1.33px 高、82 行全挤在 422px 里；实测相邻行 top 只差 17.5px，
        而卡片本身 176px，164 张互相重叠，视觉上就是一片细条纹。
     ② align-items:start —— 行高不够时卡片会被 flex 压缩、.d-card 的 overflow:hidden
        把 min-height:auto 变成 0，缩略图被压到 11px。 */
  grid-auto-rows:max-content;
  align-items:start;
}
.d-card{
  display:flex;flex-direction:column;border-radius:var(--radius-lg);
  border:1px solid var(--color-border);background:var(--color-card);
  overflow:hidden;text-align:left;
  transition:border-color 200ms ease,box-shadow 200ms ease,transform 200ms ease;
}
.d-card:hover{
  border-color:var(--color-primary);box-shadow:var(--shadow-md);transform:translateY(-2px);
}
.d-card[aria-pressed="true"]{
  border-color:var(--color-primary);box-shadow:0 0 0 1px var(--color-primary) inset;
}
/* 预览区比例必须与缩略图原始比例一致，否则 object-fit:cover 会裁掉左右内容
   （实测 480×240 塞进 221×132 的框 → 左右各裁 8%，标题贴着左缘有被切风险）。
   配色缩略图 480×240 = 2:1；整篇设计缩略图 480×360 = 4:3。用 aspect-ratio 而不是写死高度，
   这样列宽变化（两列 / 一列）时也不会裁。 */
.d-prev{
  aspect-ratio:2 / 1;position:relative;overflow:hidden;background:var(--color-card);
}
/* 整篇设计卡片：缩略图 4:3，卡片高一点，才装得下标题+正文+列表 */
#grid-kit .d-prev{ aspect-ratio:4 / 3; }
/* 缩略图：与线上 .d-thumb 同规则（object-fit:cover + object-position:top center） */
.d-thumb{
  width:100%;height:100%;object-fit:cover;object-position:top center;
  display:block;
}
/* 角标放右下角 —— 左上角会压住标题首字（实测「时代周刊」被压成「整篇去了趟海边」） */
.d-kit{
  position:absolute;right:6px;bottom:6px;z-index:2;
  padding:2px 7px;border-radius:4px;
  background:rgba(19,78,74,.78);color:#fff;
  font-size:9.5px;line-height:1.6;letter-spacing:.03em;font-weight:500;
}
.d-body{
  padding:10px 12px;display:flex;align-items:center;gap:6px;
  border-top:0;background:var(--color-foreground);
}
.d-fav{
  width:24px;height:24px;display:grid;place-items:center;border-radius:5px;
  color:rgba(247,244,238,.55);font-size:13px;transition:background 200ms ease,color 200ms ease;
  flex:none;
}
.d-fav:hover{background:rgba(255,255,255,.12);color:#fff}
.d-fav[data-on="1"]{color:#E8A08C}

/* ══ 卡片标题：两个 tab 共用同一条规格（2026-11-03 用户定）════════
   用户原话：「只需要突出的标题！在配色主题这边也是一样，标题要统一啊！
   不然两个 tag 完全不同。」
   所以 .d-name 不再分 theme / kit 两套 —— 衬线、加深、加大，
   164 套配色主题与 19 套整篇设计读起来是同一套目录。
   之前的两版都被推翻：12.5px 灰字太弱（读不出）、衬线编号 + desc
   太啰嗦（用户不要简介和描述）。现在只剩标题一件事。

   2026-11-03 又一轮（用户选 C 案）：标题条改**深墨底白字**。
   前两版实测失败的原因不是对比度，而是「纸白缩略图 + 白色标题条」
   之间明度差只有 1.11:1，两张白纸贴在一起，加多少线都分不开。
   反白是唯一能一次性拉开 15:1 的做法，且两侧 tab 统一。
   ⚠️ 底色取 --color-foreground（墨 #191713），不用纯黑，保留暖调。 */
.d-name{
  flex:1;min-width:0;
  font:700 15px/1.3 Georgia,'Songti SC','SimSun',serif;
  letter-spacing:.02em;color:#F7F4EE;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ══ 整篇设计卡片（2026-11-03 · 第四版：C 案深墨底白字）══════════
   演进：① 彩色竖线 + 徽章 + desc → 用户「太 ai 了」
        ② 白底 + 1px 细线 → 用户「区别还是不太明显」
        ③ 白底 + 缩略图投影 → 仍是白压白，用户「区别还是不太明显」
        ④ 深墨底白字（当前）→ 对比 15:1，且两侧 tab 统一

   第三版为什么还不行，实测数据：缩略图底部平均色 rgb(243,243,242)，
   标题条 rgb(255,255,255)，明度对比 1.11:1 —— 再怎么加线加影，
   同一块白面上放两个白东西，眼睛就是分不开。

   本版唯一改动：标题条反白。缩略图不再留白边、不再加投影，
   保留 4:3 满幅 —— 上一条黑条已经足够形成边界，不需要再叠第二层修饰。
   两 tab 的卡片结构至此完全一致，只有缩略图比例不同（4:3 vs 2:1）。 */
#grid-kit .d-kit{ display:none; }            /* 冗余徽章，本 tab 零信息量 */

/* ══ 整篇设计卡片（2026-11-03 · 第三版）═══════════════════════
   演进：① 彩色竖线 + 徽章 + desc → 用户「太 ai 了」；
        ② 白底标题条 + 1px 细线 → 用户「区别还是不太明显」。
   第二版为什么失败，实测数据说得很清楚：
        缩略图底部平均色 rgb(243,243,242)（文章预览本身就是白纸）
        标题条底色       rgb(255,255,255)
                        明度对比 1.11:1 —— 两张白纸贴在一起
        分隔线 #EAE6DD on #FFFFFF
                        明度对比 1.25:1 —— 等于没画
   结论：线再深、字再黑都没用，因为「白图 + 白条」之间不存在明暗差。
   要分开两张白纸，只能靠**阴影**——渐变不依赖色差，
   在任何底色的缩略图下方都能形成边界。
   做法：缩略图四周留出卡片白边（margin）+ 一圈细描边 + 底部投影，
   让它从标题条上「浮」起来；标题条不再需要 border-top。 */
/* 第三版遗留的「缩略图留白 + 投影」在 C 案下反而脏：黑条的边界已经够硬，
   再压一圈投影就是两层修饰。故一并删除，缩略图恢复满幅 4:3。 */


/* 第 4 段配色微调 */
.d-custom{
  flex:none;border-top:1px solid var(--color-border);
  padding:var(--space-sm) var(--space-lg);display:flex;gap:var(--space-md);
  align-items:center;flex-wrap:wrap;background:var(--color-card);
}
.dc-label{font-size:12px;font-weight:600;color:var(--color-foreground)}
.dc-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-muted-fg)}
.dc-item input{
  width:26px;height:26px;padding:0;border:1px solid var(--color-border);
  border-radius:var(--radius-sm);background:none;cursor:pointer;
}
.dc-reset{
  margin-left:auto;height:28px;padding:0 12px;border-radius:var(--radius-sm);
  border:1px solid var(--color-border);background:var(--color-card);
  font-size:12px;color:var(--color-foreground);
}

/* toast */
#toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(8px);
  background:var(--color-foreground);color:#fff;padding:10px 18px;
  border-radius:var(--radius);font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity 200ms ease,transform 200ms ease;
  z-index:60;white-space:nowrap;max-width:80vw;box-shadow:var(--shadow-lg);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="brand-mark">S</span>SuperSu</div>
  <nav class="tabs">
    <button class="tab" aria-pressed="true">公众号排版</button>

    <button class="tab" disabled>小红书长图文</button>
  </nav>
  <div class="top-right">
    <span class="badge"><i></i>引擎就绪</span>
    <button class="tbtn" id="btn-settings" title="设置">⚙</button>

    <!-- 导出菜单（对齐线上 #btn-export → #menu-export 4 项） -->
    <div class="tmenu-wrap">

        <button data-exp="md">Markdown<span class="sub">源文件</span></button>

    <div class="tmenu-wrap">

</header>

<!-- ══ 设置弹窗（低频项集中在这里，2026-11-02 用户定）══
     频率分层原则（HANDOFF §6.2「全弹窗版被否」的教训）：
     高频常驻（主题/版式/段落）· 低频进弹窗（字号/背景/页尾/内容开关/配色微调） -->
<dialog id="settings-dlg" class="setdlg">
  <div class="sd-head">
    <span class="sd-t">设置</span>
    <span class="sd-sub">配一次就不再动的东西放这里</span>
    <button class="sd-x" id="sd-close" aria-label="关闭">×</button>
  </div>

  <div class="sd-body">
    <!-- 排版 -->
    <div class="sd-sec">
      <div class="sd-h">排版</div>

      <div class="sd-item sd-col">
        <div class="sd-l">
          <b>背景</b>
          <em id="set-bg-note">只改整页底色，不动标题/正文/列表样式，与配色自由组合。</em>
        </div>
        <div class="tw-bgs" id="set-grid-bg"></div>
      </div>

      <div class="sd-item">
        <div class="sd-l">
          <b>配色微调</b>
          <em id="c-note">临时改当前主题的底色/正文/强调色，不影响已保存的主题。</em>
        </div>
        <div class="sd-ctl">
          <label class="dc-item">底色<input type="color" id="c-bg" value="#FFFFFF"></label>
          <label class="dc-item">正文<input type="color" id="c-text" value="#134E4A"></label>
          <label class="dc-item">强调<input type="color" id="c-acc" value="#FF0000"></label>
          <button class="dc-reset" id="c-reset">恢复</button>
        </div>
      </div>
    </div>

    <!-- 内容 -->

/* 配色主题（示例数据，真实项目从 themes/index.json 读） */

  { id:'grid',   n:'细网格',   desc:'工程感方格，适合技术文',  bg:'#FCFCFC',
    css:'linear-gradient(rgba(120,110,95,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(120,110,95,.055) 1px,transparent 1px)' },
];
const BG_SIZE = { grid:'18px 18px' };

const SAMPLE = `周末去了趟海边

第一天：什么也没做

两天里我没看手机，也没带相机。风把头发吹得乱七八糟，我坐在礁石上看了很久的海。

下午四点到的，光刚好落在水面上，碎成一片一片。我什么也没做，就坐着。

「后来我才发现，那天唯一拍下的照片，是手机彻底没电之前随手按的一张。」

第二天：五点起床看日出

· 五点起床，裹着被子坐在阳台上
· 六点零七分，太阳从海平面出来

中午退房，在车站买了一个面包。回来的路上我想，好像什么也没发生，但好像又发生了什么。`;

/* ══════════════════════════════════════════════════════════════════════
   状态
   ══════════════════════════════════════════════════════════════════════ */
const S = {
  mode: 'theme',
  bgId: 'plain',            // 背景 style（B-1）
  fontSize: 15,             // 正文字号（B-2）
  tailOn: true,             // 页尾开关（A-1）
  /* 页尾默认文案：用数组拼装，避免在单引号字符串里出现真实换行（会 SyntaxError） */
  tailMd: [
    '**关于作者**',
    '专注公众号排版与内容设计，持续分享可复用的排版方法。',
    '**如果觉得有价值，请点赞、分享或收藏。**',
  ].join(String.fromCharCode(10, 10)),
  optLinks: true,           // 显示链接网址（A-2）
  optLead: true,            // 首段作为导语（B-3）
  optTitle: false,          // 预览公众号标题
  themeId: 'su-biz-azure',
  lay: '',
  fam: 'all',
  blocks: { quote:true, data:false, tip:true },
  search: '',
  /* 配色微调（2026-11-03 用户定）：null = 用主题原色；
     一旦用户动过色块就变成 {bg,ink,acc} 整体覆盖。切主题时清回 null。 */
  tune: null,
};
const KIT_BY_ID = () => Object.fromEntries(KITS.map(k => [k.id, k]));
const isKit = () => !!KIT_BY_ID()[S.themeId];

/* 收藏 —— ⚠️ 原型阶段只做交互骨架（2026-11-03 用户定）：
   内存里的一个 Set，不写 localStorage。原型的职责是让人看出"点了会怎样"，
   真实持久化留给实现阶段（线上已有完整实现，见 pwa/src/app.js 的 LS.fav + toggleFav，
   不要另造一套）。刷新页面收藏清空是**预期**，不是 bug。 */
const FAV = new Set();
function favList() { return [...FAV]; }
function toggleFav(id) {
  if (FAV.has(id)) FAV.delete(id); else FAV.add(id);
  renderDrawer();
  renderCaps();
}

function themeNow() {
  if (isKit()) {
    const k = KIT_BY_ID()[S.themeId];
    return { n: k.name, bg: k.colors.background || '#fff', acc: k.colors.accent || '#000' };
  }
  return THEMES.find(t => t.id === S.themeId) || THEMES[0];
}
const layNow = () => isKit() ? (KIT_BY_ID()[S.themeId].lockedLayout || '') : S.lay;

/* ══════════════════════════════════════════════════════════════════════
   渲染预览
   ══════════════════════════════════════════════════════════════════════ */
function parse(text) {
  const lines = text.split('\n').map(l => l.trim());
  const out = { title:'', secs:[] };
  let cur = null, first = true;
  for (const l of lines) {
    if (!l) continue;
    if (first) { out.title = l; first = false; continue; }
    if (/^[·•\-]\s*/.test(l)) {
      if (!cur) { cur = { h:'', body:[], list:[] }; out.secs.push(cur); }
      (cur.list = cur.list || []).push(l.replace(/^[·•\-]\s*/, ''));
      continue;
    }
    if (/^[「"].*[」"]$/.test(l)) {
      if (!cur) { cur = { h:'', body:[], list:[] }; out.secs.push(cur); }
      (cur.quotes = cur.quotes || []).push(l.replace(/^[「"]|[」"]$/g, ''));
      continue;
    }
    if (l.length <= 18) { cur = { h:l, body:[], list:[] }; out.secs.push(cur); continue; }
    if (!cur) { cur = { h:'', body:[], list:[] }; out.secs.push(cur); }
    cur.body.push(l);
  }
  return out;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderPreview() {
  const d = parse(document.getElementById('input').value || '');
  const t = themeNow();
  const B = S.blocks;

  /* 配色微调（2026-11-03 用户定：改色实时生效 + 初值跟随当前主题）
     tune 为 null 时用主题原色；一旦用户动过色块，就整体覆盖三色。
     整篇设计不允许微调 —— 配色和版式是一起设计的（与「背景」同一条规则）。 */
  const tuned = (!isKit() && S.tune) ? S.tune : null;
  const cAcc = tuned ? tuned.acc : t.acc;
  const cInk = tuned ? tuned.ink : (t.ink || '');
  const cBg  = tuned ? tuned.bg  : (t.bg  || '');

  /* 字号（B-2，2026-11-03 用户定）
     · 范围：正文一组 = 段落 p + 列表 li + 引用 blockquote（主题里三者同为 15px 一档）
     · 标题 h1–h6 按同一比例缩放，保持层级关系（h1 22 / h2 18 / h3 16 是设计好的阶梯）
     · 基准 15px = 主题原值，ratio=1 时产物与不带字号时一致 */
  const fs = S.fontSize || 15;
  const ratio = fs / 15;
  const h1px = Math.round(22 * ratio);
  const h2px = Math.round(18 * ratio);

  let html = `<h1 style="color:${cAcc};font-size:${h1px}px">${esc(d.title || '未命名')}</h1>`;

  /* 首段导语（B-3）：「首段」严格指**第一个正文段落**。
     ⚠️ 踩过坑：原实现是「往后找第一个 ≥40 字的段落」，结果第一段 39 字不够门槛，
     被跳过，导语落到了第三节的段落上（截图暴露）。语义上「开篇段落」就是第一段，
     不够长就**不加**，而不是找下一个。 */
  let firstParaSeen = false;
  /* 微调后的"墨色"只加在正文/小标题上；没微调时不写 style，保持主题原样 */
  const inkStyle = cInk ? `;color:${cInk}` : '';
  d.secs.forEach(s => {
    if (s.h) html += `<div class="h2s" style="font-size:${h2px}px${inkStyle}">${esc(s.h)}</div>`;
    s.body.forEach(p => {
      /* 首段导语（B-3）：仅第一个段落、且 ≥40 字才加浅底 */
      /* 只有「全文第一个段落」才可能是导语；不够长就不加 */
      const isLead = S.optLead && !firstParaSeen && p.length >= 40;
      firstParaSeen = true;
      /* 链接网址（A-2）：把正文里的 http(s) 链补明文 */
      let body = esc(p);
      if (S.optLinks) {
        body = body.replace(/(https?:\/\/[^\s，。；）)】]+)/g,
          (m) => `${m}<span class="url">（${m}）</span>`);
      }
      html += `<p style="font-size:${fs}px${inkStyle}" class="${isLead ? 'lead' : ''}">${body}</p>`;
    });
    if (s.list && s.list.length) html += `<ul>${s.list.map(x => `<li style="font-size:${fs}px${inkStyle}">${esc(x)}</li>`).join('')}</ul>`;
    /* 引用块左侧竖线跟强调色走 —— 这是"强调色"在正文里最直观的落点 */
    if (s.quotes && B.quote) s.quotes.forEach(q => {
      html += `<blockquote style="font-size:${fs}px${cAcc ? `;border-left-color:${cAcc}` : ''}">「${esc(q)}」</blockquote>`;
    });
  });

  /* 页尾（A-1）：独立于正文，附在末尾，支持 Markdown 的粗体/换行 */
  if (S.tailOn && S.tailMd.trim()) {
    const NL = String.fromCharCode(10);   // 避免正则里出现真实换行
    const tailHtml = esc(S.tailMd)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .split(new RegExp(NL + '{2,}'))
      .map(seg => `<p>${seg.split(NL).join('<br>')}</p>`).join('');
    html += `<div class="pv-tail">${tailHtml}</div>`;
  }

  /* 公众号标题（opt-title）：仅画布展示 */
  if (S.optTitle) html = `<div style="font-size:12px;color:#8A8279;margin-bottom:8px">公众号标题（不进正文）</div>` + html;

  document.getElementById('preview').innerHTML = html;
  /* 手机外壳的导航标题跟着文章标题走（照线上 #wx-title 的行为）
     ⚠️ 变量名不能叫 t —— 上面 const t = themeNow() 已占用（踩过 SyntaxError） */
  const wxTitle = document.getElementById('wx-title');
  if (wxTitle) wxTitle.textContent = d.title || '未命名';

  /* 解析条 */
  const counts = [
    ['大标题', d.title ? 1 : 0],
    ['小标题', d.secs.filter(s => s.h).length],
    ['段落', d.secs.reduce((n,s) => n + s.body.length, 0)],
    ['金句', d.secs.reduce((n,s) => n + (s.quotes||[]).length, 0)],
    ['列表', d.secs.reduce((n,s) => n + (s.list||[]).length, 0)],
  ].filter(([,n]) => n > 0);
  document.getElementById('parse-body').innerHTML = counts.length
    ? counts.map(([k,n]) => `<span class="pchip">${k} <b>${n}</b></span>`).join('')
    : '<span class="pchip hint">粘贴后自动识别结构</span>';
}

/* ══════════════════════════════════════════════════════════════════════
   抽屉
   ══════════════════════════════════════════════════════════════════════ */
function renderDrawer() {
  const mode = S.mode;
  document.getElementById('pane-theme').hidden = mode !== 'theme';
  document.getElementById('pane-kit').hidden = mode !== 'kit';

  /* 背景网格（B-1）：渲染到设置弹窗（低频项，2026-11-02 用户定：微调区只留高频） */
  const bgGrid = document.getElementById('set-grid-bg');
  if (bgGrid) {
    const locked = isKit();
    bgGrid.innerHTML = BGS.map(b => {
      const on = b.id === S.bgId;
      return `<button class="d-card" data-bg="${b.id}" aria-pressed="${on}"
                ${locked ? 'disabled' : ''} style="opacity:${locked ? .4 : 1}">
        <div class="d-prev" style="background:${b.bg};${b.css ? `background-image:${b.css};background-size:${BG_SIZE[b.id] || 'auto'}` : ''}">
          <div style="padding:10px;display:flex;flex-direction:column;gap:4px;justify-content:center;height:100%">
            <div style="height:7px;width:66%;border-radius:2px;background:#333;opacity:.55"></div>
            <div style="height:3px;width:88%;border-radius:2px;background:#333;opacity:.16"></div>
          </div>
        </div>
        <div class="d-body">
          <span class="d-name">${b.n}</span>
          <span style="font-size:10.5px;color:var(--color-muted-fg)">${on ? '✓' : ''}</span>
        </div>
      </button>`;
    }).join('');

    const note = document.getElementById('set-bg-note');
    if (note) note.textContent = locked
      ? '当前用的是整篇设计，背景不可改 —— 那是设计的一部分。'
      : '只改整页底色，不动标题/正文/列表样式，与配色自由组合。';
  }
  document.querySelectorAll('#mode-tabs button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));

  /* 族：按真实数据统计数量 */
  const famCount = {};
  THEMES.forEach(t => { if (t.fam) famCount[t.fam] = (famCount[t.fam] || 0) + 1; });
  FAMS = [['all','全部',THEMES.length], ['fav', '收藏', favList().length]]
    .concat(Object.entries(famCount)
      .sort((a,b) => b[1] - a[1])
      .map(([k,n]) => [k, FAM_LABEL[k] || k, n]));
  document.getElementById('fams').innerHTML = FAMS.map(([k,label,n]) =>
    `<button class="fchip" data-fam="${k}" aria-pressed="${S.fam===k}">${label}${n?` ${n}`:''}</button>`
  ).join('');
  const cf = FAMS.find(f => f[0] === S.fam);
  document.getElementById('fam-hint').textContent =
    S.fam === 'all' ? `${THEMES.length} 套 · 按族浏览` : `${cf ? cf[2] : 0} 套 · ${cf ? cf[1] : ''}`;

  /* 版式 */
  const chip = ([id,label]) => {
    const locked = isKit();
    return `<button class="dl-chip" data-lay="${id}" aria-pressed="${layNow()===id}" ${locked?'disabled':''}>${label}</button>`;
  };
  document.getElementById('lays-common').innerHTML = LAYS_COMMON.map(chip).join('');
  const q = (S.search || '').toLowerCase();
  const hit = t => !q || (t.n || t.name || '').toLowerCase().includes(q) || t.id.includes(q);

  /* 配色主题网格 */
  /* 收藏：照 pwa/src/app.js 的既有实现（LS.fav 存 id 数组 + toggleFav 重渲染），
     不另造一套。星标必须阻止冒泡，否则点星标会顺带把主题也切换了。 */
  const favSet = new Set(favList());
  let list = S.fam === 'fav' ? THEMES.filter(t => favSet.has(t.id))
           : S.fam === 'all' ? THEMES
           : THEMES.filter(t => t.fam === S.fam);
  /* 收藏置顶（与线上 renderFlat 的排序一致） */
  const ranked = [...list].sort((a,b) => (favSet.has(b.id)?1:0) - (favSet.has(a.id)?1:0));
  document.getElementById('grid').innerHTML = ranked.filter(hit).map(t =>
    `<button class="d-card" data-th="${t.id}" aria-pressed="${t.id===S.themeId}">
      <div class="d-prev" style="background:${t.bg}">
        <img class="d-thumb" loading="lazy" alt="${esc(t.n)}"
             src="../../public/theme-thumbs/${t.id}.jpg"
             onerror="this.style.display='none'">
      </div>
      <div class="d-body">
        <span class="d-name">${t.n}</span>
        <span class="d-fav" data-fav="${t.id}" data-on="${favSet.has(t.id)?1:0}" role="button" tabindex="0" aria-label="收藏">${favSet.has(t.id)?'★':'☆'}</span>
      </div>
    </button>`).join('')
    || `<div style="grid-column:1/-1;padding:24px;color:var(--color-muted-fg);font-size:13px">${
        S.fam === 'fav' ? '还没有收藏 —— 点每张卡片右下角的 ☆ 收起来' :
        S.search ? '没匹配的配色主题' : '这个族暂时没有主题'}</div>`;

  /* 整篇设计网格 —— 预渲染 JPG，照线上 theme-thumbs 的做法
     （pwa/src/app.js:775 用 <img src="./theme-thumbs/{id}.jpg">）
     不用 iframe：桌面宽度的 h1 塞进 227px 卡片会占 3–4 行、正文全被挤没。
     JPG 由 scripts/gen_kit_thumbs.py 用 Playwright 截 480×240 生成。 */
  document.getElementById('grid-kit').innerHTML = KITS.filter(hit).map(k =>
    `<button class="d-card d-card-kit" data-th="${k.id}" aria-pressed="${k.id===S.themeId}">
      <div class="d-prev">
        <img class="d-thumb" loading="lazy" alt="${esc(k.name)}"
             src="./data/${k.id}.jpg"
             onerror="this.style.display='none'">
      </div>
      <div class="d-body">
        <span class="d-name">${esc(k.name)}</span>
        <span class="d-fav" data-fav="${k.id}" data-on="${favSet.has(k.id)?1:0}" role="button" tabindex="0" aria-label="收藏">${favSet.has(k.id)?'★':'☆'}</span>
      </div>
    </button>`).join('')
    /* 空态分两种，别混：① 搜索没命中（常见）② 缩略图真缺失（罕见）。
       原来只有一种文案，搜「夜航」时明明 19 张缩略图都在，却提示「未生成」（2026-11-03 实测）。 */
    || (KITS.length === 0
        ? `<div style="grid-column:1/-1;padding:24px;color:var(--color-muted-fg);font-size:13px">缩略图未生成，先跑 scripts/gen_kit_thumbs.py</div>`
        : `<div style="grid-column:1/-1;padding:24px;color:var(--color-muted-fg);font-size:13px">没匹配的整篇设计 · <b style="color:var(--color-primary);cursor:pointer" onclick="document.getElementById('d-search').value='';document.getElementById('d-search').dispatchEvent(new Event('input',{bubbles:true}))">清除搜索</b></div>`);
}

/* 背景（B-1）：只改整页底色，不动内容样式。整篇设计时禁用。
   优先级：配色微调的底色 > 背景网格选中的底纹 > 纯白。
   微调底色是「用户刚手动挑的颜色」，应盖过背景预设的底色（底纹图仍保留）。 */
function applyBg() {
  const pv = document.getElementById('preview');
  const shell = document.getElementById('preview-wrap');
  if (isKit()) {
    /* kit 自带背景，不覆盖 */
    pv.style.background = '';
    pv.style.backgroundImage = '';
    return;
  }
  const b = BGS.find(x => x.id === S.bgId) || BGS[0];
  pv.style.background = (S.tune && S.tune.bg) ? S.tune.bg : b.bg;
  pv.style.backgroundImage = b.css || '';
  pv.style.backgroundSize = BG_SIZE[b.id] || 'auto';
}

/* 页尾 / 内容开关（A-1、A-2、B-3、opt-title）同步到状态 */
function syncContentOpts() {
  const g = id => document.getElementById(id);
  S.tailOn   = g('tail-on').checked;
  S.tailMd   = g('tail-md').value;
  S.optLinks = g('opt-links').checked;
  S.optLead  = g('opt-lead').checked;
  S.optTitle = g('opt-title').checked;
  renderPreview();
}

/* 设置弹窗（低频项集中地，2026-11-02 用户定：顶栏齿轮 → 弹窗） */
const setDlg = document.getElementById('settings-dlg');

/* ══ 配色微调（2026-11-03 用户定：改色实时生效 + 初值跟随当前主题）══
   ⚠️ 之前这三个 <input type="color"> 全文件零监听、零读取（实测改色无任何反应，
   且切主题后仍显示写死的 #FFFFFF/#134E4A/#FF0000）—— 属于"能点但没用"的假控件。 */
function syncTuneInputs() {
  const t = themeNow();
  const bg  = S.tune ? S.tune.bg  : (t.bg  || '#FFFFFF');
  const ink = S.tune ? S.tune.ink : (t.ink || '#333333');
  const acc = S.tune ? S.tune.acc : (t.acc || '#333333');
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
  set('c-bg', bg); set('c-text', ink); set('c-acc', acc);
  /* 整篇设计的配色是设计的一部分，不给改（与「背景」同一条规则） */
  const locked = isKit();
  ['c-bg','c-text','c-acc','c-reset'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = locked;
  });
  const note = document.getElementById('c-note');
  if (note) note.textContent = locked
    ? '当前用的是整篇设计，配色是设计的一部分，不可单独改。'
    : '临时改当前主题的底色 / 正文 / 强调色，不影响已保存的主题。';
}

/* 改色 → 写 S.tune → 立刻重绘预览 */
function onTuneInput() {
  if (isKit()) return;
  S.tune = {
    bg:  document.getElementById('c-bg').value,
    ink: document.getElementById('c-text').value,
    acc: document.getElementById('c-acc').value,
  };
  applyBg();          // 底色走 applyBg（预览容器的 background）
  renderPreview();    // 正文墨色 / 强调色在 renderPreview 里
  renderCaps();       // 顶部色卡第一格跟着变
}
['c-bg','c-text','c-acc'].forEach(id => {
  document.getElementById(id)?.addEventListener('input', onTuneInput);
});
document.getElementById('c-reset')?.addEventListener('click', () => {
  S.tune = null;
  syncTuneInputs();
  applyBg();
  renderPreview();
  renderCaps();
  toast('配色已恢复为主题原色');
});

document.getElementById('btn-settings')?.addEventListener('click', () => {
  renderDrawer();          // 打开前刷新一次背景网格的选中态
  syncTuneInputs();        // 色块初值跟随当前主题
  setDlg.showModal();
});
document.getElementById('sd-close')?.addEventListener('click', () => setDlg.close());
/* 点遮罩关闭（dialog 的点击目标是它自己时才算点在外面） */
setDlg?.addEventListener('click', (e) => { if (e.target === setDlg) setDlg.close(); });

/* ══ 顶栏下拉菜单（对齐 pwa/index.html 的 #btn-export / #btn-more）══
   两个菜单必须互斥：开一个就关另一个，否则会叠在一起。
   点菜单外面任意位置也收起 —— 与线上行为一致。 */
const TMENUS = [
  { btn: 'btn-export', menu: 'menu-export' },
  { btn: 'btn-more',   menu: 'menu' },
];
function closeTopMenus(except) {
  TMENUS.forEach(({ btn, menu }) => {
    if (menu === except) return;
    const m = document.getElementById(menu);
    const b = document.getElementById(btn);
    if (m) m.hidden = true;
    if (b) b.setAttribute('aria-expanded', 'false');
  });
}
TMENUS.forEach(({ btn, menu }) => {
  const b = document.getElementById(btn);
  const m = document.getElementById(menu);
  if (!b || !m) return;
  b.addEventListener('click', (e) => {
    e.stopPropagation();
    const willOpen = m.hidden;
    closeTopMenus(willOpen ? menu : null);
    m.hidden = !willOpen;
    b.setAttribute('aria-expanded', String(willOpen));
  });
  m.addEventListener('click', (e) => e.stopPropagation());
});
document.addEventListener('click', () => closeTopMenus(null));

/* 导出四项（线上 #menu-export 的 data-exp） */
document.getElementById('menu-export')?.querySelectorAll('[data-exp]').forEach(btn => {
  btn.addEventListener('click', () => {
    const map = {
      long:   '长图 PNG：整篇渲染成一张长图',
      html:   'HTML 文件：自包含单文件，留档 / 交稿',
      md:     'Markdown：导出源码',
      images: '图片 ZIP：打包正文全部图片',
    };
    toast(`导出 ${map[btn.dataset.exp]}`);
    closeTopMenus(null);
  });
});

/* 更多菜单八项（线上 #menu 的 data-act） */
document.getElementById('menu')?.querySelectorAll('[data-act]').forEach(btn => {
  btn.addEventListener('click', () => {
    const act = btn.dataset.act;
    if (act === 'export-menu') {
      // 「导出与分发」= 打开导出菜单，不是执行导出
      closeTopMenus(null);
      document.getElementById('btn-export').click();
      return;
    }
    const map = {
      'ai-tools':    'AI 工具面板（原型未实现）',
      'draft':       '已恢复上次草稿',
      'clear-draft': '草稿已清空',
      'backup':      '备份 / 恢复本机数据',
      'clear-all':   '清除本地数据（会二次确认）',
      'update':      '更新记录',
      'about':       '关于 / 源码',
    };
    toast(map[act] || act);
    closeTopMenus(null);
  });
});

function renderLayBar() {
  const bar = document.getElementById('laybar');
  const t = themeNow();
  if (isKit()) {
    bar.querySelector('.ll').textContent = '整篇设计';
    document.getElementById('lay-cur').textContent = t.n;
    document.getElementById('lay-quick').innerHTML =
      '<span style="font-size:11.5px;color:var(--color-muted-fg)">版式与配色已随设计内置</span>';
    document.getElementById('lay-meta').innerHTML =
      '<button id="kit-exit" style="font-size:11.5px;padding:3px 10px;border:1px solid var(--color-border);border-radius:6px;background:var(--color-card);color:var(--color-foreground)">改回可组合</button>';
    return;
  }
  bar.querySelector('.ll').textContent = '版式';
  const all = [...LAYS_COMMON, ...LAYS_NEWS];
  const cur = all.find(l => l[0] === layNow());
  document.getElementById('lay-cur').textContent = cur ? cur[1] : '默认';
  /* 8 项全显示（2026-11-03 用户定）：原来 slice(0,6) 只在底部露出 6 项，
     而抽屉里是 8 项 —— 两处不一致，用户会以为「卡片组 / 时间线」丢了。 */
  document.getElementById('lay-quick').innerHTML = all.map(([id,label]) =>
    `<button data-lay="${id}" aria-pressed="${layNow()===id}">${label}</button>`).join('');
  document.getElementById('lay-meta').textContent = `${t.n} · 164 套`;
}

function renderLayPop() {
  const chip = ([id,label]) =>
    `<button class="lc${layNow()===id?' on':''}" data-lay="${id}">${label}</button>`;
  document.getElementById('laypop').innerHTML =
    `<div class="row"><span class="gl">通用</span>${LAYS_COMMON.map(chip).join('')}</div>`;
}

/* ══ 折叠段摘要（②③④）══════════════════════════════════════════
   收起时摘要行必须说清「现在是什么状态」，否则用户得展开才知道，
   等于把成本从"占高度"转嫁给"点一次"。三处摘要都是纯读取，不改状态。 */
function syncFoldSums() {
  /* ② 版式：整篇设计时版式被锁，摘要要说"已内置"而不是某个版式名 */
  const laySum = document.getElementById('lay-sum');
  if (laySum) {
    if (isKit()) {
      laySum.textContent = '随整篇设计内置';
    } else {
      const all = [...LAYS_COMMON, ...LAYS_NEWS];
      const cur = all.find(l => l[0] === layNow());
      laySum.textContent = `版式：${cur ? cur[1] : '默认'}`;
    }
  }

  /* ③ 段落：列出打开的开关，全关时说"全关" */
  const blkSum = document.getElementById('blk-sum');
  if (blkSum) {
    const on = [['quote','金句'],['data','数据'],['tip','提示']]
      .filter(([k]) => S.blocks[k]).map(([, n]) => n);
    blkSum.textContent = on.length ? on.join(' · ') : '全部关闭';
  }

  /* ④ 字号由 syncFsLabel() 维护（它本来就在写 #fs-hint），这里不重复 */
}

/* 折叠交互：点标题行或按 Enter/Space 都能展开收起。
   三段互相独立 —— 用户可能只想展开字号，不想让版式那两段再撑开。 */
document.querySelectorAll('.sec.is-fold > .sec-h').forEach(h => {
  const sec = h.parentElement;
  const toggle = () => {
    const open = sec.dataset.open === '1';
    sec.dataset.open = open ? '0' : '1';
    h.setAttribute('aria-expanded', String(!open));
    sec.querySelector('.sec-body').hidden = open;
  };
  h.addEventListener('click', toggle);
  h.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });
});

function renderCaps() {
  const t = themeNow();
  const list = [t, ...THEMES.filter(x => x.id !== S.themeId)].slice(0, 40);
  document.getElementById('caps').innerHTML = list.map(x => {
    const bg = x.id === S.themeId ? t.bg : x.bg;
    const acc = x.id === S.themeId ? t.acc : x.acc;
    return `<button class="cap" data-th="${x.id}" aria-pressed="${x.id===S.themeId}">
      <span class="cap-sw" style="background:${bg};--sw2:${acc}"></span>${x.n}
    </button>`;
  }).join('');
}

const paint = () => { renderPreview(); applyBg(); renderDrawer(); renderCaps(); renderLayBar(); renderLayPop(); syncFoldSums(); };

/* ══════════════════════════════════════════════════════════════════════
   交互
   ══════════════════════════════════════════════════════════════════════ */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2200);
}
function openDrawer() {
  document.getElementById('laypop').hidden = true;
  document.getElementById('lay-toggle').textContent = '▴';
  document.getElementById('drawer').hidden = false;
  document.getElementById('drawer-mask').hidden = false;
  document.body.classList.add('browsing');
  renderDrawer();
}
function closeDrawer() {
  document.getElementById('drawer').hidden = true;
  document.getElementById('drawer-mask').hidden = true;
  document.body.classList.remove('browsing');
}

document.addEventListener('click', (e) => {
  /* ⚠️ 收藏必须排在 [data-th] 之前：星标在卡片按钮内部，
     若先命中 data-th，点星标会顺带把主题切了（线上同款坑）。 */
  const fav = e.target.closest('[data-fav]');
  if (fav) { e.stopPropagation(); toggleFav(fav.dataset.fav); return; }

  const mt = e.target.closest('[data-mode]');
  if (mt) { S.mode = mt.dataset.mode; S.search = ''; document.getElementById('d-search').value = ''; renderDrawer(); syncFoldSums(); return; }

  const fam = e.target.closest('[data-fam]');
  if (fam) { S.fam = fam.dataset.fam; renderDrawer(); return; }

  const lay = e.target.closest('[data-lay]');
  if (lay && !lay.disabled) {
    S.lay = lay.dataset.lay;
    document.getElementById('laypop').hidden = true;
    document.getElementById('lay-toggle').textContent = '▴';
    paint();
    toast(`版式：${LAY_LABEL[S.lay] || '默认'}`);
    return;
  }

  /* 背景（B-1） */
  const bgBtn = e.target.closest('[data-bg]');
  if (bgBtn && !bgBtn.disabled) {
    S.bgId = bgBtn.dataset.bg;
    applyBg();
    renderDrawer();
    toast(`背景：${BGS.find(b => b.id === S.bgId).n}`);
    return;
  }

  const th = e.target.closest('[data-th]');
  if (th) {
    S.themeId = th.dataset.th;
    /* 微调是针对「当前这套主题」的临时覆盖，换主题就该清掉 ——
       否则上一套改的颜色会继续压在新主题上（用户选的是新主题，不是旧微调）。 */
    S.tune = null;
    if (isKit()) S.mode = 'kit';
    paint();
    syncTuneInputs();     // 色块回到新主题的真实色值
    toast(`已选：${themeNow().n}`);
    return;
  }

  if (e.target.closest('#kit-exit')) {
    S.mode = 'theme'; S.themeId = 'su-biz-azure'; S.lay = ''; S.tune = null;
    paint(); syncTuneInputs(); toast('已改回可组合版式'); return;
  }
  if (e.target.closest('#lay-toggle')) {
    const pop = document.getElementById('laypop');
    const btn = document.getElementById('lay-toggle');
    pop.hidden = !pop.hidden;
    btn.textContent = pop.hidden ? '▴' : '▾';
    btn.setAttribute('aria-expanded', String(!pop.hidden));
    return;
  }
  if (e.target.closest('#btn-themes')) { openDrawer(); return; }
  if (e.target.closest('#d-close') || e.target.closest('#drawer-mask')) { closeDrawer(); return; }
  if (e.target.closest('#btn-copy')) { toast('已复制（原型不写剪贴板）'); return; }

  /* 内容区四个按钮（线上 #btn-demo / #btn-clear + 插图 / 搜图）
     原型只给最小反馈，不做真实上传与联网搜图 —— 与「交互骨架」边界一致。 */
  const cbtn = e.target.closest('[data-cbtn]');
  if (cbtn) {
    const input = document.getElementById('input');
    const act = cbtn.dataset.cbtn;
    if (act === 'demo') {
      input.value = SAMPLE;
      syncInput();
      toast('已载入示例文本');
    } else if (act === 'clear') {
      if (!input.value.trim()) { toast('已经是空的了'); return; }
      input.value = '';
      syncInput();
      toast('已清空（线上有撤销）');
    } else if (act === 'img') {
      toast('插图：线上可上传本地图片 / 粘贴图片链接');
    } else if (act === 'search') {
      toast('搜图：线上用 Pexels 联网搜图（需填免费 Key）');
    }
    return;
  }

  /* 手机 / 网页视图切换（照线上 applyMode()：给 .preview-wrap 加 .web） */
  const modeBtn = e.target.closest('#btn-mode');
  if (modeBtn) {
    const wrap = document.getElementById('preview-wrap');
    const web = wrap.classList.toggle('web');
    modeBtn.textContent = web ? '网页' : '手机';
    return;
  }
});

document.addEventListener('change', (e) => {
  const b = e.target.closest('[data-blk]');
  if (b) { S.blocks[b.dataset.blk] = b.checked; renderPreview(); }
});

/* 字号（B-2，2026-11-03 用户定：抽屉内常驻）
   范围：正文一组（段落 + 列表 + 引用）+ 标题按同一比例缩放。
   基准 15px = 主题原值；提示里同时显示正文与 h1 的实际 px，避免"改了没感觉"。 */
const fsRange = document.getElementById('font-size');
const fsHint  = document.getElementById('fs-hint');
function syncFsLabel() {
  const v = S.fontSize;
  fsHint.textContent = `${v} px · 标题 ${Math.round(22 * v / 15)} px`;
  if (fsRange) fsRange.value = v;
  const minus = document.getElementById('fs-minus');
  const plus  = document.getElementById('fs-plus');
  if (minus) minus.disabled = v <= Number(fsRange.min);
  if (plus)  plus.disabled  = v >= Number(fsRange.max);
}
function setFontSize(v) {
  const min = Number(fsRange.min), max = Number(fsRange.max);
  S.fontSize = Math.min(max, Math.max(min, v));
  syncFsLabel();
  renderPreview();
}
if (fsRange) {
  syncFsLabel();
  fsRange.addEventListener('input', (e) => setFontSize(Number(e.target.value)));
  document.getElementById('fs-minus').addEventListener('click', () => setFontSize(S.fontSize - 1));
  document.getElementById('fs-plus').addEventListener('click', () => setFontSize(S.fontSize + 1));
  document.getElementById('fs-reset').addEventListener('click', () => {
    setFontSize(15);
    toast('字号已重置为 15 px');
  });
}

/* 页尾与内容开关（A-1 / A-2 / B-3 / opt-title） */
['tail-on','tail-md','opt-links','opt-lead','opt-title'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener(id === 'tail-md' ? 'input' : 'change', syncContentOpts);
});
/* 初始化默认页尾文案 */
const tailEl = document.getElementById('tail-md');
if (tailEl && !tailEl.value) tailEl.value = S.tailMd;

document.getElementById('d-search').addEventListener('input', (e) => {
  S.search = e.target.value.trim(); renderDrawer();
});
/* 输入区统一同步：字数 + 预览（demo/clear 按钮也走这里，避免各写一份） */
function syncInput() {
  const input = document.getElementById('input');
  document.getElementById('char-count').textContent = input.value.length + ' 字';
  renderPreview();
}
document.getElementById('input').addEventListener('input', syncInput);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
document.getElementById('c-reset').onclick = () => { paint(); toast('配色已恢复'); };

/* ══════════════════════════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════════════════════════ */
/* ══ 加载真实数据 ══ */
const RES = await fetch('./data/themes-index.json');
if (!RES.ok) throw new Error('数据加载失败：' + RES.status);
const ALL = await RES.json();

/* 179 条 = 164 palette + 15 kit（字段：id/name/desc/primary/accent/background/family/kind/lockedLayout/tags/featured） */
THEMES = ALL.filter(t => t.kind !== 'kit').map(t => ({
  id: t.id, n: t.name, fam: t.family || '',
  bg: t.background || '#FFFFFF', acc: t.accent || t.primary || '#333',
  ink: t.primary || '#333333',
  desc: t.desc || '', featured: !!t.featured,
}));
KITS = ALL.filter(t => t.kind === 'kit').map(t => ({
  id: t.id, name: t.name, lockedLayout: t.lockedLayout || '',
  colors: {
    background: t.background || '#FFFFFF',
    accent: t.accent || '#333',
    primary: t.primary || '#333333',
  },
  desc: t.desc || '',
}));

document.getElementById('input').value = SAMPLE;
document.getElementById('char-count').textContent = SAMPLE.length + ' 字';

/* 15 套整篇设计：由 loadData() 从同一份 index.json 里筛 kind==='kit' 得到
   名字取自 mg-*.json 的 name 字段（用户已定：保留品牌名） */

paint();
</script>
</body>
</html>
