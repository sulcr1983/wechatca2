<!doctype html>
<html lang="zh-CN" data-theme="dune">
<head>
  <meta charset="utf-8">
  <title>不是因为寂寞才想你 · 阿苏</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: #1a1a1a; font-family: "Noto Serif SC", serif; padding: 64px 32px; }
    .sheet { display: flex; flex-direction: column; align-items: center; gap: 48px; }
    .poster { position: relative; overflow: hidden; isolation: isolate; }
    .poster.xhs { width: 1080px; height: 1440px; }
    .poster.xhs .content { padding: 0; }
    .content { position: relative; width: 100%; height: 100%; z-index: 2; }
    .stack { display: flex; flex-direction: column; }
    .gap-3 { gap: 24px; }
    [data-theme="dune"] { --paper: #f0e6d2; --paper-2: #ded0b7; --ink: #1f1a14; --muted: #6f6557; --line: rgba(31,26,20,.22); --accent: #8f7650; --accent-soft: #d4c2a4; --ink-rgb: 31,26,20; --paper-rgb: 240,230,210; --accent-rgb: 143,118,80; }
    .poster.xhs { background: var(--paper); color: var(--ink); }
    .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    .img-overlay { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.55) 50%, rgba(0,0,0,.70) 100%); pointer-events: none; backdrop-filter: blur(2px); }
    .grain { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: .25; mix-blend-mode: multiply; background-image: radial-gradient(rgba(0,0,0,.045) 1px, transparent 1px); background-size: 3px 3px; }
    .inner-content { position: relative; z-index: 4; padding: 96px 88px; background: rgba(0,0,0,0.08); border-radius: 4px; }
    .kicker { font-family: "IBM Plex Mono", monospace; font-size: 21px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin: 0 0 32px; text-shadow: 0 1px 3px rgba(0,0,0,0.25); }
    .h-display { font-family: "Noto Serif SC", serif; font-weight: 500; font-size: 118px; line-height: 1.08; letter-spacing: .04em; margin: 0 0 32px; }
    .h-sub { font-family: "Playfair Display", serif; font-style: italic; font-weight: 400; font-size: 32px; color: var(--muted); margin: 0 0 24px; line-height: 1.4; text-shadow: 0 1px 3px rgba(0,0,0,0.20); }
    .lead { font-family: "Noto Serif SC", serif; font-weight: 400; font-size: 26px; line-height: 1.55; color: var(--muted); margin: 0; text-shadow: 0 1px 3px rgba(0,0,0,0.20); }
    .issue-row { display: flex; align-items: center; gap: 16px; font-family: "IBM Plex Mono", monospace; font-size: 20px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); text-shadow: 0 1px 3px rgba(0,0,0,0.25); }
    .issue-row .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
    .accent-rule { display: inline-block; width: 40px; height: 3px; background: var(--accent); margin-bottom: 24px; }
    .issue-strip { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 88px 40px; font-family: "IBM Plex Mono", monospace; font-size: 17px; letter-spacing: .20em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 20px; z-index: 5; }
    .issue-strip::before { content: ''; position: absolute; top: -40px; left: 88px; right: 88px; height: 1px; background: var(--line); }
    .issue-strip span:nth-child(3) { margin-left: auto; }
  
/* WCAG contrast fix */
.kicker, .h-display, .lead, .h-sub, .issue-row, .issue-strip span, .t-meta, .t-cat {
  color: rgba(255,255,255,.92) !important;
}
.issue-strip::before { opacity: .3; }
</style>
</head>
<body>
  <main class="sheet">
    <section class="poster xhs" id="xhs-cover">
      <img class="cover-img" src="../../images/05-swing.jpg" alt="秋千">
      <div class="img-overlay"></div>
      <div class="grain"></div>
      <div class="inner-content stack gap-3">
        <div class="issue-row"><span>Vol. 01</span><span class="dot"></span><span>2026.05</span><span class="dot"></span><span>情感 · 随笔</span></div>
        <div class="stack gap-3" style="margin-top: 80px;">
          <p class="kicker">不是情歌，是时代</p>
          <h1 class="h-display">{{TITLE}}</h1>
          <div class="accent-rule"></div>
          <p class="h-sub">而是想念的那个时代，已经有点远了</p>
        </div>
        <p class="lead" style="margin-top: 48px;">{{LEAD}}</p>
        <div class="grow" style="flex:1"></div>
      </div>
      <div class="issue-strip"><span>{{AUTHOR}}</span><span>·</span><span>小红书</span></div>
    </section>
  </main>
</body>
</html>
