<!doctype html>
<html lang="zh-CN" data-accent="ikb">
<head>
  <meta charset="utf-8">
  <title>不是因为寂寞才想你 · 阿苏</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Noto+Sans+SC:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root,
    [data-accent="ikb"] {
      --paper: #fafaf8;
      --ink: #0a0a0a;
      --grey-1: #f0f0ee;
      --grey-2: #d4d4d2;
      --grey-3: #737373;
      --accent: #002FA7;
      --accent-on: #ffffff;
    }
    :root {
      --sans:    "Inter", "Helvetica Neue", Helvetica, "Noto Sans SC",
                 -apple-system, "PingFang SC", "Microsoft YaHei UI", sans-serif;
      --sans-zh: "Noto Sans SC", -apple-system, "PingFang SC",
                 "Microsoft YaHei UI", "Inter", sans-serif;
      --mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
    }
    :root {
      --sp-3:   8px;
      --sp-4:  12px;
      --sp-5:  16px;
      --sp-6:  24px;
      --sp-7:  32px;
      --sp-8:  40px;
      --sp-9:  48px;
      --sp-10: 64px;
      --sp-11: 80px;
      --sp-12: 96px;
      --sp-13:160px;
    }
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      font-family: var(--sans);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 64px 32px;
    }
    .sheet {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }
    .poster {
      position: relative;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
      isolation: isolate;
    }
    .poster.xhs { width: 1080px; height: 1440px; }
    .poster.xhs .content { padding: var(--sp-12) var(--sp-11); }
    .content { position: relative; width: 100%; height: 100%; z-index: 2; }
    .inner-content { position: relative; z-index: 4; padding: 96px 88px; background: rgba(0,0,0,0.08); border-radius: 4px; }
    .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    .img-overlay { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.55) 50%, rgba(0,0,0,.70) 100%); pointer-events: none; backdrop-filter: blur(2px); }
    .dot-mat {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: .06;
      background-image: radial-gradient(var(--ink) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
    .h-statement {
      font-family: var(--sans);
      font-weight: 200;
      font-size: 180px;
      line-height: 1.05;
      letter-spacing: -.015em;
      margin: 0;
      color: var(--ink);
    }
    .lead {
      font-family: var(--sans-zh);
      font-weight: 400;
      font-size: 30px;
      line-height: 1.55;
      color: var(--ink);
      margin: 0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.20);
    }
    .t-cat {
      font-family: var(--sans);
      font-weight: 600;
      font-size: 22px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.25);
    }
    .t-meta {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 20px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--grey-3);
      margin: 0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.25);
    }
    .poster.xhs .h-statement { font-size: 124px; }
    .stack    { display: flex; flex-direction: column; }
    .row      { display: flex; flex-direction: row; }
    .gap-7    { gap: var(--sp-7); }
    .gap-9    { gap: var(--sp-9); }
    .grow     { flex: 1; }
    .hr-accent {
      height: 3px;
      background: var(--accent);
      border: 0;
      width: 96px;
      margin: 0;
    }
    .chrome-min {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 18px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--grey-3);
      padding-bottom: var(--sp-6);
      border-bottom: 1px solid var(--grey-2);
      margin-bottom: var(--sp-9);
    }
  
/* WCAG contrast fix */
.kicker, .h-display, .lead, .h-sub, .issue-row, .issue-strip span, .t-meta, .t-cat {
  color: rgba(255,255,255,.92) !important;
}
.issue-strip::before { opacity: .3; }
</style>
</head>
<body>
  <main class="sheet">
    <section class="poster xhs" id="xhs-cover">
      <img class="cover-img" src="../../images/07-radio.jpg" alt="收音机">
      <div class="img-overlay"></div>
      <div class="dot-mat"></div>
      <div class="content inner-content stack gap-9">
        <div class="chrome-min">
          <span>Vol. 01 · Essay</span>
          <span>2026.05</span>
        </div>
        <div class="stack gap-7">
          <p class="t-cat">封面 · Cover</p>
          <h1 class="h-statement">{{TITLE}}</h1>
        </div>
        <div class="grow"></div>
        <hr class="hr-accent">
        <p class="lead">而是想念的那个时代，已经有点远了。</p>
        <div class="row gap-6">
          <p class="t-meta">Issue 01</p>
          <p class="t-meta">/ 阿苏</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
